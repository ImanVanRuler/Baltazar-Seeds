<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spectral Garden — Reimagined</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ui-bg:rgba(8,12,20,0.6);--accent:#7bd3ff;--accent2:#c27bff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#eaf6ff;font-family:Inter,system-ui,Segoe UI,Roboto}
  canvas{display:block;width:100vw;height:100vh}
  .ui{
    position:fixed;left:18px;top:18px;z-index:200;padding:14px 16px;border-radius:14px;
    background:var(--ui-bg);backdrop-filter:blur(8px);border:1px solid rgba(120,180,255,0.08);
    box-shadow:0 10px 30px rgba(0,0,0,0.55);min-width:260px
  }
  .ui h1{font-size:15px;margin-bottom:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
  .ui p{font-size:12px;opacity:0.9;margin-bottom:10px}
  .controls{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px}
  .btn{padding:8px 12px;border-radius:10px;border:none;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));
    color:#dff7ff;font-weight:600;cursor:pointer}
  .small{font-size:12px;padding:6px 8px;border-radius:8px}
  input[type=range]{width:140px}
  .label{font-size:12px;color:#a8dfff;min-width:60px}
  .footer{position:fixed;right:18px;bottom:18px;color:#9fd9ff;opacity:0.85;font-size:12px}
  .back{position:fixed;right:18px;top:18px;background:transparent;color:#9fd9ff;text-decoration:none;border-radius:10px;padding:8px}
  @media(max-width:640px){.ui{left:10px;top:10px;right:10px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <h1>Spectral Garden — Reimagined</h1>
  <p>Move mouse, click to burst. Shapes, color & bloom — tuned for interactivity.</p>
  <div class="controls">
    <div class="row">
      <button id="pause" class="btn">Pause</button>
      <button id="shape" class="btn small">Shape: Circle</button>
      <button id="fs" class="btn small">Fullscreen</button>
    </div>
    <div class="row">
      <span class="label">Speed</span>
      <input id="speed" type="range" min="0.2" max="4" step="0.05" value="1">
      <span id="speedVal" class="label">1.00</span>
    </div>
    <div class="row">
      <span class="label">Bloom</span>
      <input id="bloom" type="range" min="0.0" max="3" step="0.05" value="1.3">
      <span id="bloomVal" class="label">1.30</span>
    </div>
    <div class="row">
      <span class="label">Palette</span>
      <button id="palPrev" class="btn small">◀</button>
      <button id="palNext" class="btn small">▶</button>
      <span id="palName" style="margin-left:8px;font-size:12px;color:#bfeaff">Aurora</span>
    </div>
  </div>
</div>

<div class="footer">Click = Burst · Drag = flow · Shapes & palettes toggle</div>

<script>
'use strict';
// --- Setup WebGL2 ---
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false});
if(!gl){ alert('WebGL2 required'); throw new Error('WebGL2 not supported'); }
gl.clearColor(0,0,0,1);

// --- Resize ---
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', fit);
fit();

// --- Utilities: compile/link ---
function compile(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    throw new Error('Shader compile error');
  }
  return s;
}
function link(vs, fs, tfVaryings=null){
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  if(tfVaryings) gl.transformFeedbackVaryings(p, tfVaryings, gl.INTERLEAVED_ATTRIBS);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error('Program link error');
  }
  return p;
}

// --- Fullscreen quad ---
const quadVS = `#version 300 es
precision mediump float;
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5 + 0.5; gl_Position = vec4(aPos,0,1); }`;
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

// helper draw
function draw(prog, uniforms={}, textures=[]){
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

  for(const k in uniforms){
    const loc = gl.getUniformLocation(prog, k);
    if(!loc) continue;
    const v = uniforms[k];
    if(typeof v === 'number') gl.uniform1f(loc, v);
    else if(Array.isArray(v) && v.length===2) gl.uniform2fv(loc, v);
    else if(Array.isArray(v) && v.length===3) gl.uniform3fv(loc, v);
    else if(Array.isArray(v) && v.length===4) gl.uniform4fv(loc, v);
  }
  textures.forEach((t,i)=>{
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    const loc = gl.getUniformLocation(prog, t.name);
    if(loc) gl.uniform1i(loc, i);
  });
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

// --- Simple FBO maker ---
function makeFBO(w,h){
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA, w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {fbo:f, tex:tex, w:w, h:h};
}

// --- Flow shader (visual base) ---
const flowFS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uHueShift;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float noise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  float a = hash(i), b = hash(i+vec2(1.,0.)), c = hash(i+vec2(0.,1.)), d = hash(i+vec2(1.,1.));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a, b, u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
}
vec3 palette(float t){
  // dynamic psychedelic palette
  vec3 a = vec3(0.05,0.02,0.08);
  vec3 b = vec3(0.2,0.6,1.0);
  vec3 c = vec3(1.0,0.4,0.8);
  vec3 d = vec3(0.7,1.0,0.6);
  return a + b*cos(6.28318*(c*t + d + uHueShift));
}
void main(){
  vec2 uv = vUv;
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  float t = uTime*0.2;
  float n = noise(p*3.0 + t);
  // add swirling near mouse
  vec2 m = (uMouse - 0.5) * vec2(uRes.x/uRes.y,1.0);
  float d = length(p-m);
  float swirl = exp(-d*6.0) * 1.6;
  float n2 = noise(p*6.0 - t*0.5 + swirl);
  float mixn = smoothstep(-0.2,0.8, n*0.6 + n2*0.4 + swirl*0.6);
  vec3 col = palette(mixn);
  // vignette
  float v = smoothstep(0.9,0.2,length(uv-0.5));
  col *= 1.0 - 0.5*v;
  o = vec4(col,1.0);
}`;

// compile flow
const flowProg = link(compile(quadVS, gl.VERTEX_SHADER), compile(flowFS, gl.FRAGMENT_SHADER));

// --- Particles using Transform Feedback ---
// We'll keep particles as simple XY + velocity + life + kind
const NUM = 80000; // tuned for interactivity; lower if slow
const stride = 5; // x,y,vx,vy,life
const initData = new Float32Array(NUM * stride);
for(let i=0;i<NUM;i++){
  const j=i*stride;
  const a = Math.random()*Math.PI*2;
  const r = 0.02 + Math.random()*0.12;
  initData[j]   = 0.5 + Math.cos(a)*r;   // x
  initData[j+1] = 0.5 + Math.sin(a)*r;   // y
  initData[j+2] = (Math.random()*2-1)*0.002; // vx
  initData[j+3] = (Math.random()*2-1)*0.002; // vy
  initData[j+4] = Math.random()*3.0;      // life
}

const buffers = [gl.createBuffer(), gl.createBuffer()];
const vaos = [gl.createVertexArray(), gl.createVertexArray()];
for(let k=0;k<2;k++){
  gl.bindVertexArray(vaos[k]);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers[k]);
  gl.bufferData(gl.ARRAY_BUFFER, initData, gl.DYNAMIC_COPY);
  // attribs: location 0-4
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,stride*4,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,2,gl.FLOAT,false,stride*4,8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,stride*4,16);
}
let src = 0, dst = 1;
function swap(){ const t=src; src=dst; dst=t; }

// update shader (vertex shader with TF)
const updateVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
layout(location=1) in vec2 aVel;
layout(location=2) in float aLife;
out vec2 vPos; out vec2 vVel; out float vLife;
uniform float uTime; uniform float uDt; uniform float uSpeed; uniform vec2 uRes; uniform vec2 uMouse;
float hash(float n){ return fract(sin(n)*43758.5453); }
float rnd(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 pos = aPos;
  vec2 vel = aVel;
  float life = aLife + uDt;
  // flow force sample via simple procedural noise (cheap)
  vec2 uv = (pos - 0.5) * vec2(uRes.x/uRes.y,1.0);
  float t = uTime*0.6;
  // derive a fake curl from sin noise
  float n1 = sin((uv.x+uv.y*1.2)*4.0 + t)*0.5 + 0.5;
  float n2 = sin((uv.y-uv.x*1.1)*3.1 - t*0.7)*0.5 + 0.5;
  vec2 curl = vec2(n2 - n1, n1 - n2);
  // mouse attraction/repel strong near cursor
  vec2 m = uMouse;
  vec2 d = pos - m;
  float dist = length(d) + 1e-6;
  vec2 dir = normalize(d);
  vec2 swirl = vec2(-dir.y, dir.x) * exp(-dist*8.0) * 0.9;
  vec2 pull = -dir * exp(-dist*5.0) * 0.6;
  vel += (curl + swirl + pull) * 0.002 * uSpeed;
  vel *= mix(0.985, 0.992, clamp(uSpeed,0.2,2.5));
  pos += vel * uDt * 60.0;
  // respawn
  if(pos.x < -0.2 || pos.x > 1.2 || pos.y < -0.2 || pos.y > 1.2 || life > 6.0){
    float r = rnd(vec2(uTime, life));
    float ang = r*6.2831853;
    float rad = 0.01 + r*0.12;
    pos = vec2(0.5) + vec2(cos(ang), sin(ang))*rad;
    vel = vec2(rnd(pos+1.0)-0.5, rnd(pos+2.0)-0.5)*0.003 * uSpeed;
    life = 0.0;
  }
  vPos = pos; vVel = vel; vLife = life;
}`;
const passthroughFS = `#version 300 es
precision highp float; out vec4 o; void main(){ o = vec4(0.0); }`;
const updateProg = link(compile(updateVS, gl.VERTEX_SHADER), compile(passthroughFS, gl.FRAGMENT_SHADER),
  ['vPos','vVel','vLife']);

// render particle shader (points)
const renderVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
layout(location=1) in vec2 aVel;
layout(location=2) in float aLife;
uniform vec2 uRes;
uniform float uTime;
uniform int uShape; // 0 circle,1 diamond,2 square,3 star
out float vLife; out float vN;
void main(){
  vLife = 1.0 - clamp(aLife/6.0,0.0,1.0);
  vec2 p = (aPos - 0.5) * vec2(uRes.x/uRes.y,1.0);
  gl_Position = vec4(p*2.0, 0.0, 1.0);
  float base = 6.0 + vLife*18.0;
  gl_PointSize = base * (1.0 + (sin(uTime*2.0 + aPos.x*20.0)*0.08));
  vN = fract(aPos.x*123.456 + aPos.y*78.9);
}`;
const renderFS = `#version 300 es
precision highp float;
in float vLife; in float vN;
out vec4 o;
uniform float uHueShift; uniform int uShape;
vec3 hsb2rgb(vec3 c){
  vec3 rgb = clamp(abs(mod(c.x*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);
  rgb = rgb*rgb*(3.0-2.0*rgb);
  return c.z * mix(vec3(1.0), rgb, c.y);
}
float shapeMask(vec2 uv){
  // uv in [0,1] with center at 0.5
  vec2 p = (uv - 0.5)*2.0;
  float d = length(p);
  // circle
  if(uShape==0) return smoothstep(0.98,0.45, d);
  // diamond
  if(uShape==1) return smoothstep(1.1,0.5, max(abs(p.x),abs(p.y)));
  // square
  if(uShape==2) return smoothstep(1.0,0.45, max(abs(p.x),abs(p.y)));
  // star (rough)
  float a = atan(p.y,p.x);
  float r = pow(abs(cos(5.0*a))*0.5 + 0.2, 0.8);
  return smoothstep(1.0,0.45, d / r);
}
void main(){
  vec2 uv = gl_PointCoord;
  float m = shapeMask(uv);
  if(m < 0.01) discard;
  float alpha = m * (0.6 + 0.4*vLife) * (0.8 + 0.2*fract(vN*123.0));
  float hue = fract(vN*0.33 + uHueShift);
  vec3 col = hsb2rgb(vec3(hue, 0.8, 1.0));
  o = vec4(col * (0.6 + 0.6*vLife), alpha);
}`;

// compile render
const renderProg = link(compile(renderVS, gl.VERTEX_SHADER), compile(renderFS, gl.FRAGMENT_SHADER));

// --- Post-processing: bright pass & two-pass blur & composite ---
const brightFS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D tex;
void main(){ vec3 c = texture(tex, vUv).rgb; float l = dot(c, vec3(0.299,0.587,0.114)); o = vec4(c * max(0.0, l-0.6), 1.0); }`;
const blurFS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D tex; uniform vec2 dir;
void main(){
  vec2 uv = vUv;
  vec3 sum = texture(tex, uv).rgb * 0.227027;
  sum += texture(tex, uv + dir * 1.384615).rgb * 0.316216;
  sum += texture(tex, uv - dir * 1.384615).rgb * 0.316216;
  sum += texture(tex, uv + dir * 3.230769).rgb * 0.070270;
  sum += texture(tex, uv - dir * 3.230769).rgb * 0.070270;
  o = vec4(sum,1.0);
}`;
const compFS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D scene, blur; uniform float intensity;
void main(){
  vec3 s = texture(scene, vUv).rgb;
  vec3 b = texture(blur, vUv).rgb * intensity;
  vec3 col = s + b;
  col = col / (col + vec3(1.0));
  o = vec4(pow(col, vec3(0.95,0.98,0.99)),1.0);
}`;
const brightProg = link(compile(quadVS, gl.VERTEX_SHADER), compile(brightFS, gl.FRAGMENT_SHADER));
const blurProg = link(compile(quadVS, gl.VERTEX_SHADER), compile(blurFS, gl.FRAGMENT_SHADER));
const compProg = link(compile(quadVS, gl.VERTEX_SHADER), compile(compFS, gl.FRAGMENT_SHADER));

// --- FBOs for scene & bloom ---
let sceneFBO = makeFBO(canvas.width, canvas.height);
let ping = makeFBO(Math.max(64, canvas.width>>1), Math.max(64, canvas.height>>1));
let pong = makeFBO(Math.max(64, canvas.width>>1), Math.max(64, canvas.height>>1));
function resizeFBOs(){ sceneFBO = makeFBO(canvas.width, canvas.height); ping = makeFBO(Math.max(64, canvas.width>>1), Math.max(64, canvas.height>>1)); pong = makeFBO(Math.max(64, canvas.width>>1), Math.max(64, canvas.height>>1)); }
window.addEventListener('resize', ()=>{ fit(); resizeFBOs(); });

// --- Input & UI hooks ---
let mouse = {x:0.5,y:0.5,down:false};
canvas.addEventListener('pointermove', e=>{
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mouse.x = ((e.clientX - r.left) * dpr) / canvas.width;
  mouse.y = 1.0 - ((e.clientY - r.top) * dpr) / canvas.height;
});
canvas.addEventListener('pointerdown', e=>{
  mouse.down = true;
  spawnBurst((mouse.x), (mouse.y));
});
canvas.addEventListener('pointerup', e=>{ mouse.down=false; });

// bursts queue
const bursts = [];
function spawnBurst(nx, ny, power=1.0){
  bursts.push({x:nx,y:ny,p:power,t:0});
  // also inject a few particle resets by directly manipulating buffer on GPU-friendly way: (we simply rely on update shader respawn)
}

// UI elements
const pauseBtn = document.getElementById('pause');
const shapeBtn = document.getElementById('shape');
const fsBtn = document.getElementById('fs');
const speedIn = document.getElementById('speed'), speedVal = document.getElementById('speedVal');
const bloomIn = document.getElementById('bloom'), bloomVal = document.getElementById('bloomVal');
const palPrev = document.getElementById('palPrev'), palNext = document.getElementById('palNext'), palName = document.getElementById('palName');

let running = true;
pauseBtn.onclick = ()=>{ running = !running; pauseBtn.textContent = running? 'Pause' : 'Play'; };
fsBtn.onclick = ()=>{ if(document.fullscreenElement) document.exitFullscreen(); else canvas.requestFullscreen(); };

let shapeMode = 0;
const shapeLabels = ['Circle','Diamond','Square','Star'];
shapeBtn.onclick = ()=>{ shapeMode = (shapeMode+1) % shapeLabels.length; shapeBtn.textContent = 'Shape: ' + shapeLabels[shapeMode]; };

let palettes = [
  {name:'Aurora', shift:0.03},
  {name:'Vapor', shift:0.22},
  {name:'Tropic', shift:0.55},
  {name:'Moss', shift:0.78}
];
let palIdx = 0;
palPrev.onclick = ()=>{ palIdx = (palIdx-1 + palettes.length)%palettes.length; palName.textContent = palettes[palIdx].name; };
palNext.onclick = ()=>{ palIdx = (palIdx+1) % palettes.length; palName.textContent = palettes[palIdx].name; };

speedIn.oninput = ()=> speedVal.textContent = parseFloat(speedIn.value).toFixed(2);
bloomIn.oninput = ()=> bloomVal.textContent = parseFloat(bloomIn.value).toFixed(2);
speedVal.textContent = speedIn.value; bloomVal.textContent = bloomIn.value;

// --- Transform Feedback & draw loop ---
const tf = gl.createTransformFeedback();
let last = performance.now()*0.001;
function frame(){
  const now = performance.now()*0.001;
  let dt = Math.min(0.033, now - last); last = now;
  if(!running) dt = 0;
  // update bursts time
  for(let i=bursts.length-1;i>=0;i++){
    bursts[i].t += dt;
    if(bursts[i].t > 0.6) bursts.splice(i,1);
  }

  // === Render base flow into scene FBO (for background color) ===
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fbo);
  gl.viewport(0,0,sceneFBO.w, sceneFBO.h);
  draw(flowProg, { uRes:[canvas.width, canvas.height], uTime:now, uMouse:[mouse.x, mouse.y], uHueShift: palettes[palIdx].shift }, []);

  // === Update particles with transform feedback ===
  gl.useProgram(updateProg);
  gl.uniform1f(gl.getUniformLocation(updateProg,'uTime'), now);
  gl.uniform1f(gl.getUniformLocation(updateProg,'uDt'), dt);
  gl.uniform1f(gl.getUniformLocation(updateProg,'uSpeed'), parseFloat(speedIn.value));
  gl.uniform2fv(gl.getUniformLocation(updateProg,'uRes'), [canvas.width, canvas.height]);
  gl.uniform2fv(gl.getUniformLocation(updateProg,'uMouse'), [mouse.x, mouse.y]);

  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, buffers[dst]);
  gl.enable(gl.RASTERIZER_DISCARD);
  gl.bindVertexArray(vaos[src]);
  gl.beginTransformFeedback(gl.POINTS);
  gl.drawArrays(gl.POINTS, 0, NUM);
  gl.endTransformFeedback();
  gl.disable(gl.RASTERIZER_DISCARD);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
  swap();

  // === Render particles onto sceneFBO using additive blending ===
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fbo);
  gl.viewport(0,0,sceneFBO.w, sceneFBO.h);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(renderProg);
  gl.uniform2fv(gl.getUniformLocation(renderProg,'uRes'), [canvas.width, canvas.height]);
  gl.uniform1f(gl.getUniformLocation(renderProg,'uTime'), now);
  gl.uniform1i(gl.getUniformLocation(renderProg,'uShape'), shapeMode);
  gl.uniform1f(gl.getUniformLocation(renderProg,'uHueShift'), palettes[palIdx].shift);
  gl.bindVertexArray(vaos[src]);
  gl.drawArrays(gl.POINTS, 0, NUM);
  gl.disable(gl.BLEND);

  // === Bloom: bright pass -> blur X -> blur Y ===
  gl.bindFramebuffer(gl.FRAMEBUFFER, ping.fbo);
  gl.viewport(0,0,ping.w,ping.h);
  draw(brightProg, {}, [{tex:sceneFBO.tex, name:'tex'}]);

  gl.bindFramebuffer(gl.FRAMEBUFFER, pong.fbo);
  gl.viewport(0,0,pong.w,pong.h);
  draw(blurProg, { dir: [1.5/ping.w, 0]}, [{tex:ping.tex, name:'tex'}]);

  gl.bindFramebuffer(gl.FRAMEBUFFER, ping.fbo);
  gl.viewport(0,0,ping.w,ping.h);
  draw(blurProg, { dir: [0, 1.5/pong.h]}, [{tex:pong.tex, name:'tex'}]);

  // === Composite to screen ===
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width, canvas.height);
  draw(compProg, { intensity: parseFloat(bloomIn.value) }, [{tex:sceneFBO.tex, name:'scene'}, {tex:ping.tex, name:'blur'}]);

  requestAnimationFrame(frame);
}
resizeFBOs();
requestAnimationFrame(frame);

// small performance tip: allow lowering NUM if slow (console)
console.log('Spectral Garden started. NUM=', NUM);

</script>
