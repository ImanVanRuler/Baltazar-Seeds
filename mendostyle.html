<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MendoStyle — Standalone</title>
<style>
  :root {
    --bg: #0b0b0b;
    --fg: #f7f7f7;
    --accent: #ff3b3b;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: clamp(20px, 5vw, 48px);
    letter-spacing: 1px;
    margin: 0;
  }
  p {
    max-width: 680px;
    color: #dcdcdc;
    margin: 0;
  }
  .box {
    padding: 1.2rem 1.6rem;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.03);
  }
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0.6rem;
    text-align: center;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h1>MendoStyle — Standalone</h1>
    <p>Dies ist eine komplett lokale Demo-Seite (keine externen Dateien). Wenn diese Seite angezeigt wird, ist Deine GitHub-Pages-Startseite korrekt.</p>
  </div>
</div>
<footer>mendostyle.html — lokal & self-contained</footer>
</body>
</html>
