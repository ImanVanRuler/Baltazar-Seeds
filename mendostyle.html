<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mendo Style</title>
<style>
  /* Grund-Reset */
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Arial', sans-serif; }
  body { background: linear-gradient(120deg, #1b1b1b, #2c2c2c); color: #fff; overflow-x: hidden; }

  /* Header */
  header { background: #111; padding: 2rem 1rem; text-align: center; position: relative; }
  header h1 { font-size: 3rem; letter-spacing: 2px; text-transform: uppercase; color: #f0a500; }
  header p { font-size: 1.2rem; margin-top: 0.5rem; color: #ccc; }

  /* Animierte Hintergrundeffekte */
  .bg-effect {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: radial-gradient(circle at 50% 50%, rgba(240,165,0,0.2), transparent 70%);
    animation: rotate 60s linear infinite;
    z-index: 0;
  }

  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Hauptbereich */
  main { position: relative; z-index: 1; padding: 5rem 1rem; max-width: 1200px; margin: 0 auto; text-align: center; }
  main h2 { font-size: 2rem; color: #f0a500; margin-bottom: 1rem; }
  main p { font-size: 1.1rem; line-height: 1.6; color: #ddd; margin-bottom: 2rem; }

  /* Buttons */
  .btn { display: inline-block; padding: 1rem 2rem; background: #f0a500; color: #111; text-decoration: none; text-transform: uppercase; font-weight: bold; border-radius: 8px; transition: all 0.3s ease; }
  .btn:hover { background: #fff; color: #111; transform: scale(1.05); box-shadow: 0 0 20px #f0a500; }

  /* Footer */
  footer { background: #111; text-align: center; padding: 2rem 1rem; color: #777; font-size: 0.9rem; margin-top: 4rem; }
</style>
</head>
<body>
  <div class="bg-effect"></div>

  <header>
    <h1>Mendo Style</h1>
    <p>Independent & Stylish</p>
  </header>

  <main>
    <h2>Welcome to the vibe</h2>
    <p>Hier steht dein eigener Content. Du kannst alles anpassen – Texte, Bilder, Buttons. Alles funktioniert eigenständig und die Seite ist sofort sichtbar.</p>
    <a href="#" class="btn">Check it out</a>
  </main>

  <footer>
    &copy; 2025 Mendo Style. All rights reserved.
  </footer>
</body>
</html>
