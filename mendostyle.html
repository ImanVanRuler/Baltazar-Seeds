<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendo Dope Farms</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; }

    /* Container */
    .container { text-align: center; padding: 20px; border: 2px solid #ffcc00; border-radius: 15px; background: rgba(0, 0, 0, 0.7); max-width: 90%; }

    /* Header */
    h1 { font-size: 3rem; color: #ffcc00; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 2px; }

    /* Paragraph */
    p { font-size: 1.2rem; color: #ccc; margin-bottom: 1.5rem; }

    /* Button */
    .btn { display: inline-block; padding: 10px 20px; margin-top: 10px; background-color: #ffcc00; color: #121212; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background-color 0.3s ease; }
    .btn:hover { background-color: #e6b800; }

    /* Footer */
    footer { position: absolute; bottom: 10px; font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mendo Dope Farms</h1>
    <p>Willkommen auf der offiziellen Seite von Mendo Dope Farms. Hier findest du alles über unsere preisgekrönten Sorten, Züchtungen und mehr.</p>
    <a href="https://mendodopefarms.com" class="btn" target="_blank">Besuche unseren Shop</a>
  </div>
  <footer>
    <p>&copy; 2025 Mendo Dope Farms. Alle Rechte vorbehalten.</p>
  </footer>
</body>
</html>
