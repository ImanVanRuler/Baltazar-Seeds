<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baltazar Seeds Mainmenu</title>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg-dark: #111;
      --text-light: #ff0b0b;
      --card-bg: rgba(0,0,0,0.7);
      --accent: #ff0b0b;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Bebas Neue', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      overflow-x: hidden;
    }

    body {opacity:0;transition:opacity 1s ease;}
    body.loaded {opacity:1;}

    header {
      display:flex;justify-content:space-between;align-items:center;
      padding:1rem 4vw;background:rgba(0,0,0,0.85);
      position:sticky;top:0;z-index:100;
    }

    header h1 {margin:0;font-family:'Nosifer',cursive;font-size:2rem;text-shadow:2px 2px 0 #000;}

    nav a {
      position:relative;
      color:var(--accent);
      text-decoration:none;
      margin-left:1rem;
      font-size:1.2rem;
      text-shadow:1px 1px 0 #000;
      transition:color 0.3s ease;
      overflow:hidden;
    }

    /* --- Neuer Effekt: Glow aus den Ecken --- */
    nav a::before, nav a::after {
      content:"";
      position:absolute;
      inset:0;
      border:2px solid var(--accent);
      border-radius:8px;
      opacity:0;
      transform:scale(0);
      transform-origin: top left;
      transition:transform 0.5s ease, opacity 0.5s ease;
      z-index:-1;
    }

    nav a::after {
      transform-origin: bottom right;
    }

    nav a:hover::before, nav a:hover::after {
      opacity:1;
      transform:scale(1);
      box-shadow:0 0 12px var(--accent),0 0 25px var(--accent);
    }

    nav a:hover {color:black;background:var(--accent);border-radius:4px;}

    /* Hero Section */
    .hero {
      position:relative;
      text-align:center;
      color:var(--accent);
      overflow:hidden;
      height:70vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .hero video {
      position:absolute;top:0;left:0;width:100%;height:100%;
      object-fit:cover;z-index:0;opacity:0;
      animation:fadeIn 2s forwards;
    }

    .hero .hero-text {position:relative;z-index:1;}
    .hero h2 {
      font-family:'Nosifer',cursive;
      font-size:clamp(48px,8vw,96px);
      color:#8b0000;
      text-shadow:0 0 5px #a64dff,0 0 10px #a64dff;
      animation:purpleGlow 3s ease-in-out infinite;
    }

    @keyframes fadeIn {to{opacity:1;}}
    @keyframes purpleGlow {
      0%,100%{text-shadow:0 0 5px #a64dff,0 0 10px #a64dff;}
      50%{text-shadow:0 0 15px #b266ff,0 0 25px #a64dff,0 0 35px #d9b3ff;}
    }

    /* Kategorie-Buttons mit gleichem Effekt */
    .category-bar {
      display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;
      padding:1rem 4vw;background:rgba(0,0,0,0.8);
      position:sticky;top:70px;z-index:99;
    }

    .category-bar button {
      position:relative;
      background:rgba(0,0,0,0.6);
      border:2px solid var(--accent);
      color:var(--accent);
      font-size:1rem;
      font-family:'Bebas Neue',sans-serif;
      padding:0.5rem 1rem;
      border-radius:6px;
      cursor:pointer;
      overflow:hidden;
      transition:color 0.3s ease, background 0.3s ease;
    }

    .category-bar button::before, .category-bar button::after {
      content:"";
      position:absolute;
      inset:0;
      border:2px solid var(--accent);
      border-radius:6px;
      opacity:0;
      transform:scale(0);
      transform-origin: top left;
      transition:transform 0.5s ease, opacity 0.5s ease;
      z-index:-1;
    }
    .category-bar button::after {transform-origin: bottom right;}
    .category-bar button:hover::before, .category-bar button:hover::after {
      opacity:1;
      transform:scale(1);
      box-shadow:0 0 12px var(--accent),0 0 25px var(--accent);
    }

    .category-bar button:hover, .category-bar button.active {
      background:var(--accent);
      color:black;
    }

    /* Buttons im Grid */
    .btn {
      position:relative;
      display:inline-block;
      margin-top:0.8rem;
      padding:0.6rem 1.2rem;
      font-size:0.9rem;
      color:var(--accent);
      background:rgba(0,0,0,0.6);
      border:2px solid var(--accent);
      border-radius:6px;
      text-decoration:none;
      cursor:pointer;
      overflow:hidden;
      transition:color 0.3s ease, background 0.3s ease;
    }

    .btn::before, .btn::after {
      content:"";
      position:absolute;
      inset:0;
      border:2px solid var(--accent);
      border-radius:6px;
      opacity:0;
      transform:scale(0);
      transform-origin: top left;
      transition:transform 0.5s ease, opacity 0.5s ease;
      z-index:-1;
    }
    .btn::after {transform-origin: bottom right;}
    .btn:hover::before, .btn:hover::after {
      opacity:1;
      transform:scale(1);
      box-shadow:0 0 12px var(--accent),0 0 25px var(--accent);
    }

    .btn:hover {background:var(--accent);color:black;}

    /* Footer */
    footer {
      text-align:center;
      padding:2rem 1rem;
      background:rgba(0,0,0,0.85);
      font-size:0.9rem;
      text-shadow:1px 1px 0 #000;
    }

    footer .footer-socials a {
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:3rem;height:3rem;
      font-size:1.5rem;
      color:var(--accent);
      margin:0 0.5rem;
      text-decoration:none;
      border-radius:50%;
      overflow:hidden;
      transition:color 0.3s ease;
    }

    footer .footer-socials a::before, footer .footer-socials a::after {
      content:"";
      position:absolute;
      inset:0;
      border:2px solid var(--accent);
      border-radius:50%;
      opacity:0;
      transform:scale(0);
      transform-origin: top left;
      transition:transform 0.5s ease, opacity 0.5s ease;
      z-index:-1;
    }
    footer .footer-socials a::after {transform-origin: bottom right;}
    footer .footer-socials a:hover::before, footer .footer-socials a:hover::after {
      opacity:1;
      transform:scale(1);
      box-shadow:0 0 12px var(--accent),0 0 25px var(--accent);
    }

    .donate-btn {
      position:fixed;bottom:1rem;right:1rem;
      padding:0.5rem 1rem;
      font-size:0.75rem;
      font-family:'Nosifer',cursive;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(145deg,#ff4d4d,var(--accent));
      border-radius:6px;
      border:2px solid var(--accent);
      box-shadow:0 2px 6px rgba(255,11,11,0.5);
      z-index:9999;
      transition:all 0.3s ease, transform 0.2s ease;
      text-shadow:1px 1px 2px black;
      overflow:hidden;
    }

    .donate-btn::before, .donate-btn::after {
      content:"";
      position:absolute;
      inset:0;
      border:2px solid var(--accent);
      border-radius:6px;
      opacity:0;
      transform:scale(0);
      transform-origin: top left;
      transition:transform 0.5s ease, opacity 0.5s ease;
      z-index:-1;
    }
    .donate-btn::after {transform-origin: bottom right;}
    .donate-btn:hover::before, .donate-btn:hover::after {
      opacity:1;
      transform:scale(1);
      box-shadow:0 0 12px var(--accent),0 0 25px var(--accent);
    }
    .donate-btn:hover {background:linear-gradient(145deg,var(--accent),#ff4d4d);transform:scale(1.05);}
  </style>
</head>
<body>
<header>
  <h1></h1>
  <nav>
    <a href="#">Entrance</a>
    <a href="#">Menu</a>
    <a href="#">Imprint & Contact</a>
    <a href="#">Fun Area</a>
  </nav>
</header>
<section class="hero">
  <video autoplay muted loop playsinline>
    <source src="INTRO.mp4" type="video/mp4">
  </video>
  <div class="hero-text">
    <h2>BALTAZAR SEEDS</h2>
  </div>
</section>

<div class="category-bar">
  <button class="active">ALL</button>
  <button>MOSTLY SATIVA</button>
  <button>MOSTLY INDICA</button>
</div>

<a class="btn" href="#">View Details</a>

<footer>
  <div class="footer-socials">
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-youtube"></i></a>
  </div>
</footer>

<a href="#" class="donate-btn">Donate</a>
</body>
</html>
