<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KI AGENTEN</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
.station{
    position:relative;
    width:100vw;
    height:100vh;
    background:#000;
    overflow:hidden;
}
.station-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
}
.ui{
    position:absolute;
    inset:0;
    pointer-events:none;
}
.chat{
    position:absolute;
    bottom:7.1%;
    width:32.1%;
    height:17.8%;
    padding:7px 10px 0;
    overflow:auto;
    pointer-events:auto;
    color:#c8d5dd;
    font-size:clamp(9px,.82vw,14px);
    line-height:1.45;
    scrollbar-width:none;
}
.chat::-webkit-scrollbar{display:none}
.chat.one{left:17.7%}
.chat.two{left:50.4%}
.msg{margin:0 0 5px;text-shadow:0 0 5px #000}
.msg .who{font-weight:bold}
.one .agent .who{color:#35f49b}
.two .agent .who{color:#35aaff}
.user .who{color:#d9e3e9}
.input{
    position:absolute;
    bottom:2.65%;
    height:4.1%;
    width:24.5%;
    border:0;
    outline:0;
    background:rgba(0,0,0,.86);
    color:#dce8ee;
    padding:0 13px;
    font-size:clamp(9px,.78vw,14px);
    pointer-events:auto;
}
.input.one{left:18.8%}
.input.two{left:51.4%}
.input::placeholder{color:#73818b}
.send{
    position:absolute;
    bottom:2.65%;
    height:4.1%;
    width:4.9%;
    border:0;
    background:transparent;
    color:transparent;
    cursor:pointer;
    pointer-events:auto;
}
.send.one{left:43.9%}
.send.two{left:76.6%}
.send:disabled{cursor:default}
.hit{
    position:absolute;
    pointer-events:auto;
    cursor:pointer;
    background:transparent;
    border:0;
}
.task-area{right:0;top:5.5%;width:17%;height:55%}
.log-area{right:0;top:67%;width:17%;height:25%}
@media(max-aspect-ratio:1/1){
    .station-bg{height:100%;width:100%;object-fit:cover}
    .chat{font-size:10px}
}
</style>
</head>

    <div class="ui">
        <div class="chat one" id="chat1"></div>
        <div class="chat two" id="chat2"></div>

        <input class="input one" id="input1" placeholder="Nachricht an Agent 1 ..." autocomplete="off">
        <button class="send one" id="send1" aria-label="Agent 1 senden"></button>

        <input class="input two" id="input2" placeholder="Nachricht an Agent 2 ..." autocomplete="off">
        <button class="send two" id="send2" aria-label="Agent 2 senden"></button>
    </div>
</div>

<script>
const chats = {
    1: document.getElementById("chat1"),
    2: document.getElementById("chat2")
};
const inputs = {
    1: document.getElementById("input1"),
    2: document.getElementById("input2")
};
const buttons = {
    1: document.getElementById("send1"),
    2: document.getElementById("send2")
};

function addMessage(agent, who, text){
    const row = document.createElement("div");
    row.className = "msg " + (who === "User" ? "user" : "agent");

    const name = document.createElement("span");
    name.className = "who";
    name.textContent = who + ": ";

    const body = document.createElement("span");
    body.textContent = text;

    row.appendChild(name);
    row.appendChild(body);
    chats[agent].appendChild(row);
    chats[agent].scrollTop = chats[agent].scrollHeight;
}

async function sendToAgent(agent){
    const input = inputs[agent];
    const button = buttons[agent];
    const text = input.value.trim();
    if(!text) return;

    addMessage(agent, "User", text);
    input.value = "";
    button.disabled = true;

    try{
        const response = await fetch("/api/chat", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:text, agent:agent})
        });

        const data = await response.json();

        if(!response.ok) throw new Error(data.error || "Serverfehler");

        addMessage(agent, "Agent " + agent, data.reply ?? "Keine Antwort erhalten.");
    }catch(error){
        addMessage(agent, "System", "Fehler: " + error.message);
    }finally{
        button.disabled = false;
        input.focus();
    }
}

buttons[1].addEventListener("click", () => sendToAgent(1));
buttons[2].addEventListener("click", () => sendToAgent(2));

inputs[1].addEventListener("keydown", e => {
    if(e.key === "Enter") sendToAgent(1);
});
inputs[2].addEventListener("keydown", e => {
    if(e.key === "Enter") sendToAgent(2);
});
</script>
