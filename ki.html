let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

window.onerror=function(m,s,l,c,e){
  err.style.display="block";
  err.textContent="Spiel konnte einen Fehler abfangen: "+m;
  setTimeout(()=>err.style.display="none",5000);
};

const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];

const keys={};
const pressed={};
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(!keys[k])pressed[k]=true;
  keys[k]=true;
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();
  AudioEngine.unlock();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let pad=null;
function pollPad(){
  const p=navigator.getGamepads?navigator.getGamepads()[0]:null;
  pad=p;
}
function btn(i){return !!pad&&!!pad.buttons[i]&&pad.buttons[i].pressed}

function action(name){
  if(name==="attack")return pressed.j||btn(2);
  if(name==="dash")return pressed.k||btn(1);
  if(name==="interact")return pressed.e||btn(0);
  if(name==="inventory")return pressed.i||btn(3);
  if(name==="pause")return pressed.escape||btn(9);
  return false;
}
function held(name){
  if(name==="up")return keys.w||keys.arrowup||(pad&&pad.axes[1]<-.35);
  if(name==="down")return keys.s||keys.arrowdown||(pad&&pad.axes[1]>.35);
  if(name==="left")return keys.a||keys.arrowleft||(pad&&pad.axes[0]<-.35);
  if(name==="right")return keys.d||keys.arrowright||(pad&&pad.axes[0]>.35);
  return false;
}

/* =========================================================
   AUDIO
   ========================================================= */

const AudioEngine={
  ctx:null,
  master:null,
  music:null,
  unlocked:false,
  unlock(){
    if(this.unlocked)return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();
      this.master.gain.value=.13;
      this.master.connect(this.ctx.destination);
      this.unlocked=true;
      this.startMusic();
    }catch(e){}
  },
  tone(freq,dur,type="sine",vol=.2,slide=0){
    if(!this.unlocked)return;
    const c=this.ctx;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=freq;
    if(slide)o.frequency.linearRampToValueAtTime(freq+slide,c.currentTime+dur);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
    o.connect(g);g.connect(this.master);o.start();o.stop(c.currentTime+dur);
  },
  noise(dur=.08,vol=.12){
    if(!this.unlocked)return;
    const c=this.ctx,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=c.createBufferSource(),g=c.createGain();
    s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(this.master);s.start();
  },
  startMusic(){
    if(!this.unlocked)return;
    if(this.music)return;
    const c=this.ctx;
    this.music=setInterval(()=>{
      if(game.mode!=="play")return;
      const root=game.bossActive?110:game.zone==="village"?196:game.zone==="dungeon"?147:165;
      this.tone(root,.7,"triangle",.025);
      setTimeout(()=>this.tone(root*1.5,.5,"sine",.018),180);
      setTimeout(()=>this.tone(root*1.25,.5,"sine",.014),360);
    },900);
  },
  attack(){this.tone(220,.09,"sawtooth",.09,180)},
  hit(){this.tone(90,.12,"square",.11,-40);this.noise(.05,.06)},
  hurt(){this.tone(65,.22,"sawtooth",.13,-30)},
  item(){this.tone(523,.1,"sine",.08);setTimeout(()=>this.tone(784,.15,"sine",.06),80)},
  chest(){this.tone(330,.12,"triangle",.07);setTimeout(()=>this.tone(660,.25,"triangle",.08),130)},
  door(){this.tone(120,.35,"sine",.08,-80)},
  switch(){this.tone(440,.08,"square",.07);setTimeout(()=>this.tone(660,.12,"square",.05),90)},
  boss(){this.tone(55,.7,"sawtooth",.12,-15)},
  death(){this.tone(180,.5,"triangle",.12,-150)},
  win(){[523,659,784,1046].forEach((n,i)=>setTimeout(()=>this.tone(n,.35,"triangle",.08),i*160))}
};

/* =========================================================
   SAVE / LOAD
   ========================================================= */

function saveGame(){
  const data={
    zone:game.zone,playTime:game.playTime,
    player:{x:player.x,y:player.y,hp:player.hp,potions:player.potions,coins:player.coins,damage:player.damage,equipment:player.equipment},
    chests,switches,doors,defeated,questState,worldFlags
  };
  try{
    localStorage.setItem("echoesOfAsterraSave",JSON.stringify(data));
    toast("Spiel gespeichert");
  }catch(e){toast("Speichern nicht möglich")}
}

function loadGame(){
  try{
    const raw=localStorage.getItem("echoesOfAsterraSave");
    if(!raw)return false;
    const d=JSON.parse(raw);
    game.zone=d.zone||"village";
    game.playTime=d.playTime||0;
    Object.assign(player,d.player||{});
    chests=d.chests||{};
    switches=d.switches||{};
    doors=d.doors||{};
    defeated=d.defeated||{};
    questState=d.questState||{};
    worldFlags=Object.assign(worldFlags,d.worldFlags||{});
    enterZone(game.zone);
    game.mode="play";
    toast("Spielstand geladen");
    return true;
  }catch(e){return false}
}

function hasSave(){
  try{return !!localStorage.getItem("echoesOfAsterraSave")}catch(e){return false}
}

function enterZone(zone){
  game.zone=zone;
  entities=[];
  particles=[];
  game.bossActive=null;
  const z=zones[zone];
  if(zone==="village"){player.x=900;player.y=620;spawnVillage()}
  if(zone==="forest"){player.x=120;player.y=750;spawnForest()}
  if(zone==="lake"){player.x=100;player.y=700;spawnLake()}
  if(zone==="ruins"){player.x=130;player.y=700;spawnRuins()}
  if(zone==="mountain"){player.x=100;player.y=1000;spawnMountain()}
  if(zone==="dungeon1"){player.x=180;player.y=500;spawnDungeon1()}
  if(zone==="dungeon2"){player.x=180;player.y=500;spawnDungeon2()}
  if(zone==="dungeon3"){player.x=180;player.y=550;spawnDungeon3()}
  camera.x=player.x-W/2;
  camera.y=player.y-H/2;
}

function wall(x,y,w,h,type="wall"){entities.push({kind:"wall",x,y,w,h,type})}

function npc(id,name,x,y,color,dialog,quest){
  entities.push({kind:"npc",id,name,x,y,r:20,color,dialog,quest})
}
function enemy(type,x,y){
  const id=type+"_"+Math.random().toString(36).slice(2);
  if(defeated[id])return;
  const stats={
    slime:{hp:28,speed:55,r:15,damage:7,color:"#79c86b",range:32,cd:1.2},
    wolf:{hp:38,speed:105,r:16,damage:10,color:"#9a9fa7",range:35,cd:.9},

    knight:{hp:70,speed:45,r:20,damage:16,color:"#75839b",range:42,cd:1.4},
    brute:{hp:95,speed:35,r:24,damage:20,color:"#8d5c43",range:48,cd:1.7}
  };
  const s=stats[type];
  entities.push({kind:"enemy",id,type,x,y,r:s.r,hp:s.hp,maxHp:s.hp,speed:s.speed,damage:s.damage,color:s.color,range:s.range,cd:s.cd,attack:0,hit:0,phase:Math.random()*5})
}
function chest(id,x,y,item,locked=false){

/* =========================================================
   QUESTS / DIALOG
   ========================================================= */

function startQuest(id){
  if(!questState[id])questState[id]="active";
  game.quest=id;
}
function completeQuest(id){
  questState[id]="done";
  if(id==="main1"){
    player.maxHp+=20;player.hp=player.maxHp;
    toast("Die Lebensenergie wächst");
  }
}

function talk(n){
  if(!n)return;
  let lines=n.dialog.slice();
  if(n.id==="elder"){
    if(!questState.main1){
      lines=["Elya: Die drei Heiligtümer warten.","Elya: Finde die drei Sternensplitter.","Elya: Kehre danach zu mir zurück."];
      startQuest("main1");
    }else if(worldFlags.boss3){
      lines=["Elya: Du hast die drei Splitter gefunden.","Elya: Das Tor zum Himmelsherz ist offen.","Elya: Geh und beende was vor Jahrhunderten begann."];
    }else{
      lines=["Elya: Drei Splitter... drei Heiligtümer.","Elya: Der Wald, die Sonne und der Mond."];
    }
  }
  if(n.id==="smith"){
    if(player.equipment.blade)lines=["Rovan: Diese Klinge kennt nun deinen Griff.","Rovan: Sie wird dich nicht im Stich lassen."];
    else if(hasItem("blade")){
      player.equipment.blade=true;player.damage+=8;removeItem("blade");
      lines=["Rovan: Diese Klinge ist besser als sie aussieht.","Rovan: Jetzt kannst du den alten Stahl führen."];
      AudioEngine.item();
    }
  }
  if(n.id==="healer"){
    player.hp=player.maxHp;
    lines=["Mira: Atme tief durch.","Mira: Deine Wunden sind geschlossen."];
    AudioEngine.item();
  }
  game.dialogue={name:n.name,lines,index:0,npc:n};
  game.mode="dialog";
}

function advanceDialog(){
  if(!game.dialogue)return;
  game.dialogue.index++;
  if(game.dialogue.index>=game.dialogue.lines.length){
    game.dialogue=null;game.mode="play";
    saveGame();
  }
}

function toast(t){
  game.message=t;game.messageTime=2.5;
}

function hasItem(id){
  if(id==="potion")return player.potions>0;
  return !!(player.items&&player.items[id]);
}
function addItem(id){
  if(!player.items)player.items={};
  if(id==="potion")player.potions++;
  else player.items[id]=(player.items[id]||0)+1;
  AudioEngine.item();
  toast(ITEMS[id]?.name||id+" erhalten");
}
function removeItem(id){
  if(id==="potion"){if(player.potions>0)player.potions--;return}
  if(player.items&&player.items[id]){
    player.items[id]--;
    if(player.items[id]<=0)delete player.items[id];
  }
}

/* =========================================================
   COLLISION
   ========================================================= */

function circleRect(c,r){
  const nx=clamp(c.x,r.x,r.x+r.w);
  const ny=clamp(c.y,r.y,r.y+r.h);
  return Math.hypot(c.x-nx,c.y-ny)<c.r;
}
function solid(e){
  if(e.kind==="wall")return true;
  if(e.kind==="door")return e.locked;
  if(e.kind==="water")return true;
  return false;
}
function blocked(x,y,r=player.r){
  const z=zones[game.zone];
  if(x<r||y<r||x>z.w-r||y>z.h-r)return true;
  for(const e of entities){
    if(solid(e)&&circleRect({x,y},r,e))return true;
  }
  return false;
}
function moveCircle(o,dx,dy){
  const nx=o.x+dx,ny=o.y+dy;
  if(!blocked(nx,o.y,o.r))o.x=nx;
  if(!blocked(o.x,ny,o.r))o.y=ny;
}

/* =========================================================
   COMBAT
   ========================================================= */

function playerAttack(){
  if(player.attackCooldown>0||player.attack>0)return;
  player.attack=.25;
  player.attackCooldown=.35;
  AudioEngine.attack();
  particlesBurst(player.x+player.dir.x*35,player.y+player.dir.y*35,"#d8f0ff",8);
  for(const e of entities){
    if(e.kind!=="enemy"&&e.kind!=="boss")continue;
    const dx=e.x-player.x,dy=e.y-player.y;
    const d=Math.hypot(dx,dy);
    if(d<75){
      const dot=(dx*player.dir.x+dy*player.dir.y)/(d||1);
      if(dot>.15)damageEnemy(e,player.damage);
    }
  }
}

function damageEnemy(e,dmg){
  if(e.hit>0)return;
  e.hp-=dmg;e.hit=.12;
  texts.push({x:e.x,y:e.y-30,text:"-"+dmg,color:"#fff",life:.7});
  particlesBurst(e.x,e.y,"#fff",5);
  AudioEngine.hit();
  game.shake=Math.max(game.shake,5);
  if(e.hp<=0){
    if(e.kind==="boss"){
      defeated[e.id]=true;
      bossDefeated(e);
    }else{
      defeated[e.id]=true;
      if(Math.random()<.25)addItem("potion");
      else player.coins+=irnd(1,5);
      e.dead=true;
    }
  }
}

function bossDefeated(e){
  game.bossActive=null;
  const key=e.type==="rootwarden"?"boss1":e.type==="sunqueen"?"boss2":"boss3";
  defeated[key]=true;
  worldFlags[key]=true;
  player.maxHp+=15;player.hp=player.maxHp;
  if(key==="boss1")addItem("star");
  if(key==="boss2")addItem("star");
  if(key==="boss3"){
    addItem("star");
    questState.main1="done";
    game.win=true;
    game.mode="win";
    AudioEngine.win();
  }
  toast(e.name+" besiegt!");
  saveGame();
}

function damagePlayer(dmg){
  if(player.invuln>0||game.mode!=="play")return;
  player.hp-=dmg;player.invuln=.8;player.hurt=.25;
  game.flash=.2;game.shake=10;
  texts.push({x:player.x,y:player.y-30,text:"-"+dmg,color:"#ff7272",life:.7});
  AudioEngine.hurt();
  if(player.hp<=0){
    player.hp=0;
    game.mode="gameover";
    AudioEngine.death();
  }
}

/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemy(e,dt){
  if(e.dead)return;
  e.hit=Math.max(0,e.hit-dt);
  e.attack=Math.max(0,e.attack-dt);
  const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d<500){
    let vx=dx/d,vy=dy/d;
    if(e.type==="archer"){
      if(d<150){vx=-vx;vy=-vy}
      else if(d>260){vx*=.5;vy*=.5}
      moveCircle(e,vx*e.speed*dt,vy*e.speed*dt);
      if(d<280&&e.attack<=0){
        e.attack=e.cd;
        const a=Math.atan2(dy,dx);
        entities.push({kind:"projectile",x:e.x,y:e.y,vx:Math.cos(a)*280,vy:Math.sin(a)*280,r:6,damage:e.damage,life:2,color:"#f0b96d"});
      }
    }else{
      moveCircle(e,vx*e.speed*dt,vy*e.speed*dt);
      if(d<e.range+player.r&&e.attack<=0){
        e.attack=e.cd;
        damagePlayer(e.damage);
      }
    }
  }
}

function updateBoss(e,dt){
  e.hit=Math.max(0,e.hit-dt);
  e.attack-=dt;
  const hpRatio=e.hp/e.maxHp;
  e.phase=hpRatio<.66?1:hpRatio<.33?2:0;
  const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.type==="rootwarden"){
    if(d>170)moveCircle(e,dx/d*35*dt,dy/d*35*dt);
    if(e.attack<=0){
      e.attack=[1.8,1.4,1.1][e.phase];
      if(e.phase===0){
        radialProjectiles(e,6,150);
      }else if(e.phase===1){
        for(let i=0;i<3;i++)setTimeout(()=>radialProjectiles(e,8,180),i*180);
      }else{
        radialProjectiles(e,12,240);
      }
    }
  }
  if(e.type==="sunqueen"){
    if(d>260)moveCircle(e,dx/d*55*dt,dy/d*55*dt);
    if(e.attack<=0){
      e.attack=[1.5,1.1,.75][e.phase];
      const a=Math.atan2(dy,dx);
      for(let i=-1;i<=1;i++){
        projectile(e,a+i*.25,300,14);
      }
    }
  }
  if(e.type==="moonbeast"){
    if(d>100)moveCircle(e,dx/d*75*dt,dy/d*75*dt);
    if(e.attack<=0){
      e.attack=[1.4,1,.65][e.phase];
      if(e.phase===0){
        projectile(e,Math.atan2(dy,dx),360,18);
      }else if(e.phase===1){
        radialProjectiles(e,10,320);
      }else{
        if(d<100)damagePlayer(32);
        radialProjectiles(e,16,350);
        game.shake=12;
      }
    }
  }
}

function projectile(owner,a,speed,damage){
  entities.push({
    kind:"projectile",x:owner.x,y:owner.y,
    vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    r:7,damage,life:3,color:owner.color
  });
}
function radialProjectiles(owner,n,speed){
  for(let i=0;i<n;i++)projectile(owner,i*TAU/n+game.time*.3,speed,owner.damage);
}

/* =========================================================
   INTERACTION
   ========================================================= */

function interact(){
  for(const e of entities){
    if(e.kind==="npc"&&Math.hypot(player.x-e.x,player.y-e.y)<70){
      talk(e);return;
    }
    if(e.kind==="chest"&&Math.hypot(player.x-e.x,player.y-e.y)<75){
      openChest(e);return;
    }
    if(e.kind==="switch"&&Math.hypot(player.x-e.x,player.y-e.y)<75){
      switches[e.id]=!switches[e.id];
      AudioEngine.switch();
      toast(switches[e.id]?"Schalter aktiviert":"Schalter deaktiviert");
      enterZone(game.zone);return;
    }
    if(e.kind==="exit"&&circleRect(player,e)){
      if(e.locked){toast("Der Weg ist versiegelt");return}
      game.transition=.35;game.transitionTo=e.to;
      setTimeout(()=>enterZone(e.to),350);
      return;
    }
  }
}

function circleRect(c,r){
  const nx=clamp(c.x,r.x,r.x+r.w),ny=clamp(c.y,r.y,r.y+r.h);
  return Math.hypot(c.x-nx,c.y-ny)<c.r;
}

function openChest(e){
  if(chests[e.id]){toast("Die Truhe ist leer");return}
  if(e.locked&&!hasItem("forestKey")&&!hasItem("ruinKey")&&!hasItem("moonKey")){
    toast("Verschlossen");return;
  }
  chests[e.id]=true;
  addItem(e.item);
  AudioEngine.chest();
}

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){
  pollPad();
  game.time+=dt;
  if(game.mode==="play"){
    game.playTime+=dt;
    updatePlay(dt);
  }
  game.messageTime=Math.max(0,game.messageTime-dt);
  game.shake=Math.max(0,game.shake-dt*20);
  game.flash=Math.max(0,game.flash-dt);
  player.invuln=Math.max(0,player.invuln-dt);
  player.hurt=Math.max(0,player.hurt-dt);
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
  for(const t of texts){t.y-=25*dt;t.life-=dt}
  texts=texts.filter(t=>t.life>0);
}

function updatePlay(dt){
  if(action("pause")){pressed.escape=false;game.mode="pause";return}
  if(action("inventory")){pressed.i=false;game.inventoryOpen=!game.inventoryOpen;return}
  if(game.inventoryOpen)return;

  if(action("attack")){pressed.j=false;playerAttack()}
  if(action("interact")){pressed.e=false;interact()}
  if(action("dash")){pressed.k=false;dash()}

  let dx=(held("right")?1:0)-(held("left")?1:0);
  let dy=(held("down")?1:0)-(held("up")?1:0);
  const len=Math.hypot(dx,dy)||1;
  if(dx||dy){
    dx/=len;dy/=len;
    player.dir.x=dx;player.dir.y=dy;
  }
  let speed=player.speed;
  if(player.dash>0)speed=520;
  moveCircle(player,dx*speed*dt,dy*speed*dt);
  player.dash=Math.max(0,player.dash-dt);
  player.dashCooldown=Math.max(0,player.dashCooldown-dt);
  player.attack=Math.max(0,player.attack-dt);
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);
  player.stamina=clamp(player.stamina+30*dt,0,player.maxStamina);

  for(const e of entities){
    if(e.kind==="enemy")updateEnemy(e,dt);
    if(e.kind==="boss")updateBoss(e,dt);
    if(e.kind==="projectile"){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;
      if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
        damagePlayer(e.damage);e.life=0;
      }
    }
  }
  entities=entities.filter(e=>!e.dead&&e.life!==0);

  if(game.quest==="main1"&&questState.main1==="done"){
    game.quest=null;
  }
  if(player.hp<player.maxHp&&keys.h&&player.potions>0){
    player.potions--;player.hp=Math.min(player.maxHp,player.hp+40);AudioEngine.item();
  }

  camera.x+=(player.x-W/2-camera.x)*Math.min(1,dt*6);
  camera.y+=(player.y-H/2-camera.y)*Math.min(1,dt*6);
  const z=zones[game.zone];
  camera.x=clamp(camera.x,0,Math.max(0,z.w-W));
  camera.y=clamp(camera.y,0,Math.max(0,z.h-H));
}

function dash(){
  if(player.dashCooldown>0||player.stamina<25)return;
  player.stamina-=25;player.dash=.18;player.dashCooldown=.65;player.invuln=.25;
  particlesBurst(player.x,player.y,"#9ddcff",12);
}

/* =========================================================
   PARTICLES
   ========================================================= */

function particlesBurst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=rnd(30,150);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.2,.6),max:.6,color,r:rnd(2,5)});
  }
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if(game.mode==="title"){drawTitle();ctx.restore();return}
  drawWorld();
  if(game.mode==="dialog")drawDialogue();
  if(game.mode==="pause")drawPause();
  if(game.mode==="gameover")drawGameOver();
  if(game.mode==="win")drawWin();
  ctx.restore();
}

function drawWorld(){
  const z=zones[game.zone];
  ctx.fillStyle=z.color;ctx.fillRect(0,0,W,H);

  ctx.save();
  const sx=(Math.random()-.5)*game.shake,sy=(Math.random()-.5)*game.shake;
  ctx.translate(-camera.x+sx,-camera.y+sy);

  drawGround();
  for(const e of entities)if(e.kind==="water")drawWater(e);
  for(const e of entities){
    if(e.kind==="wall")drawWall(e);
    if(e.kind==="door")drawDoor(e);
    if(e.kind==="exit")drawExit(e);
    if(e.kind==="chest")drawChest(e);
    if(e.kind==="switch")drawSwitch(e);
    if(e.kind==="npc")drawNPC(e);
    if(e.kind==="enemy")drawEnemy(e);
    if(e.kind==="boss")drawBoss(e);
    if(e.kind==="projectile")drawProjectile(e);
  }
  drawPlayer();
  for(const p of particles)drawParticle(p);
  for(const t of texts)drawTextWorld(t);

  ctx.restore();

  drawHUD();
  if(game.inventoryOpen)drawInventory();
  if(game.messageTime>0)drawToast();
  if(game.flash>0){ctx.fillStyle="rgba(255,50,50,"+game.flash*2+")";ctx.fillRect(0,0,W,H)}
}

function drawGround(){
  const z=zones[game.zone];
  ctx.fillStyle=z.color;ctx.fillRect(0,0,z.w,z.h);
  const tile=64;
  const x0=Math.floor(camera.x/tile)*tile;
  const y0=Math.floor(camera.y/tile)*tile;
  for(let y=y0;y<camera.y+H+tile;y+=tile){
    for(let x=x0;x<camera.x+W+tile;x+=tile){
      if(((x/tile+y/tile)&1)===0){
        ctx.fillStyle=game.zone==="lake"?"#1a4058":game.zone==="ruins"?"#604f36":game.zone==="mountain"?"#49434e":game.zone.startsWith("dungeon")?z.color:"#284d36";
        ctx.fillRect(x,y,tile,tile);
      }
      if(game.zone==="forest"&&Math.random()<.02){
        ctx.fillStyle="#39734a";ctx.fillRect(x+20,y+35,3,15);
      }
    }
  }
  if(game.zone==="village"){
    ctx.fillStyle="#9b825c";ctx.fillRect(720,0,360,1200);
    ctx.fillStyle="#765e43";ctx.fillRect(0,570,1800,100);
  }
}

function drawWall(e){
  ctx.fillStyle=e.type==="tree"?"#102a1e":e.type==="rock"?"#55545b":e.type==="ruin"?"#827157":"#394450";
  ctx.fillRect(e.x,e.y,e.w,e.h);
  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.fillRect(e.x+5,e.y+e.h,e.w,8);
  if(e.type==="tree"){
    ctx.fillStyle="#244b2c";
    ctx.beginPath();ctx.arc(e.x+e.w/2,e.y+10,32,0,TAU);ctx.fill();
  }
}

function drawWater(e){
  ctx.fillStyle="#164764";ctx.fillRect(e.x,e.y,e.w,e.h);
  ctx.strokeStyle="rgba(120,210,235,.22)";
  for(let y=e.y+20;y<e.y+e.h;y+=40){
    ctx.beginPath();
    for(let x=e.x;x<e.x+e.w;x+=20)ctx.lineTo(x,y+Math.sin(game.time*2+x*.03)*4);
    ctx.stroke();
  }
}

function drawDoor(e){
  ctx.fillStyle=e.locked?"#4d241e":"#6f4a2d";
  ctx.fillRect(e.x,e.y,e.w,e.h);
  if(e.locked){
    ctx.fillStyle="#d5b45e";ctx.fillRect(e.x+e.w/2-5,e.y+e.h/2-5,10,10);
  }
}

function drawExit(e){
  ctx.fillStyle="rgba(100,190,255,.16)";
  ctx.fillRect(e.x,e.y,e.w,e.h);
  ctx.strokeStyle="rgba(160,230,255,.5)";
  ctx.strokeRect(e.x,e.y,e.w,e.h);
}

function drawChest(e){
  const open=!!chests[e.id];
  ctx.fillStyle=open?"#604d34":"#9b682d";
  ctx.fillRect(e.x-21,e.y-17,42,34);
  ctx.fillStyle="#d4a848";ctx.fillRect(e.x-3,e.y-17,6,34);
  if(!open){ctx.fillStyle="#e4d07b";ctx.fillRect(e.x-4,e.y-2,8,8)}
}

function drawSwitch(e){
  const on=!!switches[e.id];
  ctx.fillStyle=on?"#72e8a0":"#633d3d";
  ctx.beginPath();ctx.arc(e.x,e.y,18,0,TAU);ctx.fill();
  ctx.strokeStyle="#ddd";ctx.stroke();
}

function drawNPC(e){
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(e.x,e.y+19,22,8,0,0,TAU);ctx.fill();
  ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,18,0,TAU);ctx.fill();
  ctx.fillStyle="#222";ctx.fillRect(e.x-9,e.y-5,5,5);ctx.fillRect(e.x+4,e.y-5,5,5);
  ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.textAlign="center";ctx.fillText(e.name,e.x,e.y-28);
}

function drawEnemy(e){
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(e.x,e.y+e.r, e.r,6,0,0,TAU);ctx.fill();
  ctx.fillStyle=e.hit>0?"#fff":e.color;
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.fill();
  if(e.type==="wolf"){
    ctx.fillStyle="#222";ctx.beginPath();ctx.moveTo(e.x-13,e.y-10);ctx.lineTo(e.x-18,e.y-25);ctx.lineTo(e.x-4,e.y-15);ctx.fill();
    ctx.beginPath();ctx.moveTo(e.x+13,e.y-10);ctx.lineTo(e.x+18,e.y-25);ctx.lineTo(e.x+4,e.y-15);ctx.fill();
  }
  if(e.type==="archer"){
    ctx.strokeStyle="#2d2016";ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,13,-1.2,1.2);ctx.stroke();
  }
  ctx.fillStyle="#20252d";
  ctx.fillRect(e.x-7,e.y-4,4,4);ctx.fillRect(e.x+4,e.y-4,4,4);
  if(e.hp<e.maxHp){
    ctx.fillStyle="#260f12";ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,4);
    ctx.fillStyle="#d95050";ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*(e.hp/e.maxHp),4);
  }
}

function drawBoss(e){
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.rotate(Math.sin(game.time*2)*.04);
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(0,e.r+12,e.r*1.1,12,0,0,TAU);ctx.fill();
  ctx.fillStyle=e.hit>0?"#fff":e.color;
  ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();
  ctx.strokeStyle="#f0df91";ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle="#161522";ctx.fillRect(-18,-8,9,9);ctx.fillRect(9,-8,9,9);
  ctx.restore();
}

function drawProjectile(e){
  ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.fill();
}

function drawPlayer(){
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(player.x,player.y+20,20,7,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(player.x,player.y);
  if(player.invuln>0&&Math.floor(game.time*20)%2===0)ctx.globalAlpha=.45;
  ctx.fillStyle="#d9e5f2";ctx.beginPath();ctx.arc(0,0,18,0,TAU);ctx.fill();
  ctx.fillStyle="#4b6da7";ctx.beginPath();ctx.arc(0,-5,16,Math.PI,TAU);ctx.fill();
  ctx.fillStyle="#252b39";ctx.fillRect(-8,-4,5,5);ctx.fillRect(4,-4,5,5);
  if(player.attack>0){
    ctx.strokeStyle="#e6f6ff";ctx.lineWidth=7;
    ctx.beginPath();ctx.arc(0,0,45,Math.atan2(player.dir.y,player.dir.x)-.8,Math.atan2(player.dir.y,player.dir.x)+.8);ctx.stroke();
  }
  ctx.restore();
}

function drawParticle(p){
  ctx.globalAlpha=clamp(p.life/p.max,0,1);
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  ctx.globalAlpha=1;
}
function drawTextWorld(t){
  ctx.globalAlpha=clamp(t.life/.7,0,1);
  ctx.fillStyle=t.color;ctx.font="bold 16px Arial";ctx.textAlign="center";ctx.fillText(t.text,t.x,t.y);
  ctx.globalAlpha=1;
}

/* =========================================================

function panel(x,y,w,h,a=.82){
  ctx.fillStyle=`rgba(7,12,22,${a})`;
  ctx.fillRect(x,y,w,h);

  ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
}

function drawInventory(){

function drawToast(){
  panel(W/2-220,H-90,440,48,.9);
  ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 15px Arial";
  ctx.fillText(game.message,W/2,H-60);
}

function drawDialogue(){
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(0,0,W,H);
  panel(70,H-230,W-140,180,.95);
  ctx.textAlign="left";ctx.fillStyle="#f1d68a";ctx.font="bold 22px Arial";
  ctx.fillText(game.dialogue.name,100,H-190);
  ctx.fillStyle="#fff";ctx.font="18px Arial";
  const line=game.dialogue.lines[game.dialogue.index]||"";
  wrapText(line,100,H-150,W-220,30);
  ctx.textAlign="right";ctx.font="12px Arial";ctx.fillStyle="#a9bfd6";
  ctx.fillText("E oder Enter",W-100,H-75);
}

function wrapText(t,x,y,maxWidth,lineHeight){
  const words=t.split(" ");let line="";
  for(const word of words){
    const test=line?line+" "+word:word;
    if(ctx.measureText(test).width>maxWidth){
      ctx.fillText(line,x,y);line=word;y+=lineHeight;
    }else line=test;
  }
  if(line)ctx.fillText(line,x,y);
}

function drawPause(){
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);
  panel(W/2-260,H/2-180,520,360,.95);

function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#071426");g.addColorStop(.55,"#172b3e");g.addColorStop(1,"#080b13");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  for(let i=0;i<80;i++){
    const x=(i*173)%W,y=(i*71)%H;
    ctx.fillStyle=`rgba(220,235,255,${.2+(i%4)*.12})`;
    ctx.fillRect(x,y,2,2);
  }

  ctx.fillStyle="rgba(91,140,188,.18)";
  ctx.beginPath();ctx.arc(W/2,H*.68,180,0,TAU);ctx.fill();
  ctx.fillStyle="#dcecff";
  ctx.textAlign="center";
  ctx.font="bold 64px Georgia";
  ctx.fillText("ECHOES",W/2,H*.30);
  ctx.font="bold 34px Georgia";
  ctx.fillStyle="#e5c979";
  ctx.fillText("OF ASTERRA",W/2,H*.37);
  ctx.font="14px Arial";
  ctx.fillStyle="#9eb7d0";
  ctx.fillText("Ein kleines Action Adventure",W/2,H*.43);

  const options=[
    ["N","NEUES SPIEL",!0],
    ["L","SPIEL LADEN",hasSave()],
    ["C","STEUERUNG",!0]
  ];
  options.forEach((o,i)=>{
    const y=H*.56+i*58;
    ctx.fillStyle=o[2]?"rgba(20,36,55,.9)":"rgba(20,36,55,.4)";
    ctx.fillRect(W/2-150,y-25,300,42);
    ctx.strokeStyle=o[2]?"#6388a9":"#293747";ctx.strokeRect(W/2-150,y-25,300,42);
    ctx.fillStyle=o[2]?"#fff":"#596776";ctx.font="16px Arial";
    ctx.fillText(o[1],W/2,y+3);
  });
  ctx.fillStyle="#71859a";ctx.font="12px Arial";
  ctx.fillText("N = Neues Spiel    L = Laden    C = Steuerung",W/2,H-30);
}

/* =========================================================
   TITLE / MENU INPUT
   ========================================================= */

function menuInput(){
  if(game.mode==="title"){
    if(pressed.n){
      pressed.n=false;newGame();
    }
    if(pressed.l){
      pressed.l=false;
      if(hasSave())loadGame();
    }
    if(pressed.c){
      pressed.c=false;
      alert("WASD / Pfeile = Bewegung\nJ = Angriff\nK = Ausweichen\nE = Interaktion\nI = Inventar\nESC = Pause\nH = Heiltrank\n\nGamepad wird unterstützt.");
    }
    return true;
  }
  if(game.mode==="dialog"){
    if(pressed.e||pressed.enter||pressed.space){
      pressed.e=pressed.enter=pressed.space=false;
      advanceDialog();
    }
    return true;
  }
  if(game.mode==="pause"){
    if(pressed.escape){
      pressed.escape=false;game.mode="play";
    }
    if(pressed.s){
      pressed.s=false;saveGame();
    }
    return true;
  }
  if(game.mode==="gameover"){
    if(pressed.enter||pressed.space){
      pressed.enter=pressed.space=false;
      player.hp=player.maxHp;
      game.mode="play";
      enterZone("village");
    }
    return true;
  }
  if(game.mode==="win"){
    if(pressed.enter||pressed.space){
      pressed.enter=pressed.space=false;
      game.win=false;game.mode="title";
    }
    return true;
  }
  return false;
}

function newGame(){
  Object.assign(player,{
    x:900,y:620,hp:100,maxHp:100,stamina:100,maxStamina:100,
    speed:190,damage:14,potions:2,coins:20,
    equipment:{shield:false,blade:false},items:{}
  });
  chests={};switches={};doors={};defeated={};questState={};
  worldFlags={
    elderTalk:false,forestOpen:true,ruinOpen:true,mountainOpen:true,
    dungeon1:false,dungeon2:false,dungeon3:false,boss1:false,boss2:false,boss3:false
  };
  game.playTime=0;game.quest=null;game.win=false;
  enterZone("village");
  game.mode="play";
  startQuest("main1");
  toast("Finde die drei Sternensplitter");
  saveGame();
}

/* =========================================================
   GAME LOOP
   ========================================================= */

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  menuInput();
  update(dt);
  render();
  for(const k in pressed)delete pressed[k];
  requestAnimationFrame(loop);
}

boot.style.display="none";
requestAnimationFrame(loop);

/* Initial player inventory */
player.items={};

/* Keyboard Enter support */
addEventListener("keydown",e=>{
  if(e.key==="Enter")pressed.enter=true;
});

/* Prevent browser scrolling */
addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});

/* Auto save periodically */
setInterval(()=>{
  if(game.mode==="play")saveGame();
},30000);

/* =========================================================
   END
   ========================================================= */
</script>
