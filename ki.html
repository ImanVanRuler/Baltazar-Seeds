tide_puzzle:{name:'Versunkener Schrein · Fluttor',biome:'dungeon',dungeon:'tide',room:1,exits:[{x:100,y:500,to:'tide_door',label:'Zurück'},{x:1500,y:500,to:'tide_boss',label:'Zum Wächter',requires:'puzzle'}],obstacles:[[380,250,120,90,'pillar'],[1090,650,120,90,'pillar']],puzzle:{x:790,y:460,label:'Flutrad'},enemies:[['archer',1000,400]],chests:[['tide_chest',1260,760,'heart']]},

cinder_boss:{name:'Aschenkluft · Schmiedekessel',biome:'sanctum',dungeon:'cinder',room:2,boss:'forge',exits:[{x:100,y:500,to:'cinder_puzzle',label:'Zur Glutgalerie'}],obstacles:[[300,250,110,110,'pillar'],[1190,250,110,110,'pillar']]}
};
const bossNames={bark:'MORR, DER WURZELKÖNIG',eel:'NALU, DIE FLUTSTIMME',forge:'VARK, DER GLUTSCHMIED'};
function freshState(){return{room:'village',player:{x:790,y:530,hp:6,maxHp:6,stamina:100,dir:{x:1,y:0},attack:0,dodge:0,invuln:0,anim:0,hitFlash:0},inventory:{Trank:2,Schlüssel:0,'Wurzel-Siegel':0,'Flut-Siegel':0,'Glut-Siegel':0},quests:{tide:{status:'active',count:0},mara:{status:'active',count:0},oren:{status:'not_started',count:0}},flags:{},chests:{},puzzles:{},bosses:{},rooms:{},playTime:0,story:0,options:{volume:.22}}}
let state=freshState(),roomData=null,camera={x:0,y:0},entities=[],particles=[],numbers=[],projectiles=[],boss=null,hover=null;
function roomSave(id=state.room){state.rooms[id]={enemies:entities.filter(e=>!e.boss).map(e=>({...e})),};}
function loadRoom(id,x,y){if(!roomDefs[id])return;roomSave();state.room=id;const def=roomDefs[id];roomData=def;const stored=state.rooms[id];entities=stored?.enemies?stored.enemies.map(e=>({...e})):spawnEnemies(def);entities=entities.filter(e=>e.hp>0);boss=null;if(def.boss&&!state.bosses[def.dungeon]){boss=makeBoss(def.boss);entities.push(boss)}state.player.x=x??(id==='village'?790:120);state.player.y=y??500;camera.x=clamp(state.player.x-VIEW_W/2,0,W-VIEW_W);camera.y=clamp(state.player.y-VIEW_H/2,0,H-VIEW_H);particles=[];}
function spawnEnemies(def){return(def.enemies||[]).map(([type,x,y],i)=>makeEnemy(type,x,y,i));}
function makeEnemy(type,x,y,i=0){const stats={mote:[2,78,115,'#a9d3c1','split'],hound:[3,108,105,'#d2875f','dash'],archer:[3,58,260,'#8b9eb2','shot'],brute:[6,43,115,'#a98a69','slam'],shield:[5,48,105,'#a3a181','guard']},s=stats[type]||stats.mote;return{id:`${state.room}_${type}_${x}_${i}`,type,x,y,hp:s[0],maxHp:s[0],speed:s[1],range:s[2],color:s[3],behavior:s[4],cool:rand(.4,1.3),stun:0,flash:0,dir:{x:0,y:1},anim:rand(0,6),dead:false}}
function makeBoss(type){const color={bark:'#8e7251',eel:'#4aa0a5',forge:'#da7446'}[type];return{id:`boss_${type}`,type:'boss',boss:true,bossType:type,x:1120,y:500,hp:32,maxHp:32,speed:62,range:150,color,cool:2,phase:1,flash:0,stun:0,anim:0,pattern:0,dead:false}}
const blocked=(x,y,r=16)=>{if(x<34||y<34||x>W-34||y>H-34)return true;for(const o of roomData?.obstacles||[])if(x+r>o[0]&&x-r<o[0]+o[2]&&y+r>o[1]&&y-r<o[1]+o[3])return true;return false};
function moveEntity(e,dx,dy,r=15){if(dx&&!blocked(e.x+dx,e.y,r))e.x+=dx;if(dy&&!blocked(e.x,e.y+dy,r))e.y+=dy;}
function addParticle(x,y,color,count=8,power=100){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(power*.25,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7),max:.7,color,size:rand(2,5)})}}
function sound(kind='menu'){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{return}}if(audio.state==='suspended')audio.resume();const now=audio.currentTime,volume=state.options?.volume??.22;const tones={attack:[180,.07,'sawtooth'],hit:[105,.12,'triangle'],hurt:[78,.22,'square'],item:[660,.18,'sine'],door:[240,.2,'triangle'],chest:[520,.25,'sine'],menu:[360,.06,'sine'],switch:[430,.2,'triangle'],boss:[65,.5,'sawtooth'],death:[95,.7,'triangle'],win:[523,.8,'sine'],dash:[240,.09,'triangle']};let [freq,duration,wave]=tones[kind]||tones.menu;try{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.48),now+duration);gain.gain.setValueAtTime(Math.max(.001,volume*.24),now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+duration)}catch{}}
let musicTimer=0,musicStep=0;function music(dt){musicTimer-=dt;if(musicTimer>0||screen!=='play')return;musicTimer=.72;const root=roomData?.dungeon==='root'?82:roomData?.dungeon==='tide'?124:roomData?.dungeon==='cinder'?110:roomData?.biome==='cave'?98:146;const seq=[1,1.25,1.5,1.25,.75,1,1.5,2];const f=root*seq[musicStep++%seq.length];if(!audio)return;if(audio.state==='suspended')return;try{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.linearRampToValueAtTime((state.options.volume||.22)*.018,audio.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.62);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.64)}catch{}}
function toast(text){notice=text;noticeTime=2.4}
function saveGame(silent=false){try{roomSave();state.playTime=gameTime;localStorage.setItem(SAVE_KEY,JSON.stringify(state));if(!silent){sound('menu');toast('Spielstand gespeichert')}}catch{toast('Speichern nicht möglich')}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const s=JSON.parse(raw);if(!s||!s.player||!roomDefs[s.room])return false;state={...freshState(),...s,player:{...freshState().player,...s.player},inventory:{...freshState().inventory,...s.inventory},quests:{...freshState().quests,...s.quests},options:{volume:.22,...s.options}};if(state.player.hp<=0){state.player.hp=state.player.maxHp;state.room='village';state.player.x=790;state.player.y=530}gameTime=state.playTime||0;loadRoom(state.room,state.player.x,state.player.y);return true}catch{return false}}
function startNew(){state=freshState();gameTime=0;loadRoom('village',790,530);screen='play';fade=1;fadeDir=-1;sound('menu');toast('Die Küste hält den Atem an.');}
function interact(){if(dialogue){dialogue.index++;if(dialogue.index>=dialogue.lines.length)dialogue=null;return}const p=state.player;let target=null,best=76;const options=[];for(const [id,x,y]of roomData.npcs||[])options.push({kind:'npc',id,x,y});for(const [id,x,y,item]of roomData.chests||[])if(!state.chests[id])options.push({kind:'chest',id,x,y,item});if(roomData.puzzle&&!state.puzzles[state.room])options.push({kind:'puzzle',...roomData.puzzle});for(const ex of roomData.exits||[])options.push({kind:'exit',...ex});for(const o of options){const d=dist(p,o);if(d<best){target=o;best=d}}if(!target){toast('Nichts in Reichweite.');return}if(target.kind==='exit'){if(target.requires==='key'){const key=`${roomData.dungeon}_unlocked`;if(!state.flags[key]){if((state.inventory.Schlüssel||0)<1){toast('Eine rostige Tür. Ein Schlüssel fehlt.');return}state.inventory.Schlüssel--;state.flags[key]=true;sound('door');toast('Der Schlüssel dreht sich im Schloss.')}}if(target.requires==='puzzle'&&!state.puzzles[roomData.dungeon+'_puzzle']){toast('Das Siegel hält die Tür geschlossen.');return}loadRoom(target.to,target.to==='village'?1450:120,500);sound('door');return}if(target.kind==='chest'){if(target.id.endsWith('_chest')&&target.id!=='welcome'&&(state.inventory.Schlüssel||0)<1){toast('Verschlossen. Ein Schlüssel könnte helfen.');return}if(target.id.endsWith('_chest'))state.inventory.Schlüssel--;state.chests[target.id]=true;grant(target.item);sound('chest');toast(`Truhe geöffnet: ${itemName(target.item)}`);return}if(target.kind==='puzzle'){state.puzzles[state.room]=true;state.puzzles[roomData.dungeon+'_puzzle']=true;addParticle(target.x,target.y,'#f3cf82',24,180);sound('switch');toast(`${target.label} antwortet mit einem hellen Ton.`);return}talk(target.id)}
const itemName=id=>({potion:'Heiltrank',key:'Schlüssel',heart:'Herzsplitter','relic_root':'Wurzel-Siegel','relic_tide':'Flut-Siegel','relic_cinder':'Glut-Siegel'}[id]||id);
function grant(item){if(item==='potion')state.inventory.Trank=(state.inventory.Trank||0)+1;else if(item==='key')state.inventory.Schlüssel=(state.inventory.Schlüssel||0)+1;else if(item==='heart'){state.player.maxHp++;state.player.hp=Math.min(state.player.maxHp,state.player.hp+2)}else if(item?.startsWith('relic_')){const name=itemName(item);state.inventory[name]=1;const dungeon=item.slice(6);state.bosses[dungeon]=true;state.story++;toast(`${name} gefunden!`);if(state.story>=3){screen='won';saveGame(true);sound('win')}}}
function talk(id){let d;if(id==='mara'){const q=state.quests.mara;if(q.status==='ready'){q.status='complete';state.inventory.Trank=(state.inventory.Trank||0)+1;d=['Mara, die Kartografin','Der Hain dankt dir. Nimm diesen Heiltrank für den nächsten Weg.']}else if(q.status==='complete')d=['Mara, die Kartografin','Du hast dem Hain wieder eine Stimme gegeben.'];else d=['Mara, die Kartografin',`Vertreibe fünf Irrlichter und Schattenhunde. Fortschritt: ${q.count}/5.`,`Die drei alten Schreine verstummen. Hol ihre Siegel zurück, dann hört die Küste wieder ihren Herzschlag.`]}else if(id==='oren'){const q=state.quests.oren;if(q.status==='not_started'){q.status='active';d=['Oren, der Fischer','Lichtbogenschützen lauern am Silberufer. Besiege zwei davon, und ich gebe dir einen Heiltrank.']}else if(q.status==='ready'){q.status='complete';state.inventory.Trank=(state.inventory.Trank||0)+1;d=['Oren, der Fischer','Das Ufer ist wieder sicher. Nimm einen Heiltrank, du hast ihn dir verdient.']}else if(q.status==='complete')d=['Oren, der Fischer','Das Ufer ist wieder sicher. Möge dein Weg so ruhig sein wie ein guter Fang.'];else d=['Oren, der Fischer',`Die Lichtbogenschützen am Ufer müssen verschwinden. Fortschritt: ${q.count}/2.`]}else if(id==='ivo')d=['Ivo, der Töpfer','Ich brenne meine Krüge bei Mondlicht. Sie werden davon nicht besser, aber ich schlafe dabei gut.','Eine Truhe im Dorf wartet auf dich. Ein kleiner Anfang.'];else d=['Sable, die Hüterin','Hör auf die Räume. Schalter und Türen antworten, wenn du dich ihnen näherst.','Die Wächter wechseln ihre Angriffsmuster, sobald sie halb erschöpft sind.'];dialogue={lines:d,index:0};}
function questProgress(type){const mara=state.quests.mara,oren=state.quests.oren;if((type==='mote'||type==='hound')&&mara.status==='active'){mara.count++;if(mara.count>=5){mara.status='ready';toast('Ziel erreicht: Sprich mit Mara, um deine Belohnung abzuholen.')}}if(type==='archer'&&oren.status==='active'){oren.count++;if(oren.count>=2){oren.status='ready';toast('Ziel erreicht: Sprich mit Oren, um deine Belohnung abzuholen.')}}}
function updatePlayer(dt){const p=state.player;let x=(input.keys.has('d')||input.keys.has('arrowright')?1:0)-(input.keys.has('a')||input.keys.has('arrowleft')?1:0)+input.gamepad.x,y=(input.keys.has('s')||input.keys.has('arrowdown')?1:0)-(input.keys.has('w')||input.keys.has('arrowup')?1:0)+input.gamepad.y;const mag=Math.hypot(x,y);if(mag>1){x/=mag;y/=mag}if(mag>.1){p.dir={x:x/mag,y:y/mag};p.anim+=dt*9}const sprint=input.keys.has('shift')&&p.stamina>0,speed=sprint?255:190;if(sprint&&mag>.1)p.stamina=Math.max(0,p.stamina-30*dt);else p.stamina=Math.min(100,p.stamina+19*dt);if(mag>.1){moveEntity(p,x*speed*dt,y*speed*dt,14);if(Math.abs(x)>Math.abs(y))p.dir={x:Math.sign(x),y:0};else p.dir={x:0,y:Math.sign(y)}}p.attack=Math.max(0,p.attack-dt);p.dodge=Math.max(0,p.dodge-dt);p.invuln=Math.max(0,p.invuln-dt);p.hitFlash=Math.max(0,p.hitFlash-dt);if(p.attack>0&&!p.didHit){p.didHit=true;const cx=p.x+p.dir.x*57,cy=p.y+p.dir.y*57;for(const e of entities){if(e.dead||dist({x:cx,y:cy},e)>78)continue;let dmg=2;if(e.boss)dmg=3;if(e.behavior==='guard'&&e.dir.x*p.dir.x+e.dir.y*p.dir.y<-.2){dmg=1;addParticle(e.x,e.y,'#d8d1a2',5,100)}else{e.stun=.28;e.flash=.18;addParticle(e.x,e.y,'#f2d386',10,145);sound('hit')}e.hp-=dmg;numbers.push({x:e.x,y:e.y-25,text:`-${dmg}`,life:.8,color:'#ffe2a2'});if(e.hp<=0)killEnemy(e)}}else if(p.attack<=0)p.didHit=false;if(p.dodge>0){moveEntity(p,p.dir.x*520*dt,p.dir.y*520*dt,13)}if(pressed('j')&&p.attack<=0&&p.dodge<=0){p.attack=.23;p.didHit=false;sound('attack');addParticle(p.x+p.dir.x*32,p.y+p.dir.y*32,'#f1d486',4,90)}if(pressed('k')&&p.dodge<=0&&p.stamina>=22){p.dodge=.19;p.invuln=.38;p.stamina-=22;sound('dash');addParticle(p.x,p.y,'#c5d5cb',9,100)}if(pressed('e'))interact();if(pressed('i'))screen='inventory';if(pressed('escape'))screen='pause';if(pressed('1')&&(p.hp<p.maxHp)&&(state.inventory.Trank||0)>0){state.inventory.Trank--;p.hp=Math.min(p.maxHp,p.hp+3);addParticle(p.x,p.y,'#90d49f',18,120);sound('item');toast('Heiltrank: +3 Herzen')}camera.x+=(clamp(p function panel(x,y,w,h){ctx.fillStyle='rgba(13,22,22,.94)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(226,204,151,.65)';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2);ctx.strokeStyle='rgba(226,204,151,.17)';ctx.strokeRect(x+7,y+7,w-14,h-14)}
function drawHUD(){const p=state.player;panel(18,17,250,83);ctx.fillStyle='#e7d7b2';ctx.font='16px Georgia';ctx.textAlign='left';ctx.fillText('HERZKRAFT',32,42);for(let i=0;i<p.maxHp;i++){const x=34+(i%10)*21,y=55+Math.floor(i/10)*19;ctx.fillStyle=i<p.hp?'#d96859':'#493f3c';ctx.beginPath();ctx.moveTo(x,y+5);ctx.arc(x-4,y+4,5,Math.PI,0);ctx.arc(x+4,y+4,5,Math.PI,0);ctx.lineTo(x,y+14);ctx.fill()}ctx.fillStyle='#354441';ctx.fillRect(32,87,210,5);ctx.fillStyle='#90b69a';ctx.fillRect(32,87,210*p.stamina/100,5);ctx.fillStyle='#e8d9b4';ctx.textAlign='right';ctx.font='17px Georgia';ctx.fillText(roomData.name,942,34);ctx.fillStyle='#cfc5a7';ctx.font='13px Georgia';ctx.fillText(`Trank ${state.inventory.Trank||0}  ·  Schlüssel ${state.inventory.Schlüssel||0}`,942,56);ctx.textAlign='left';ctx.fillStyle='rgba(13,22,22,.72)';ctx.fillRect(18,578,455,43);ctx.fillStyle='#edcf88';ctx.font='13px Georgia';ctx.fillText('ZIEL',31,596);ctx.fillStyle='#ede2c7';ctx.font='14px Georgia';const quest=state.quests.mara;const goal=state.story>=3?'Die Küste hat ihre Stimme zurück.':state.story>0?`Finde die drei Siegel  ·  ${state.story}/3`:quest.status==='active'?`Hilf Mara: Irrlichter vertreiben  ·  ${quest.count}/5`:'Finde die drei Siegel  ·  0/3';ctx.fillText(goal,31,613);if(boss){panel(330,17,300,49);ctx.fillStyle='#f2dba4';ctx.textAlign='center';ctx.font='13px Georgia';ctx.fillText(bossNames[boss.bossType],480,35);ctx.fillStyle='#453b39';ctx.fillRect(350,43,260,10);ctx.fillStyle='#bd6255';ctx.fillRect(351,44,258*(boss.hp/boss.maxHp),8)}}
function drawDialogue(){if(!dialogue)return;panel(88,462,784,151);ctx.fillStyle='#e9cb82';ctx.textAlign='left';ctx.font='18px Georgia';ctx.fillText(dialogue.lines[0],111,492);ctx.fillStyle='#efe6cd';ctx.font='17px Georgia';wrapText(dialogue.lines[dialogue.index+1]||'',111,524,735,23);ctx.fillStyle='#cdbb91';ctx.textAlign='right';ctx.font='12px Georgia';ctx.fillText('E · Weiter',845,590)}
function wrapText(text,x,y,maxWidth,lineHeight){const words=(text||'').split(' ');let line='';for(const word of words){const test=line+word+' ';if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word+' ';y+=lineHeight}else line=test}ctx.fillText(line,x,y)}
function drawToast(){if(noticeTime<=0)return;ctx.globalAlpha=Math.min(1,noticeTime*2);panel(260,542,440,43);ctx.fillStyle='#f1e4c5';ctx.textAlign='center';ctx.font='15px Georgia';ctx.fillText(notice,480,568);ctx.globalAlpha=1}
function button(label,x,y,w,h,action,sub=''){const focused=buttons.length===keyboardSelection,inside=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h,active=inside||focused;ctx.fillStyle=active?'#756448':'#293734';ctx.fillRect(x,y,w,h);ctx.strokeStyle=active?'#f1d793':'#887c5f';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);ctx.fillStyle='#f2e5c6';ctx.textAlign='center';ctx.font='19px Georgia';ctx.fillText(label,x+w/2,y+(sub?26:31));if(sub){ctx.fillStyle='#b9b7a5';ctx.font='12px Georgia';ctx.fillText(sub,x+w/2,y+47)}return{x,y,w,h,action}}
let buttons=[];function titleArt(){ctx.fillStyle='#16221f';ctx.fillRect(0,0,960,640);for(let i=0;i<18;i++){const x=(i*97+Math.sin(gameTime*.17+i)*22)%960;const h=100+(i*47)%290;ctx.fillStyle=['#233931','#2d493c','#38533f'][i%3];ctx.beginPath();ctx.moveTo(x-70,570);ctx.lineTo(x,570-h);ctx.lineTo(x+85,570);ctx.fill()}ctx.fillStyle='#72928a';ctx.globalAlpha=.55;ctx.beginPath();ctx.ellipse(700,493,310,44,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#d5bd83';ctx.beginPath();ctx.arc(720,195,55,0,7);ctx.fill();ctx.fillStyle='#16221f';ctx.beginPath();ctx.arc(742,183,50,0,7);ctx.fill();ctx.fillStyle='#eee0bd';ctx.textAlign='center';ctx.font='48px Georgia';ctx.fillText('DIE LIEDER',480,120);ctx.font='26px Georgia';ctx.fillStyle='#e6c77d';ctx.fillText('DER GEZEITEN',480,158);ctx.fillStyle='#c5c8b2';ctx.font='15px Georgia';ctx.fillText('Ein Abenteuer über Erinnerung, Mut und eine sehr alte Küste',480,208)}
function drawOverlay(){buttons=[];if(screen==='title'){titleArt();panel(310,265,340,305);buttons.push(button('Neues Spiel',340,295,280,53,'new'));const exists=!!localStorage.getItem(SAVE_KEY);buttons.push(button('Spiel laden',340,359,280,53,'load',exists?'Fortsetzung bereit':'Kein Spielstand'));buttons.push(button('Steuerung',340,423,280,53,'controls'));buttons.push(button('Ton: '+(state.options.volume?'Ein':'Aus'),340,487,280,53,'sound'));ctx.fillStyle='#a8ad9b';ctx.font='12px Georgia';ctx.textAlign='center';ctx.fillText('Ein vollständiges Abenteuer · automatisch lokal gespeichert',480,608)}else if(screen==='pause'||screen==='inventory'||screen==='controls'||screen==='gameover'||screen==='won'){ctx.fillStyle='#071110a8';ctx.fillRect(0,0,960,640);panel(240,105,480,435);const title={pause:'PAUSE',inventory:'RUCKSACK',controls:'WEGWEISER',gameover:'DIE FLUT NIMMT DICH',won:'DIE KÜSTE ERINNERT SICH'}[screen];ctx.fillStyle='#efdaaa';ctx.textAlign='center';ctx.font='32px Georgia';ctx.fillText(title,480,153);if(screen==='pause'){buttons.push(button('Weiter',330,190,300,48,'resume'));buttons.push(button('Speichern',330,250,300,48,'save'));buttons.push(button('Rucksack',330,310,300,48,'inventory'));buttons.push(button('Steuerung',330,370,300,48,'controls'));buttons.push(button('Zum Titel',330,430,300,48,'title'))}else if(screen==='inventory'){ctx.textAlign='left';ctx.fillStyle='#ede1c3';ctx.font='18px Georgia';let y=218;for(const[k,v]of Object.entries(state.inventory)){if(v>0){ctx.fillText(`${k}`,315,y);ctx.textAlign='right';ctx.fillText(`× ${v}`,640,y);ctx.textAlign='left';y+=31}}ctx.fillStyle='#b9b7a5';ctx.font='14px Georgia';ctx.fillText('1 · Heiltrank trinken    ·    J · Klinge    ·    K · Ausweichen',315,450);buttons.push(button('Zurück',330,466,300,48,'resume'))}else if(screen==='controls'){ctx.textAlign='left';ctx.fillStyle='#ede1c3';ctx.font='17px Georgia';['WASD / Pfeile   Bewegen','Shift   Sprinten','J   Klingenhieb','K   Ausweichen (verleiht kurze Unverwundbarkeit)','E   Reden, öffnen, Schalter und Türen','I   Rucksack','1   Heiltrank','Esc   Pause','Gamepad: linker Stick bewegen, A interagieren, X angreifen, B ausweichen'].forEach((s,i)=>ctx.fillText(s,294,214+i*29));buttons.push(button('Zurück',330,466,300,48,'resume'))}else{ctx.fillStyle='#dfcfad';ctx.font='17px Georgia';ctx.fillText(screen==='won'?'Drei Siegel, ein neues Lied.':`Die Reise endet hier. Spielzeit ${formatTime(gameTime)}`,480,222);buttons.push(button(screen==='won'?'Zum Titel':'Am Lager erwachen',330,290,300,53,screen==='won'?'title':'retry'));buttons.push(button('Spiel laden',330,356,300,53,'load'));buttons.push(button('Speichern',330,422,300,53,'save'))}}}
function formatTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return`${m}:${String(s).padStart(2,'0')}`}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));if(roomData&&['play','pause','inventory','controls','gameover','won'].includes(screen)){drawWorld();drawHUD();drawDialogue();drawToast()}drawOverlay();if(fade>0){ctx.fillStyle=`rgba(4,9,10,${fade})`;ctx.fillRect(0,0,960,640)}ctx.restore()}
function action(name){sound('menu');if(name==='new')startNew();else if(name==='retry'){state.player.hp=state.player.maxHp;state.player.stamina=100;state.player.invuln=1.4;loadRoom('village',790,530);screen='play';saveGame(true);toast('Du erwachst am Lagerfeuer.')}else if(name==='load'){if(loadGame()){screen='play';toast('Spielstand geladen.')}else toast('Kein gültiger Spielstand gefunden.')}else if(name==='resume'){screen='play'}else if(name==='save'){saveGame();if(screen==='gameover'||screen==='won')screen='title'}else if(name==='inventory')screen='inventory';else if(name==='controls')screen='controls';else if(name==='title'){saveGame(true);screen='title';dialogue=null}else if(name==='sound'){state.options.volume=state.options.volume?0:.22;toast(state.options.volume?'Ton eingeschaltet':'Ton ausgeschaltet')} }
function pointerPos(e){const r=canvas.getBoundingClientRect();mouse={x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*640/r.height}}
canvas.addEventListener('pointermove',pointerPos);canvas.addEventListener('pointerdown',e=>{pointerPos(e);for(const b of buttons){if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){action(b.action);return}}if(screen==='play'&&e.pointerType==='touch'&&dialogue)interact()});
canvas.addEventListener('pointerdown',e=>{pointerPos(e);const b=buttons.find(q=>mouse.x>=q.x&&mouse.x<=q.x+q.w&&mouse.y>=q.y&&mouse.y<=q.y+q.h);if(b?.action==='controls'){controlsReturn=screen;keyboardSelection=0}if(screen==='controls'&&b?.action==='resume'){screen=controlsReturn;keyboardSelection=0;e.stopImmediatePropagation()}},true);
window.addEventListener('keydown',e=>{if(screen==='controls'&&e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();screen=controlsReturn;keyboardSelection=0;return}if(screen==='play'||!buttons.length)return;const key=e.key.toLowerCase();if(key==='arrowdown'||key==='arrowup'){e.preventDefault();keyboardSelection=(keyboardSelection+(key==='arrowdown'?1:buttons.length-1))%buttons.length;e.stopImmediatePropagation()}else if(key==='enter'||key===' '){const b=buttons[keyboardSelection];if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.action==='controls'){controlsReturn=screen;keyboardSelection=0}if(screen==='controls'&&b.action==='resume'){screen=controlsReturn;keyboardSelection=0}else action(b.action)}},true);
let menuPadButtons=[];function pollMenuGamepad(){if(screen==='play')return;const pad=[...(navigator.getGamepads?.()||[])].find(Boolean);if(!pad)return;const down=i=>!!pad.buttons[i]?.pressed;if(down(13)&&!menuPadButtons[13])keyboardSelection=(keyboardSelection+1)%Math.max(1,buttons.length);if(down(12)&&!menuPadButtons[12])keyboardSelection=(keyboardSelection+Math.max(1,buttons.length)-1)%Math.max(1,buttons.length);if(down(0)&&!menuPadButtons[0]&&buttons[keyboardSelection]){const b=buttons[keyboardSelection];if(b.action==='controls'){controlsReturn=screen;keyboardSelection=0}if(screen==='controls'&&b.action==='resume'){screen=controlsReturn;keyboardSelection=0}else action(b.action)}menuPadButtons=pad.buttons.map(b=>b.pressed);input.pressed.clear()}
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key))e.preventDefault();if(!input.keys.has(key))input.pressed.add(key);input.keys.add(key);if(key==='escape'&&screen==='title')return;if(key==='escape'&&screen==='inventory')screen='play';else if(key==='escape'&&screen==='controls'&&roomData)screen='pause';else if(key==='escape'&&screen==='pause')screen='play';if(key==='i'&&screen==='inventory')screen='play';if(key==='i'&&screen==='play')screen='inventory';if(key==='enter'&&dialogue)interact()});window.addEventListener('keyup',e=>input.keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>input.keys.clear());
function pollGamepad(){const pads=navigator.getGamepads?.()||[];const p=[...pads].find(Boolean);if(!p)return;input.gamepad.x=Math.abs(p.axes[0]||0)>.2?p.axes[0]:0;input.gamepad.y=Math.abs(p.axes[1]||0)>.2?p.axes[1]:0;const map={0:'e',2:'j',1:'k',9:'escape',4:'i'};p.buttons.forEach((b,i)=>{if(b.pressed&&!input.gamepad.buttons[i]&&map[i])input.pressed.add(map[i])});input.gamepad.buttons=p.buttons.map(b=>b.pressed)}
function loop(t){const dt=Math.min(.04,(t-lastTime)/1000||0);lastTime=t;pollGamepad();pollMenuGamepad();update(dt);draw();requestAnimationFrame(loop)}
loadRoom('village',790,530);requestAnimationFrame(loop);
})();
</script></body></html>
