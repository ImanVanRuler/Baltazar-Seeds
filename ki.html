<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KI Welt</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #08090b;

    font-family: Arial, sans-serif;
}

body {

    display: flex;

    justify-content: center;

    align-items: center;
}

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #08090b;
}

canvas {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#ui {

    position: absolute;

    left: 20px;
    top: 20px;

    z-index: 20;

    color: white;

    background: rgba(8, 9, 11, 0.92);

    border: 1px solid #454545;

    padding: 12px 16px;

    border-radius: 6px;

    font-size: 14px;

    min-width: 220px;
}

#ui strong {

    display: block;

    margin-bottom: 6px;

    font-size: 17px;
}

#agentStatus {

    margin-top: 8px;

    color: #8ee6ad;

    font-size: 12px;
}

#dialogue {

    position: absolute;

    left: 50%;
    bottom: 90px;

    transform: translateX(-50%);

    width: min(650px, calc(100vw - 40px));

    min-height: 90px;

    z-index: 30;

    background: rgba(10, 11, 13, 0.96);

    border: 1px solid #555;

    border-radius: 7px;

    padding: 16px 20px;

    color: white;

    display: none;

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

#dialogueName {

    font-weight: bold;

    margin-bottom: 8px;

    font-size: 16px;
}

#dialogueText {

    color: #ddd;

    line-height: 1.5;

    font-size: 15px;
}

#controls {

    position: absolute;

    right: 20px;
    bottom: 20px;

    z-index: 20;

    display: flex;

    gap: 8px;
}

button {

    background: #24272b;

    color: white;

    border: 1px solid #555;

    padding: 10px 16px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;
}

button:hover {

    background: #353940;
}

button:disabled {

    opacity: 0.5;

    cursor: wait;
}

#thinking {

    position: absolute;

    left: 50%;
    top: 20px;

    transform: translateX(-50%);

    z-index: 40;

    display: none;

    color: #aaa;

    background: rgba(10,10,10,0.9);

    border: 1px solid #444;

    padding: 8px 14px;

    border-radius: 5px;

    font-size: 13px;
}

#chat {

    position: absolute;

    left: 20px;
    bottom: 20px;

    z-index: 50;

    width: 420px;

    max-width: calc(100vw - 40px);

    display: none;

    background: rgba(10,11,13,0.97);

    border: 1px solid #555;

    border-radius: 7px;

    padding: 12px;
}

#chatInput {

    width: 100%;

    background: #15171a;

    color: white;

    border: 1px solid #555;

    padding: 10px;

    outline: none;

    font-size: 14px;
}

#chatSend {

    margin-top: 8px;

    width: 100%;
}

</style>

</head>

<body>

<div id="game">

<canvas
id="world"
width="960"
height="600">
</canvas>


<div id="ui">

<strong>KI WORLD</strong>

<div id="status">
Simulation bereit
</div>

<div id="agentStatus">
Alex und Maya warten.
</div>

</div>


<div id="thinking">
KI denkt ...
</div>


<div id="dialogue">

<div id="dialogueName"></div>

<div id="dialogueText"></div>

</div>


<div id="chat">

<input
id="chatInput"
type="text"
placeholder="Sprich mit der KI..."
autocomplete="off">

<button
id="chatSend"
onclick="sendChat()">
Senden
</button>

</div>


<div id="controls">

<button onclick="startSimulation()">
Start
</button>

<button onclick="pauseSimulation()">
Pause
</button>

<button onclick="askAI()">
KI Gespräch
</button>

<button onclick="toggleChat()">
KI Chat
</button>

<button onclick="resetWorld()">
Reset
</button>

</div>


</div>


<script>

/* =========================================================
   OPENAI API
   ========================================================= */

/*
   HIER DEINEN API SCHLÜSSEL EINTRAGEN

   Beispiel:

   const OPENAI_API_KEY = "DEIN_API_KEY_HIER";

*/

const OPENAI_API_KEY = "DEIN_API_KEY_HIER";


/* =========================================================
   OPENAI EINSTELLUNGEN
   ========================================================= */

const OPENAI_MODEL = "gpt-5";


/* =========================================================
   GRUNDWERTE
   ========================================================= */

const canvas =
document.getElementById("world");

const ctx =
canvas.getContext("2d");

const statusElement =
document.getElementById("status");

const agentStatus =
document.getElementById("agentStatus");

const dialogue =
document.getElementById("dialogue");

const dialogueName =
document.getElementById("dialogueName");

const dialogueText =
document.getElementById("dialogueText");

const thinking =
document.getElementById("thinking");

const chat =
document.getElementById("chat");

const chatInput =
document.getElementById("chatInput");

const chatSend =
document.getElementById("chatSend");


const WORLD_WIDTH = 960;

const WORLD_HEIGHT = 600;


let running = false;

let animationFrame = null;

let conversationBusy = false;


/* =========================================================
   AGENTEN
   ========================================================= */

let agent1 = {

    name: "Alex",

    x: 300,
    y: 330,

    targetX: 300,
    targetY: 330,

    color: "#4fa9e8",

    skin: "#d7b18b",

    state: "idle",

    personality:
        "Alex ist neugierig, kreativ und risikofreudig. Er denkt gerne über neue Ideen nach.",

    goal:
        "Alex möchte herausfinden, wie man mit einer interessanten digitalen Idee Geld verdienen kann.",

    memory: []

};


let agent2 = {

    name: "Maya",

    x: 650,
    y: 350,

    targetX: 650,
    targetY: 350,

    color: "#d85d91",

    skin: "#d7a47d",

    state: "idle",

    personality:
        "Maya ist analytisch, vorsichtig und interessiert sich dafür, wie Dinge funktionieren.",

    goal:
        "Maya möchte Probleme verstehen und gemeinsam mit anderen sinnvolle Lösungen entwickeln.",

    memory: []

};


/* =========================================================
   WELT
   ========================================================= */

function drawFloor() {

    ctx.fillStyle = "#25272a";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    const tileSize = 32;


    for (
        let y = 0;
        y < WORLD_HEIGHT;
        y += tileSize
    ) {

        for (
            let x = 0;
            x < WORLD_WIDTH;
            x += tileSize
        ) {

            if (
                (x / tileSize + y / tileSize) % 2 === 0
            ) {

                ctx.fillStyle = "#292b2e";

            } else {

                ctx.fillStyle = "#25272a";

            }


            ctx.fillRect(
                x,
                y,
                tileSize,
                tileSize
            );


            ctx.strokeStyle =
                "rgba(0,0,0,0.15)";


            ctx.strokeRect(
                x,
                y,
                tileSize,
                tileSize
            );

        }

    }

}


/* =========================================================
   WÄNDE
   ========================================================= */

function drawWalls() {

    ctx.fillStyle = "#17191c";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        30
    );

    ctx.fillRect(
        0,
        0,
        30,
        WORLD_HEIGHT
    );

    ctx.fillRect(
        WORLD_WIDTH - 30,
        0,
        30,
        WORLD_HEIGHT
    );


    ctx.fillStyle = "#3a3d40";

    ctx.fillRect(
        30,
        30,
        WORLD_WIDTH - 60,
        8
    );


    ctx.fillStyle = "#101214";

    ctx.fillRect(
        30,
        WORLD_HEIGHT - 38,
        WORLD_WIDTH - 60,
        8
    );

}


/* =========================================================
   COMPUTER
   ========================================================= */

function drawComputer(x, y) {

    ctx.fillStyle = "#17191c";

    ctx.fillRect(
        x,
        y,
        72,
        48
    );


    ctx.fillStyle = "#050607";

    ctx.fillRect(
        x + 5,
        y + 5,
        62,
        35
    );


    ctx.fillStyle = "#39c77a";

    ctx.fillRect(
        x + 11,
        y + 11,
        50,
        23
    );


    ctx.fillStyle = "#194f36";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        ctx.fillRect(

            x + 15,

            y + 14 + i * 4,

            35 - i * 4,

            2
        );

    }


    ctx.fillStyle = "#090a0c";

    ctx.fillRect(
        x + 32,
        y + 48,
        8,
        12
    );

    ctx.fillRect(
        x + 20,
        y + 58,
        32,
        5
    );

}


/* =========================================================
   TISCH
   ========================================================= */

function drawDesk(x, y) {

    ctx.fillStyle = "#17181a";

    ctx.fillRect(
        x,
        y,
        130,
        65
    );


    ctx.fillStyle = "#3d4044";

    ctx.fillRect(
        x + 6,
        y + 6,
        118,
        53
    );


    ctx.fillStyle = "#202225";

    ctx.fillRect(
        x + 12,
        y + 12,
        106,
        41
    );


    drawComputer(
        x + 30,
        y - 25
    );


    ctx.fillStyle = "#111214";

    ctx.fillRect(
        x + 12,
        y + 65,
        8,
        20
    );

    ctx.fillRect(
        x + 110,
        y + 65,
        8,
        20
    );

}


/* =========================================================
   BANK
   ========================================================= */

function drawBench(x, y) {

    ctx.fillStyle = "#111214";

    ctx.fillRect(
        x,
        y,
        150,
        25
    );


    ctx.fillStyle = "#55585c";

    ctx.fillRect(
        x + 5,
        y + 5,
        140,
        15
    );


    ctx.fillStyle = "#161719";

    ctx.fillRect(
        x + 10,
        y + 25,
        8,
        25
    );

    ctx.fillRect(
        x + 132,
        y + 25,
        8,
        25
    );

}


/* =========================================================
   PFLANZE
   ========================================================= */

function drawPlant(x, y) {

    ctx.fillStyle = "#171819";

    ctx.fillRect(
        x - 12,
        y + 15,
        24,
        15
    );


    ctx.fillStyle = "#27824b";


    ctx.beginPath();

    ctx.arc(
        x - 10,
        y + 8,
        10,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 2,
        y,
        12,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 12,
        y + 10,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   TERMINAL
   ========================================================= */

function drawTerminal(x, y) {

    ctx.fillStyle = "#111315";

    ctx.fillRect(
        x,
        y,
        80,
        65
    );


    ctx.fillStyle = "#34383c";

    ctx.fillRect(
        x + 8,
        y + 8,
        64,
        42
    );


    ctx.fillStyle = "#50d68a";

    ctx.fillRect(
        x + 15,
        y + 15,
        50,
        25
    );


    ctx.fillStyle = "#101214";

    ctx.fillRect(
        x + 36,
        y + 50,
        8,
        15
    );

}


/* =========================================================
   OBJEKTE
   ========================================================= */

function drawObjects() {

    drawDesk(100, 130);

    drawDesk(410, 115);

    drawDesk(700, 135);


    drawDesk(110, 400);

    drawDesk(410, 420);

    drawDesk(700, 400);


    drawBench(
        390,
        275
    );


    drawPlant(
        70,
        80
    );

    drawPlant(
        885,
        80
    );

    drawPlant(
        70,
        510
    );

    drawPlant(
        885,
        510
    );


    drawTerminal(
        470,
        65
    );

}


/* =========================================================
   AGENT ZEICHNEN
   ========================================================= */

function drawAgent(agent) {

    const x = agent.x;

    const y = agent.y;


    ctx.save();


    ctx.fillStyle =
        "rgba(0,0,0,0.35)";


    ctx.beginPath();


    ctx.ellipse(

        x,

        y + 19,

        20,

        8,

        0,

        0,

        Math.PI * 2

    );


    ctx.fill();


    ctx.fillStyle =
        agent.color;


    ctx.fillRect(

        x - 14,

        y - 2,

        28,

        27

    );


    ctx.fillStyle =
        agent.skin;


    ctx.beginPath();


    ctx.arc(

        x,

        y - 13,

        12,

        0,

        Math.PI * 2

    );


    ctx.fill();


    ctx.fillStyle =
        "#25201d";


    ctx.fillRect(

        x - 12,

        y - 25,

        24,

        6

    );


    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        x - 6,
        y - 14,
        3,
        3
    );

    ctx.fillRect(
        x + 3,
        y - 14,
        3,
        3
    );


    ctx.fillStyle =
        "#202226";


    ctx.fillRect(
        x - 11,
        y + 25,
        8,
        13
    );

    ctx.fillRect(
        x + 3,
        y + 25,
        8,
        13
    );


    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "#ffffff";


    ctx.fillText(

        agent.name,

        x,

        y + 55

    );


    ctx.restore();

}


/* =========================================================
   BEWEGUNG
   ========================================================= */

function updateAgent(agent) {

    const dx =
        agent.targetX - agent.x;

    const dy =
        agent.targetY - agent.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > 2) {

        agent.x +=
            dx / distance * 1.4;

        agent.y +=
            dy / distance * 1.4;

    }

}


/* =========================================================
   WELT ZEICHNEN
   ========================================================= */

function drawWorld() {

    ctx.clearRect(

        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT

    );


    drawFloor();

    drawWalls();

    drawObjects();


    updateAgent(agent1);

    updateAgent(agent2);


    drawAgent(agent1);

    drawAgent(agent2);


    animationFrame =
        requestAnimationFrame(
            drawWorld
        );

}


/* =========================================================
   DIALOG
   ========================================================= */

function showDialogue(
    name,
    text
) {

    dialogueName.textContent =
        name;

    dialogueText.textContent =
        text;

    dialogue.style.display =
        "block";

}


/* =========================================================
   OPENAI ANFRAGE
   ========================================================= */

async function callOpenAI(message) {

    if (
        !OPENAI_API_KEY ||
        OPENAI_API_KEY === "DEIN_API_KEY_HIER"
    ) {
        throw new Error(
            "API Schlüssel fehlt. Trage deinen neuen OpenAI API Schlüssel ein."
        );
    }

    console.log("KI Anfrage wird gesendet...");
    console.log("Modell:", OPENAI_MODEL);
    console.log("Nachricht:", message);

    let response;

    try {
        response = await fetch(
            "https://api.openai.com/v1/responses",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + OPENAI_API_KEY
                },
                body: JSON.stringify({
                    model: OPENAI_MODEL,
                    instructions: `
Du bist die künstliche Intelligenz
innerhalb einer interaktiven Spielwelt.

Du steuerst keine Spielengine direkt.
Du bist eine intelligente Figur und
entscheidest aufgrund des Weltzustands,
was gesagt oder als nächste Handlung
vorgeschlagen werden soll.

Antworte auf Deutsch.

Die Spielwelt enthält zwei Agenten:

Alex:
Persönlichkeit:
${agent1.personality}

Ziel:
${agent1.goal}

Gedächtnis:
${JSON.stringify(agent1.memory)}

Maya:
Persönlichkeit:
${agent2.personality}

Ziel:
${agent2.goal}

Gedächtnis:
${JSON.stringify(agent2.memory)}
`,
                    input: message
                })
            }
        );
    } catch (networkError) {
        console.error("NETZWERKFEHLER:", networkError);
        throw new Error(
            "Netzwerkfehler: " + networkError.message
        );
    }

    console.log("HTTP Status:", response.status);

    const rawText = await response.text();
    console.log("API Antwort:", rawText);

    let data;

    try {
        data = JSON.parse(rawText);
    } catch (parseError) {
        throw new Error(
            "Die API hat keine gültige JSON Antwort geliefert. HTTP " +
            response.status +
            "\n\nAntwort:\n" +
            rawText
        );
    }

    if (!response.ok) {
        throw new Error(
            "OpenAI API Fehler " +
            response.status +
            ":\n\n" +
            (data.error?.message || rawText)
        );
    }

    if (!data.output_text) {
        console.error("Keine output_text Antwort:", data);
        throw new Error(
            "Die KI hat geantwortet aber es wurde kein output_text gefunden."
        );
    }

    return data.output_text;
}

async function askAI() {

    if (conversationBusy) {

        return;

    }


    conversationBusy = true;


    thinking.style.display =
        "block";


    statusElement.textContent =
        "Die KI denkt ...";


    try {

        const message = `

Die Welt ist gerade aktiv.

Alex befindet sich bei
X=${Math.round(agent1.x)}
Y=${Math.round(agent1.y)}.

Maya befindet sich bei
X=${Math.round(agent2.x)}
Y=${Math.round(agent2.y)}.

Alex soll jetzt selbst entscheiden,
was er tun oder sagen möchte.

Erzeuge eine kurze natürliche Szene
oder einen Dialog.

        `;


        const reply =
            await callOpenAI(message);


        showDialogue(
            "KI",
            reply
        );


        agent1.memory.push(
            reply
        );


        statusElement.textContent =
            "KI Antwort erhalten.";

        agentStatus.textContent =
            "Die KI hat auf die Welt reagiert.";


    } catch (error) {

        console.error(error);


        showDialogue(
            "SYSTEM",
            error.message
        );


        statusElement.textContent =
            "KI Fehler: " + error.message;

    }


    thinking.style.display =
        "none";


    conversationBusy =
        false;

}


/* =========================================================
   CHAT
   ========================================================= */

function toggleChat() {

    if (
        chat.style.display === "block"
    ) {

        chat.style.display =
            "none";

    } else {

        chat.style.display =
            "block";

        chatInput.focus();

    }

}


async function sendChat() {

    const message =
        chatInput.value.trim();


    if (!message) {

        return;

    }


    chatInput.value = "";

    chatSend.disabled = true;

    thinking.style.display =
        "block";


    try {

        const reply =
            await callOpenAI(message);


        showDialogue(
            "KI",
            reply
        );


        agent1.memory.push(
            "Spieler: " + message
        );

        agent1.memory.push(
            "KI: " + reply
        );


        statusElement.textContent =
            "KI Antwort erhalten.";


    } catch (error) {

        showDialogue(
            "SYSTEM",
            error.message
        );


        statusElement.textContent =
            "KI Fehler: " + error.message;

    }


    thinking.style.display =
        "none";

    chatSend.disabled =
        false;

}


chatInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendChat();

        }

    }
);


/* =========================================================
   SIMULATION START
   ========================================================= */

function startSimulation() {

    if (running) {

        return;

    }


    running = true;


    statusElement.textContent =
        "Alex und Maya sind aktiv.";


    agentStatus.textContent =
        "Die Agenten können Entscheidungen treffen.";


    agent1.targetX =
        440;

    agent1.targetY =
        340;


    agent2.targetX =
        520;

    agent2.targetY =
        340;


    showDialogue(

        "SYSTEM",

        "Die Welt wurde gestartet. Die echte KI ist verbunden."

    );

}


/* =========================================================
   PAUSE
   ========================================================= */

function pauseSimulation() {

    running = false;


    statusElement.textContent =
        "Simulation pausiert.";

}


/* =========================================================
   RESET
   ========================================================= */

function resetWorld() {

    running = false;

    conversationBusy = false;


    dialogue.style.display =
        "none";


    thinking.style.display =
        "none";


    agent1.x =
        300;

    agent1.y =
        330;

    agent1.targetX =
        300;

    agent1.targetY =
        330;


    agent2.x =
        650;

    agent2.y =
        350;

    agent2.targetX =
        650;

    agent2.targetY =
        350;


    agent1.memory = [];

    agent2.memory = [];


    statusElement.textContent =
        "Simulation bereit.";


    agentStatus.textContent =
        "Alex und Maya warten.";

}


/* =========================================================
   START
   ========================================================= */

drawWorld();

</script>

</body>

</html>
