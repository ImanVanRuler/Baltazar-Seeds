<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALTAZAR SEEDS | Enter the 420 Universe</title>
    <meta name="description" content="Baltazar Seeds – Premium genetics for the discerning hunter. Adults only (21+).">
    <meta name="theme-color" content="#030403">

    <!-- Google Fonts (DSGVO: besser selbst hosten) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@200;300;400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════
           RESET & TOKENS
        ═══════════════════════════════════════════ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:          #030403;
            --bg-deep:     #050805;
            --ink:         #e9e5dd;
            --ink-dim:     rgba(233, 229, 221, 0.62);
            --ink-faint:   rgba(233, 229, 221, 0.15);
            --gold:        #c4913e;
            --gold-bright: #e8c87a;
            --gold-line:   rgba(196, 145, 62, 0.25);
            --gold-soft:   rgba(196, 145, 62, 0.08);
            --green:       #7ab55c;
            --green-deep:  #314c35;
            --line:        rgba(233, 229, 221, 0.05);
            --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
        }

        body {
            cursor: none;
        }

        /* ═══════════════════════════════════════════
           GRAIN TEXTURE OVERLAY
        ═══════════════════════════════════════════ */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 900;
            pointer-events: none;
            background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='none'/><g fill='white' opacity='.04'><rect x='7' y='18' width='1' height='1'/><rect x='29' y='44' width='1' height='1'/><rect x='53' y='9' width='1' height='1'/><rect x='78' y='61' width='1' height='1'/><rect x='14' y='83' width='1' height='1'/><rect x='99' y='27' width='1' height='1'/><rect x='122' y='71' width='1' height='1'/><rect x='148' y='12' width='1' height='1'/><rect x='167' y='55' width='1' height='1'/><rect x='188' y='88' width='1' height='1'/><rect x='33' y='120' width='1' height='1'/><rect x='61' y='144' width='1' height='1'/><rect x='87' y='177' width='1' height='1'/><rect x='110' y='133' width='1' height='1'/><rect x='135' y='160' width='1' height='1'/><rect x='162' y='109' width='1' height='1'/><rect x='183' y='142' width='1' height='1'/><rect x='44' y='190' width='1' height='1'/><rect x='71' y='99' width='1' height='1'/><rect x='156' y='181' width='1' height='1'/></g></svg>");
            background-size: 200px 200px;
            opacity: 0.6;
            mix-blend-mode: overlay;
        }

        /* ═══════════════════════════════════════════
           INTRO SCREEN
        ═══════════════════════════════════════════ */
        .intro {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background:
                radial-gradient(circle at center, rgba(90, 130, 70, 0.35), rgba(20, 35, 20, 0.7) 40%, #030403 90%);
            animation: introFade 3s ease forwards;
            cursor: none;
            z-index: 1;
        }

        /* Lebender Lichtkern */
        .intro::before {
            content: '';
            position: absolute;
            width: 70vw;
            height: 70vw;
            max-width: 900px;
            max-height: 900px;
            background: radial-gradient(circle, rgba(160, 210, 110, 0.22), transparent 65%);
            filter: blur(90px);
            animation: pulse 10s ease-in-out infinite;
        }

        /* Botanische Deko-Elemente */
        .botanical-deco {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0.06;
        }
        .botanical-deco.left {
            left: -40px;
            bottom: -40px;
            width: 300px;
            height: 300px;
            transform: rotate(15deg);
        }
        .botanical-deco.right {
            right: -40px;
            top: -40px;
            width: 300px;
            height: 300px;
            transform: rotate(-15deg);
        }

        /* ═══════════════════════════════════════════
           SCHWEBENDE PARTIKEL (Sporen)
        ═══════════════════════════════════════════ */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold-bright);
            opacity: 0;
            animation: particleFloat 8s linear infinite;
        }
        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        /* ═══════════════════════════════════════════
           CONTENT
        ═══════════════════════════════════════════ */
        .content {
            position: relative;
            z-index: 3;
            color: var(--ink);
        }

        .brand-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(45px, 8vw, 110px);
            font-weight: 400;
            letter-spacing: clamp(10px, 2.5vw, 28px);
            text-transform: uppercase;
            color: var(--ink);
            position: relative;
            animation:
                titleReveal 3.5s ease forwards,
                glitch 8s infinite;
        }

        /* Licht-Überblendung auf dem Titel */
        h1::after {
            content: "BALTAZAR SEEDS";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    rgba(255, 255, 255, 0.85),
                    transparent 80%
                );
            background-size: 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 7s infinite;
            pointer-events: none;
        }

        /* Glitch-Schicht */
        h1::before {
            content: "BALTAZAR SEEDS";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            color: var(--green);
            opacity: 0.3;
            clip-path: inset(0 0 50% 0);
            transform: translate(-2px, 0);
            animation: glitchLayer 5s infinite;
            pointer-events: none;
        }

        .subtitle {
            margin-top: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(11px, 1.5vw, 16px);
            letter-spacing: clamp(5px, 1vw, 10px);
            font-weight: 300;
            color: rgba(240, 230, 200, 0.65);
            animation: subtitleReveal 4.5s ease forwards;
        }

        .subtitle span {
            color: var(--gold);
        }

        /* Scroll-Hinweis */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--ink-faint);
            opacity: 0;
            animation: fadeUp 0.8s ease 2s forwards;
        }

        /* ═══════════════════════════════════════════
           ALTERS-OVERLAY (21+)
        ═══════════════════════════════════════════ */
        .age-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(3, 4, 3, 0.96);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .age-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .age-box {
            background: #0b1209;
            border: 1px solid var(--gold-line);
            padding: 50px 44px;
            max-width: 440px;
            text-align: center;
            color: var(--ink);
            transform: translateY(20px);
            transition: transform 0.5s var(--ease-out);
            position: relative;
        }
        .age-overlay.visible .age-box {
            transform: translateY(0);
        }

        .age-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .age-icon {
            margin-bottom: 16px;
            font-size: 36px;
            color: var(--gold);
        }

        .age-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 12px;
            color: var(--gold-bright);
        }

        .age-text {
            font-size: 13px;
            line-height: 1.8;
            color: var(--ink-dim);
            margin-bottom: 28px;
        }

        .age-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .age-btn {
            padding: 13px 26px;
            border: 1px solid var(--gold-line);
            background: none;
            color: var(--ink);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        .age-btn:hover {
            background: var(--gold-soft);
            border-color: var(--gold);
        }
        .age-btn--primary {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
        }
        .age-btn--primary:hover {
            background: var(--gold-bright);
        }

        .age-note {
            margin-top: 18px;
            font-size: 9px;
            letter-spacing: 0.15em;
            color: var(--ink-faint);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }

        /* ═══════════════════════════════════════════
           CUSTOM CURSOR
        ═══════════════════════════════════════════ */
        .cursor-ring {
            position: fixed;
            width: 34px;
            height: 34px;
            border: 1px solid rgba(196, 145, 62, 0.4);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1000;
            transition: width 0.35s var(--ease-out), height 0.35s var(--ease-out), border-color 0.3s ease;
            mix-blend-mode: normal;
        }
        .cursor-ring.active {
            width: 60px;
            height: 60px;
            border-color: rgba(196, 145, 62, 0.7);
        }

        .cursor-dot {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1001;
        }

        /* ═══════════════════════════════════════════
           ANIMATIONEN
        ═══════════════════════════════════════════ */
        @keyframes introFade {
            from { opacity: 0; transform: scale(1.04); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.95); opacity: 0.7; }
            50%      { transform: scale(1.1);  opacity: 1; }
        }

        @keyframes titleReveal {
            from { opacity: 0; filter: blur(20px); letter-spacing: 50px; }
            to   { opacity: 1; filter: blur(0); }
        }

        @keyframes shine {
            0%       { background-position: -200% center; }
            30%, 100% { background-position: 200% center; }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: none; }
            92%           { transform: translate(-2px, 1px); }
            94%           { transform: translate(2px, -1px); }
        }

        @keyframes glitchLayer {
            0%, 85%, 100% { clip-path: inset(0 0 50% 0); }
            88%           { clip-path: inset(20% 0 30% 0); transform: translate(3px, -2px); }
        }

        @keyframes subtitleReveal {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 0.65; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════════════ */
        @media (max-width: 600px) {
            h1 { letter-spacing: 6px; }
            .age-box { padding: 30px 20px; margin: 0 16px; }
            .botanical-deco { display: none; }
        }

        /* ═══════════════════════════════════════════
           REDUCED MOTION
        ═══════════════════════════════════════════ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════
         INTRO SCREEN
    ═══════════════════════════════ -->
    <div class="intro" id="intro" tabindex="0" aria-label="Baltazar Seeds – Enter the 420 Universe">

        <!-- Botanische Deko -->
        <svg class="botanical-deco left" viewBox="0 0 200 200" fill="none" stroke="white" stroke-width="0.5" aria-hidden="true">
            <path d="M100 10C70 50 70 90 100 130C130 90 130 50 100 10Z"/>
            <path d="M100 130C60 118 28 138 10 170C42 170 72 150 100 130Z"/>
            <path d="M100 130C140 118 172 138 190 170C158 170 128 150 100 130Z"/>
            <path d="M100 70C60 60 20 70 5 95C30 100 65 90 100 70Z"/>
            <path d="M100 70C140 60 180 70 195 95C170 100 135 90 100 70Z"/>
        </svg>
        <svg class="botanical-deco right" viewBox="0 0 200 200" fill="none" stroke="white" stroke-width="0.5" aria-hidden="true">
            <path d="M100 10C70 50 70 90 100 130C130 90 130 50 100 10Z"/>
            <path d="M100 130C60 118 28 138 10 170C42 170 72 150 100 130Z"/>
            <path d="M100 130C140 118 172 138 190 170C158 170 128 150 100 130Z"/>
        </svg>

        <div class="content">
            <div class="brand-tag">Genetic Hunter</div>
            <h1>Baltazar Seeds</h1>
            <div class="subtitle">ENTER THE <span>420</span> UNIVERSE</div>
        </div>

        <div class="scroll-hint">Click to Enter</div>
    </div>

    <!-- ═══════════════════════════════
         PARTIKEL
    ═══════════════════════════════ -->
    <div id="particles" aria-hidden="true"></div>

    <!-- ═══════════════════════════════
         ALTERS-OVERLAY (21+)
    ═══════════════════════════════ -->
    <div class="age-overlay" id="ageOverlay" role="dialog" aria-modal="true" aria-labelledby="ageTitle">
        <div class="age-box">
            <div class="age-icon" aria-hidden="true">🌿</div>
            <div class="age-title" id="ageTitle">Adults Only</div>
            <p class="age-text">
                This website contains information about cannabis seeds and is intended exclusively for adults aged 21 and over.<br><br>
                By clicking "I am 21+", you confirm that you are of legal age.
            </p>
            <div class="age-buttons">
                <button class="age-btn age-btn--primary" id="ageYes">I am 21+</button>
                <button class="age-btn" id="ageNo">Leave</button>
            </div>
            <div class="age-note">All seeds sold as collectibles only</div>
        </div>
    </div>

    <!-- ═══════════════════════════════
         CUSTOM CURSOR
    ═══════════════════════════════ -->
    <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

    <script>
        (function() {
            'use strict';

            // ─── Elemente ───────────────────────────
            const intro       = document.getElementById('intro');
            const ageOverlay  = document.getElementById('ageOverlay');
            const ageYes      = document.getElementById('ageYes');
            const ageNo       = document.getElementById('ageNo');
            const cursorRing  = document.getElementById('cursorRing');
            const cursorDot   = document.getElementById('cursorDot');
            const particles   = document.getElementById('particles');

            // ─── Partikel erzeugen ──────────────────
            function createParticles() {
                const count = 30;
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 1 + Math.random() * 3;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 8 + 's';
                    p.style.animationDuration = (6 + Math.random() * 6) + 's';
                    p.style.opacity = '0';
                    particles.appendChild(p);
                }
            }
            createParticles();

            // ─── Altersprüfung ──────────────────────
            let ageVerified = false;
            try {
                ageVerified = localStorage.getItem('baltazar_age_21') === 'true';
            } catch (e) {}

            function enterSite() {
                window.location.href = 'hauptseite.html';
            }

            intro.addEventListener('click', function() {
                if (ageVerified) {
                    enterSite();
                } else {
                    ageOverlay.classList.add('visible');
                }
            });

            // Tastatur
            intro.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    intro.click();
                }
            });

            ageYes.addEventListener('click', function() {
                try {
                    localStorage.setItem('baltazar_age_21', 'true');
                } catch (e) {}
                enterSite();
            });

            ageNo.addEventListener('click', function() {
                window.location.href = 'https://www.google.com';
            });

            // Overlay schließen bei Klick außerhalb
            ageOverlay.addEventListener('click', function(e) {
                if (e.target === ageOverlay) {
                    ageOverlay.classList.remove('visible');
                }
            });

            // ─── Custom Cursor ──────────────────────
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let ringX = mouseX;
            let ringY = mouseY;

            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursorDot.style.left = mouseX + 'px';
                cursorDot.style.top  = mouseY + 'px';
            });

            function animateCursor() {
                ringX += (mouseX - ringX) * 0.12;
                ringY += (mouseY - ringY) * 0.12;
                cursorRing.style.left = ringX + 'px';
                cursorRing.style.top  = ringY + 'px';
                requestAnimationFrame(animateCursor);
            }
            animateCursor();

            // Hover-Effekt auf Intro
            intro.addEventListener('mouseenter', function() {
                cursorRing.classList.add('active');
            });
            intro.addEventListener('mouseleave', function() {
                cursorRing.classList.remove('active');
            });

            // Cursor ausblenden, wenn Maus das Fenster verlässt
            document.addEventListener('mouseleave', function() {
                cursorRing.style.opacity = '0';
                cursorDot.style.opacity = '0';
            });
            document.addEventListener('mouseenter', function() {
                cursorRing.style.opacity = '1';
                cursorDot.style.opacity = '1';
            });

            // ─── Escape schließt Overlay ────────────
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    ageOverlay.classList.remove('visible');
                }
            });

        })();
    </script>
</body>
</html>
