<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baltazar Seeds - Chill Corner</title>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Bebas+Neue&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    /* ---------------- Reset & Basis ---------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      font-family: 'Bebas Neue', cursive;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      text-align: center;
      background: radial-gradient(circle at center, #001100, #000);
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 15px; }

    /* ---------------- Header ---------------- */
    header {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      padding: 15px 0;
      z-index: 100;
      box-shadow: 0 0 25px rgba(0, 255, 153, 0.4);
      border-bottom: 1px solid rgba(0, 255, 153, 0.3);
    }
    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      color: #00ff99;
      margin: 0;
      text-shadow: 0 0 15px #00ff99, 0 0 25px #003300;
      letter-spacing: 2px;
    }

    /* ---------------- Glitch Title ---------------- */
    .glitch {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      color: #00ff99;
      margin: 40px 0;
      position: relative;
      animation: glitchFlicker 3s infinite;
      text-shadow: 0 0 15px #00ff99;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      background: #0a0a0a;
    }
    .glitch::before {
      animation: glitch-1 0.5s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      color: #00ffff;
      left: 2px;
      text-shadow: -1px 0 #ff00ff;
    }
    .glitch::after {
      animation: glitch-2 0.7s infinite linear alternate-reverse;
      clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
      color: #ff00ff;
      left: -2px;
      text-shadow: 1px 0 #00ff99;
    }
    @keyframes glitchFlicker {
      0%, 95%, 100% { opacity: 1; }
      96%, 99% { opacity: 0.4; }
    }
    @keyframes glitch-1 {
      0% { transform: translate(0); }
      100% { transform: translate(-3px, 2px); }
    }
    @keyframes glitch-2 {
      0% { transform: translate(0); }
      100% { transform: translate(3px, -2px); }
    }

    /* ---------------- Game Section ---------------- */
    .game-section {
      max-width: 800px;
      margin: 0 auto 50px;
      padding: 20px 15px;
    }
    #snakeGame {
      width: 100%;
      height: 450px;
      max-width: 800px;
      margin: 0 auto;
      display: block;
      border: 3px solid #00ff99;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 153, 0.6), inset 0 0 20px rgba(0, 0, 0, 0.8);
      image-rendering: pixelated;
      background: #111;
    }
    .controls {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      max-width: 220px;
      margin: 20px auto;
    }
    .controls button {
      background: #222;
      border: 2px solid #00ff99;
      color: #00ff99;
      font-size: 1.8rem;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    .controls button:active {
      background: #00ff99;
      color: #000;
      transform: scale(0.95);
    }
    @media (max-width: 768px) {
      .controls { display: grid; }
      #snakeGame { height: 300px; }
    }

    /* ---------------- Card Section ---------------- */
    .card-section {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      padding: 60px 15px;
      min-height: 600px;
      overflow: hidden;
    }
    .card-section video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.4;
      z-index: -1;
      filter: brightness(0.6) contrast(1.3) blur(1px);
    }

    /* ---------------- Card Widget ---------------- */
    .card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 153, 0.3);
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      padding: 25px;
      text-align: center;
      transition: all 0.4s ease;
      box-shadow: 0 8px 32px rgba(0, 255, 153, 0.2);
      position: relative;
      z-index: 1;
    }
    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 15px 40px rgba(0, 255, 153, 0.4);
      border-color: #00ff99;
    }
    .card h2 {
      margin-bottom: 18px;
      color: #00ff99;
      font-size: 1.6rem;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00ff99;
    }
    .card button {
      padding: 12px 28px;
      font-size: 1.1rem;
      background: #00ff99;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Bebas Neue', cursive;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.5);
    }
    .card button:hover {
      background: #00cc77;
      transform: scale(1.05);
    }
    #scanOutput, #fact {
      max-height: 260px;
      overflow-y: auto;
      text-align: left;
      font-family: 'Courier New', monospace;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid rgba(0, 255, 153, 0.2);
    }
    .site {
      padding: 6px 12px;
      border-left: 4px solid #555;
      margin-bottom: 6px;
      font-weight: bold;
      transition: 0.3s;
    }
    .legendary {
      color: #00ff99;
      border-left: 5px solid #00ff99;
      text-shadow: 0 0 10px #00ff99;
      animation: blink 0.7s infinite alternate;
    }
    .negative {
      color: #ff3300;
      border-left: 5px solid #ff3300;
      text-shadow: 0 0 10px #ff3300;
      animation: blink 0.7s infinite alternate;
    }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }

    /* ---------------- Loading Spinner ---------------- */
    .scan-loading {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #0f0;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------------- Floating Leaves ---------------- */
    .leaf {
      position: absolute;
      width: 60px;
      height: 60px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Cannabis_leaf_icon.svg/1024px-Cannabis_leaf_icon.svg.png') no-repeat center center;
      background-size: contain;
      opacity: 0.35;
      pointer-events: all;
      animation: float 15s ease-in-out infinite, sway 3s ease-in-out infinite;
      filter: drop-shadow(0 0 10px #00ff99);
      transition: all 0.4s ease;
      z-index: 0;
    }
    .leaf:hover {
      opacity: 0.8;
      transform: scale(1.4) !important;
      filter: drop-shadow(0 0 25px #00ff99);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-320px) rotate(180deg); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }

    /* ---------------- Navigation Buttons ---------------- */
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 50px auto;
      padding: 0 15px;
    }
    .back-button {
      display: inline-block;
      padding: 14px 32px;
      background: #222;
      color: #fff;
      border: 3px solid #00ff99;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.6);
    }
    .back-button:hover {
      background: #00ff99;
      color: #000;
      transform: scale(1.1);
      box-shadow: 0 0 35px rgba(0, 255, 153, 0.9);
    }

    /* ---------------- Footer ---------------- */
    footer {
      padding: 30px;
      font-size: 0.9rem;
      color: #00ff99;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BALTAZAR SEEDS</h1>
    </header>

    <main>
      <section class="hero">
        <h1 class="glitch" data-text="CHILL CORNER">🌱 CHILL CORNER 🌱</h1>
      </section>

      <!-- Snake Game Section -->
      <section class="game-section">
        <canvas id="snakeGame" width="800" height="450"></canvas>
        <div class="controls">
          <button onclick="setDirection(0,-1)">↑</button>
          <button onclick="setDirection(-1,0)">←</button>
          <button onclick="setDirection(0,1)">↓</button>
          <button onclick="setDirection(1,0)">→</button>
        </div>
      </section>

      <!-- Card Section -->
      <section class="card-section">
        <video autoplay muted loop playsinline preload="auto" poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
          <source src="logovid.mp4" type="video/mp4">
          Ihr Browser unterstütgt das Video-Tag nicht.
        </video>

        <!-- Ultra Scan Widget -->
        <div class="card">
          <h2>BOT SCAN</h2>
          <button id="startScanBtn">Start Scan</button>
          <div id="scanOutput"></div>
        </div>

        <!-- Fun Facts Widget -->
        <div class="card">
          <h2>TIPS & FUN FACTS</h2>
          <button id="showFactBtn">Show Tip</button>
          <div id="fact"></div>
        </div>

        <!-- Floating Leaves -->
        <div class="leaf" style="left:5%; animation-delay:0s;"></div>
        <div class="leaf" style="left:25%; animation-delay:2s;"></div>
        <div class="leaf" style="left:45%; animation-delay:4s;"></div>
        <div class="leaf" style="left:65%; animation-delay:1s;"></div>
        <div class="leaf" style="left:85%; animation-delay:3s;"></div>
      </section>

      <!-- Navigation -->
      <nav class="nav-buttons">
        <a href="farm.html" class="back-button">Farm</a>
        <a href="flow.html" class="back-button">Flow</a>
        <a href="baltazarsrun.html" class="back-button">Baltazar's Run</a>
        <a href="seite3.html" class="back-button">Menu</a>
      </nav>
    </main>

    <footer>
      &copy; 2025 Baltazar Seeds – Stay High, Stay Safe
    </footer>
  </div>

  <!-- Hover Sound (optional – ersetze mit deiner Datei) -->
  <audio id="hoverSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBQAAAA==" type="audio/wav">
  </audio>

  <script>
    // ---------------- Snake Game ----------------
    const canvas = document.getElementById('snakeGame');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    let count = 0;
    let snake = [{x: 8*grid, y: 8*grid}];
    let direction = {x: 0, y: 0};
    let apple = {x: Math.floor(Math.random()*canvas.width/grid)*grid, y: Math.floor(Math.random()*canvas.height/grid)*grid};
    let score = 0;

    function setDirection(dx, dy) {
      if (dx !== 0 && direction.x === 0) direction = {x: dx, y: 0};
      if (dy !== 0 && direction.y === 0) direction = {x: 0, y: dy};
    }

    function gameLoop() {
      requestAnimationFrame(gameLoop);
      if (++count < 4) return;
      count = 0;

      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let head = {...snake[0]};
      head.x += direction.x * grid;
      head.y += direction.y * grid;

      // Wrap around
      if (head.x >= canvas.width) head.x = 0;
      if (head.x < 0) head.x = canvas.width - grid;
      if (head.y >= canvas.height) head.y = 0;
      if (head.y < 0) head.y = canvas.height - grid;

      // Collision
      for (let segment of snake) {
        if (segment.x === head.x && segment.y === head.y) {
          snake = [{x: 8*grid, y: 8*grid}];
          direction = {x:0, y:0};
          score = 0;
        }
      }

      snake.unshift(head);

      if (head.x === apple.x && head.y === apple.y) {
        score++;
        apple = {x: Math.floor(Math.random()*canvas.width/grid)*grid, y: Math.floor(Math.random()*canvas.height/grid)*grid};
      } else {
        snake.pop();
      }

      // Draw apple
      ctx.fillStyle = "#ff3333";
      ctx.fillRect(apple.x, apple.y, grid-2, grid-2);

      // Draw snake
      ctx.fillStyle = "#00ff99";
      snake.forEach(s => ctx.fillRect(s.x, s.y, grid-2, grid-2));

      // Score
      ctx.fillStyle = "#00ff99";
      ctx.font = "22px 'Bebas Neue', cursive";
      ctx.fillText("Score: " + score, 12, 28);
    }

    document.addEventListener('keydown', e => {
      if (e.key === "w") setDirection(0, -1);
      if (e.key === "s") setDirection(0, 1);
      if (e.key === "a") setDirection(-1, 0);
      if (e.key === "d") setDirection(1, 0);
    });

    requestAnimationFrame(gameLoop);

    // ---------------- Floating Leaves Interactivity ----------------
    document.querySelectorAll('.leaf').forEach(leaf => {
      leaf.addEventListener('click', () => {
        leaf.style.transform = "translateY(-60px) rotate(45deg) scale(1.5)";
        setTimeout(() => leaf.style.transform = "", 600);
      });
    });

    // ---------------- Hover Sound ----------------
    const hoverSound = document.getElementById('hoverSound');
    document.querySelectorAll('.card, .back-button, .leaf').forEach(el => {
      el.addEventListener('mouseenter', () => {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(() => {});
      });
    });

    // ---------------- Ultra Scan ----------------
    const ultraSites = [
      {name:"Baltazar-Seeds Shop", status:"legendary", type:"Invincible Security"},
      {name:"Payment Gateway", status:"legendary", type:"Fort Knox Mode"},
      {name:"Customer Data", status:"legendary", type:"Encrypted to Mars"},
      {name:"Banks", status:"negative", type:"Not Playing With Us"},
      {name:"Secret Seed Vault", status:"legendary", type:"Alien-Proof"},
      {name:"Government Inspectors", status:"negative", type:"Denied Access"}
    ];

    const outputDiv = document.getElementById('scanOutput');
    const scanBtn = document.getElementById('startScanBtn');

    async function runUltraScan() {
      scanBtn.disabled = true;
      outputDiv.innerHTML = '';
      for (let site of ultraSites) {
        const row = document.createElement('div');
        row.className = 'site';
        row.innerHTML = `Scanning ${site.name} <span class="scan-loading"></span>`;
        row.style.color = "#00ffff";
        outputDiv.appendChild(row);
        row.scrollIntoView({behavior: "smooth"});

        await new Promise(r => setTimeout(r, 700 + Math.random() * 400));

        row.innerHTML = `${site.name} ... ${site.type.toUpperCase()}!`;
        row.classList.add(site.status);

        // Leaf dance
        document.querySelectorAll('.leaf').forEach(leaf => {
          leaf.style.transform = `translateY(-${Math.random()*60}px) rotate(${Math.random()*360}deg)`;
          setTimeout(() => leaf.style.transform = "", 600);
        });

        await new Promise(r => setTimeout(r, 500));
      }

      const endMsg = document.createElement('div');
      endMsg.innerHTML = "Bot Scan Complete! Baltazar Seeds is <strong>CREAM DE LA CREAM!!</strong>";
      endMsg.style.marginTop = "15px";
      endMsg.style.color = "#ff00ff";
      endMsg.style.fontSize = "1.4rem";
      endMsg.style.textShadow = "0 0 20px #ff00ff";
      outputDiv.appendChild(endMsg);
      scanBtn.disabled = false;
    }

    scanBtn.addEventListener('click', runUltraScan);

    // ---------------- Fun Facts ----------------
    const facts = [
      "Aroma Aroma Aroma",
      "Never mix the holy with the inferior.",
      "Cannabis loves lots of Light. 16-18 Hours a Day is ideal in the growth phase.",
      "Proper humidity helps healthy Leaves and strong Plants. Warmth and perspiration are the magic words here.",
      "Fast growth in young Plants means often a stronger harvest later. You can literally see the potency.",
      "Scent Scent Scent",
      "Feed wisely: Too much synthetic fertilizer can harm your Cannabis but Organic amendments can be used more generously.",
      "Trichomes contain valuable Cannabinoids. Patience pays off. The scent of each Flower is incredible.",
      "If you dry for too long, it's called too dry, crumbs, hay or dust (not the good one) but if you dry too quickly it's called bad fermented. The flowers are then irreversibly damaged and inedible because they smell poorly fermented. Dry flowers on the other hand are more smokable. The reason some dry too quickly is precisely because they are too dry: people mistakenly believe that fresh and wet flowers are good because they are more pleasant to smoke mixed with tobacco. There is a general prejudice about freshness. Cannabis is more like wine: it gets better over time as all the chlorophyll disappears from the leaves. The smoke becomes pleasant and mild so you can hold it in your lungs for a long time & get even more high.",
      "Small mistakes make the Grow more exciting. Every grow is an adventure. You getting better and better.",
      "Terps Terps Terps",
      "When the genetics hits the pain feel no pain",
      "Strategic pruning improves airflow and light penetration, promoting bigger yields. Use Low-Stress Training (LST) carefully to avoid damaging stems while shaping the plant.",
      "Some cannabis aromas are real, others illusions. Real scents like banana or garlic come from true compounds also found in cannabis, while fruity notes like strawberry are just terpene blends. Since 2021, sulfur compounds were confirmed to cause gas, diesel, and skunk aromas in strains like GMO, Chemdawg, and SFV OG."
    ];

    document.getElementById('showFactBtn').addEventListener('click', () => {
      const fact = facts[Math.floor(Math.random() * facts.length)];
      document.getElementById('fact').innerText = fact;
    });
  </script>
</body>
</html>
