<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Mario‑Style Platformer (verbessert)</title>
  <style>
    html,body{height:100%;margin:0;background:#0b1220;display:flex;align-items:center;justify-content:center;font-family:system-ui,Arial;color:#e6eef8}
    #wrap{width:820px;text-align:center}
    canvas{display:block;margin:8px auto;background:linear-gradient(#87ceeb,#6fb3e6);border-radius:8px;image-rendering:pixelated}
    .info{font-size:13px;opacity:0.9}
    .hint{margin-top:6px;font-size:13px;color:#dfeffb}
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="450" tabindex="0"></canvas>
    <div class="info">Steuerung: ← → bewegen, ↑ oder Leertaste springen. Klick auf das Canvas, falls die Tasten nicht reagieren.</div>
    <div class="hint">Ich habe den Code überarbeitet: stabilere Kollisionen, keine Reloads bei Respawn, bessere Kameraführung.</div>
  </div>

<script>
/* ---------------------------------------------
   Simple Mario‑Style Platformer — improved
   Single HTML file — copy & paste into index.html
   ---------------------------------------------*/

// canvas + DPR handling
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CSS_W = 800, CSS_H = 450;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.floor(CSS_W * DPR);
canvas.height = Math.floor(CSS_H * DPR);
canvas.style.width = CSS_W + 'px';
canvas.style.height = CSS_H + 'px';
ctx.setTransform(DPR,0,0,DPR,0,0);

// world
const W = CSS_W, H = CSS_H, TILE = 32;
const levelRaw = [
  '................................................................................',
  '................................................................................',
  '................................................................................',
  '................................................................................',
  '........................?.......................................................',
  '..................#######......................................................',
  '..............?...................................??...........................',
  '......#########......................#####...................#########........',
  '............................E...........................................G.....',
  '##############################......##############################..##########'
];
const MAP_W = levelRaw[0].length;
const MAP_H = levelRaw.length;
const level = levelRaw.map(r => r.split(''));

// entities
let coins = [];
let enemies = [];
let goalTiles = [];
let startPos = {x:40, y: H - TILE*6};

function spawnEntities(){
  coins = [];
  enemies = [];
  goalTiles = [];
  for (let y=0;y<MAP_H;y++){
    for (let x=0;x<MAP_W;x++){
      const ch = level[y][x];
      const px = x*TILE, py = y*TILE;
      if (ch === '?') coins.push({x:px+8,y:py+8,w:16,h:16,col:false});
      if (ch === 'E') enemies.push({x:px,y:py,w:28,h:28,dir: -1, speed: 50});
      if (ch === 'G') goalTiles.push({x:px,y:py,w:TILE,h:TILE});
    }
  }
}

spawnEntities();

// player
const player = {
  x: startPos.x,
  y: startPos.y,
  w: 22,
  h: 28,
  vx: 0,
  vy: 0,
  speed: 170,
  jumpVel: 420,
  grounded: false,
  coins: 0,
  alive: true
};

// physics
const GRAV = 1400;

// input
const keys = {};
window.addEventListener('keydown', e=>{ keys[e.code]=true; if(['Space','ArrowUp'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

// helpers
function isSolidTile(tx,ty){
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return false; // outside = empty
  return level[ty][tx] === '#';
}

function tilesOverlappingRect(x,y,w,h){
  const left = Math.floor(x / TILE);
  const right = Math.floor((x + w - 1) / TILE);
  const top = Math.floor(y / TILE);
  const bottom = Math.floor((y + h - 1) / TILE);
  const out = [];
  for (let ty=top; ty<=bottom; ty++){
    for (let tx=left; tx<=right; tx++){
      if (isSolidTile(tx,ty)) out.push({tx,ty,x:tx*TILE,y:ty*TILE,w:TILE,h:TILE});
    }
  }
  return out;
}

function rectsOverlap(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// camera
let camX = 0;
function updateCamera(){
  camX = player.x - W*0.35;
  camX = Math.max(0, Math.min(camX, MAP_W*TILE - W));
}

// respawn
function respawn(){
  player.x = startPos.x; player.y = startPos.y; player.vx = 0; player.vy = 0; player.coins = 0; player.alive = true; player.grounded = false;
  spawnEntities();
}

// game loop
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 1/30);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  if (!player.alive) return;
  // input
  let dir = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
  player.vx = dir * player.speed;
  if ((keys['Space'] || keys['ArrowUp']) && player.grounded){ player.vy = -player.jumpVel; player.grounded = false; }

  // apply gravity
  player.vy += GRAV * dt;

  // horizontal move + collision
  player.x += player.vx * dt;
  let collTiles = tilesOverlappingRect(player.x, player.y, player.w, player.h);
  if (collTiles.length){
    for (const t of collTiles){
      if (player.vx > 0){ // moving right -> push left
        player.x = t.x - player.w;
      } else if (player.vx < 0){ // moving left -> push right
        player.x = t.x + TILE;
      }
      player.vx = 0;
    }
  }

  // vertical move + collision
  player.y += player.vy * dt;
  collTiles = tilesOverlappingRect(player.x, player.y, player.w, player.h);
  player.grounded = false;
  if (collTiles.length){
    for (const t of collTiles){
      if (player.vy > 0){ // falling -> land on tile
        player.y = t.y - player.h;
        player.vy = 0;
        player.grounded = true;
      } else if (player.vy < 0){ // hitting head
        player.y = t.y + TILE;
        player.vy = 0;
      }
    }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    // simple patrol with edge detection
    // move
    e.x += e.speed * dt * e.dir;
    // if obstacle in front or no ground ahead -> flip
    const frontX = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
    const footY = e.y + e.h + 2;
    const tileBelowFront = isSolidTile(Math.floor(frontX/TILE), Math.floor(footY/TILE));
    const collideAhead = tilesOverlappingRect(e.x, e.y, e.w, e.h).length > 0;
    if (!tileBelowFront || collideAhead){ e.dir *= -1; }

    // collision with player
    if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, e)){
      if (player.vy > 150 && (player.y + player.h - e.y) < 20){
        // stomp enemy
        enemies.splice(i,1);
        player.vy = -220;
      } else {
        // die -> respawn
        player.alive = false;
        setTimeout(respawn, 400);
      }
    }
  }

  // coins
  for (const c of coins){
    if (!c.col && rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, c)){
      c.col = true; player.coins += 1;
    }
  }

  // goal
  for (const g of goalTiles){ if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, g)){
    setTimeout(()=>{ alert('Level geschafft! Münzen: ' + player.coins); respawn(); }, 50);
  }}

  updateCamera();
}

// render
function render(){
  // clear
  ctx.clearRect(0,0,W,H);

  // sky gradient is canvas background; draw tiles visible in camera
  const startCol = Math.floor(camX / TILE);
  const endCol = Math.min(MAP_W, Math.ceil((camX + W)/TILE));

  // draw tiles
  for (let y=0;y<MAP_H;y++){
    for (let x=startCol;x<endCol;x++){
      const ch = level[y][x];
      const sx = x*TILE - camX;
      const sy = y*TILE;
      if (ch === '#'){
        // block
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(sx, sy, TILE, TILE);
        // top highlight
        ctx.fillStyle = '#a36f43';
        ctx.fillRect(sx+2, sy+2, TILE-4, TILE-8);
      }
      if (ch === 'G'){
        // small flag
        ctx.fillStyle = '#333'; ctx.fillRect(sx + TILE/2 - 3, sy - 22, 6, 22);
        ctx.fillStyle = '#e22'; ctx.fillRect(sx + TILE/2, sy - 18, 14, 12);
      }
    }
  }

  // coins
  for (const c of coins){ if (c.col) continue; ctx.beginPath(); ctx.fillStyle = '#ffd24d'; ctx.arc(c.x - camX + c.w/2, c.y + c.h/2, 8, 0, Math.PI*2); ctx.fill(); }

  // enemies
  for (const e of enemies){ ctx.fillStyle = '#b33'; ctx.fillRect(e.x - camX, e.y, e.w, e.h); ctx.fillStyle='#fff'; ctx.fillRect(e.x - camX + 6, e.y + 6, 5,5); }

  // player (simple)
  ctx.save();
  ctx.translate(player.x - camX, player.y);
  // body
  ctx.fillStyle = '#1a73e8'; ctx.fillRect(0, 6, player.w, player.h-6);
  // head
  ctx.fillStyle = '#fccfa7'; ctx.fillRect(3, -6, 16, 12);
  // hat
  ctx.fillStyle = '#d33'; ctx.fillRect(0, -10, 22, 6);
  // eye
  ctx.fillStyle = '#000'; ctx.fillRect(10, -2, 3,3);
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(8,8,160,36);
  ctx.fillStyle = '#000'; ctx.font = '14px system-ui'; ctx.fillText('Münzen: ' + player.coins, 18, 30);
}

// focus hint
canvas.addEventListener('click', ()=> canvas.focus());

// resize handler: keep CSS size, no need to change canvas scaling here
window.addEventListener('resize', ()=>{});

</script>
</body>
</html>
