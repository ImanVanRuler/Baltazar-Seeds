<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Simple Mario Clone</title>
  <style>
    body { margin:0; background:#222; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { background:#5c94fc; image-rendering: pixelated; }
    #info { position: absolute; top:10px; left:10px; color:white; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="info">Steuerung: ← → bewegen, ↑ oder Leertaste springen</div>
  <canvas id="game" width="800" height="480"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const TILE = 32;
    const MAP_W = 60, MAP_H = 15;

    // Level als ASCII Map – S = Startpunkt
    const levelRaw = [
      '............................................................................',
      '............................................................................',
      '............................................................................',
      '............................................................................',
      '............................................................................',
      '............................................................................',
      '............................................................................',
      '.........................?..................................................',
      '.............E..............................................................',
      '.................#####......................................................',
      '............................................................................',
      '.....S......................................................................',
      '###############################..................############################',
      '###############################..................############################',
      '###############################..................############################'
    ];

    let level = levelRaw.map(r => r.split(''));

    // Startposition (wird in spawnEntities durch S überschrieben)
    let startPos = { x: 40, y: H - TILE*3 };

    // Player
    let player = {
      x: startPos.x,
      y: startPos.y,
      w: 22,
      h: 28,
      vx: 0,
      vy: 0,
      onGround: false
    };

    let keys = {};
    document.addEventListener("keydown", e => keys[e.code] = true);
    document.addEventListener("keyup", e => keys[e.code] = false);

    let coins = [], enemies = [], goalTiles = [];
    let score = 0;

    function spawnEntities() {
      coins = [];
      enemies = [];
      goalTiles = [];
      for (let y=0; y<MAP_H; y++) {
        for (let x=0; x<MAP_W; x++) {
          const ch = level[y][x];
          const px = x * TILE, py = y * TILE;

          if (ch === 'S') {
            startPos = {
              x: px + (TILE - player.w) / 2,
              y: py + TILE - player.h
            };
            player.x = startPos.x;
            player.y = startPos.y;
            level[y][x] = '.';
          }

          if (ch === '?') {
            coins.push({ x:px+8, y:py+8, w:16, h:16, col:false });
          }

          if (ch === 'E') {
            enemies.push({ x:px, y:py, w:28, h:28, dir:-1, speed:50 });
          }

          if (ch === 'G') {
            goalTiles.push({ x:px, y:py, w:TILE, h:TILE });
          }
        }
      }
    }

    spawnEntities();

    function rectsOverlap(a,b){
      return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
    }

    function getTileAt(x,y){
      let tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
      if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return '#';
      return level[ty][tx];
    }

    function update(dt){
      // Steuerung
      if(keys["ArrowLeft"]) player.vx = -120;
      else if(keys["ArrowRight"]) player.vx = 120;
      else player.vx = 0;

      if((keys["ArrowUp"]||keys["Space"]) && player.onGround){
        player.vy = -260; player.onGround=false;
      }

      // Gravitation
      player.vy += 600*dt;

      // Bewegung X
      player.x += player.vx*dt;
      if(player.vx>0){
        if(getTileAt(player.x+player.w, player.y)=="#"||getTileAt(player.x+player.w, player.y+player.h-1)=="#"){
          player.x = Math.floor((player.x+player.w)/TILE)*TILE - player.w -0.01;
        }
      } else if(player.vx<0){
        if(getTileAt(player.x, player.y)=="#"||getTileAt(player.x, player.y+player.h-1)=="#"){
          player.x = Math.floor(player.x/TILE+1)*TILE;
        }
      }

      // Bewegung Y
      player.y += player.vy*dt;
      player.onGround=false;
      if(player.vy>=0){
        if(getTileAt(player.x, player.y+player.h)=="#"||getTileAt(player.x+player.w-1, player.y+player.h)=="#"){
          player.y = Math.floor((player.y+player.h)/TILE)*TILE - player.h;
          player.vy=0; player.onGround=true;
        }
      } else {
        if(getTileAt(player.x, player.y)=="#"||getTileAt(player.x+player.w-1, player.y)=="#"){
          player.y = Math.floor(player.y/TILE+1)*TILE;
          player.vy=0;
        }
      }

      // Münzen sammeln
      coins.forEach(c=>{
        if(!c.col && rectsOverlap(player,c)){ c.col=true; score++; }
      });

      // Gegner
      enemies.forEach(e=>{
        e.x += e.dir*e.speed*dt;
        if(getTileAt(e.x, e.y+e.h+1)=='.') e.dir*=-1;
        if(rectsOverlap(player,e)){
          if(player.vy>0){
            e.dead=true; player.vy=-200;
          } else {
            respawn();
          }
        }
      });
      enemies = enemies.filter(e=>!e.dead);

      // Ziel
      goalTiles.forEach(g=>{
        if(rectsOverlap(player,g)){
          alert("Level geschafft! Punkte: "+score);
          respawn(true);
        }
      });

      if(player.y>H) respawn();
    }

    function respawn(reset=false){
      player.x=startPos.x; player.y=startPos.y;
      player.vx=player.vy=0; score= reset?0:score;
    }

    function draw(){
      ctx.fillStyle="#5c94fc"; ctx.fillRect(0,0,W,H);
      for(let y=0;y<MAP_H;y++){
        for(let x=0;x<MAP_W;x++){
          if(level[y][x]=="#"){
            ctx.fillStyle="#654321";
            ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
          }
        }
      }
      ctx.fillStyle="yellow";
      coins.forEach(c=>{ if(!c.col) ctx.beginPath(), ctx.arc(c.x+8,c.y+8,8,0,Math.PI*2), ctx.fill(); });

      ctx.fillStyle="red";
      enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));

      ctx.fillStyle="green";
      goalTiles.forEach(g=>ctx.fillRect(g.x,g.y,g.w,g.h));

      ctx.fillStyle="blue";
      ctx.fillRect(player.x,player.y,player.w,player.h);

      ctx.fillStyle="white";
      ctx.font="16px sans-serif";
      ctx.fillText("Score: "+score,10,20);
    }

    let last=0;
    function loop(ts){
      let dt=(ts-last)/1000; last=ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
