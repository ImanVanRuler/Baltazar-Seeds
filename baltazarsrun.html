<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baltazar's Run - Epic Grower Adventure</title>
    <style>
        html, body {
            height: 100%; margin: 0;
            background: #0b1220; display: flex;
            align-items: center; justify-content: center;
            font-family: system-ui, Arial, sans-serif; color: #e6eef8;
        }
        #wrap {width: 900px; text-align: center;}
        canvas {
            display: block; margin: 8px auto;
            background: url('baltirunbackground.jpg') center/cover no-repeat;
            border-radius: 8px; image-rendering: pixelated;
        }
        .info, .hint {font-size: 14px; opacity: 0.9;}
        .hint {margin-top: 6px; color: #dfeffb;}
        .btn {
            padding: 8px 14px; margin: 4px; font-size: 16px; cursor: pointer;
            border: none; border-radius: 5px; background: #1a73e8; color: #fff;
        }
        .btn:hover {background: #155ab6;}
        a.back-button {padding: 8px 14px; margin: 4px; font-size: 16px; text-decoration: none; background: #777; color: #fff; border-radius: 5px;}
        a.back-button:hover {background: #555;}
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="game" width="900" height="500" tabindex="0"></canvas>
    <div class="info">Controls: ← → to move, ↑ or Space to jump. Click canvas if keys do not respond.</div>
    <div class="hint">Epic Grower Adventure: Collect cannabis seeds, defeat enemies, conquer levels in Baltazar's world!</div>
    <div>
        <a href="seite3.html" class="back-button">Back To Menu</a>
        <button class="btn" id="restart">Restart</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CSS_W = 900, CSS_H = 500;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.floor(CSS_W * DPR);
canvas.height = Math.floor(CSS_H * DPR);
canvas.style.width = CSS_W + 'px';
canvas.style.height = CSS_H + 'px';
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const W = CSS_W, H = CSS_H, TILE = 60; // Increased tile size for more detail

// Multiple levels with longer, more complex designs
const levels = [
    // Level 1: Beginner
    [
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................................................',
        '...................?.................................................................?.................................................?.........................................',
        '....................................#####..........................................................#####............................#......#..........................',
        '.........................................#####..............................................#####................................#.............#####...............',
        '...............#######.................................................#######.........................#######...............##..............................#######...',
        '.........................................................................................................................................................................................',
        '................................E..............................................................E................................................................G........',
        '#########################################################################################################################################################################'
    ],
    // Level 2: Intermediate with spikes and more enemies
    [
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................................................',
        '................................?...................................?...................................?...................................?..................................',
        '................#####.................................................#####.................................................#####...............................................',
        '.........................................................................................................................................................................................',
        '........S......S.......S......S.......E.......#####.........F.........#####.........E.........#####.........F.........#####.........E.........#####.........S......S...',
        '.........................................................................................................................................................................................',
        '.......#######.........#######.........#######.........#######.........#######.........#######.........#######.........#######.........#######.........#######.........',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ],
    // Level 3: Advanced with flying enemies and longer paths
    [
        '.........................................................................................................................................................................................',
        '................?..................?..................?..................?..................?..................?..................?..................?...............',
        '.......F..........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........F.....',
        '.........................................................................................................................................................................................',
        '.......E.........................................................................................................................................................E...............',
        '................S..................S..................S..................S..................S..................S..................S..................S...............',
        '.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####..',
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ],
    // Level 4: It's getting harder
    [
        '.........................................................................................................................................................................................',
        '................?..................?..................?..................?..................?..................?..................?..................?...............',
        '.......F..........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........F.....',
        '.........................................................................................................................................................................................',
        '.......E.........................................................................................................................................................E...............',
        '................S..................S..................S..................S..................S..................S..................S..................S...............',
        '.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####..',
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ],
];

let currentLevel = 0;
let levelRaw = levels[currentLevel];
let MAP_W = levelRaw[0].length;
let MAP_H = levelRaw.length;
let level = levelRaw.map(r => r.split(''));

let seeds = [], enemies = [], goalTiles = [], spikes = [];
let startPos = {x: 100, y: H - TILE - 80}; // Adjusted for larger player

const playerImg = new Image();
playerImg.src = 'baltirun.png';

function spawnEntities() {
    seeds = [];
    enemies = [];
    goalTiles = [];
    spikes = [];
    for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
            const ch = level[y][x];
            const px = x * TILE, py = y * TILE;
            if (ch === '?') seeds.push({x: px + TILE / 4, y: py + TILE / 4, w: TILE / 2, h: TILE / 2, col: false});
            if (ch === 'E') enemies.push({x: px, y: py, w: TILE - 10, h: TILE - 10, dir: -1, speed: 100, type: 'walker'});
            if (ch === 'F') enemies.push({x: px, y: py, w: TILE - 10, h: TILE - 10, dir: 1, speed: 80, type: 'flyer', vy: 0});
            if (ch === 'S') spikes.push({x: px, y: py, w: TILE, h: TILE});
            if (ch === 'G') goalTiles.push({x: px, y: py, w: TILE, h: TILE});
        }
    }
}
spawnEntities();

const player = {
    x: startPos.x,
    y: startPos.y,
    w: 80, // Larger player size
    h: 80,
    vx: 0,
    vy: 0,
    speed: 220, // Faster movement
    jumpVel: 850, // Higher jump
    grounded: false,
    seeds: 0,
    lives: 3,
    alive: true,
    facingRight: true,
    animFrame: 0,
    animTimer: 0
};

const GRAV = 1600; // Slightly higher gravity for more challenge
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; if (['Space', 'ArrowUp'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function isSolidTile(tx, ty) {
    if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return false;
    return level[ty][tx] === '#';
}

function tilesOverlappingRect(x, y, w, h) {
    const left = Math.floor(x / TILE);
    const right = Math.floor((x + w - 1) / TILE);
    const top = Math.floor(y / TILE);
    const bottom = Math.floor((y + h - 1) / TILE);
    const out = [];
    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            if (isSolidTile(tx, ty)) out.push({tx, ty, x: tx * TILE, y: ty * TILE, w: TILE, h: TILE});
        }
    }
    return out;
}

function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

let camX = 0;
let camTargetX = 0;
function updateCamera(dt) {
    camTargetX = player.x - W * 0.4;
    camTargetX = Math.max(0, Math.min(camTargetX, MAP_W * TILE - W));
    camX += (camTargetX - camX) * 10 * dt; // Smooth camera follow
}

function nextLevel() {
    currentLevel++;
    if (currentLevel >= levels.length) {
        alert('Congratulations! You completed all levels! Total seeds: ' + player.seeds);
        currentLevel = 0;
    }
    levelRaw = levels[currentLevel];
    MAP_W = levelRaw[0].length;
    MAP_H = levelRaw.length;
    level = levelRaw.map(r => r.split(''));
    respawn();
}

function respawn() {
    player.x = startPos.x;
    player.y = startPos.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.alive = true;
    spawnEntities();
}

function gameOver() {
    alert('Game Over! Total seeds collected: ' + player.seeds);
    player.seeds = 0;
    player.lives = 3;
    currentLevel = 0;
    respawn();
}

let last = performance.now();

// Sounds (place these files in the same folder or adjust paths)
const jumpSound = new Audio('jump.wav');
const collectSound = new Audio('collect_seed.wav');
const killSound = new Audio('enemy_kill.wav');
const deathSound = new Audio('death.mp3');
const levelCompleteSound = new Audio('level_complete.wav');
const bgMusic = new Audio('background_music.wav');
bgMusic.loop = true;
bgMusic.play();

function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt) {
    if (!player.alive) return;

    let dir = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) {
        dir -= 1;
        player.facingRight = false;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        dir += 1;
        player.facingRight = true;
    }
    player.vx = dir * player.speed;

    if ((keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = -player.jumpVel;
        player.grounded = false;
        jumpSound.play();
    }

    player.vy += GRAV * dt;

    // Horizontal movement and collision
    player.x += player.vx * dt;
    let collTiles = tilesOverlappingRect(player.x, player.y, player.w, player.h);
    if (collTiles.length) {
        for (const t of collTiles) {
            if (player.vx > 0) player.x = t.x - player.w;
            else if (player.vx < 0) player.x = t.x + TILE;
            player.vx = 0;
        }
    }

    // Vertical movement and collision
    player.y += player.vy * dt;
    collTiles = tilesOverlappingRect(player.x, player.y, player.w, player.h);
    player.grounded = false;
    if (collTiles.length) {
        for (const t of collTiles) {
            if (player.vy > 0) {
                player.y = t.y - player.h;
                player.vy = 0;
                player.grounded = true;
            } else if (player.vy < 0) {
                player.y = t.y + TILE;
                player.vy = 0;
            }
        }
    }

    // Fallen off screen
    if (player.y > H + 100) {
        player.alive = false;
        deathSound.play();
        player.lives--;
        if (player.lives <= 0) {
            setTimeout(gameOver, 400);
        } else {
            setTimeout(respawn, 400);
        }
    }

    // Enemies update
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.type === 'walker') {
            e.x += e.speed * dt * e.dir;
            const frontX = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
            const footY = e.y + e.h + 2;
            const tileBelowFront = isSolidTile(Math.floor(frontX / TILE), Math.floor(footY / TILE));
            const collideAhead = tilesOverlappingRect(e.x, e.y, e.w, e.h).length > 0;
            if (!tileBelowFront || collideAhead) e.dir *= -1;
        } else if (e.type === 'flyer') {
            e.x += e.speed * dt * e.dir;
            e.vy = Math.sin(Date.now() / 500) * 100; // Sine wave flying
            e.y += e.vy * dt;
            if (e.x < 0 || e.x + e.w > MAP_W * TILE) e.dir *= -1;
        }

        if (rectsOverlap(player, e)) {
            if (player.vy > 150 && (player.y + player.h - e.y) < 20) {
                enemies.splice(i, 1);
                player.vy = -300;
                killSound.play();
            } else {
                player.alive = false;
                deathSound.play();
                player.lives--;
                if (player.lives <= 0) {
                    setTimeout(gameOver, 400);
                } else {
                    setTimeout(respawn, 400);
                }
            }
        }
    }

    // Spikes
    for (const s of spikes) {
        if (rectsOverlap(player, s)) {
            player.alive = false;
            deathSound.play();
            player.lives--;
            if (player.lives <= 0) {
                setTimeout(gameOver, 400);
            } else {
                setTimeout(respawn, 400);
            }
        }
    }

    // Seeds collection
    for (const s of seeds) {
        if (!s.col && rectsOverlap(player, s)) {
            s.col = true;
            player.seeds += 1;
            collectSound.play();
        }
    }

    // Goal
    for (const g of goalTiles) {
        if (rectsOverlap(player, g)) {
            levelCompleteSound.play();
            setTimeout(() => {
                alert('Level ' + (currentLevel + 1) + ' complete! Seeds collected: ' + player.seeds);
                nextLevel();
            }, 50);
        }
    }

    // Animation timer
    if (Math.abs(player.vx) > 0 && player.grounded) {
        player.animTimer += dt;
        if (player.animTimer > 0.1) {
            player.animFrame = (player.animFrame + 1) % 4; // Assume 4-frame run animation in sprite sheet
            player.animTimer = 0;
        }
    } else {
        player.animFrame = 0;
    }

    updateCamera(dt);
}

function render() {
    ctx.clearRect(0, 0, W, H);
    const startCol = Math.floor(camX / TILE);
    const endCol = Math.min(MAP_W, Math.ceil((camX + W) / TILE));

    // Draw tiles as detailed clouds
    for (let y = 0; y < MAP_H; y++) {
        for (let x = startCol; x < endCol; x++) {
            const ch = level[y][x];
            const sx = x * TILE - camX;
            const sy = y * TILE;
            if (ch === '#') {
                ctx.fillStyle = '#fff'; // Cloud base
                ctx.beginPath();
                ctx.ellipse(sx + TILE / 2, sy + TILE / 2, TILE / 2, TILE / 3, 0, 0, Math.PI * 2);
                ctx.fill();
                // Add fluff
                ctx.beginPath();
                ctx.arc(sx + TILE / 4, sy + TILE / 4, TILE / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(sx + TILE * 3 / 4, sy + TILE / 4, TILE / 4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (ch === 'G') {
                // Goal flag
                ctx.fillStyle = '#333'; // Pole
                ctx.fillRect(sx + TILE / 2 - 4, sy - 40, 8, 40);
                ctx.fillStyle = '#2ecc71'; // Flag
                ctx.beginPath();
                ctx.moveTo(sx + TILE / 2, sy - 35);
                ctx.lineTo(sx + TILE / 2 + 30, sy - 25);
                ctx.lineTo(sx + TILE / 2, sy - 15);
                ctx.fill();
            }
            if (ch === 'S') {
                // Spikes
                ctx.fillStyle = '#f00';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(sx + i * TILE / 3 + 10, sy + TILE);
                    ctx.lineTo(sx + i * TILE / 3 + 20, sy + TILE - 20);
                    ctx.lineTo(sx + i * TILE / 3 + 30, sy + TILE);
                    ctx.fill();
                }
            }
        }
    }

    // Seeds
    for (const s of seeds) {
        if (s.col) continue;
        ctx.fillStyle = '#8b4513'; // Seed color
        ctx.beginPath();
        ctx.ellipse(s.x - camX + s.w / 2, s.y + s.h / 2, 15, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff'; // Highlight
        ctx.beginPath();
        ctx.arc(s.x - camX + s.w / 2 + 5, s.y + s.h / 2 - 5, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Enemies
    for (const e of enemies) {
        ctx.fillStyle = e.type === 'flyer' ? '#ff9900' : '#b33'; // Different colors for types
        ctx.fillRect(e.x - camX, e.y, e.w, e.h);
        ctx.fillStyle = '#fff'; // Eyes
        ctx.fillRect(e.x - camX + (e.dir > 0 ? e.w - 18 : 10), e.y + 10, 8, 8);
    }

    // Player (with flip for direction, assume sprite is facing right)
    ctx.save();
    if (!player.facingRight) {
        ctx.translate(player.x - camX + player.w, player.y);
        ctx.scale(-1, 1);
        ctx.drawImage(playerImg, 0, 0, player.w, player.h); // Adjust if sprite sheet
    } else {
        ctx.drawImage(playerImg, player.x - camX, player.y, player.w, player.h);
    }
    ctx.restore();

    // HUD
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(12, 12, 300, 44);
    ctx.fillStyle = '#000';
    ctx.font = '18px system-ui';
    ctx.fillText('Seeds: ' + player.seeds + ' | Lives: ' + player.lives + ' | Level: ' + (currentLevel + 1), 22, 40);
}

canvas.addEventListener('click', () => canvas.focus());
document.getElementById('restart').addEventListener('click', () => {
    player.seeds = 0;
    player.lives = 3;
    currentLevel = 0;
    respawn();
});

</script>
</body>
</html>
