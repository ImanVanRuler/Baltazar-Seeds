<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baltazar's Run - Epic Grower Adventure</title>
    <style>
        html, body {
            height: 100%; margin: 0;
            background: #0b1220; display: flex;
            align-items: center; justify-content: center;
            font-family: system-ui, Arial, sans-serif; color: #e6eef8;
        }
        #wrap {width: 900px; max-width: 100%; text-align: center;}
        canvas {
            display: block; margin: 8px auto;
            background: url('baltirunbackground.jpg') center/cover no-repeat;
            border-radius: 8px; image-rendering: pixelated;
        }
        .info, .hint {font-size: 14px; opacity: 0.9;}
        .hint {margin-top: 6px; color: #dfeffb;}
        .btn {
            padding: 8px 14px; margin: 4px; font-size: 16px; cursor: pointer;
            border: none; border-radius: 5px; background: #1a73e8; color: #fff;
        }
        .btn:hover {background: #155ab6;}
        a.back-button {padding: 8px 14px; margin: 4px; font-size: 16px; text-decoration: none; background: #777; color: #fff; border-radius: 5px;}
        a.back-button:hover {background: #555;}
        #mute {background: #ff9900;}
        #mute:hover {background: #cc6600;}
        #pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
            color: #fff; font-size: 32px; z-index: 10;
        }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="game" width="900" height="600" tabindex="0"></canvas>
    <div class="info">Controls: ← → to move, ↑ or Space to jump (double-jump possible). P to pause. Click canvas if keys do not respond.</div>
    <div class="hint">Epic Grower Adventure: Collect cannabis seeds, defeat enemies, conquer levels in Baltazar's world!</div>
    <div>
        <a href="seite3.html" class="back-button">Back To Menu</a>
        <button class="btn" id="restart">Restart</button>
        <button class="btn" id="mute">Mute Music</button>
    </div>
</div>
<div id="pause-overlay">Paused - Press P to resume</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CSS_W = 900, CSS_H = 600;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.floor(CSS_W * DPR);
canvas.height = Math.floor(CSS_H * DPR);
canvas.style.width = CSS_W + 'px';
canvas.style.height = CSS_H + 'px';
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const W = CSS_W, H = CSS_H, TILE = 60;

const levels = [
    // Level 1: Beginner (angepasst für mehr Spaß und Balance)
    [
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................................................',
        '...................?.................................................................?.................................................?.........................................',
        '....................................#####..........................................................#####............................#......#..........................',
        '.........................................#####..............................................#####................................#.............#####...............',
        '...............#######.................................................#######.........................#######...............##..............................#######...',
        '.........................................................................................................................................................................................',
        '................................E..............................................................E................................................................G........',
        '#########################################################################################################################################################################'
    ],
    // Level 2: Intermediate (mehr Enemies und Spikes für Challenge)
    [
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................................................',
        '................................?...................................?...................................?...................................?..................................',
        '................#####.................................................#####.................................................#####...............................................',
        '.............................S........E..................................................................................................................................................',
        '..............................................#####.........F.........#####.........E.........#####.........F.........#####.........E.........#####.........S......S...',
        '.......#######...........................................................................................................................................................................',
        '.......................#######.........#######.........#######.........#######.........#######.........#######.........#######.........#######.........#######.........',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ],
    // Level 3: Advanced (mehr fliegende Enemies und Spikes)
    [
        '.........................................................................................................................................................................................',
        '................?..................?..................?..................?..................?..................?..................?..................?...............',
        '.......F..........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........F.....',
        '.........................................................................................................................................................................................',
        '.......E.........................................................................................................................................................E...............',
        '................S..................S..................S..................S..................S..................S..................S..................S...............',
        '.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####..',
        '.........................................................................................................................................................................................',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ],
    // Level 4: Expert (härter, mit mehr Enemies, Spikes und längeren Pfaden)
    [
        '.........................................................................................................................................................................................',
        '................?..................?..................?..................?..................?..................?..................?..................?...............',
        '.......F..........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........F.....',
        '.........................................................................................................................................................................................',
        '.......E..................E..................E..................E..................E..................E..................E..................E..................E.......',
        '................S..................S..................S..................S..................S..................S..................S..................S...............',
        '.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####..',
        '........................................................................................................................................................................',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ],
    // Neues Level 5: Master (noch anspruchsvoller, mit gemischten Enemies)
    [
        '.........................................................................................................................................................................................',
        '................?..................?..................?..................?..................?..................?..................?..................?...............',
        '.......F..........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........#####...........F.....',
        '.......E.........................................................................................................................................................E...............',
        '................S..................S..................S..................S..................S..................S..................S..................S...............',
        '.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####.......#####..',
        '........................................................................................................................................................................',
        '.......F..........E................S..................F..................E..................S..................F..................E..................S...............',
        '.........................................................................................................................................................G.......................',
        '#########################################################################################################################################################################'
    ]
];

let currentLevel = 0;
let levelRaw = levels[currentLevel];
let MAP_W = levelRaw[0].length;
let MAP_H = levelRaw.length;
let level = levelRaw.map(r => r.split(''));

let seeds = [], enemies = [], goalTiles = [], spikes = [];
let startPos = {x: 100, y: H - TILE - 80};

const playerImg = new Image();
playerImg.src = 'baltirun.png';
playerImg.onerror = () => console.error('Player image failed to load');

const enemyAImg = new Image(); // Für Walker (E)
enemyAImg.src = 'enemyA.png';

const enemyBImg = new Image(); // Für Flyer (F)
enemyBImg.src = 'enemyB.png';

const spikeImg = new Image(); // Für Spikes (S)
spikeImg.src = 'spike.png';

function spawnEntities() {
    seeds = [];
    enemies = [];
    goalTiles = [];
    spikes = [];
    for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
            const ch = level[y][x];
            const px = x * TILE, py = y * TILE;
            if (ch === '?') seeds.push({x: px + TILE / 4, y: py + TILE / 4, w: TILE / 2, h: TILE / 2, col: false});
            if (ch === 'E') enemies.push({x: px, y: py, w: TILE, h: TILE, dir: -1, speed: 100 + currentLevel * 20, type: 'walker', vy: 0, spawnTime: Date.now()});
            if (ch === 'F') enemies.push({x: px, y: py, w: TILE, h: TILE, dir: 1, speed: 80 + currentLevel * 10, type: 'flyer', vy: 0, spawnTime: Date.now()});
            if (ch === 'S') spikes.push({x: px, y: py, w: TILE, h: TILE});
            if (ch === 'G') goalTiles.push({x: px, y: py, w: TILE, h: TILE});
        }
    }
}
spawnEntities();

const player = {
    x: startPos.x,
    y: startPos.y,
    w: 80,
    h: 80,
    vx: 0,
    vy: 0,
    speed: 250, // Etwas schneller für besseres Feeling
    jumpVel: 850,
    grounded: false,
    jumps: 0,
    maxJumps: 2,
    seeds: 0,
    lives: 3,
    alive: true,
    facingRight: true
};

const GRAV = 1600;
const keys = {};
let paused = false;
window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if (['Space', 'ArrowUp'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyP') togglePause();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function isSolidTile(tx, ty) {
    if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return false;
    return level[ty][tx] === '#';
}

function tilesOverlappingRect(x, y, w, h) {
    const left = Math.floor(x / TILE);
    const right = Math.floor((x + w - 1) / TILE);
    const top = Math.floor(y / TILE);
    const bottom = Math.floor((y + h - 1) / TILE);
    const out = [];
    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            if (isSolidTile(tx, ty)) out.push({tx, ty, x: tx * TILE, y: ty * TILE, w: TILE, h: TILE});
        }
    }
    return out;
}

function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

let camX = 0;
let camTargetX = 0;
function updateCamera(dt) {
    camTargetX = player.x - W * 0.4;
    camTargetX = Math.max(0, Math.min(camTargetX, MAP_W * TILE - W));
    camX += (camTargetX - camX) * Math.min(10 * dt, 1); // Sanftere Interpolation
}

function nextLevel() {
    currentLevel++;
    if (currentLevel >= levels.length) {
        alert('Congratulations! You completed all levels! Total seeds: ' + player.seeds);
        currentLevel = 0;
    }
    levelRaw = levels[currentLevel];
    MAP_W = levelRaw[0].length;
    MAP_H = levelRaw.length;
    level = levelRaw.map(r => r.split(''));
    respawn();
}

function respawn() {
    player.x = startPos.x;
    player.y = startPos.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.jumps = 0;
    player.alive = true;
    spawnEntities();
}

function gameOver() {
    alert('Game Over! Total seeds collected: ' + player.seeds);
    player.seeds = 0;
    player.lives = 3;
    currentLevel = 0;
    respawn();
}

let last = performance.now();

// Sounds
const jumpSound = new Audio('jump.wav');
const collectSound = new Audio('collect_seed.wav');
const killSound = new Audio('enemy_kill.wav');
const deathSound = new Audio('death.mp3');
const levelCompleteSound = new Audio('level_complete.wav');
const bgMusic = new Audio('background_music.wav');
bgMusic.loop = true;
bgMusic.volume = 0.2;
bgMusic.onerror = () => console.error('Background music failed to load');
let musicPlaying = false;

function startMusic() {
    if (!musicPlaying) {
        bgMusic.play().then(() => musicPlaying = true).catch(err => console.error('Music play failed:', err));
    }
}

document.getElementById('mute').addEventListener('click', () => {
    if (musicPlaying) {
        bgMusic.pause();
        musicPlaying = false;
        document.getElementById('mute').textContent = 'Unmute Music';
    } else {
        bgMusic.play();
        musicPlaying = true;
        document.getElementById('mute').textContent = 'Mute Music';
    }
});

function togglePause() {
    paused = !paused;
    document.getElementById('pause-overlay').style.display = paused ? 'flex' : 'none';
    if (paused) bgMusic.pause(); else { if (musicPlaying) bgMusic.play(); }
}

function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!paused) {
        update(dt);
    }
    render();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener('click', () => {
    canvas.focus();
    startMusic();
});

// Touch-Controls für Mobile (verbessert)
let touchStartX = 0;
let touchJump = false;
canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    const touchY = e.touches[0].clientY;
    if (touchY < canvas.height / 2) touchJump = true; // Obere Hälfte für Jump
    startMusic();
});
canvas.addEventListener('touchmove', e => {
    const touchX = e.touches[0].clientX;
    keys['ArrowRight'] = (touchX - touchStartX > 50);
    keys['ArrowLeft'] = (touchStartX - touchX > 50);
});
canvas.addEventListener('touchend', () => {
    keys['ArrowRight'] = false;
    keys['ArrowLeft'] = false;
    if (touchJump && player.jumps < player.maxJumps) {
        player.vy = -player.jumpVel;
        player.jumps++;
        player.grounded = false;
        jumpSound.play();
    }
    touchJump = false;
});

function update(dt) {
    if (!player.alive || paused) return;

    let dir = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) {
        dir -= 1;
        player.facingRight = false;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        dir += 1;
        player.facingRight = true;
    }
    player.vx = dir * player.speed;

    if ((keys['Space'] || keys['ArrowUp']) && player.jumps < player.maxJumps) {
        player.vy = -player.jumpVel;
        player.jumps++;
        player.grounded = false;
        jumpSound.play();
        keys['Space'] = false; // Verhindert Dauer-Jump
        keys['ArrowUp'] = false;
    }

    player.vy += GRAV * dt;

    // Horizontal (verbessert: Mehrere Kollisionen handhaben)
    player.x += player.vx * dt;
    let collTiles = tilesOverlappingRect(player.x, player.y, player.w, player.h);
    for (const t of collTiles) {
        if (player.vx > 0) player.x = t.x - player.w;
        else if (player.vx < 0) player.x = t.x + TILE;
    }
    if (collTiles.length) player.vx = 0;

    // Vertical (verbessert: Mehrere Kollisionen)
    player.y += player.vy * dt;
    collTiles = tilesOverlappingRect(player.x, player.y, player.w, player.h);
    player.grounded = false;
    for (const t of collTiles) {
        if (player.vy > 0) {
            player.y = t.y - player.h;
            player.vy = 0;
            player.grounded = true;
            player.jumps = 0;
        } else if (player.vy < 0) {
            player.y = t.y + TILE;
            player.vy = 0;
        }
    }

    if (player.y > H + 100) {
        player.alive = false;
        deathSound.play();
        player.lives--;
        if (player.lives <= 0) setTimeout(gameOver, 400);
        else setTimeout(respawn, 400);
    }

    // Enemies (verbessert: Bessere AI für Flyer, Kollisionen)
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.type === 'walker') {
            e.x += e.speed * dt * e.dir;
            const frontX = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
            const footY = e.y + e.h + 2;
            const frontTileX = Math.floor(frontX / TILE);
            const footTileY = Math.floor(footY / TILE);
            if (!isSolidTile(frontTileX, footTileY) || tilesOverlappingRect(e.x, e.y, e.w, e.h).length > 0) {
                e.dir *= -1;
            }
        } else if (e.type === 'flyer') {
            e.x += e.speed * dt * e.dir;
            const time = (Date.now() - e.spawnTime) / 500;
            e.vy = Math.sin(time) * 150; // Höhere Amplitude für mehr Bewegung
            e.y += e.vy * dt;
            if (e.x < 0 || e.x + e.w > MAP_W * TILE) e.dir *= -1;
            if (e.y < 0 || e.y + e.h > H) e.vy *= -1; // Verhindert Aus-dem-Bild-Fliegen
        }

        if (rectsOverlap(player, e)) {
            if (player.vy > 150 && player.y + player.h < e.y + 20) { // Genaueres Stomp-Check
                enemies.splice(i, 1);
                player.vy = -300;
                killSound.play();
            } else {
                player.alive = false;
                deathSound.play();
                player.lives--;
                if (player.lives <= 0) setTimeout(gameOver, 400);
                else setTimeout(respawn, 400);
            }
        }
    }

    // Spikes
    for (const s of spikes) {
        if (rectsOverlap(player, s)) {
            player.alive = false;
            deathSound.play();
            player.lives--;
            if (player.lives <= 0) setTimeout(gameOver, 400);
            else setTimeout(respawn, 400);
        }
    }

    // Seeds
    for (let i = seeds.length - 1; i >= 0; i--) {
        const s = seeds[i];
        if (!s.col && rectsOverlap(player, s)) {
            s.col = true;
            player.seeds += 1;
            collectSound.play();
        }
    }

    // Goal
    for (const g of goalTiles) {
        if (rectsOverlap(player, g)) {
            levelCompleteSound.play();
            setTimeout(() => {
                alert('Level ' + (currentLevel + 1) + ' complete! Seeds collected: ' + player.seeds);
                nextLevel();
            }, 50);
        }
    }

    updateCamera(dt);
}

function render() {
    ctx.clearRect(0, 0, W, H);
    const startCol = Math.floor(camX / TILE);
    const endCol = Math.min(MAP_W, Math.ceil((camX + W) / TILE));

    // Tiles (verbessert: Schönere Darstellung)
    for (let y = 0; y < MAP_H; y++) {
        for (let x = startCol; x < endCol; x++) {
            const ch = level[y][x];
            const sx = x * TILE - camX;
            const sy = y * TILE;
            if (ch === '#') {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(sx + TILE / 2, sy + TILE / 2, TILE / 2, TILE / 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(sx + TILE / 4, sy + TILE / 4, TILE / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(sx + TILE * 3 / 4, sy + TILE / 4, TILE / 4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (ch === 'G') {
                ctx.fillStyle = '#333';
                ctx.fillRect(sx + TILE / 2 - 4, sy - 40, 8, 40);
                ctx.fillStyle = '#2ecc71';
                ctx.beginPath();
                ctx.moveTo(sx + TILE / 2, sy - 35);
                ctx.lineTo(sx + TILE / 2 + 30, sy - 25);
                ctx.lineTo(sx + TILE / 2, sy - 15);
                ctx.fill();
            }
        }
    }

    // Spikes (nun mit Bild)
    for (const s of spikes) {
        const sx = s.x - camX;
        const sy = s.y;
        ctx.drawImage(spikeImg, sx, sy, s.w, s.h);
    }

    // Seeds (verbessert: Etwas animiert)
    for (const s of seeds) {
        if (s.col) continue;
        const sx = s.x - camX + s.w / 2;
        const sy = s.y + s.h / 2 + Math.sin(Date.now() / 200) * 2; // Leichte Schwebung
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 15, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx + 5, sy - 5, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Enemies (nun mit Bildern und Flip für Richtung)
    for (const e of enemies) {
        const sx = e.x - camX;
        const sy = e.y;
        ctx.save();
        if (e.dir < 0) {
            ctx.translate(sx + e.w, sy);
            ctx.scale(-1, 1);
            if (e.type === 'walker') {
                ctx.drawImage(enemyAImg, 0, 0, e.w, e.h);
            } else if (e.type === 'flyer') {
                ctx.drawImage(enemyBImg, 0, 0, e.w, e.h);
            }
        } else {
            if (e.type === 'walker') {
                ctx.drawImage(enemyAImg, sx, sy, e.w, e.h);
            } else if (e.type === 'flyer') {
                ctx.drawImage(enemyBImg, sx, sy, e.w, e.h);
            }
        }
        ctx.restore();
    }

    // Player (Fehler behoben: Immer mit w/h zeichnen)
    ctx.save();
    if (!player.facingRight) {
        ctx.translate(player.x - camX + player.w, player.y);
        ctx.scale(-1, 1);
        ctx.drawImage(playerImg, 0, 0, player.w, player.h);
    } else {
        ctx.drawImage(playerImg, player.x - camX, player.y, player.w, player.h);
    }
    ctx.restore();

    // HUD (verbessert: Transparenter, mehr Infos)
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(12, 12, 350, 44);
    ctx.fillStyle = '#000';
    ctx.font = '18px system-ui';
    const totalSeeds = seeds.length;
    const collected = player.seeds;
    ctx.fillText('Seeds: ' + collected + '/' + totalSeeds + ' | Lives: ' + player.lives + ' | Level: ' + (currentLevel + 1), 22, 40);
}

document.getElementById('restart').addEventListener('click', () => {
    player.seeds = 0;
    player.lives = 3;
    currentLevel = 0;
    respawn();
});
</script>
</body>
</html>
