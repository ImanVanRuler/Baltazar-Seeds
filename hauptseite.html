<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baltazar Seeds</title>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --red: #ff3333;
      --dark: rgba(0, 0, 0, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      background: #000;
      overflow: hidden;
    }

    .video-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.65) contrast(1.1);
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    h1 {
      font-family: 'Nosifer', cursive;
      font-size: clamp(3.5rem, 10vw, 7rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
      -webkit-text-stroke: 2px var(--red);
      text-shadow: 
        0 0 20px var(--red),
        0 0 40px var(--red),
        0 0 60px rgba(255, 50, 50, 0.6);
      margin-bottom: 1.5rem;
      animation: subtleFloat 6s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.25rem;
      max-width: 620px;
      line-height: 1.7;
      margin-bottom: 2rem;
      opacity: 0.95;
    }

    .age-notice {
      background: var(--dark);
      border: 1px solid var(--red);
      border-radius: 12px;
      padding: 1.75rem 2rem;
      max-width: 520px;
      margin: 2rem 0;
      font-size: 1.05rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.8rem;
      font-size: 1.3rem;
      font-weight: 500;
      color: #fff;
      background: transparent;
      border: 2px solid var(--red);
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.4s ease;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--red);
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(255, 51, 51, 0.6);
    }

    /* Leichter psychedelic Glow */
    @keyframes subtleFloat {
      from { transform: translateY(0) rotate(-1deg); }
      to   { transform: translateY(-12px) rotate(1deg); }
    }

    /* Schöner Fade-In */
    .loaded .content {
      opacity: 1;
    }

    /* Für reduzierte Animationen */
    @media (prefers-reduced-motion: reduce) {
      h1, .btn { animation: none !important; }
    }
  </style>
</head>
<body>

  <!-- Hintergrundvideo (komprimiert empfohlen) -->
  <video class="video-bg" autoplay muted loop playsinline preload="metadata">
    <source src="INTRO.mp4" type="video/mp4">
    Dein Browser unterstützt kein Video.
  </video>

  <div class="content" id="content">
    <h1>Baltazar</h1>
    
    <div class="age-notice">
      <p><strong>Real Genetics. Real Passion.</strong></p>
      <p>By entering this site you confirm that you are 21 years or older and understand that this website is intended for cannabis growers and breeders.</p>
    </div>

    <a href="seite3.html" class="btn" id="enterBtn">I AM 21+ — LET ME IN</a>
  </div>

  <script>
    // Einfacher Fade-In beim Laden
    window.addEventListener('load', () => {
      document.documentElement.classList.add('loaded');
    });

    // Fade-Out beim Klick
    document.getElementById('enterBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const content = document.getElementById('content');
      content.style.transition = 'opacity 1s ease';
      content.style.opacity = '0';
      
      setTimeout(() => {
        window.location.href = this.href;
      }, 900);
    });
  </script>
</body>
</html>
