/* ============ INTERSECTION OBSERVER HOOK ============ */
function useInView(options = {}) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.1, ...options });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

/* ============ PARTICLE FIELD ============ */
function ParticleField({ reducedMotion }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (reducedMotion) return;
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    let w, h, particles, animId;
    function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
    resize();
    window.addEventListener("resize", resize);
    particles = Array.from({ length: 40 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      r: Math.random() * 1.2 + 0.3,
    }));
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(140,106,77,0.3)";
        ctx.fill();
      }
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 160) {
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(140,106,77,${0.06 * (1 - d / 160)})`;
            ctx.lineWidth = 0.5; ctx.stroke();
          }
        }
      }
      animId = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, [reducedMotion]);
  if (reducedMotion) return null;
  return <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none opacity-40" />;
}

  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [leftRef,  leftVisible]   = useInView();
  const [rightRef, rightVisible]  = useInView();

  const progress = Math.min(step / 4, 1);
  const progressLabel = progress < 0.25 ? "Dormant" : progress < 0.5 ? "Germinating" : progress < 0.75 ? "Sprouting" : progress < 1 ? "Growing" : "Blooming";

  function selectOption(option) {
    setAnswers((prev) => ({ ...prev, [step]: option }));
    setStep((s) => s + 1);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setSubmitting(true);
    try {
      const res = await fetch("https://formspree.io/f/mwvdyaly", {
        method: "POST",
        body: JSON.stringify({ email, cultivator_type: answers[1], grow_medium: answers[2], _subject: "New Baltazar Seeds Inner Circle Request" }),
        headers: { Accept: "application/json", "Content-Type": "application/json" },
      });
      if (res.ok) { setSubmitted(true); setStep(4); }
    } catch (err) { /* silent */ }
    setSubmitting(false);
  }

  return (
    <section className="relative py-32 md:py-44">
      <div className="absolute top-0 left-8 right-8 md:left-16 md:right-16 h-px" style={{background:"rgba(15,26,18,0.06)"}}></div>
      <div className="px-8 md:px-16">
        <div className="flex items-center gap-6 mb-20">
          <div className="w-12 h-px" style={{background:"rgba(140,106,77,0.4)"}}></div>
          <span className="font-mono text-[10px] tracking-[0.5em] uppercase" style={{color:"#8C6A4D"}}>The Inner Circle</span>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-16">
          {/* Left column */}
          <div
            ref={leftRef}
            className="lg:col-span-5"
            style={{
              opacity: leftVisible ? 1 : 0,
              transform: leftVisible ? "translateY(0)" : "translateY(20px)",
              transition: "opacity 1s ease 0.2s, transform 1s ease 0.2s",
            }}
          >
            <h2 className="font-display font-light text-4xl md:text-6xl tracking-[-0.02em] mb-8" style={{color:"#0F1A12",lineHeight:"1.05"}}>
              Request<br />
              <span className="italic" style={{color:"rgba(140,106,77,0.7)"}}>early access.</span>
            </h2>
            <p className="font-body text-[15px] leading-[1.7] font-light max-w-md mb-10" style={{color:"rgba(15,26,18,0.4)"}}>
              The doors open soon. Tell us a little about yourself — we curate access for those who share our reverence for the craft.
            </p>

            {/* Progress bar */}
            <div className="flex items-center gap-4">
              <div className="flex-1 h-px relative" style={{background:"rgba(15,26,18,0.06)"}}>
                <div className="absolute top-0 left-0 h-full progress-bar" style={{width:`${progress * 100}%`, background:"rgba(140,106,77,0.5)"}} />
              </div>
              <span className="font-mono text-[9px] tracking-[0.3em]" style={{color:"rgba(15,26,18,0.25)"}}>{Math.round(progress * 100)}%</span>
            </div>

            {/* Bar chart */}
            <div className="mt-8 flex items-end gap-1">
              {[0.25, 0.5, 0.75, 1].map((threshold, i) => (
                <div key={i} className="w-1 rounded-full bar-item" style={{
                  height: progress >= threshold ? `${20 + i * 14}px` : "4px",
                  backgroundColor: progress >= threshold ? "rgba(140,106,77,0.4)" : "rgba(15,26,18,0.06)",
                }} />
              ))}
              <span className="font-mono text-[8px] tracking-[0.3em] ml-3" style={{color:"rgba(15,26,18,0.2)",marginBottom:"2px"}}>{progressLabel}</span>
            </div>
          </div>

          {/* Right column — form panel */}
          <div
            ref={rightRef}
            className="lg:col-span-6 lg:col-start-7"
            style={{
              opacity: rightVisible ? 1 : 0,
              transform: rightVisible ? "translateY(0)" : "translateY(20px)",
              transition: "opacity 1s ease 0.4s, transform 1s ease 0.4s",
            }}
          >
            <div className="border min-h-[400px] flex items-center justify-center p-8 md:p-12" style={{borderColor:"rgba(15,26,18,0.06)",background:"rgba(255,255,255,0.6)"}}>
              {/* Step 0 */}
              {step === 0 && (
                <div className="text-center w-full">
                  <div className="font-mono text-[9px] tracking-[0.5em] uppercase mb-8" style={{color:"rgba(15,26,18,0.25)"}}>Begin Application</div>
                  <p className="font-display text-2xl font-light mb-10 italic" style={{color:"#0F1A12"}}>"To cultivate is to understand patience."</p>
                  <button onClick={() => setStep(1)} className="font-mono text-[11px] tracking-[0.3em] uppercase border px-10 py-4" style={{color:"#8C6A4D",borderColor:"rgba(140,106,77,0.3)",transition:"background 0.3s,color 0.3s"}}
                    onMouseEnter={e => { e.target.style.background="#8C6A4D"; e.target.style.color="#F9F8F6"; }}
                    onMouseLeave={e => { e.target.style.background=""; e.target.style.color="#8C6A4D"; }}>
                    Begin
                  </button>
                </div>
              )}

              {/* Steps 1–2 */}
              {(step === 1 || step === 2) && (
                <div className="text-center w-full">
                  <div className="font-mono text-[9px] tracking-[0.5em] uppercase mb-3" style={{color:"rgba(15,26,18,0.25)"}}>Step {step} of 3</div>
                  <h3 className="font-display text-2xl md:text-3xl font-light mb-10" style={{color:"#0F1A12"}}>{FORM_STEPS[step - 1].question}</h3>
                  <div className="flex flex-wrap justify-center gap-3">
                    {FORM_STEPS[step - 1].options.map((opt) => (
                      <button key={opt} onClick={() => selectOption(opt)}
                        className="font-mono text-[10px] tracking-[0.2em] uppercase border px-6 py-3"
                        style={{color:"rgba(15,26,18,0.5)",borderColor:"rgba(15,26,18,0.08)",transition:"border-color 0.3s,color 0.3s"}}
                        onMouseEnter={e => { e.currentTarget.style.borderColor="#8C6A4D"; e.currentTarget.style.color="#8C6A4D"; }}
                        onMouseLeave={e => { e.currentTarget.style.borderColor="rgba(15,26,18,0.08)"; e.currentTarget.style.color="rgba(15,26,18,0.5)"; }}>
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Step 3 — email */}
              {step === 3 && !submitted && (
                <div className="text-center w-full">
                  <div className="font-mono text-[9px] tracking-[0.5em] uppercase mb-3" style={{color:"rgba(15,26,18,0.25)"}}>Step 3 of 3</div>
                  <h3 className="font-display text-2xl md:text-3xl font-light mb-10" style={{color:"#0F1A12"}}>Where shall we reach you?</h3>
                  <form onSubmit={handleSubmit} className="max-w-sm mx-auto">
                    <div className="border flex" style={{borderColor:"rgba(15,26,18,0.08)"}}>
                      <input
                        type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                        placeholder="your@email.com" required
                        className="flex-1 bg-transparent px-5 py-4 font-body text-sm outline-none"
                        style={{color:"#0F1A12"}}
                      />
                      <button type="submit" disabled={submitting}
                        className="border-l px-6 font-mono text-[10px] tracking-[0.25em] uppercase"
                        style={{borderColor:"rgba(15,26,18,0.08)",color:"#8C6A4D",transition:"background 0.3s,color 0.3s",opacity: submitting ? 0.4 : 1}}
                        onMouseEnter={e => { e.currentTarget.style.background="#8C6A4D"; e.currentTarget.style.color="#F9F8F6"; }}
                        onMouseLeave={e => { e.currentTarget.style.background=""; e.currentTarget.style.color="#8C6A4D"; }}>
                        {submitting ? "..." : "Join"}
                      </button>
                    </div>
                    <p className="font-mono text-[9px] tracking-[0.2em] mt-4" style={{color:"rgba(15,26,18,0.2)"}}>
                      Free · No spam · <span style={{color:"rgba(140,106,77,0.5)"}}>Just the launch signal</span>
                    </p>
                  </form>
                </div>
              )}

              {/* Step 4 — confirmed */}
              {step === 4 && (
                <div className="text-center w-full">
                  <div className="w-16 h-16 mx-auto mb-8 rounded-full border flex items-center justify-center" style={{borderColor:"rgba(140,106,77,0.3)"}}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C6A4D" strokeWidth="1.5">
                      <path d="M12 2c-3 4-3 8 0 12 3-4 3-8 0-12z" />
                      <path d="M12 14c-4 0-8 2-10 6 4 0 8-2 10-6z" />
                      <path d="M12 14c4 0 8 2 10 6-4 0-8-2-10-6z" />
                    </svg>
                  </div>
                  <h3 className="font-display text-2xl font-light mb-3 italic" style={{color:"#0F1A12"}}>You're on the list.</h3>
                  <p className="font-mono text-[10px] tracking-[0.3em] uppercase" style={{color:"rgba(140,106,77,0.6)"}}>✦ The doors open soon</p>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============ FOOTER ============ */
function FooterSection({ reducedMotion, onToggleMotion }) {
  const [ref, visible] = useInView();
  return (
    <footer className="relative py-16 md:py-24 px-8 md:px-16">
      <div className="absolute top-0 left-8 right-8 md:left-16 md:right-16 h-px" style={{background:"rgba(15,26,18,0.06)"}}></div>
      <div
        ref={ref}
        className="grid grid-cols-1 md:grid-cols-12 gap-12"
        style={{opacity: visible ? 1 : 0, transition:"opacity 1s ease"}}
      >
        <div className="md:col-span-4">
          <div className="flex items-center gap-3 mb-5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C6A4D" strokeWidth="1.2">
              <path d="M12 2c-3 4-3 8 0 12 3-4 3-8 0-12z" />
              <path d="M12 14c-4 0-8 2-10 6 4 0 8-2 10-6z" />
              <path d="M12 14c4 0 8 2 10 6-4 0-8-2-10-6z" />
            </svg>
            <span className="font-mono text-[10px] tracking-[0.3em] uppercase" style={{color:"rgba(15,26,18,0.5)"}}>Baltazar Seeds</span>
          </div>
          <p className="font-body text-[13px] leading-[1.7] font-light max-w-xs" style={{color:"rgba(15,26,18,0.3)"}}>
            A curated genetics library, meticulously bred. Reserved for those who appreciate the craft.
          </p>
        </div>
        <div className="md:col-span-3 md:col-start-6">
          <div className="font-mono text-[9px] tracking-[0.4em] uppercase mb-4" style={{color:"rgba(15,26,18,0.2)"}}>Coordinates</div>
          <div className="space-y-2 font-mono text-[11px] tracking-[0.1em]" style={{color:"rgba(15,26,18,0.35)"}}>
            <div>48°12′30″N</div>
            <div>16°22′15″E</div>
            <div className="pt-2 text-[9px] tracking-[0.3em] uppercase" style={{color:"rgba(15,26,18,0.2)"}}>Handcrafted Genetics</div>
          </div>
        </div>
        <div className="md:col-span-3 md:col-start-10">
          <div className="font-mono text-[9px] tracking-[0.4em] uppercase mb-4" style={{color:"rgba(15,26,18,0.2)"}}>Accessibility</div>
          <button onClick={onToggleMotion} className="font-mono text-[10px] tracking-[0.15em] text-left"
            style={{color:"rgba(15,26,18,0.4)",transition:"color 0.3s"}}
            onMouseEnter={e => e.currentTarget.style.color="#8C6A4D"}
            onMouseLeave={e => e.currentTarget.style.color="rgba(15,26,18,0.4)"}
            aria-label={reducedMotion ? "Enable motion effects" : "Reduce motion effects"}>
            {reducedMotion ? "◯ Enable Motion" : "● Reduce Motion"}
          </button>
        </div>
      </div>
      <div className="mt-16 pt-8 border-t flex flex-col md:flex-row justify-between items-center gap-4" style={{borderColor:"rgba(15,26,18,0.04)"}}>
        <span className="font-mono text-[9px] tracking-[0.3em] uppercase" style={{color:"rgba(15,26,18,0.15)"}}>© 2026 Baltazar Seeds · All Rights Reserved</span>
        <div className="flex items-center gap-8">
          {["Privacy","Terms"].map(label => (
            <a key={label} href={`https://baltazarseeds.com/${label.toLowerCase()}`} target="_blank" rel="noopener noreferrer"
              className="font-mono text-[9px] tracking-[0.25em] uppercase"
              style={{color:"rgba(15,26,18,0.2)",transition:"color 0.3s"}}
              onMouseEnter={e => e.currentTarget.style.color="#8C6A4D"}
              onMouseLeave={e => e.currentTarget.style.color="rgba(15,26,18,0.2)"}>
              {label}
            </a>
          ))}
        </div>
      </div>
    </footer>
  );
}

/* ============ APP ============ */
function App() {
  const [reducedMotion, setReducedMotion] = useState(false);
  return (
    <div className="relative min-h-screen overflow-x-hidden" style={{background:"#F9F8F6",color:"#0F1A12"}}>
      {/* Ambient gradient */}
      <div className="fixed inset-0 pointer-events-none z-0">
        <div className="absolute" style={{
          inset:"-10%",
          background:`radial-gradient(800px 600px at 15% 20%, rgba(140,106,77,0.04), transparent 60%),
                      radial-gradient(600px 500px at 85% 80%, rgba(74,107,58,0.03), transparent 60%)`,
        }} />
      </div>
      {/* Grain overlay */}
      <div className="fixed inset-0 pointer-events-none z-[2]" style={{
        opacity:0.035, mixBlendMode:"overlay",
        backgroundImage:`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>")`,
      }} />
      <ParticleField reducedMotion={reducedMotion} />
      {/* Corner frame */}
      <div className="fixed pointer-events-none z-[3]" style={{inset:"24px",border:"1px solid rgba(15,26,18,0.04)"}}>
        <div className="absolute" style={{top:"-1px",left:"-1px",width:"20px",height:"20px",borderLeft:"1px solid rgba(140,106,77,0.25)",borderTop:"1px solid rgba(140,106,77,0.25)"}}></div>
        <div className="absolute" style={{top:"-1px",right:"-1px",width:"20px",height:"20px",borderRight:"1px solid rgba(140,106,77,0.25)",borderTop:"1px solid rgba(140,106,77,0.25)"}}></div>
        <div className="absolute" style={{bottom:"-1px",left:"-1px",width:"20px",height:"20px",borderLeft:"1px solid rgba(140,106,77,0.25)",borderBottom:"1px solid rgba(140,106,77,0.25)"}}></div>
        <div className="absolute" style={{bottom:"-1px",right:"-1px",width:"20px",height:"20px",borderRight:"1px solid rgba(140,106,77,0.25)",borderBottom:"1px solid rgba(140,106,77,0.25)"}}></div>
      </div>
      <main className="relative z-[5]">
        <HeroSection />
        <GeneticsArchive />
        <ProcessSection />
        <InnerCircle />
        <FooterSection reducedMotion={reducedMotion} onToggleMotion={() => setReducedMotion(v => !v)} />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
