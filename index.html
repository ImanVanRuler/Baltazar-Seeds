/* ============ PARTICLE FIELD ============ */
function ParticleField({ reducedMotion }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (reducedMotion) return;
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    let w, h, particles, animId;
    function resize() {
      w = c.width = window.innerWidth;
      h = c.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);
    particles = Array.from({ length: 40 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      r: Math.random() * 1.2 + 0.3,
    }));
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(140,106,77,0.3)";
        ctx.fill();
      }
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 160) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(140,106,77,${0.06 * (1 - d / 160)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      animId = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, [reducedMotion]);
  if (reducedMotion) return null;
  return <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none opacity-40" />;
}

            className="lg:col-span-5"
          >
            <h2 className="font-display font-light text-4xl md:text-5xl lg:text-6xl text-obsidian-moss tracking-[-0.02em] leading-[1.05] mb-8">
              Request<br />
              <span className="italic text-copper/70">early access.</span>
            </h2>
            <p className="font-body text-[15px] leading-[1.7] text-obsidian-moss/40 font-light max-w-md mb-10">
              The doors open soon. Tell us a little about yourself —
              we curate access for those who share our reverence for the craft.
            </p>
            <div className="flex items-center gap-4">
              <div className="flex-1 h-px bg-obsidian-moss/[0.06] relative">
                <motion.div
                  className="absolute top-0 left-0 h-full bg-copper/50"
                  animate={{ width: `${progress * 100}%` }}
                  transition={{ duration: 0.6, ease: [0.16, 1, 0.3, 1] }}
                />
              </div>
              <span className="font-mono text-[9px] tracking-[0.3em] text-obsidian-moss/25">
                {Math.round(progress * 100)}%
              </span>
            </div>
            <div className="mt-8 flex items-end gap-1">
              {[0.25, 0.5, 0.75, 1].map((threshold, i) => (
                <motion.div
                  key={i}
                  className="w-1 rounded-full"
                  animate={{
                    height: progress >= threshold ? `${20 + i * 14}px` : "4px",
                    backgroundColor: progress >= threshold
                      ? "rgba(140,106,77,0.4)"
                      : "rgba(15,26,18,0.06)",
                  }}
                  transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
                />
              ))}
              <span className="font-mono text-[8px] tracking-[0.3em] text-obsidian-moss/20 ml-3 mb-0.5">
                {progress < 0.25 && "Dormant"}
                {progress >= 0.25 && progress < 0.5 && "Germinating"}
                {progress >= 0.5 && progress < 0.75 && "Sprouting"}
                {progress >= 0.75 && progress < 1 && "Growing"}
                {progress >= 1 && "Blooming"}
              </span>
            </div>
          </motion.div>

          <motion.div
            initial={{ opacity: 0, y: 20 }}
            whileInView={{ opacity: 1, y: 0 }}
            transition={{ duration: 1, delay: 0.4 }}
            viewport={{ once: true }}
            className="lg:col-span-6 lg:col-start-7"
          >
            <div className="border border-obsidian-moss/[0.06] bg-white/60 backdrop-blur-sm min-h-[400px] flex items-center justify-center p-8 md:p-12">
              <AnimatePresence mode="wait">
                {step === 0 && (
                  <motion.div
                    key="start"
                    initial={{ opacity: 0, y: 15 }}
                    animate={{ opacity: 1, y: 0 }}
                    exit={{ opacity: 0, y: -15 }}
                    transition={{ duration: 0.5 }}
                    className="text-center w-full"
                  >
                    <div className="font-mono text-[9px] tracking-[0.5em] uppercase text-obsidian-moss/25 mb-8">
                      Begin Application
                    </div>
                    <p className="font-display text-2xl font-light text-obsidian-moss mb-10 italic">
                      "To cultivate is to understand patience."
                    </p>
                    <button
                      onClick={() => setStep(1)}
                      className="font-mono text-[11px] tracking-[0.3em] uppercase text-copper border border-copper/30 px-10 py-4 hover:bg-copper hover:text-alabaster transition-all duration-300"
                    >
                      Begin
                    </button>
                  </motion.div>
                )}

                {(step === 1 || step === 2) && (
                  <motion.div
                    key={`step-${step}`}
                    initial={{ opacity: 0, y: 15 }}
                    animate={{ opacity: 1, y: 0 }}
                    exit={{ opacity: 0, y: -15 }}
                    transition={{ duration: 0.5 }}
                    className="text-center w-full"
                  >
                    <div className="font-mono text-[9px] tracking-[0.5em] uppercase text-obsidian-moss/25 mb-3">
                      Step {step} of 3
                    </div>
                    <h3 className="font-display text-2xl md:text-3xl font-light text-obsidian-moss mb-10">
                      {STEPS[step - 1].question}
                    </h3>
                    <div className="flex flex-wrap justify-center gap-3">
                      {STEPS[step - 1].options.map((opt) => (
                        <button
                          key={opt}
                          onClick={() => selectOption(opt)}
                          className="font-mono text-[10px] tracking-[0.2em] uppercase text-obsidian-moss/50 border border-obsidian-moss/[0.08] px-6 py-3 hover:border-copper hover:text-copper transition-all duration-300"
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </motion.div>
                )}

                {step === 3 && !submitted && (
                  <motion.div
                    key="email"
                    initial={{ opacity: 0, y: 15 }}
                    animate={{ opacity: 1, y: 0 }}
                    exit={{ opacity: 0, y: -15 }}
                    transition={{ duration: 0.5 }}
                    className="text-center w-full"
                  >
                    <div className="font-mono text-[9px] tracking-[0.5em] uppercase text-obsidian-moss/25 mb-3">
                      Step 3 of 3
                    </div>
                    <h3 className="font-display text-2xl md:text-3xl font-light text-obsidian-moss mb-10">
                      Where shall we reach you?
                    </h3>
                    <form onSubmit={handleSubmit} className="max-w-sm mx-auto">
                      <div className="border border-obsidian-moss/[0.08] flex">
                        <input
                          type="email"
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}
                          placeholder="your@email.com"
                          required
                          className="flex-1 bg-transparent px-5 py-4 font-body text-sm text-obsidian-moss placeholder:text-obsidian-moss/20 placeholder:font-mono placeholder:text-[11px] placeholder:tracking-[0.2em] placeholder:uppercase outline-none"
                        />
                        <button
                          type="submit"
                          disabled={submitting}
                          className="border-l border-obsidian-moss/[0.08] px-6 font-mono text-[10px] tracking-[0.25em] uppercase text-copper hover:bg-copper hover:text-alabaster transition-all duration-300 disabled:opacity-40"
                        >
                          {submitting ? "..." : "Join"}
                        </button>
                      </div>
                      <p className="font-mono text-[9px] tracking-[0.2em] text-obsidian-moss/20 mt-4">
                        Free · No spam · <span className="text-copper/50">Just the launch signal</span>
                      </p>
                    </form>
                  </motion.div>
                )}

                {step === 4 && (
                  <motion.div
                    key="done"
                    initial={{ opacity: 0, scale: 0.95 }}
                    animate={{ opacity: 1, scale: 1 }}
                    transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
                    className="text-center w-full"
                  >
                    <div className="w-16 h-16 mx-auto mb-8 border border-copper/30 rounded-full flex items-center justify-center">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C6A4D" strokeWidth="1.5">
                        <path d="M12 2c-3 4-3 8 0 12 3-4 3-8 0-12z" />
                        <path d="M12 14c-4 0-8 2-10 6 4 0 8-2 10-6z" />
                        <path d="M12 14c4 0 8 2 10 6-4 0-8-2-10-6z" />
                      </svg>
                    </div>
                    <h3 className="font-display text-2xl font-light text-obsidian-moss mb-3 italic">
                      You're on the list.
                    </h3>
                    <p className="font-mono text-[10px] tracking-[0.3em] uppercase text-copper/60">
                      ✦ The doors open soon
                    </p>
                  </motion.div>
                )}
              </AnimatePresence>
            </div>
          </motion.div>
        </div>
      </div>
    </section>
  );
}

/* ============ FOOTER ============ */
function FooterSection({ reducedMotion, onToggleMotion }) {
  return (
    <footer className="relative py-16 md:py-24 px-8 md:px-16">
      <div className="absolute top-0 left-8 right-8 md:left-16 md:right-16 h-px bg-obsidian-moss/[0.06]"></div>
      <motion.div
        initial={{ opacity: 0 }}
        whileInView={{ opacity: 1 }}
        transition={{ duration: 1 }}
        viewport={{ once: true }}
        className="grid grid-cols-1 md:grid-cols-12 gap-12"
      >
        <div className="md:col-span-4">
          <div className="flex items-center gap-3 mb-5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C6A4D" strokeWidth="1.2">
              <path d="M12 2c-3 4-3 8 0 12 3-4 3-8 0-12z" />
              <path d="M12 14c-4 0-8 2-10 6 4 0 8-2 10-6z" />
              <path d="M12 14c4 0 8 2 10 6-4 0-8-2-10-6z" />
            </svg>
            <span className="font-mono text-[10px] tracking-[0.3em] uppercase text-obsidian-moss/50">
              Baltazar Seeds
            </span>
          </div>
          <p className="font-body text-[13px] leading-[1.7] text-obsidian-moss/30 font-light max-w-xs">
            A curated genetics library, meticulously bred.
            Reserved for those who appreciate the craft.
          </p>
        </div>
        <div className="md:col-span-3 md:col-start-6">
          <div className="font-mono text-[9px] tracking-[0.4em] uppercase text-obsidian-moss/20 mb-4">
            Coordinates
          </div>
          <div className="space-y-2 font-mono text-[11px] tracking-[0.1em] text-obsidian-moss/35">
            <div>48°12′30″N</div>
            <div>16°22′15″E</div>
            <div className="pt-2 text-[9px] tracking-[0.3em] uppercase text-obsidian-moss/20">
              Handcrafted Genetics
            </div>
          </div>
        </div>
        <div className="md:col-span-3 md:col-start-10">
          <div className="font-mono text-[9px] tracking-[0.4em] uppercase text-obsidian-moss/20 mb-4">
            Accessibility
          </div>
          <button
            onClick={onToggleMotion}
            className="font-mono text-[10px] tracking-[0.15em] text-obsidian-moss/40 hover:text-copper transition-colors duration-300 text-left"
            aria-label={reducedMotion ? "Enable motion effects" : "Reduce motion effects"}
          >
            {reducedMotion ? "◯ Enable Motion" : "● Reduce Motion"}
          </button>
        </div>
      </motion.div>
      <div className="mt-16 pt-8 border-t border-obsidian-moss/[0.04] flex flex-col md:flex-row justify-between items-center gap-4">
        <span className="font-mono text-[9px] tracking-[0.3em] uppercase text-obsidian-moss/15">
          © 2026 Baltazar Seeds · All Rights Reserved
        </span>
        <div className="flex items-center gap-8">
          <a href="https://baltazarseeds.com/privacy" target="_blank" rel="noopener noreferrer" className="font-mono text-[9px] tracking-[0.25em] uppercase text-obsidian-moss/20 hover:text-copper transition-colors duration-300">
            Privacy
          </a>
          <a href="https://baltazarseeds.com/terms" target="_blank" rel="noopener noreferrer" className="font-mono text-[9px] tracking-[0.25em] uppercase text-obsidian-moss/20 hover:text-copper transition-colors duration-300">
            Terms
          </a>
        </div>
      </div>
    </footer>
  );
}

/* ============ APP ============ */
function App() {
  const [reducedMotion, setReducedMotion] = useState(false);

  return (
    <div className="relative min-h-screen bg-alabaster text-obsidian-moss overflow-x-hidden">
      <div className="fixed inset-0 pointer-events-none z-0">
        <div className="absolute inset-[-10%]"
          style={{
            background: `
              radial-gradient(800px 600px at 15% 20%, rgba(140,106,77,0.04), transparent 60%),
              radial-gradient(600px 500px at 85% 80%, rgba(74,107,58,0.03), transparent 60%)
            `,
          }}
        />
      </div>
      <div className="fixed inset-0 pointer-events-none z-[2] opacity-[0.035] mix-blend-overlay"
        style={{
          backgroundImage: `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>")`,
        }}
      />
      <ParticleField reducedMotion={reducedMotion} />
      <div className="fixed inset-6 md:inset-8 border border-obsidian-moss/[0.04] pointer-events-none z-[3]">
        <div className="absolute -top-px -left-px w-5 h-5 border-l border-t border-copper/25"></div>
        <div className="absolute -top-px -right-px w-5 h-5 border-r border-t border-copper/25"></div>
        <div className="absolute -bottom-px -left-px w-5 h-5 border-l border-b border-copper/25"></div>
        <div className="absolute -bottom-px -right-px w-5 h-5 border-r border-b border-copper/25"></div>
      </div>
      <main className="relative z-[5]">
        <HeroSection />
        <GeneticsArchive />

        <FooterSection

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
