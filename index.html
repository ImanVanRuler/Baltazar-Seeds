<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BALTAZAR SEEDS | 420 Universe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

}


/* Hintergrund */

body {

    background:
    radial-gradient(
        circle at center,
        #314c35 0%,
        #18271c 35%,
        #091009 75%,
        #030403 100%
    );

}


/* gesamte Startfläche */

.intro {

    width: 100%;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    cursor: none;
/* eigener mystischer Cursor */

.cursor {

    position: fixed;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    border: 1px solid rgba(220,240,200,0.7);

    pointer-events: none;

    transform: translate(-50%, -50%);

    z-index: 999;

    transition:
    width .3s ease,
    height .3s ease,
    background .3s ease;

    mix-blend-mode: difference;

}


.cursor.active {

    width: 60px;
    height: 60px;

    background:
    rgba(120,200,120,0.15);

}



/* neue Schrift */

.content {

    font-family:
    "Cormorant Garamond",
    serif;

}



/* Titel */

h1 {

    position: relative;

    font-weight: 400;

    text-transform: uppercase;

    animation:

    titleReveal
    3s
    ease forwards,

    subtleGlitch
    7s
    infinite;

}



/* elegante Einblendung */

@keyframes titleReveal {


0% {

    opacity:0;

    letter-spacing:40px;

    filter:
    blur(15px);

}


100% {

    opacity:1;

    letter-spacing:
    clamp(5px,1vw,12px);

    filter:
    blur(0);

}


}



/* sehr dezenter Glitch */

@keyframes subtleGlitch {


0%,
90%,
100% {

    transform:
    translate(0);

}


92% {

    transform:
    translate(-2px,1px);

}


94% {

    transform:
    translate(2px,-1px);

}


}



.subtitle {

    animation:

    fadeSubtitle
    4s
    ease forwards;

}



@keyframes fadeSubtitle {


from {

    opacity:0;

    transform:
    translateY(20px);

}


to {

    opacity:.65;

    transform:
    translateY(0);

}


}

    opacity: 0;

    animation:
    introFade 3s ease forwards;

}


/* leichte Lichtstimmung */

.intro::before {

    content: "";

    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 900px;
    max-height: 900px;

    background:
    radial-gradient(
        circle,
        rgba(125,190,120,0.18),
        transparent 65%
    );


    filter: blur(60px);

    animation:
    pulse 8s ease-in-out infinite;

}



/* Inhalt */

.content {

    position: relative;

    z-index: 2;

    color: rgba(245,245,230,0.95);

}



h1 {

    font-size:
    clamp(35px, 7vw, 75px);

    font-weight: 300;

    letter-spacing:
    clamp(5px, 1vw, 12px);

    margin-bottom: 25px;


}



.subtitle {

    font-size:
    clamp(11px, 2vw, 17px);

    letter-spacing:
    clamp(3px, 0.7vw, 7px);

    opacity: 0.65;

}



/* Animationen */


@keyframes introFade {

    from {

        opacity: 0;

        transform:
        scale(1.03);

    }


    to {

        opacity: 1;

        transform:
        scale(1);

    }

}



@keyframes pulse {


    0%,
    100% {

        transform:
        scale(0.95);

        opacity:0.7;

    }


    50% {

        transform:
        scale(1.1);

        opacity:1;

    }


}




/* Handy Anpassung */

@media(max-width:600px){


    h1 {

        letter-spacing:
        4px;

    }


    .subtitle {

        letter-spacing:
        3px;

    }


}


</style>

</head>



<body>


<div class="intro" onclick="enterSite()">


    <div class="content">


        <h1>
            BALTAZAR SEEDS
        </h1>


        <div class="subtitle">
            ENTER THE 420 UNIVERSE
        </div>


    </div>


</div>

<div class="cursor"></div>

<script>

const cursor =
document.querySelector(".cursor");


document.addEventListener(
"mousemove",
(e)=>{


cursor.style.left =
e.clientX + "px";


cursor.style.top =
e.clientY + "px";


});


const intro =
document.querySelector(".intro");


intro.addEventListener(
"mouseenter",
()=>{

cursor.classList.add("active");

});


intro.addEventListener(
"mouseleave",
()=>{

cursor.classList.remove("active");

});



function enterSite(){

window.location.href =
"hauptseite.html";

}


</script>


</body>

</html>
