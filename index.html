<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BALTAZAR SEEDS | 420 Universe</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

}


/* Hintergrund */

body {

    background:
    radial-gradient(
        circle at center,
        #314c35 0%,
        #18271c 35%,
        #091009 75%,
        #030403 100%
    );

}


/* gesamte Startfläche */

.intro {

    width: 100%;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    cursor: pointer;


    opacity: 0;

    animation:
    introFade 3s ease forwards;

}


/* leichte Lichtstimmung */

.intro::before {

    content: "";

    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 900px;
    max-height: 900px;

    background:
    radial-gradient(
        circle,
        rgba(125,190,120,0.18),
        transparent 65%
    );


    filter: blur(60px);

    animation:
    pulse 8s ease-in-out infinite;

}



/* Inhalt */

.content {

    position: relative;

    z-index: 2;

    color: rgba(245,245,230,0.95);

}



h1 {

    font-size:
    clamp(35px, 7vw, 75px);

    font-weight: 300;

    letter-spacing:
    clamp(5px, 1vw, 12px);

    margin-bottom: 25px;


}



.subtitle {

    font-size:
    clamp(11px, 2vw, 17px);

    letter-spacing:
    clamp(3px, 0.7vw, 7px);

    opacity: 0.65;

}



/* Animationen */


@keyframes introFade {

    from {

        opacity: 0;

        transform:
        scale(1.03);

    }


    to {

        opacity: 1;

        transform:
        scale(1);

    }

}



@keyframes pulse {


    0%,
    100% {

        transform:
        scale(0.95);

        opacity:0.7;

    }


    50% {

        transform:
        scale(1.1);

        opacity:1;

    }


}




/* Handy Anpassung */

@media(max-width:600px){


    h1 {

        letter-spacing:
        4px;

    }


    .subtitle {

        letter-spacing:
        3px;

    }


}


</style>

</head>



<body>


<div class="intro" onclick="enterSite()">


    <div class="content">


        <h1>
            BALTAZAR SEEDS
        </h1>


        <div class="subtitle">
            ENTER THE 420 UNIVERSE
        </div>


    </div>


</div>



<script>


function enterSite(){

    window.location.href =
    "hauptseite.html";

}


</script>


</body>

</html>
