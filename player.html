<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON VERTICAL ESCAPE</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0a0114;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0114 70%);
        }
        canvas {
            display: block;
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.25),
                        0 0 120px rgba(255, 0, 127, 0.15);
            image-rendering: pixelated;
        }
        #uiLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        #hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .hud-panel {
            background: rgba(15, 8, 35, 0.9);
            border: 2px solid;
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(8px);
        }
        #scorePanel { border-color: #00f2fe; }
        #timerPanel { border-color: #ff007f; }
        .hud-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.8;
        }
        .hud-value {
            font-size: 26px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 2, 20, 0.97);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .screen-overlay.hidden { opacity: 0; pointer-events: none; }
        .menu-box {
            text-align: center;
            padding: 50px 40px;
            background: rgba(20, 10, 45, 0.95);
            border: 3px solid #00f2fe;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.4);
            max-width: 420px;
            width: 90%;
        }
        .menu-title {
            font-size: 42px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #00f2fe, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
        }
        button.action-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #00f2fe, #ff007f);
            border: none;
            color: white;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            transition: all 0.2s;
        }
        button.action-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.7);
        }

        #touchControls {
            position: absolute;
            bottom: 40px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
            opacity: 0.9;
        }
        .touch-btn {
            width: 80px; height: 80px;
            background: rgba(20, 10, 45, 0.85);
            border: 3px solid #00f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiLayer">
            <!-- HUD -->
            <div id="hud">
                <div class="hud-panel" id="scorePanel">
                    <div class="hud-label">DISTANZ</div>
                    <div id="scoreVal" class="hud-value">0000m</div>
                </div>
                <div class="hud-panel" id="timerPanel">
                    <div class="hud-label">ENERGIE</div>
                    <div id="timerVal" class="hud-value">30.0s</div>
                </div>
            </div>

            <!-- Overlay -->
            <div id="screenOverlay" class="screen-overlay">
                <div class="menu-box">
                    <h1 class="menu-title" id="menuTitle">NEON ESCAPE</h1>
                    <p id="menuDesc" style="margin:20px 0; line-height:1.5; color:#b8a8ff;">
                        Fliege nach oben.<br>
                        Sammle Energie.<br>
                        Überlebe so lange wie möglich.
                    </p>
                    <button class="action-btn" id="startBtn">START</button>
                    <div id="highscore" style="margin-top:25px; font-size:14px; color:#00f2fe;"></div>
                </div>
            </div>

            <!-- Touch Controls -->
            <div id="touchControls">
                <div class="touch-btn" id="btnLeft">◀</div>
                <div class="touch-btn" id="btnRight">▶</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        const VIRTUAL_WIDTH = 480;
        const VIRTUAL_HEIGHT = 800;

        let scale = 1;
        let offsetX = 0;

        let gameState = 'MENU';
        let score = 0;
        let highScore = localStorage.getItem('neonHighScore') || 0;
        let timeRemaining = 30;
        let cameraY = 0;

        const player = {
            x: VIRTUAL_WIDTH / 2,
            y: 650,
            radius: 15,
            speed: 7,
            vx: 0,
            vy: -4.2
        };

        let segments = [], obstacles = [], items = [], enemies = [], particles = [], trails = [];

        let keys = {};
        let touchLeft = false, touchRight = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'pickup') {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(800, now);
                o.frequency.exponentialRampToValueAtTime(1600, now + 0.12);
                g.gain.setValueAtTime(0.25, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                o.connect(g).connect(audioCtx.destination);
                o.start(now); o.stop(now + 0.2);
            }
            else if (type === 'hit') {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(220, now);
                o.frequency.exponentialRampToValueAtTime(60, now + 0.4);
                g.gain.value = 0.4;
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                o.connect(g).connect(audioCtx.destination);
                o.start(now); o.stop(now + 0.5);
            }
            else if (type === 'start') {
                const notes = [261.63, 329.63, 392, 523.25];
                notes.forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.2, now + i*0.08);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i*0.08 + 0.35);
                    o.connect(g).connect(audioCtx.destination);
                    o.start(now + i*0.08);
                    o.stop(now + i*0.08 + 0.4);
                });
            }
        }

        function resize() {
            const h = window.innerHeight;
            const targetW = h * VIRTUAL_WIDTH / VIRTUAL_HEIGHT;
            canvas.height = h;
            canvas.width = Math.min(window.innerWidth, targetW);

            scale = canvas.height / VIRTUAL_HEIGHT;
            offsetX = (canvas.width - VIRTUAL_WIDTH * scale) / 2;

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touchControls').style.display = 'flex';
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // Input
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        btnLeft.addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; });
        btnLeft.addEventListener('touchend', () => touchLeft = false);
        btnRight.addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; });
        btnRight.addEventListener('touchend', () => touchRight = false);

        function handleInput() {
            player.vx = 0;
            if (keys['a'] || keys['arrowleft'] || touchLeft) player.vx = -player.speed;
            if (keys['d'] || keys['arrowright'] || touchRight) player.vx = player.speed;
        }

        function spawnParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = 1.5 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * vel,
                    vy: Math.sin(angle) * vel,
                    size: 3 + Math.random() * 4,
                    color,
                    alpha: 1,
                    life: 35 + Math.random() * 20
                });
            }
        }

        function generateSegment(startY, count = 6) {
            for (let i = 0; i < count; i++) {
                const y = startY - i * 210;
                
                // Wände
                const width = 75 + Math.random() * 110;
                const side = Math.random() > 0.5 ? 'left' : 'right';
                segments.push({
                    x: side === 'left' ? 0 : VIRTUAL_WIDTH - width,
                    y: y,
                    width, height: 28,
                    color: '#00f2fe'
                });

                // Hindernisse
                if (Math.random() > 0.45) {
                    obstacles.push({
                        x: 70 + Math.random() * (VIRTUAL_WIDTH - 160),
                        y: y - 95,
                        width: 38 + Math.random() * 45,
                        height: 22,
                        color: '#ff0055'
                    });
                }

                // Items
                if (Math.random() > 0.2) {
                    items.push({
                        x: 60 + Math.random() * (VIRTUAL_WIDTH - 120),
                        y: y - 55,
                        radius: 9,
                        pulse: Math.random() * Math.PI * 2
                    });
                }

                // Enemies (später)
                if (y < -800 && Math.random() > 0.65) {
                    enemies.push({
                        x: 60 + Math.random() * (VIRTUAL_WIDTH - 120),
                        y: y - 140,
                        radius: 13,
                        speed: 1.8 + Math.random() * 1.8,
                        dir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }

        function cleanup() {
            const threshold = cameraY - 150;
            segments = segments.filter(s => s.y > threshold);
            obstacles = obstacles.filter(o => o.y > threshold);
            items = items.filter(i => i.y > threshold);
            enemies = enemies.filter(e => e.y > threshold);
            particles = particles.filter(p => p.life > 0);
        }

        function checkCollision(circle, rect) {
            const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
            const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
            const dx = circle.x - closestX;
            const dy = circle.y - closestY;
            return (dx * dx + dy * dy) < (circle.radius * circle.radius);
        }

        function update(delta) {
            if (gameState !== 'PLAYING') return;

            timeRemaining -= delta / 1000;
            if (timeRemaining <= 0) { endGame(); return; }

            handleInput();
            player.x += player.vx;
            player.y += player.vy;

            // Bounds
            player.x = Math.max(player.radius, Math.min(VIRTUAL_WIDTH - player.radius, player.x));

            // Camera
            const targetCam = player.y - VIRTUAL_HEIGHT * 0.68;
            cameraY += (targetCam - cameraY) * 0.12;

            // Generate new content
            const lastY = segments.length ? segments[segments.length-1].y : 800;
            if (cameraY < lastY + VIRTUAL_HEIGHT * 0.8) {
                generateSegment(lastY - 100);
            }

            // Collisions
            segments.forEach(seg => {
                if (checkCollision(player, seg)) {
                    player.y += 12;
                    playSound('hit');
                    spawnParticles(player.x, player.y, '#00f2fe', 10);
                }
            });

            obstacles.forEach(obs => {
                if (checkCollision(player, obs)) {
                    timeRemaining -= 3.5;
                    player.y += 22;
                    playSound('hit');
                    spawnParticles(player.x, player.y + 10, '#ff0055', 18);
                }
            });

            // Enemies
            enemies.forEach(e => {
                e.x += e.speed * e.dir;
                if (e.x < 30 || e.x > VIRTUAL_WIDTH - 30) e.dir *= -1;

                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    timeRemaining -= 6;
                    player.y += 28;
                    playSound('hit');
                    spawnParticles(e.x, e.y, '#ff007f', 22);
                }
            });

            // Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.pulse += 0.18;
                if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + item.radius) {
                    timeRemaining = Math.min(45, timeRemaining + 7);
                    playSound('pickup');
                    spawnParticles(item.x, item.y, '#00ffaa', 14);
                    items.splice(i, 1);
                }
            }

            // Particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.life -= 1;
                p.alpha = p.life / 40;
            });

            cleanup();

            // Score
            const newScore = Math.max(score, Math.floor((700 - player.y) / 8));
            if (newScore > score) score = newScore;

            // HUD
            document.getElementById('scoreVal').textContent = String(score).padStart(4, '0') + 'm';
            document.getElementById('timerVal').textContent = timeRemaining.toFixed(1) + 's';
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, 0);
            ctx.scale(scale, scale);
            ctx.translate(0, -cameraY);

            // Background
            ctx.fillStyle = '#0c0419';
            ctx.fillRect(0, cameraY - 100, VIRTUAL_WIDTH, VIRTUAL_HEIGHT + 200);

            // Grid / Neon lines
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';
            ctx.lineWidth = 2;
            for (let y = Math.floor(cameraY / 60) * 60; y < cameraY + VIRTUAL_HEIGHT + 100; y += 60) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(VIRTUAL_WIDTH, y);
                ctx.stroke();
            }

            // Segments
            segments.forEach(s => {
                ctx.shadowBlur = 18;
                ctx.shadowColor = s.color;
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.width, s.height);
            });
            ctx.shadowBlur = 0;

            // Obstacles
            obstacles.forEach(o => {
                ctx.fillStyle = o.color;
                ctx.fillRect(o.x, o.y, o.width, o.height);
            });

            // Items
            items.forEach(item => {
                const r = item.radius + Math.sin(item.pulse) * 2.5;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffaa';
                ctx.fillStyle = '#00ffaa';
                ctx.beginPath();
                ctx.arc(item.x, item.y, r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Enemies
            enemies.forEach(e => {
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff007f';
                ctx.fillStyle = '#ff007f';
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(e.x - 4, e.y - 4, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            // Player + Trail
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00f2fe';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        let lastTime = 0;
        function loop(ts) {
            if (!lastTime) lastTime = ts;
            const delta = ts - lastTime;
            lastTime = ts;

            update(delta);
            draw();
            requestAnimationFrame(loop);
        }

        function initGame() {
            segments = []; obstacles = []; items = []; enemies = []; particles = [];
            player.x = VIRTUAL_WIDTH / 2;
            player.y = 650;
            score = 0;
            timeRemaining = 30;
            cameraY = 0;

            generateSegment(700, 8);
            document.getElementById('screenOverlay').classList.add('hidden');
            gameState = 'PLAYING';
            playSound('start');
        }

        function endGame() {
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonHighScore', highScore);
            }
            document.getElementById('menuTitle').textContent = 'ENERGIE ERSCHÖPFT';
            document.getElementById('menuDesc').innerHTML = `Du hast <strong>${score} Meter</strong> erreicht!`;
            document.getElementById('startBtn').textContent = 'NOCHMAL VERSUCHEN';
            document.getElementById('highscore').textContent = `HIGHSCORE: ${highScore}m`;
            document.getElementById('screenOverlay').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', initGame);

        // Highscore anzeigen
        document.getElementById('highscore').textContent = `HIGHSCORE: ${highScore}m`;

        requestAnimationFrame(loop);
    </script>
</body>
</html>
