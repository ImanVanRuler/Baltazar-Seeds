<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON VERTICAL ESCAPE</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0a0114;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0114 70%);
        }
        canvas { display: block; box-shadow: 0 0 60px rgba(0,242,254,0.25), 0 0 120px rgba(255,0,127,0.15); }

        #uiLayer { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
        }
        .hud-panel {
            background: rgba(15,8,35,0.9); border: 2px solid; padding: 10px 18px;
            border-radius: 12px; box-shadow: 0 0 20px rgba(0,242,254,0.3); backdrop-filter: blur(8px);
        }
        #scorePanel { border-color: #00f2fe; }
        #timerPanel { border-color: #ff007f; }
        .hud-value { font-size: 26px; font-family: monospace; font-weight: bold; }

        .screen-overlay {
            position: absolute; inset: 0; background: rgba(6,2,20,0.97);
            backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .screen-overlay.hidden {
    display: none !important;
}
        .menu-box {
            text-align: center; padding: 50px 40px; background: rgba(20,10,45,0.95);
            border: 3px solid #00f2fe; border-radius: 20px; box-shadow: 0 0 60px rgba(0,242,254,0.4);
            max-width: 420px; width: 90%;
        }
        .menu-title { font-size: 42px; background: linear-gradient(90deg,#00f2fe,#ff00aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        button.action-btn {
            margin-top:20px; background: linear-gradient(135deg,#00f2fe,#ff007f); border:none; color:white;
            padding:16px 40px; font-size:18px; font-weight:bold; border-radius:50px; cursor:pointer;
        }
        #touchControls {
            position:absolute; bottom:40px; left:0; right:0; display:flex; justify-content:space-around; padding:0 30px;
        }
        .touch-btn {
            width:80px; height:80px; background:rgba(20,10,45,0.85); border:3px solid #00f2fe;
            border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; color:#00f2fe;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiLayer">
            <div id="hud">
                <div class="hud-panel" id="scorePanel">
                    <div class="hud-label">DISTANZ</div>
                    <div id="scoreVal" class="hud-value">0000m</div>
                </div>
                <div class="hud-panel" id="timerPanel">
                    <div class="hud-label">ENERGIE</div>
                    <div id="timerVal" class="hud-value">30.0s</div>
                </div>
            </div>

            <div id="screenOverlay" class="screen-overlay">
                <div class="menu-box">
                    <h1 class="menu-title" id="menuTitle">NEON ESCAPE</h1>
                    <p id="menuDesc" style="margin:20px 0; line-height:1.5; color:#b8a8ff;">Fliege. Sammle. Überlebe.</p>
                    <button class="action-btn" id="startBtn">START</button>
                    <div id="highscore" style="margin-top:25px; font-size:14px; color:#00f2fe;"></div>
                </div>
            </div>

            <div id="touchControls">
                <div class="touch-btn" id="btnLeft">◀</div>
                <div class="touch-btn" id="btnRight">▶</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const VIRTUAL_WIDTH = 480;
        const VIRTUAL_HEIGHT = 800;

        let scale = 1, offsetX = 0;
        let gameState = 'MENU';
        let score = 0, highScore = localStorage.getItem('neonHighScore') || 0;
        let timeRemaining = 30;
        let cameraY = 0;
        let difficulty = 1;

        const player = { x: VIRTUAL_WIDTH/2, y: 650, radius: 15, speed: 6.8, vx: 0, vy: -3.6 };

        let segments = [], obstacles = [], items = [], enemies = [], particles = [], stars = [], ambientParticles = [];

        let keys = {}, touchLeft = false, touchRight = false;
        let lastMilestone = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            if (type === 'pickup') {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(900, now); o.frequency.exponentialRampToValueAtTime(1800, now+0.1);
                g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.15);
                o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+0.18);
            } else if (type === 'hit') {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = 'sawtooth'; o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(60, now+0.35);
                g.gain.value = 0.35; g.gain.exponentialRampToValueAtTime(0.001, now+0.4);
                o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+0.45);
            } else if (type === 'milestone') {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = 'triangle'; o.frequency.setValueAtTime(600, now);
                g.gain.value = 0.3; g.gain.exponentialRampToValueAtTime(0.001, now+0.6);
                o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+0.6);
            }
        }

        function resize() {
            const h = window.innerHeight;
            const targetW = h * VIRTUAL_WIDTH / VIRTUAL_HEIGHT;
            canvas.height = h; canvas.width = Math.min(window.innerWidth, targetW);
            scale = canvas.height / VIRTUAL_HEIGHT;
            offsetX = (canvas.width - VIRTUAL_WIDTH * scale) / 2;
            if ('ontouchstart' in window) document.getElementById('touchControls').style.display = 'flex';
        }
        window.addEventListener('resize', resize); resize();

        // Input
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        document.getElementById('btnLeft').addEventListener('touchstart', e=>{e.preventDefault(); touchLeft=true;});
        document.getElementById('btnLeft').addEventListener('touchend', ()=>{touchLeft=false;});
        document.getElementById('btnRight').addEventListener('touchstart', e=>{e.preventDefault(); touchRight=true;});
        document.getElementById('btnRight').addEventListener('touchend', ()=>{touchRight=false;});

        function handleInput() {
            player.vx = 0;
            if (keys['a'] || keys['arrowleft'] || touchLeft) player.vx = -player.speed;
            if (keys['d'] || keys['arrowright'] || touchRight) player.vx = player.speed;
        }

        function spawnParticles(x, y, color, count=12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * (1.5 + Math.random()*4),
                    vy: Math.sin(angle) * (1.5 + Math.random()*4) - 1,
                    size: 2.5 + Math.random()*4,
                    color, alpha: 1, life: 38
                });
            }
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * VIRTUAL_WIDTH,
                    y: Math.random() * -2000,
                    size: Math.random() * 2.5 + 0.8,
                    speed: Math.random() * 0.6 + 0.3
                });
            }
        }

        function generateSegment(startY, count = 7) {
            const progress = Math.max(0, -startY / 800); // Fortschritt

            for (let i = 0; i < count; i++) {
                const y = startY - i * 195;

                // Frühes Spiel = entspannt
                const isEarly = y > -600;

                // Wände
                if (!isEarly || Math.random() > 0.4) {
                    const width = 70 + Math.random() * 105;
                    const side = Math.random() > 0.5;
                    segments.push({ x: side ? 0 : VIRTUAL_WIDTH - width, y, width, height: 26 });
                }

                // Hindernisse
                if (Math.random() > (isEarly ? 0.75 : 0.45)) {
                    obstacles.push({
                        x: 65 + Math.random() * (VIRTUAL_WIDTH - 150),
                        y: y - 88,
                        width: 36 + Math.random() * 42,
                        height: 22
                    });
                }

                // Zeitkugeln (viele am Anfang)
                if (Math.random() > (isEarly ? 0.1 : 0.25)) {
                    items.push({ x: 55 + Math.random()*(VIRTUAL_WIDTH-110), y: y - 52, radius: 9, pulse: Math.random()*Math.PI*2 });
                }

                // Gegner (später)
                if (!isEarly && Math.random() > 0.6) {
                    enemies.push({
                        x: 60 + Math.random()*(VIRTUAL_WIDTH-120),
                        y: y - 135,
                        radius: 13,
                        speed: 1.9 + difficulty * 0.6,
                        dir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }

        function checkCollision(circle, rect) {
            const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
            const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
            return (circle.x - cx)**2 + (circle.y - cy)**2 < circle.radius ** 2;
        }

        function update(delta) {
            if (gameState !== 'PLAYING') return;

            timeRemaining -= delta / 1000;
            if (timeRemaining <= 0) return endGame();

            handleInput();
            player.x += player.vx;
            player.y += player.vy;
            player.x = Math.max(player.radius, Math.min(VIRTUAL_WIDTH - player.radius, player.x));

            const targetCam = player.y - VIRTUAL_HEIGHT * 0.68;
            cameraY += (targetCam - cameraY) * 0.13;

            // Difficulty
            difficulty = 1 + Math.max(0, -player.y / 1200);

            // Generation
            const lastY = segments.length ? segments[segments.length-1].y : 800;
            if (cameraY < lastY + VIRTUAL_HEIGHT * 0.75) {
                generateSegment(lastY - 80);
            }

            // Collisions
            segments.forEach(s => { if (checkCollision(player, s)) { player.y += 11; playSound('hit'); spawnParticles(player.x, player.y, '#00f2fe', 9); }});
            obstacles.forEach(o => { if (checkCollision(player, o)) { timeRemaining -= 1.5; player.y += 20; playSound('hit'); spawnParticles(player.x, player.y, '#ff0055', 16); }});

            enemies.forEach(e => {
                e.x += e.speed * e.dir;
                if (e.x < 35 || e.x > VIRTUAL_WIDTH - 35) e.dir *= -1;
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    timeRemaining -= 3;
                    player.y += 26;
                    playSound('hit');
                    spawnParticles(e.x, e.y, '#ff007f', 20);
                }
            });

            // Items
            for (let i = items.length-1; i >= 0; i--) {
                const it = items[i];
                it.pulse += 0.2;
                if (Math.hypot(player.x - it.x, player.y - it.y) < player.radius + it.radius + 4) {
                    timeRemaining = Math.min(48, timeRemaining + 7);
                    playSound('pickup');
                    spawnParticles(it.x, it.y, '#00ffaa', 16);
                    items.splice(i,1);
                }
            }

            // Particles
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; p.alpha = p.life/35; });
            particles = particles.filter(p => p.life > 0);

            // Ambient
            ambientParticles.forEach(p => {
                p.y += p.speed;
                p.x += Math.sin(cameraY/60 + p.x) * 0.03;
            });

            // Milestones
            const currentMeters = Math.floor((700 - player.y)/8);
            if (currentMeters - lastMilestone >= 100) {
                lastMilestone = Math.floor(currentMeters/100)*100;
                spawnParticles(player.x, player.y - 40, '#ffff00', 25);
                playSound('milestone');
            }

            score = Math.max(score, currentMeters);
            document.getElementById('scoreVal').textContent = String(score).padStart(4,'0') + 'm';
            document.getElementById('timerVal').textContent = timeRemaining.toFixed(1) + 's';
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.save();
            ctx.translate(offsetX, 0);
            ctx.scale(scale, scale);
            ctx.translate(0, -cameraY);

            // Background Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                const sy = (s.y + cameraY * s.speed) % (VIRTUAL_HEIGHT + 400) - 200;
                ctx.globalAlpha = 0.6 + Math.sin(cameraY/30 + s.x) * 0.4;
                ctx.fillRect(s.x, sy, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            // Ambient particles
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ambientParticles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
            ctx.globalAlpha = 1;

            // Segments
            ctx.shadowBlur = 16; ctx.shadowColor = '#00f2fe';
            segments.forEach(s => {
                ctx.fillStyle = '#00f2fe';
                ctx.fillRect(s.x, s.y, s.width, s.height);
            });
            ctx.shadowBlur = 0;

            obstacles.forEach(o => { ctx.fillStyle = '#ff0055'; ctx.fillRect(o.x, o.y, o.width, o.height); });

            // Items
            items.forEach(it => {
                const r = it.radius + Math.sin(it.pulse)*2.8;
                ctx.shadowBlur = 22; ctx.shadowColor = '#00ffaa';
                ctx.fillStyle = '#00ffaa';
                ctx.beginPath(); ctx.arc(it.x, it.y, r, 0, Math.PI*2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Enemies (Drone Style)
            enemies.forEach(e => {
                ctx.shadowBlur = 14; ctx.shadowColor = '#ff007f';
                ctx.fillStyle = '#ff007f';
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();

                // Rotoren
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(e.x-8, e.y-4, 16, 3);
                ctx.fillRect(e.x-4, e.y-10, 3, 8);

                ctx.fillStyle = '#00f2fe';
                ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI*2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            // Player
            ctx.shadowBlur = 28; ctx.shadowColor = '#00f2fe';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function initGame() {
            segments = []; obstacles = []; items = []; enemies = []; particles = [];
            player.x = VIRTUAL_WIDTH/2; player.y = 650;
            score = 0; timeRemaining = 30; cameraY = 0; difficulty = 1; lastMilestone = 0;

            createStars();
            ambientParticles = Array.from({length:35}, () => ({
                x: Math.random()*VIRTUAL_WIDTH,
                y: Math.random()*-800,
                speed: 0.8 + Math.random()*1.2,
                alpha: 0.4 + Math.random()*0.5
            }));

            generateSegment(750, 9);
            document.getElementById('screenOverlay').classList.add('hidden');
            gameState = 'PLAYING';
        }

        function endGame() {
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonHighScore', highScore);
            }
            document.getElementById('menuTitle').textContent = 'ENERGIE ERSCHÖPFT';
            document.getElementById('menuDesc').innerHTML = `Du hast <strong>${score} Meter</strong> erreicht!`;
            document.getElementById('startBtn').textContent = 'NOCHMAL VERSUCHEN';
            document.getElementById('highscore').textContent = `HIGHSCORE: ${highScore}m`;
            document.getElementById('screenOverlay').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', initGame);
        document.getElementById('highscore').textContent = `HIGHSCORE: ${highScore}m`;

        let lastTime = 0;
        function loop(ts) {
            if (!lastTime) lastTime = ts;
            const delta = ts - lastTime;
            lastTime = ts;
            update(delta);
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
