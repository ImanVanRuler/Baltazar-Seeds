<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON VERTICAL ESCAPE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #04010d;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
        }

        #uiLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 14px; left: 14px; right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .hud-panel {
            background: rgba(6, 2, 18, 0.92);
            border: 1.5px solid rgba(0, 200, 230, 0.35);
            padding: 8px 14px 9px;
            border-radius: 11px;
            backdrop-filter: blur(12px);
            min-width: 105px;
        }

        .hud-label {
            font-size: 8px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 3px;
            opacity: 0.55;
        }

        #scorePanel .hud-label { color: #00e8ff; }
        #timerPanel .hud-label { color: #ff3388; }

        .hud-value {
            font-size: 21px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            line-height: 1;
        }

        #scorePanel .hud-value {
            color: #00e8ff;
            text-shadow: 0 0 14px rgba(0, 232, 255, 0.75);
        }

        #timerPanel .hud-value {
            color: #ff3388;
            text-shadow: 0 0 14px rgba(255, 51, 136, 0.75);
        }

        #energyBar {
            height: 4px;
            margin-top: 6px;
            background: rgba(255, 51, 136, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        #energyFill {
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #ff5566);
            border-radius: 2px;
            box-shadow: 0 0 6px #ff007f;
            transition: width 0.12s linear, background 0.3s;
        }

        #centerHud {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding-top: 4px;
        }

        #shieldIndicator {
            display: none;
            background: rgba(6, 2, 18, 0.92);
            border: 1.5px solid rgba(255, 204, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            animation: shieldPulse 1.4s infinite;
        }

        @keyframes shieldPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(255,204,0,0.3); }
            50%       { box-shadow: 0 0 18px rgba(255,204,0,0.7); }
        }

        #multiplierBadge {
            display: none;
            background: rgba(6, 2, 18, 0.88);
            border: 1.5px solid rgba(180, 100, 255, 0.5);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #cc88ff;
        }

        #toast {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            white-space: nowrap;
            text-align: center;
        }

        .screen-overlay {
            position: absolute; inset: 0;
            background: rgba(3, 1, 12, 0.96);
            backdrop-filter: blur(18px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .screen-overlay.hidden { display: none !important; }

        .menu-box {
            text-align: center;
            padding: 44px 38px 38px;
            background: rgba(10, 4, 28, 0.98);
            border: 2px solid rgba(0, 220, 255, 0.3);
            border-radius: 22px;
            box-shadow:
                0 0 60px rgba(0, 200, 255, 0.12),
                0 0 120px rgba(255, 0, 127, 0.07),
                inset 0 0 30px rgba(0, 180, 255, 0.03);
            max-width: 400px; width: 90%;
        }

        .menu-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(100deg, #00e8ff 10%, #ff00aa 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .menu-subtitle {
            font-size: 9px;
            letter-spacing: 5px;
            color: rgba(160, 130, 255, 0.45);
            text-transform: uppercase;
            margin: 6px 0 22px;
        }

        .menu-desc {
            color: rgba(180, 160, 255, 0.75);
            line-height: 1.75;
            font-size: 13px;
        }

        .item-legend {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 16px 0 8px;
            font-size: 11px;
            color: rgba(180, 160, 255, 0.5);
        }

        .item-legend span { letter-spacing: 1px; }

        .controls-hint {
            margin-top: 10px;
            font-size: 11px;
            color: rgba(80, 140, 220, 0.45);
            letter-spacing: 1px;
        }

        .action-btn {
            display: block;
            width: 100%;
            margin-top: 26px;
            background: linear-gradient(135deg, #00b8cc, #cc0060);
            border: none;
            color: #fff;
            padding: 17px 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 28px rgba(0, 200, 220, 0.25), 0 4px 20px rgba(200, 0, 80, 0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .action-btn:hover { transform: translateY(-1px); box-shadow: 0 0 40px rgba(0,200,220,0.35); }
        .action-btn:active { transform: scale(0.97); }

        .highscore-display {
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 2.5px;
            color: rgba(0, 220, 255, 0.5);
            text-transform: uppercase;
        }

        .score-big {
            font-size: 56px;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            background: linear-gradient(90deg, #00e8ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin: 10px 0 6px;
        }

        .new-record {
            font-size: 11px;
            letter-spacing: 3px;
            color: #ffcc00;
            text-shadow: 0 0 12px #ffcc00;
            margin-bottom: 4px;
            animation: blink 0.9s infinite;
        }

        @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0.3 } }

        .stat-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 14px 0 4px;
            font-size: 11px;
            color: rgba(180,160,255,0.55);
            letter-spacing: 1px;
        }

        #touchControls {
            position: absolute;
            bottom: 28px; left: 0; right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 22px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 84px; height: 84px;
            background: rgba(8, 3, 22, 0.82);
            border: 2px solid rgba(0, 220, 255, 0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            color: rgba(0, 220, 255, 0.65);
            touch-action: none;
            transition: background 0.1s, border-color 0.1s, color 0.1s;
        }

        .touch-btn.pressed {
            background: rgba(0, 160, 200, 0.18);
            border-color: rgba(0, 240, 255, 0.85);
            color: rgba(0, 240, 255, 0.95);
            box-shadow: 0 0 20px rgba(0,220,255,0.3);
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div id="hud">
            <div class="hud-panel" id="scorePanel">
                <div class="hud-label">Distanz</div>
                <div id="scoreVal" class="hud-value">0000m</div>
            </div>

            <div id="centerHud">
                <div id="shieldIndicator">⬡ SCHILD</div>
                <div id="multiplierBadge">× 1</div>
            </div>

            <div class="hud-panel" id="timerPanel">
                <div class="hud-label">Energie</div>
                <div id="timerVal" class="hud-value">30.0s</div>
                <div id="energyBar"><div id="energyFill"></div></div>
            </div>
        </div>

        <div id="toast"></div>

        <div id="screenOverlay" class="screen-overlay">
            <div class="menu-box" id="menuBox"></div>
        </div>

        <div id="touchControls">
            <div class="touch-btn" id="btnLeft">◀</div>
            <div class="touch-btn" id="btnRight">▶</div>
        </div>
    </div>
</div>

<script>
'use strict';

const VW = 480, VH = 800;
const MAX_ENERGY   = 50;
const START_ENERGY = 30;
const PLAYER_R     = 14;
const BASE_SPEED   = 7.0;
const RISE_SPEED   = -3.6;
const TRAIL_LEN    = 28;
const INVINCIBLE_F = 45;
const SEGMENT_GAP  = 190;

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
let scale = 1;

function resize() {
    const winW = window.innerWidth, winH = window.innerHeight;
    const ratio = VW / VH;
    if (winW / winH > ratio) {
        canvas.height = winH;
        canvas.width  = winH * ratio;
    } else {
        canvas.width  = winW;
        canvas.height = winW / ratio;
    }
    scale = canvas.height / VH;
    canvas.style.left = ((winW - canvas.width)  / 2) + 'px';
    canvas.style.top  = ((winH - canvas.height) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();

let AC = null;
function getAC() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
}

function playTone(freq0, freq1, dur, type = 'sine', vol = 0.22) {
    try {
        const ac = getAC(), t = ac.currentTime;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq0, t);
        if (freq1 !== freq0) o.frequency.exponentialRampToValueAtTime(freq1, t + dur * 0.7);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(ac.destination);
        o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
}

const SFX = {
    pickup:       () => playTone(800,  1600, 0.18, 'sine',     0.22),
    shieldPickup: () => { playTone(600, 1200, 0.14, 'triangle', 0.2); setTimeout(() => playTone(900, 1800, 0.14, 'triangle', 0.15), 100); },
    hit:          () => playTone(200,   55,  0.38, 'sawtooth', 0.28),
    shieldHit:    () => playTone(440,  880,  0.22, 'square',   0.22),
    milestone:    () => { [523, 659, 784].forEach((f, i) => setTimeout(() => playTone(f, f, 0.18, 'triangle', 0.2), i * 90)); },
    gameover:     () => playTone(220,   55,  0.8,  'sawtooth', 0.3),
};

let gameState   = 'MENU';
let score       = 0;
let highScore   = parseInt(localStorage.getItem('neonHS2') || '0');
let energy      = START_ENERGY;
let cameraY     = 0;
let worldTopY   = 750;
let difficulty  = 1;
let lastMilestone = 0;
let shakeAmt    = 0;
let frame       = 0;
let multiplier  = 1;

const player = {
    x: VW / 2, y: 650,
    vx: 0, vy: RISE_SPEED,
    r: PLAYER_R,
    speed: BASE_SPEED,
    invincible: 0,
    hasShield: false,
    trail: [],
    speedBoostEnd: 0,
};

let segments  = [];
let obstacles = [];
let items     = [];
let enemies   = [];
let particles = [];
let stars     = [];
let nebulae   = [];
let toastTimer = null;

const keys = {};
let touchLeft = false, touchRight = false;

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

function setupBtn(id, setTrue, setFalse) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); setTrue(); el.classList.add('pressed');    }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); setFalse(); el.classList.remove('pressed'); }, { passive: false });
    el.addEventListener('touchcancel',  () => { setFalse(); el.classList.remove('pressed'); });
}
setupBtn('btnLeft',  () => { touchLeft  = true;  }, () => { touchLeft  = false; });
setupBtn('btnRight', () => { touchRight = true;  }, () => { touchRight = false; });

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('touchControls').style.display = 'flex';
}

function toast(msg, color = '#ffff00') {
    const el = document.getElementById('toast');
    el.textContent  = msg;
    el.style.color  = color;
    el.style.textShadow = `0 0 18px ${color}, 0 0 40px ${color}55`;
    el.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1300);
}

function burst(x, y, color, n = 14, spd = 4.5) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.8 + Math.random() * spd;
        particles.push({
            x, y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.8,
            size: 1.8 + Math.random() * 3,
            color, alpha: 1,
            life: 28 + Math.random() * 20
        });
    }
}

function ring(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        particles.push({
            x, y,
            vx: Math.cos(a) * 3.8, vy: Math.sin(a) * 3.8,
            size: 2.2,
            color, alpha: 1,
            life: 24
        });
    }
}

function createBG() {
    stars = [];
    const layers = [
        { n: 55, speed: 0.12, sizeMin: 0.7,  sizeMax: 1.2  },
        { n: 35, speed: 0.35, sizeMin: 1.2,  sizeMax: 1.9  },
        { n: 18, speed: 0.65, sizeMin: 1.8,  sizeMax: 2.8  },
    ];
    layers.forEach(l => {
        for (let i = 0; i < l.n; i++) {
            stars.push({
                x:       Math.random() * VW,
                y:       Math.random() * VH,
                size:    l.sizeMin + Math.random() * (l.sizeMax - l.sizeMin),
                speed:   l.speed,
                bright:  0.4 + Math.random() * 0.6,
                phase:   Math.random() * Math.PI * 2
            });
        }
    });

    nebulae = [];
    for (let i = 0; i < 6; i++) {
        nebulae.push({
            x:     Math.random() * VW,
            y:     Math.random() * VH,
            rx:    90 + Math.random() * 150,
            ry:    60 + Math.random() * 100,
            hue:   Math.random() > 0.5 ? '240' : '210',
            alpha: 0.025 + Math.random() * 0.04,
            speed: 0.06
        });
    }
}

function genSegment(startY, count = 9) {
    const segProgress = Math.max(0, -startY / 900);

    for (let i = 0; i < count; i++) {
        const y = startY - i * SEGMENT_GAP;
        worldTopY = Math.min(worldTopY, y);

        const earlyPhase = y > -400;
        const midPhase   = y <= -400  && y > -1200;

        if (!earlyPhase || Math.random() > 0.35) {
            const maxW  = earlyPhase ? 130 : (midPhase ? 155 : 175);
            const w     = 55 + Math.random() * maxW;
            const safe  = Math.min(w, VW * 0.44);
            const left  = Math.random() > 0.5;
            segments.push({
                x: left ? 0 : VW - safe,
                y,
                width:  safe,
                height: 18 + Math.floor(segProgress * 5),
                left
            });
        }

        const obsThresh = earlyPhase ? 0.82 : (midPhase ? 0.52 : 0.38);
        if (Math.random() > obsThresh) {
            const w = 30 + Math.random() * 55;
            obstacles.push({
                x:      60  + Math.random() * (VW - 130),
                y:      y   - 82,
                width:  w,
                height: 16,
                pulse:  Math.random() * Math.PI * 2
            });
        }

        const itemChance = earlyPhase ? 0.06 : 0.26;
        if (Math.random() > itemChance) {
            const roll = Math.random();
            const type = roll < 0.65 ? 0 : (roll < 0.87 ? 1 : 2);
            items.push({
                x:     48 + Math.random() * (VW - 96),
                y:     y  - 50,
                r:     type === 2 ? 10 : 9,
                type,
                pulse: Math.random() * Math.PI * 2
            });
        }

        if (!earlyPhase) {
            const enemyThresh = midPhase ? 0.65 : 0.45;
            if (Math.random() > enemyThresh) {
                const spd = 1.7 + difficulty * 0.5 + Math.random() * 0.7;
                enemies.push({
                    x:          55  + Math.random() * (VW - 110),
                    y:          y   - 130,
                    r:          12,
                    speed:      spd,
                    dir:        Math.random() > 0.5 ? 1 : -1,
                    pulse:      Math.random() * Math.PI * 2,
                    rotorAngle: 0
                });
            }
        }
    }
}

function circleRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
}

function handleHit(loss, color, shake, extra = null) {
    if (player.hasShield) {
        player.hasShield = false;
        document.getElementById('shieldIndicator').style.display = 'none';
        shakeAmt = shake * 0.5;
        player.invincible = INVINCIBLE_F;
        ring(player.x, player.y, '#ffcc00', 18);
        SFX.shieldHit();
        toast('SCHILD ZERSTÖRT', '#ffcc00');
    } else {
        energy      = Math.max(0, energy - loss);
        shakeAmt    = shake;
        player.invincible = INVINCIBLE_F;
        burst(player.x, player.y, color, 16);
        SFX.hit();
        if (extra) extra();
    }
}

function collectItem(it) {
    const col = ['#00ffaa', '#00bbff', '#ffcc00'][it.type];
    ring(it.x, it.y, col, 14);

    if (it.type === 0) {
        energy = Math.min(MAX_ENERGY, energy + 7);
        SFX.pickup();
        toast('+7s ENERGIE', '#00ffaa');
    } else if (it.type === 1) {
        player.speed = BASE_SPEED * 1.55;
        player.speedBoostEnd = Date.now() + 3000;
        SFX.pickup();
        toast('SPEED BOOST!', '#00bbff');
    } else {
        player.hasShield = true;
        document.getElementById('shieldIndicator').style.display = 'block';
        SFX.shieldPickup();
        toast('SCHILD AKTIV', '#ffcc00');
    }
}

function initGame() {
    segments = []; obstacles = []; items = [];
    enemies = []; particles = [];

    player.x = VW / 2; player.y = 650;
    player.vx = 0; player.vy = RISE_SPEED;
    player.invincible = 0;
    player.hasShield  = false;
    player.trail      = [];
    player.speed      = BASE_SPEED;
    player.speedBoostEnd = 0;

    score = 0; energy = START_ENERGY;
    cameraY = 0; worldTopY = 750;
    difficulty = 1; lastMilestone = 0;
    shakeAmt = 0; frame = 0; multiplier = 1;

    createBG();
    genSegment(750, 10);

    document.getElementById('shieldIndicator').style.display  = 'none';
    document.getElementById('multiplierBadge').style.display  = 'none';
    document.getElementById('screenOverlay').classList.add('hidden');
    gameState = 'PLAYING';
}

function endGame() {
    gameState = 'GAMEOVER';
    const newRec = score > highScore;
    if (newRec) { highScore = score; localStorage.setItem('neonHS2', highScore); }
    SFX.gameover();
    setTimeout(() => showGameOver(newRec), 600);
}

function renderMenu(html) {
    document.getElementById('menuBox').innerHTML = html;
    document.getElementById('screenOverlay').classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', initGame);
}

function showMainMenu() {
    renderMenu(`
        <div class="menu-title">NEON ESCAPE</div>
        <div class="menu-subtitle">Vertical Survival</div>
        <p class="menu-desc">
            Steuere dein Schiff aufwärts durch den Neonraum.<br>
            Sammle Orbs — weiche Hindernissen aus.
        </p>
        <div class="item-legend">
            <span style="color:#00ffaa">● Energie</span>
            <span style="color:#00bbff">◆ Speed</span>
            <span style="color:#ffcc00">⬡ Schild</span>
        </div>
        <p class="controls-hint">← → &nbsp;/&nbsp; A D &nbsp;zum Steuern</p>
        <button class="action-btn" id="startBtn">START</button>
        <div class="highscore-display">${highScore > 0 ? '— HIGHSCORE: ' + highScore + 'm —' : ''}</div>
    `);
}

function showGameOver(newRec) {
    renderMenu(`
        <div class="menu-title">ENERGIE LEER</div>
        <div class="menu-subtitle">Game Over</div>
        <div class="score-big">${score}m</div>
        ${newRec ? '<div class="new-record">★ NEUER REKORD ★</div>' : ''}
        <div class="stat-row">
            <span>HIGHSCORE: ${highScore}m</span>
        </div>
        <button class="action-btn" id="startBtn">NOCHMAL</button>
    `);
}

showMainMenu();

function update(delta) {
    if (gameState !== 'PLAYING') return;

    const dt = Math.min(delta, 50);
    frame++;

    if (player.speedBoostEnd && Date.now() > player.speedBoostEnd) {
        player.speed        = BASE_SPEED;
        player.speedBoostEnd = 0;
    }

    energy -= dt / 1000;
    if (energy <= 0) { energy = 0; return endGame(); }

    if (player.invincible > 0) player.invincible--;
    shakeAmt *= 0.80;

    player.vx = 0;
    if (keys['a'] || keys['arrowleft']  || touchLeft)  player.vx = -player.speed;
    if (keys['d'] || keys['arrowright'] || touchRight) player.vx =  player.speed;

    player.x = Math.max(player.r, Math.min(VW - player.r, player.x + player.vx));
    player.y += player.vy;

    player.trail.unshift({ x: player.x, y: player.y });
    if (player.trail.length > TRAIL_LEN) player.trail.pop();

    const camTarget = player.y - VH * 0.65;
    cameraY += (camTarget - cameraY) * 0.14;

    difficulty = 1 + Math.max(0, -player.y / 1500);
    multiplier = Math.min(5, 1 + Math.floor(Math.max(0, -player.y) / 700));

    if (worldTopY > cameraY - VH) {
        genSegment(worldTopY - 50, 9);
    }

    const cullY = cameraY + VH + 300;
    segments  = segments.filter(s  => s.y  < cullY);
    obstacles = obstacles.filter(o => o.y  < cullY);
    items     = items.filter(it    => it.y < cullY);
    enemies   = enemies.filter(e   => e.y  < cullY);

    if (player.invincible === 0) {
        for (const s of segments) {
            if (circleRect(player.x, player.y, player.r, s.x, s.y, s.width, s.height)) {
                handleHit(1.5, '#00ccff', 7);
                if (s.left) {
                    player.x = s.x + s.width + player.r + 1;
                } else {
                    player.x = s.x - player.r - 1;
                }
                player.x = Math.max(player.r, Math.min(VW - player.r, player.x));
                break;
            }
        }
    }

    if (player.invincible === 0) {
        for (const o of obstacles) {
            o.pulse += 0.05;
            if (circleRect(player.x, player.y, player.r, o.x, o.y, o.width, o.height)) {
                handleHit(2.5, '#ff0044', 11, () => { player.y += 16; });
                break;
            }
        }
    }

    for (const e of enemies) {
        e.x += e.speed * e.dir;
        e.rotorAngle += 0.14;
        e.pulse += 0.06;
        if (e.x < 30) { e.x = 30; e.dir = 1; }
        if (e.x > VW - 30) { e.x = VW - 30; e.dir = -1; }

        if (player.invincible === 0) {
            if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
                handleHit(4, '#ff007f', 14, () => { player.y += 20; burst(e.x, e.y, '#ff007f', 20); });
            }
        }
    }

    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.pulse += 0.17;
        if (Math.hypot(player.x - it.x, player.y - it.y) < player.r + it.r + 5) {
            collectItem(it);
            items.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.06;
        p.life--;
        p.alpha = Math.max(0, p.life / 32);
        if (p.life <= 0) particles.splice(i, 1);
    }

    const meters = Math.max(0, Math.floor((700 - player.y) / 7));
    if (meters - lastMilestone >= 100) {
        lastMilestone = Math.floor(meters / 100) * 100;
        burst(player.x, player.y - 35, '#ffff00', 30, 5);
        SFX.milestone();
        toast(lastMilestone + 'm  ×' + multiplier, '#ffff00');
    }
    score = Math.max(score, meters);

    document.getElementById('scoreVal').textContent = String(score).padStart(4, '0') + 'm';
    document.getElementById('timerVal').textContent = energy.toFixed(1) + 's';

    const pct = energy / MAX_ENERGY;
    document.getElementById('energyFill').style.width = (pct * 100) + '%';
    if (pct < 0.25) {
        document.getElementById('energyFill').style.background = 'linear-gradient(90deg,#ff2200,#ff6600)';
        document.getElementById('energyFill').style.boxShadow  = '0 0 8px #ff2200';
    } else {
        document.getElementById('energyFill').style.background = 'linear-gradient(90deg,#ff007f,#ff5566)';
        document.getElementById('energyFill').style.boxShadow  = '0 0 6px #ff007f';
    }

    if (multiplier >= 2) {
        const mb = document.getElementById('multiplierBadge');
        mb.style.display  = 'block';
        mb.textContent    = '× ' + multiplier;
    } else {
        document.getElementById('multiplierBadge').style.display = 'none';
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();

    if (shakeAmt > 0.4) {
        ctx.translate(
            (Math.random() - 0.5) * shakeAmt * scale,
            (Math.random() - 0.5) * shakeAmt * scale
        );
    }

    ctx.scale(scale, scale);

    const bgGrad = ctx.createLinearGradient(0, 0, 0, VH);
    const depth  = Math.min(1, Math.max(0, -cameraY / 3000));
    bgGrad.addColorStop(0, `hsl(${255 - depth * 30}, 85%, ${3 + depth * 2}%)`);
    bgGrad.addColorStop(1, `hsl(${240 - depth * 20}, 90%, ${1.5 + depth}%)`);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, VW, VH);

    nebulae.forEach(n => {
        const dy  = (-cameraY) * n.speed;
        const sy  = ((n.y + dy) % (VH + 200) + VH + 200) % (VH + 200);
        const rg  = ctx.createRadialGradient(n.x, sy, 0, n.x, sy, n.rx);
        const col = `hsla(${n.hue}, 90%, 35%, ${n.alpha})`;
        rg.addColorStop(0, col);
        rg.addColorStop(1, 'hsla(0,0%,0%,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.ellipse(n.x, sy, n.rx, n.ry, 0, 0, Math.PI * 2);
        ctx.fill();
    });

    stars.forEach(s => {
        const dy  = (-cameraY) * s.speed;
        const sy  = ((s.y + dy) % (VH + 60) + VH + 60) % (VH + 60);
        const twk = s.bright * (0.65 + 0.35 * Math.sin(frame * 0.045 + s.phase));
        ctx.globalAlpha = twk;
        ctx.fillStyle   = '#ffffff';
        ctx.fillRect(s.x, sy, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(0, -cameraY);

    ctx.strokeStyle = 'rgba(0,90,160,0.045)';
    ctx.lineWidth   = 1;
    for (let gx = 0; gx <= VW; gx += 60) {
        ctx.beginPath();
        ctx.moveTo(gx, cameraY);
        ctx.lineTo(gx, cameraY + VH);
        ctx.stroke();
    }
    for (let gy = Math.floor(cameraY / 60) * 60; gy < cameraY + VH; gy += 60) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(VW, gy);
        ctx.stroke();
    }

    segments.forEach(s => {
        const sg = ctx.createLinearGradient(s.x, 0, s.x + s.width, 0);
        if (s.left) {
            sg.addColorStop(0,   '#002233');
            sg.addColorStop(0.7, '#005577');
            sg.addColorStop(1,   '#00d4ee');
        } else {
            sg.addColorStop(0,   '#00d4ee');
            sg.addColorStop(0.3, '#005577');
            sg.addColorStop(1,   '#002233');
        }
        ctx.shadowBlur  = 10;
        ctx.shadowColor = '#00aabb';
        ctx.fillStyle   = sg;
        ctx.fillRect(s.x, s.y, s.width, s.height);

        ctx.shadowBlur   = 0;
        ctx.strokeStyle  = 'rgba(0,220,245,0.6)';
        ctx.lineWidth    = 1.2;
        const ex = s.left ? s.x + s.width : s.x;
        ctx.beginPath();
        ctx.moveTo(ex, s.y); ctx.lineTo(ex, s.y + s.height);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;

    obstacles.forEach(o => {
        const p   = 0.6 + 0.4 * Math.sin(o.pulse);
        const og  = ctx.createLinearGradient(o.x, o.y, o.x + o.width, o.y + o.height);
        og.addColorStop(0, '#bb0022');
        og.addColorStop(1, '#ff0055');
        ctx.shadowBlur  = 8 + p * 7;
        ctx.shadowColor = '#ff0044';
        ctx.fillStyle   = og;
        ctx.fillRect(o.x, o.y, o.width, o.height);

        ctx.strokeStyle = 'rgba(255,180,180,0.35)';
        ctx.lineWidth   = 1;
        const cx = o.x + o.width / 2, cy = o.y + o.height / 2;
        ctx.beginPath();
        ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
        ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;

    const ITEM_BASE  = ['#00ffaa', '#00bbff', '#ffcc00'];
    const ITEM_GLOW  = ['#00cc88', '#0088cc', '#cc9900'];
    const ITEM_WHITE = 'rgba(255,255,255,0.8)';

    items.forEach(it => {
        const p   = Math.sin(it.pulse);
        const r   = it.r + p * 2.5;
        const col = ITEM_BASE[it.type];
        const glw = ITEM_GLOW[it.type];

        ctx.globalAlpha = 0.3 + p * 0.15;
        ctx.strokeStyle = col;
        ctx.lineWidth   = 1.2;
        ctx.shadowBlur  = 0;
        ctx.beginPath();
        ctx.arc(it.x, it.y, r + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.shadowBlur  = 20 + p * 8;
        ctx.shadowColor = glw;
        const ig = ctx.createRadialGradient(it.x, it.y - 1, 0, it.x, it.y, r);
        ig.addColorStop(0,   ITEM_WHITE);
        ig.addColorStop(0.35, col);
        ig.addColorStop(1,    glw + 'aa');
        ctx.fillStyle = ig;
        ctx.beginPath();
        ctx.arc(it.x, it.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.7;
        ctx.fillStyle   = '#fff';
        if (it.type === 0) {
            ctx.fillRect(it.x - 3, it.y - 1, 6, 2);
            ctx.fillRect(it.x - 1, it.y - 3, 2, 6);
        } else if (it.type === 1) {
            ctx.beginPath();
            ctx.moveTo(it.x, it.y - 4.5);
            ctx.lineTo(it.x - 3, it.y + 2.5);
            ctx.lineTo(it.x + 3, it.y + 2.5);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth   = 1.2;
            ctx.beginPath();
            for (let h = 0; h < 6; h++) {
                const a = (h / 6) * Math.PI * 2 - Math.PI / 6;
                h === 0
                    ? ctx.moveTo(it.x + Math.cos(a) * 4, it.y + Math.sin(a) * 4)
                    : ctx.lineTo(it.x + Math.cos(a) * 4, it.y + Math.sin(a) * 4);
            }
            ctx.closePath();
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    });
    ctx.shadowBlur = 0;

    enemies.forEach(e => {
        const p = Math.sin(e.pulse);

        ctx.save();
        ctx.translate(e.x, e.y);

        ctx.save();
        ctx.rotate(e.rotorAngle);
        for (let arm = 0; arm < 4; arm++) {
            const a  = (arm / 4) * Math.PI * 2;
            const tx = Math.cos(a) * 16, ty = Math.sin(a) * 16;
            ctx.strokeStyle = 'rgba(255,20,120,0.55)';
            ctx.lineWidth   = 1.8;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tx, ty); ctx.stroke();
            ctx.shadowBlur  = 6; ctx.shadowColor = '#ff007f';
            ctx.fillStyle   = '#ff4499';
            ctx.beginPath(); ctx.arc(tx, ty, 2.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        ctx.shadowBlur  = 12 + p * 5;
        ctx.shadowColor = '#ff007f';
        const eg = ctx.createRadialGradient(0, 0, 0, 0, 0, e.r);
        eg.addColorStop(0,   '#ffffff');
        eg.addColorStop(0.4, '#ff5599');
        eg.addColorStop(1,   '#880033');
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();

        ctx.shadowBlur  = 0;
        ctx.fillStyle   = '#00e8ff';
        ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-1, -1, 1.5, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
    });
    ctx.shadowBlur = 0;

    player.trail.forEach((pt, i) => {
        const t     = 1 - i / TRAIL_LEN;
        const tCol  = player.speedBoostEnd > Date.now() ? '#00bbff'
                    : player.hasShield ? '#ffcc00'
                    : '#00ccff';
        ctx.globalAlpha = t * 0.55;
        ctx.shadowBlur  = 6;
        ctx.shadowColor = tCol;
        ctx.fillStyle   = tCol;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, player.r * t * 0.6, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;

    const blink = player.invincible > 0 && Math.floor(frame / 4) % 2 === 1;
    if (!blink) {
        ctx.save();
        ctx.translate(player.x, player.y);

        if (player.hasShield) {
            const sp = 0.45 + 0.25 * Math.sin(frame * 0.12);
            ctx.globalAlpha = sp;
            ctx.strokeStyle  = '#ffcc00';
            ctx.lineWidth    = 2;
            ctx.shadowBlur   = 18;
            ctx.shadowColor  = '#ffcc00';
            ctx.beginPath();
            ctx.arc(0, 0, player.r + 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.shadowBlur  = 0;
        }

        if (player.speedBoostEnd > Date.now()) {
            const sp = 0.3 + 0.2 * Math.sin(frame * 0.2);
            ctx.globalAlpha = sp;
            ctx.strokeStyle  = '#00bbff';
            ctx.lineWidth    = 2.5;
            ctx.shadowBlur   = 14;
            ctx.shadowColor  = '#00bbff';
            ctx.beginPath();
            ctx.arc(0, 0, player.r + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.shadowBlur  = 0;
        }

        const exhaustLen = 5 + 2 * Math.sin(frame * 0.4);
        ctx.globalAlpha = 0.5 + 0.3 * Math.sin(frame * 0.35);
        ctx.shadowBlur  = 16;
        ctx.shadowColor = '#ff00aa';
        const exGrad = ctx.createRadialGradient(0, player.r * 0.5, 0, 0, player.r * 0.5, exhaustLen);
        exGrad.addColorStop(0, '#ffffff');
        exGrad.addColorStop(0.4, '#ff00aa');
        exGrad.addColorStop(1, 'rgba(255,0,170,0)');
        ctx.fillStyle = exGrad;
        ctx.beginPath();
        ctx.arc(0, player.r * 0.5, exhaustLen, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.shadowBlur  = 22;
        ctx.shadowColor = '#00e0ff';
        const R = player.r;
        ctx.fillStyle   = 'rgba(220,248,255,0.95)';
        ctx.strokeStyle = '#00ddff';
        ctx.lineWidth   = 2;
        ctx.beginPath();
        ctx.moveTo(0,          -R);
        ctx.lineTo(-R * 0.9,   R * 0.55);
        ctx.lineTo(-R * 0.25,  R * 0.3);
        ctx.lineTo(0,           R * 0.5);
        ctx.lineTo( R * 0.25,  R * 0.3);
        ctx.lineTo( R * 0.85,  R * 0.55);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur  = 6;
        ctx.shadowColor = '#00e8ff';
        ctx.fillStyle   = '#00e8ff';
        ctx.beginPath();
        ctx.ellipse(0, -R * 0.28, 3.2, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur  = 0;
        ctx.fillStyle   = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(-R * 0.15, -R * 0.55, 2, 3, -0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        ctx.shadowBlur = 0;
    }

    particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur  = 3;
        ctx.shadowColor = p.color;
        ctx.fillStyle   = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;

    ctx.restore();
    ctx.restore();
}

let lastTime = 0;
function loop(ts) {
    const delta = lastTime ? ts - lastTime : 16;
    lastTime    = ts;
    update(delta);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
