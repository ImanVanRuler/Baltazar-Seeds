<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Escape Deluxe</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial;color:#fff}
#ui{position:fixed;left:10px;top:10px;z-index:2;font-weight:bold}
canvas{display:block;margin:auto;background:#000;image-rendering:pixelated}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
font-size:42px;background:#0009;visibility:hidden;z-index:3;text-align:center}
</style>
</head>
<body>
<div id="ui">Level <span id=lvl>1</span> | Punkte <span id=s>0</span></div>
<div id="msg"></div>
<canvas id="c"></canvas>
<script>
const cv=c,ctx=cv.getContext("2d");
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();onresize=rs;
const tile=32;
let level=1,score=0;
const uiS=s,uiL=lvl,msg=document.getElementById("msg");
const p={x:1,y:1};
let maze=[],coins=[],exit={x:1,y:1};

function makeMaze(w,h){
 maze=Array.from({length:h},()=>Array(w).fill(1));
 function carve(x,y){
   maze[y][x]=0;
   [[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5).forEach(d=>{
     let nx=x+d[0],ny=y+d[1];
     if(nx>0&&ny>0&&nx<w-1&&ny<h-1&&maze[ny][nx]){
       maze[y+d[1]/2][x+d[0]/2]=0;
       carve(nx,ny);
     }
   });
 }
 carve(1,1);
 exit={x:w-2,y:h-2};
 maze[exit.y][exit.x]=0;
 coins=[];
 for(let i=0;i<12;i++){
   let x,y;
   do{x=1+2*(Math.random()*((w-2)/2)|0);y=1+2*(Math.random()*((h-2)/2)|0);}
   while(maze[y][x]);
   coins.push({x,y});
 }
 p.x=1;p.y=1;
}
makeMaze(31,21);

addEventListener("keydown",e=>{
 let dx=0,dy=0;
 if(e.key=="ArrowLeft"||e.key=="a")dx=-1;
 if(e.key=="ArrowRight"||e.key=="d")dx=1;
 if(e.key=="ArrowUp"||e.key=="w")dy=-1;
 if(e.key=="ArrowDown"||e.key=="s")dy=1;
 let nx=p.x+dx,ny=p.y+dy;
 if(maze[ny]&&maze[ny][nx]===0){p.x=nx;p.y=ny;}
 coins=coins.filter(c=>{
   if(c.x===p.x&&c.y===p.y){score+=10;uiS.textContent=score;return false;}
   return true;
 });
 if(p.x===exit.x&&p.y===exit.y){
   level++;uiL.textContent=level;score+=100;uiS.textContent=score;
   makeMaze(31,21);
 }
});

function draw(){
 ctx.fillStyle="#000";ctx.fillRect(0,0,cv.width,cv.height);
 const ox=(cv.width-31*tile)/2, oy=(cv.height-21*tile)/2;
 for(let y=0;y<21;y++)for(let x=0;x<31;x++){
   ctx.fillStyle=maze[y][x]?"#234":"#ddd";
   ctx.fillRect(ox+x*tile,oy+y*tile,tile-1,tile-1);
 }
 ctx.fillStyle="gold";
 coins.forEach(c=>{ctx.beginPath();ctx.arc(ox+c.x*tile+16,oy+c.y*tile+16,6,0,7);ctx.fill();});
 ctx.fillStyle="#0f0";
 ctx.fillRect(ox+p.x*tile+6,oy+p.y*tile+6,20,20);
 ctx.fillStyle="#0af";
 ctx.fillRect(ox+exit.x*tile+4,oy+exit.y*tile+4,24,24);
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
