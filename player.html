<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Vertical Escape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06020f;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Spielfeld-Zentrierung */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #110724 0%, #06020f 100%);
        }

        canvas#gameCanvas {
            display: block;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.1);
            background: #090414;
        }


    /* Interface Layer */
        #uiLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* HUD oben */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-panel {
            background: rgba(13, 6, 28, 0.85);
            border: 2px solid #00f2fe;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(5px);
        }

        .hud-label {
            font-size: 11px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
        }

        .hud-value {
            font-size: 20px;
            font-family: monospace;
            font-weight: bold;
            color: #ffffff;
        }

        #timerPanel {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }

        #timerPanel .hud-label {
            color: #ff007f;
        }

        /* Overlays (Start / Game Over) */
        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 2, 15, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        .screen-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-box {
            text-align: center;
            padding: 40px;
            background: rgba(17, 7, 36, 0.9);
            border: 2px solid #00f2fe;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .menu-title {
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-desc {
            font-size: 14px;
            color: #a59cb8;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        button.action-btn {
            background: linear-gradient(135deg, #00f2fe, #ff007f);
            border: none;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }

        /* Touch-Steuerung */
        #touchControls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            display: none; /* Wird per JS auf Mobilgeräten aktiviert */
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(17, 7, 36, 0.8);
            border: 2px solid #00f2fe;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00f2fe;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>


<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="uiLayer">
            <!-- HUD -->
            <div id="hud">
                <div class="hud-panel" id="scorePanel">
                    <span class="hud-label">Distanz</span>
                    <span id="scoreVal" class="hud-value">0m</span>
                </div>
                <div class="hud-panel" id="timerPanel">
                    <span class="hud-label">Zeit übrig</span>
                    <span id="timerVal" class="hud-value">30.0s</span>
                </div>
            </div>

            <!-- Start- / Game Over-Bildschirm -->
            <div id="screenOverlay" class="screen-overlay">
                <div class="menu-box">
                    <h1 class="menu-title" id="menuTitle">Neon Escape</h1>
                    <p class="menu-desc" id="menuDesc">
                        Weiche den Hindernissen aus und entkomme nach oben! Sammle Zeitzellen, um den Countdown aufzuhalten, und passe auf die feindlichen Drohnen auf.
                    </p>
                    <button class="action-btn" id="startBtn">Starten</button>
                </div>
            </div>

            <!-- Mobile Touch-Tasten -->
            <div id="touchControls" class="hidden">
                <div class="touch-btn" id="btnLeft">◀</div>
                <div class="touch-btn" id="btnRight">▶</div>
            </div>
        </div>
    </div>


         <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Konstanten für das Spielfeld
        const VIRTUAL_WIDTH = 480;
        const VIRTUAL_HEIGHT = 800;

        // Spielzustand
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let timeRemaining = 30.0;
        let cameraY = 0; // Folgt dem Spieler nach oben

        // Entitäten-Listen
        let player = {
            x: VIRTUAL_WIDTH / 2,
            y: 700,
            radius: 14,
            speed: 6,
            vx: 0,
            vy: -3 // Permanente Aufwärtsbewegung
        };
        let segments = []; // Labyrinth-Wände segmentweise generiert
        let obstacles = [];
        let items = [];
        let enemies = [];
        let particles = [];

        // Eingabe-Tracker
        let keys = {};

        // Canvas-Skalierung für scharfe Render-Optik
        function resizeCanvas() {
            const windowHeight = window.innerHeight;
            const targetWidth = (windowHeight * VIRTUAL_WIDTH) / VIRTUAL_HEIGHT;
            
            canvas.height = windowHeight;
            canvas.width = Math.min(window.innerWidth, targetWidth);
            
            // Erkennung für Mobilgeräte für Touch-Steuerung
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touchControls').style.display = 'flex';
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- WEB AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;

            if (type === 'pickup') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } 
            else if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            else if (type === 'start') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(261.63, now); // C4
                osc.frequency.setValueAtTime(329.63, now + 0.1); // E4
                osc.frequency.setValueAtTime(392.00, now + 0.2); // G4
                osc.frequency.setValueAtTime(523.25, now + 0.3); // C5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            }
        }


           // Generiert Wände und Objekte basierend auf der vertikalen Höhe (y-Achse)
        function generateSegment(startY, endY) {
            // Generiert alle 150 Pixel neue Barrieren/Plattformen
            for (let y = startY; y > endY; y -= 150) {
                const wallWidth = 100 + Math.random() * 120;
                const side = Math.random() > 0.5 ? 'left' : 'right';
                
                // Labyrinth-Wand links oder rechts platzieren
                segments.push({
                    x: side === 'left' ? 0 : VIRTUAL_WIDTH - wallWidth,
                    y: y,
                    width: wallWidth,
                    height: 25,
                    color: '#00f2fe'
                });

                // Hindernisse in der Mitte generieren
                if (Math.random() > 0.4) {
                    obstacles.push({
                        x: 80 + Math.random() * (VIRTUAL_WIDTH - 160),
                        y: y - 75,
                        width: 40 + Math.random() * 60,
                        height: 20,
                        color: '#ff0055'
                    });
                }

                // Zeit-Zellen (Sammelobjekt) platzieren
                if (Math.random() > 0.3) {
                    items.push({
                        x: 50 + Math.random() * (VIRTUAL_WIDTH - 100),
                        y: y - 40,
                        radius: 8,
                        color: '#00ffaa',
                        pulse: 0
                    });
                }

                // Feindliche Drohnen hinzufügen (bewegen sich horizontal)
                if (Math.random() > 0.5 && y < 500) {
                    enemies.push({
                        x: 50 + Math.random() * (VIRTUAL_WIDTH - 100),
                        y: y - 110,
                        radius: 12,
                        speed: 2 + Math.random() * 3,
                        dir: Math.random() > 0.5 ? 1 : -1,
                        color: '#ff007f'
                    });
                }
            }
        }

        // Bereinigt alte Objekte, die außerhalb des Bildschirms liegen, um Speicher zu sparen
        function cleanupEntities() {
            segments = segments.filter(s => s.y > cameraY - 100);
            obstacles = obstacles.filter(o => o.y > cameraY - 100);
            items = items.filter(i => i.y > cameraY - 100);
            enemies = enemies.filter(e => e.y > cameraY - 100);
            particles = particles.filter(p => p.alpha > 0);
        }


    // Erzeugt Partikel-Explosionen bei Kollisionen oder Sammel-Aktionen
        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 2 + Math.random() * 4,
                    color: color,
                    alpha: 1.0,
                    decay: 0.02 + Math.random() * 0.03
                });
            }
        }

        // Aktualisiert die Bewegung und Transparenz der Partikel
        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
            });
        }


      // Tastatur-Events registrieren
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        // Touch-Steuerung für mobile Geräte (Weiche Abfrage)
        let touchLeft = false;
        let touchRight = false;

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); touchLeft = true; }, { passive: false });
        btnLeft.addEventListener('touchend', () => { touchLeft = false; });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); touchRight = true; }, { passive: false });
        btnRight.addEventListener('touchend', () => { touchRight = false; });

        // Berechnet die aktuelle Bewegungsrichtung des Spielers
        function handleInput() {
            player.vx = 0;
            
            if (keys['a'] || keys['arrowleft'] || touchLeft) {
                player.vx = -player.speed;
            }
            if (keys['d'] || keys['arrowright'] || touchRight) {
                player.vx = player.speed;
            }
        }


          // Hilfsfunktion zur Kollisionserkennung zwischen Kreis und Rechteck
        function checkCircleRectCollision(circle, rect) {
            const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
            const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
            
            const distanceX = circle.x - closestX;
            const distanceY = circle.y - closestY;
            const distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);
            
            return distanceSquared < (circle.radius * circle.radius);
        }

        // Kern-Spiellogik und Updates pro Frame
        function update(deltaTime) {
            if (gameState !== 'PLAYING') return;

            // Zeit-Countdown reduzieren (in Sekunden)
            timeRemaining -= deltaTime / 1000;
            if (timeRemaining <= 0) {
                timeRemaining = 0;
                endGame();
                return;
            }

            // Spieler bewegen
            handleInput();
            player.x += player.vx;
            player.y += player.vy;

            // Spielfeldrand-Kollision (Seitlich einperren)
            if (player.x - player.radius < 0) player.x = player.radius;
            if (player.x + player.radius > VIRTUAL_WIDTH) player.x = VIRTUAL_WIDTH - player.radius;

            // Kamera folgt dem Spieler flüssig nach oben
            const targetCameraY = player.y - VIRTUAL_HEIGHT * 0.7;
            cameraY += (targetCameraY - cameraY) * 0.1;

            // Endlose Labyrinth-Generierung triggern
            const lowestGeneratedY = segments.length > 0 ? segments[segments.length - 1].y : 800;
            if (cameraY < lowestGeneratedY + VIRTUAL_HEIGHT) {
                generateSegment(lowestGeneratedY, lowestGeneratedY - 1000);
            }

            // 1. Kollision: Labyrinth-Wände (Stoppt Aufwärtsbewegung / wirft zurück)
            segments.forEach(seg => {
                if (checkCircleRectCollision(player, seg)) {
                    player.y += 8; // Zurückwerfen
                    playSound('hit');
                    spawnParticles(player.x, player.y, '#00f2fe', 8);
                }
            });

            // 2. Kollision: Hindernisse (Zeitabzug bei Treffer)
            obstacles.forEach(obs => {
                if (checkCircleRectCollision(player, obs)) {
                    timeRemaining -= 3; // 3 Sekunden Strafe
                    player.y += 15; // Starker Rückstoß
                    playSound('hit');
                    spawnParticles(player.x, player.y, '#ff0055', 12);
                }
            });

            // 3. Kollision: Gegner-Drohnen (Bewegung und Treffer)
            enemies.forEach(enemy => {
                // Horizontale Patrouille
                enemy.x += enemy.speed * enemy.dir;
                if (enemy.x - enemy.radius < 20 || enemy.x + enemy.radius > VIRTUAL_WIDTH - 20) {
                    enemy.dir *= -1; // Richtung wechseln
                }

                // Spieler-Distanz prüfen
                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist < player.radius + enemy.radius) {
                    timeRemaining -= 5; // 5 Sekunden Strafe
                    player.y += 20;
                    playSound('hit');
                    spawnParticles(enemy.x, enemy.y, '#ff007f', 15);
                }
            });

            // 4. Kollision: Zeit-Zellen aufsammeln
            items.forEach((item, index) => {
                item.pulse += 0.1;
                const dist = Math.hypot(player.x - item.x, player.y - item.y);
                if (dist < player.radius + item.radius) {
                    timeRemaining = Math.min(45, timeRemaining + 6); // Max 45s aufladen
                    playSound('pickup');
                    spawnParticles(item.x, item.y, '#00ffaa', 10);
                    items.splice(index, 1); // Objekt entfernen
                }
            });

            // Partikel aktualisieren und aufräumen
            updateParticles();
            cleanupEntities();

            // Score berechnen anhand der erreichten Höhe
            const currentScore = Math.floor((700 - player.y) / 10);
            if (currentScore > score) score = currentScore;

            // HUD UI aktualisieren
            document.getElementById('scoreVal').innerText = score + 'm';
            document.getElementById('timerVal').innerText = timeRemaining.toFixed(1) + 's';
        }


       .screen-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }
 

               // Die Render-Pipeline für alle visuellen Elemente auf dem Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Matrix-Verschiebung basierend auf der Kamera-Höhe aktivieren
            ctx.save();
            
            // Berechne Skalierungsfaktor und horizontale Zentrierung
            const scale = canvas.height / VIRTUAL_HEIGHT;
            const viewportOffsetX = (canvas.width - (VIRTUAL_WIDTH * scale)) / 2;
            
            // Spielfeld auf dem physischen Bildschirm zentrieren und skalieren
            ctx.translate(viewportOffsetX, 0);
            ctx.scale(scale, scale);
            
            // Kamera-Bewegung auf der Y-Achse anwenden
            ctx.translate(0, -cameraY);

            // Spielfeld-Hintergrundbegrenzung zeichnen (Visueller Rahmen)
            ctx.fillStyle = '#05020a';
            ctx.fillRect(0, cameraY, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            // 1. Labyrinth-Wände zeichnen (Neon-Glow-Optik)
            segments.forEach(seg => {
                ctx.fillStyle = seg.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = seg.color;
                ctx.fillRect(seg.x, seg.y, seg.width, seg.height);
            });
            ctx.shadowBlur = 0; // Glow zurücksetzen

            // 2. Hindernisse zeichnen
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // 3. Zeit-Zellen zeichnen (mit leichtem Pulsieren)
            items.forEach(item => {
                const pulseRadius = item.radius + Math.sin(item.pulse) * 2;
                ctx.fillStyle = item.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = item.color;
                ctx.beginPath();
                ctx.arc(item.x, item.y, pulseRadius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 4. Feindliche Drohnen zeichnen
            enemies.forEach(enemy => {
                // Wenn der Gegner auf Cooldown ist, blinkt er leicht transparent
                ctx.globalAlpha = enemy.hitCooldown > 0 ? 0.4 : 1.0;
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 5. Partikel-Effekte zeichnen
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0; // Alpha zurücksetzen

            // 6. Spieler zeichnen (mit eigenem Lichtradius)
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Kamera-Matrix-Verschiebung wieder aufheben
            ctx.restore();
        }

        // Haupt-Zeitschleife (Game-Loop)
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }
        // Initialisiert ein komplett neues Spiel
        function initGame() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Alle Listen leeren
            segments = [];
            obstacles = [];
            items = [];
            enemies = [];
            particles = [];

            // Spieler-Eigenschaften zurücksetzen
            player.x = VIRTUAL_WIDTH / 2;
            player.y = 700;
            score = 0;
            timeRemaining = 30.0;
            cameraY = 0;

            // Erstes Start-Segment generieren
            generateSegment(600, -400);

            // Interface ausblenden und Spiel starten
            document.getElementById('screenOverlay').classList.add('hidden');
            gameState = 'PLAYING';
            playSound('start');
        }

        // Beendet das Spiel bei Zeitablauf
        function endGame() {
            gameState = 'GAMEOVER';
            playSound('hit');

            document.getElementById('menuTitle').innerText = 'Game Over';
            document.getElementById('menuDesc').innerHTML = `Deine Energie ist instabil geworden.<br><br><strong>Erreichte Distanz: ${score} Meter</strong>`;
            document.getElementById('startBtn').innerText = 'Erneut versuchen';
            document.getElementById('screenOverlay').classList.remove('hidden');
        }

        // Event-Listener für den Start-Button
        document.getElementById('startBtn').addEventListener('click', initGame);

        // Core Launch: Startet die Grafik-Schleife im Hintergrund
        requestAnimationFrame((timestamp) => {
            lastTime = timestamp;
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
