<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maze Escape</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

html,body{
overflow:hidden;
background:#000;
width:100%;
height:100%;
font-family:Arial,Helvetica,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
background:#111;
}

#hud{
position:fixed;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:0 0 10px black;
pointer-events:none;
z-index:100;
}

#message{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:white;
font-size:70px;
font-weight:bold;
display:none;
text-align:center;
text-shadow:0 0 25px black;
z-index:200;
}

#touch{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
z-index:100;
}

.btn{
width:85px;
height:85px;
border-radius:50%;
background:rgba(255,255,255,.15);
border:2px solid white;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:40px;
backdrop-filter:blur(5px);
}

@media (min-width:900px){
#touch{
display:none;
}
}
</style>

</head>
<body>

<div id="hud">

<div>
Punkte:
<span id="score">0</span>
</div>

<div>
Zeit:
<span id="time">90</span>
</div>

</div>

<div id="message"></div>

<canvas id="game"></canvas>

<div id="touch">

<div class="btn" id="left">
◀
</div>

<div class="btn" id="right">
▶
</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);

let score=0;
let timer=90;
let gameRunning=true;

const player={

x:0,
y:0,

w:34,
h:34,

speed:5,

color:"#00ff66"

};

function spawnPlayer(){

player.x=canvas.width/2-player.w/2;
player.y=canvas.height-120;

}

spawnPlayer();

const keys={};

window.addEventListener("keydown",e=>{

keys[e.key]=true;

});

window.addEventListener("keyup",e=>{

keys[e.key]=false;

});

let leftTouch=false;
let rightTouch=false;

function bind(id,value){

const b=document.getElementById(id);

b.addEventListener("touchstart",e=>{

e.preventDefault();
window[value]=true;

});

b.addEventListener("touchend",e=>{

e.preventDefault();
window[value]=false;

});

}

bind("left","leftTouch");
bind("right","rightTouch");

let scrollSpeed=2;

let cameraY=0;

function update(){

if(!gameRunning)return;

cameraY+=scrollSpeed;

if(keys["ArrowLeft"]||keys["a"]||leftTouch){

player.x-=player.speed;

}

if(keys["ArrowRight"]||keys["d"]||rightTouch){

player.x+=player.speed;

}

if(player.x<0)player.x=0;

if(player.x+player.w>canvas.width){

player.x=canvas.width-player.w;

}

if(player.y<cameraY){

gameOver("ZU LANGSAM");

}

}

function drawBackground(){

ctx.fillStyle="#111";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="#222";

for(let y=-100;y<canvas.height+100;y+=50){

ctx.beginPath();
ctx.moveTo(0,y+(cameraY%50));
ctx.lineTo(canvas.width,y+(cameraY%50));
ctx.stroke();

}

}

function drawPlayer(){

ctx.fillStyle=player.color;

ctx.fillRect(

player.x,

player.y-cameraY,

player.w,

player.h

);

}

function draw(){

drawBackground();

drawPlayer();

}

function gameLoop(){

update();

draw();

requestAnimationFrame(gameLoop);

}

gameLoop();

setInterval(()=>{

if(!gameRunning)return;

timer--;

document.getElementById("time").textContent=timer;

if(timer<=0){

gameOver("ZEIT ABGELAUFEN");

}

},1000);

function addScore(v){

score+=v;

document.getElementById("score").textContent=score;

}

function gameOver(text){

gameRunning=false;

const m=document.getElementById("message");

m.style.display="block";

m.innerHTML=text+"<br><br>ENTER = Neustart";

}

window.addEventListener("keydown",e=>{

if(e.key==="Enter"&&!gameRunning){

location.reload();

}

});

</script>

</body>
</html>
