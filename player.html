<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psychedelic Sound Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow: 0 0 15px rgba(0, 255, 213, 0.6);
      --glow-intense: 0 0 30px rgba(157, 0, 255, 0.8), 0 0 50px rgba(0, 255, 217, 0.5);
      --bg-gradient: linear-gradient(270deg, #1a0033, #000f26, #2a003a, #001a17);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-size: 800% 800%;
      animation: bgshift 16s ease infinite;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 16px;
      overflow-x: hidden;
    }

    @keyframes bgshift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 50px;
      text-shadow: var(--glow-intense);
      animation: pulse 2.5s ease-in-out infinite alternate;
      color: #a0f7ff;
    }

    @keyframes pulse {
      from { opacity: 0.8; text-shadow: var(--glow); }
      to { opacity: 1; text-shadow: var(--glow-intense); }
    }

    .player {
      background: rgba(20, 20, 40, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
      padding: 18px;
      margin: 18px 0;
      text-align: center;
      transition: all 0.35s ease;
      box-shadow: var(--glow);
    }

    .player:hover {
      transform: translateY(-4px);
      box-shadow: var(--glow-intense);
      border-color: rgba(0, 255, 213, 0.5);
    }

    h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 1.2px;
      color: #e0f7ff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    /* Styling der nativen Audio-Controls */
    audio::-webkit-media-controls-panel {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-volume-slider,
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display {
      filter: drop-shadow(0 0 6px #00ffcc);
    }

    .download {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 18px;
      background: linear-gradient(135deg, #00ffcc, #9d00ff);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1.3px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .download:hover {
      background: linear-gradient(135deg, #ff00c8, #00ffcc);
      box-shadow: 0 0 20px rgba(157, 0, 255, 0.7);
      transform: scale(1.06);
    }

    footer {
      margin-top: 60px;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
      letter-spacing: 1px;
    }

    footer a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      color: #a0f7ff;
      text-shadow: 0 0 10px #00ffcc;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .player { padding: 16px; }
      h1 { margin-bottom: 40px; }
    }
  </style>
</head>
<body>

  <h1>🌀 Psychedelic Sound Portal 🌀</h1>

  <div class="player">

    <audio controls preload="metadata">

  <footer>
    © 2025 – Psychedelic Sound Portal | Designed by <a href="#">IMAN VAN RULER</a>

</body>
</html>
