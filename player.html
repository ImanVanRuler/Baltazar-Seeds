<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mein Musik Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 10px;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
    }
    .player {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px 30px;
      margin-bottom: 25px;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    audio {
      width: 100%;
      outline: none;
      margin-top: 10px;
    }
    .download {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      background-color: #1db954;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    .download:hover {
      background-color: #17a84b;
    }
    footer {
      margin-top: 40px;
      opacity: 0.7;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>🎧 Meine Musik</h1>

  <!-- Player Beispiel -->
  <div class="player">
    <h3>Track 1 – Beispiel</h3>
    <audio controls>
      <source src="track1.mp3" type="audio/mpeg">
      Dein Browser unterstützt kein Audio-Element.
    </audio>
    <a class="download" href="track1.mp3" download>Download</a>
  </div>

  <div class="player">
    <h3>Track 2 – Beispiel</h3>
    <audio controls>
      <source src="track2.mp3" type="audio/mpeg">
      Dein Browser unterstützt kein Audio-Element.
    </audio>
    <a class="download" href="track2.mp3" download>Download</a>
  </div>

  <div class="player">
    <h3>Track 3 – Beispiel</h3>
    <audio controls>
      <source src="track3.mp3" type="audio/mpeg">
      Dein Browser unterstützt kein Audio-Element.
    </audio>
    <a class="download" href="track3.mp3" download>Download</a>
  </div>

  <footer>© 2025 – Dein Name / GitHub Music Page</footer>
</body>
</html>
