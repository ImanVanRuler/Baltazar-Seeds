--bd-mono);letter-spacing:.16em;text-transform:uppercase}\n#bd-hud .hud-top,#bd-hud .hud-bottom{position:absolute;left:18px;right:18px;display:flex;\njustify-content:space-between;align-items:center}\n#bd-hud .hud-top{top:13px}#bd-hud .hud-bottom{bottom:12px}\n#bd-hud .hud-left,#bd-hud .hud-right{display:flex;align-items:center;gap:14px}\n#bd-hud .hud-right{text-align:right}\n#bd-hud .hud-mark{width:6px;height:6px;background:var(--bd-green-hot);\nbox-shadow:0 0 10px rgba(183,213,143,.55);animation:bdBlink 1.7s steps(2,end) infinite}\n#bd-hud .hud-rule{width:48px;height:1px;background:currentColor;opacity:.45}\n#bd-hud .hud-coordinates{opacity:.55}\n#bd-hud .hud-bottom{opacity:.36}\n#bd-hud .hud-corner{position:absolute;width:23px;height:23px;opacity:.42}\n#bd-hud .hud-corner.tl{top:10px;left:10px;border-top:1px solid var(--bd-green);border-left:1px solid var(--bd-green)}\n#bd-hud .hud-corner.tr{top:10px;right:10px;border-top:1px solid var(--bd-green);border-right:1px solid var(--bd-green)}\n#bd-hud .hud-corner.bl{bottom:10px;left:10px;border-bottom:1px solid var(--bd-green);border-left:1px solid var(--bd-green)}\n#bd-hud .hud-corner.br{bottom:10px;right:10px;border-bottom:1px solid var(--bd-green);border-right:1px solid var(--bd-green)}\n@keyframes bdBlink{0%,46%{opacity:1}47%,100%{opacity:.18}}\n\n/* Terminal strip */\n#bd-terminal{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:9996;\nwidth:min(760px,calc(100vw - 40px));pointer-events:none;color:rgba(180,201,179,.52);\nfont:8px/1.5 var(--bd-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;\nopacity:0;transition:opacity .4s ease}\n#bd-terminal.visible{opacity:1}\n#bd-terminal span{display:inline-block;border-left:1px solid rgba(183,213,143,.45);\npadding-left:8px;animation:bdCursor 1s steps(1,end) infinite}\n@keyframes bdCursor{0%,45%{border-color:rgba(183,213,143,.45)}46%,100%{border-color:transparent}}\n\n/* Shell */\n.app{width:min(1520px,calc(100% - 20px))!important;margin:10px auto 0!important;\nborder:1px solid var(--bd-line-strong)!important;background:rgba(3,5,4,.92)!important;\nbox-shadow:0 0 0 1px rgba(0,0,0,.7),0 28px 100px rgba(0,0,0,.68),\ninset 0 0 80px rgba(102,141,95,.025)!important;position:relative}\n.app::before{content:\"ARCHIVE_NODE // BZ-SEEDS\";position:absolute;top:7px;right:14px;z-index:5001;\ncolor:rgba(183,213,143,.26);font:7px var(--bd-mono);letter-spacing:.14em;pointer-events:none}\n.topbar{background:rgba(4,7,5,.96)!important;border-bottom:1px solid var(--bd-line)!important;\nbackdrop-filter:blur(12px)!important}\n.brandMark{background:#050805!important;color:var(--bd-green-hot)!important;\nborder:1px solid var(--bd-line-strong)!important;box-shadow:inset 0 0 18px rgba(130,170,115,.04)!important}\n.brandText strong,.brandText small{font-family:var(--bd-mono)!important}\n.brandText strong{color:var(--bd-text)!important;letter-spacing:.08em!important;text-transform:uppercase}\n.brandText small{color:var(--bd-dim)!important}\n.topNav a,.topNav button{color:var(--bd-dim)!important;border-color:transparent!important;background:transparent!important}\n.topNav a:hover,.topNav button:hover{color:var(--bd-green-hot)!important;\nbackground:rgba(145,175,135,.045)!important;border-color:var(--bd-line)!important}\n.topStatus{color:var(--bd-dim)!important}\n.statusDot{background:var(--bd-green-hot)!important;\nbox-shadow:0 0 0 3px rgba(183,213,143,.07),0 0 12px rgba(183,213,143,.24)!important}\n\n/* Sidebar */\n.sidebar{background:#050806!important;border-right:1px solid var(--bd-line)!important}\n.sideLabel,.sideNav button,.sideNav a,.sideBottom p{font-family:var(--bd-mono)!important}\n.sideLabel{color:var(--bd-faint)!important}\n.sideNav button,.sideNav a{color:var(--bd-dim)!important;border:1px solid transparent!important;background:transparent!important}\n.sideNav button:hover,.sideNav a:hover,.sideNav .active{color:var(--bd-green-hot)!important;\nbackground:rgba(135,165,125,.035)!important;border-color:var(--bd- ne */\n.timeline::before{background:rgba(160,190,153,.18)!important}\n.timeDot{background:#050805!important;border-color:var(--bd-green)!important;box-shadow:0 0 12px rgba(155,195,135,.12)}\n.timeCard{background:rgba(7,11,8,.72)!important;border-color:var(--bd-line)!important;box-shadow:none!important}\n.timeCard:hover{background:rgba(12,18,13,.92)!important;border-color:var(--bd-line-strong)!important;\nbox-shadow:inset 3px 0 0 var(--bd-green),0 8px 30px rgba(0,0,0,.28)!important}\n.timeCard h3{color:var(--bd-text)!important}\n\n/* Reports */\n.reportGrid{gap:8px!important}\n.report{background:rgba(6,10,7,.72)!important;border-color:var(--bd-line)!important;box-shadow:none!important}\n.report:hover{background:rgba(10,15,11,.94)!important;border-color:var(--bd-line-strong)!important;box-shadow:inset 3px 0 0 var(--bd-green)!important}\n.reportTop{border-bottom-color:var(--bd-line)!important}.reportType{color:var(--bd-green)!important}\n.reportBody h3{color:var(--bd-text)!important}\n.fact{color:var(--bd-dim)!important;border-color:var(--bd-line)!important;background:rgba(150,180,140,.025)!important}\n.reportLink{background:#050805!important;color:var(--bd-green)!important;border-color:var(--bd-line-strong)!important}\n.reportLink:hover{background:var(--bd-green)!important;color:#020302!important;border-color:var(--bd-green)!important}\n\n/* Images */\n.journalCard,.dualCard,.compareCard{background:#050805!important;border-color:var(--bd-line)!important}\n.journalCard::after,.dualCard::after{content:\"\";position:absolute;inset:0;pointer-events:none;\nbackground:linear-gradient(90deg,rgba(2,4,3,.12),transparent 35%,rgba(2,4,3,.26)),\nrepeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.045) 3px 4px);z-index:3}\n.journalOverlay{background:linear-gradient(transparent,rgba(0,0,0,.92))!important}\n.journalOverlay span,.dualInfo small{color:var(--bd-green-hot)!important;font-family:var(--bd-mono)!important}\n.dualInfo{background:#060a07!important;border-left-color:var(--bd-line)!important}\n.dualInfo strong{color:var(--bd-text)!important}\n\n/* Compare */\n.compareCard{background:#060907!important}.compareHead{border-bottom-color:var(--bd-line)!important}\n.compareHead b,.compareContent h3{color:var(--bd-text)!important}.compareHead span{color:var(--bd-faint)!important}\n.compareList{border-top-color:var(--bd-line)!important}.compareList div{border-bottom-color:var(--bd-line)!important;color:var(--bd-dim)!important}\n.compareList b{color:var(--bd-text)!important}\n\n/* Lineage */\n.lineage{background:#050806!important;border-color:var(--bd-line)!important}\n.lineNode{background:#070c08!important;border-color:var(--bd-line)!important}\n.lineNode::after,.lineNode small{color:var(--bd-green)!important}\n.lineNode strong{color:var(--bd-text)!important}\n\n/* Sources */\n.sourceCard{background:#050806!important;border-color:var(--bd-line)!important}\n.sourceCard:hover{background:#0a100c!important;border-color:var(--bd-line-strong)!important}\n.sourceCard a{color:var(--bd-green-hot)!important}.sourceCard a:hover{color:#d6e9c5!important;text-decoration:underline;text-underline-offset:4px}\n\n/* Support */\n.support,#support,.drawer,#supportDrawer,#contactDrawer,.toast{font-family:var(--bd-mono)!important}\n.support{background:#050806!important;border-color:var(--bd-line)!important}\n.support h2,.support h3{font-family:var(--bd-mono)!important;font-weight:400!important}\n.support h2 span{color:var(--bd-green-hot)!important}\n\n/* Age gate */\n#ageGate{background:linear-gradient(rgba(183,213,143,.018) 1px,transparent 1px),\nlinear-gradient(90deg,rgba(183,213,143,.012) 1px,transparent 1px),rgba(2,4,3,.985)!important;\nbackground-size:28px 28px,28px 28px,auto!important;backdrop-filter:blur(7px)!important}\n.ageWindow{background:#060a07!important;border:1px solid var(--bd-line-strong)!important;\nbox-shadow:0 0 0 1px rgba(0,0,0,.9),0 40px 120px rgba(0,0,0,.82),inset 0 0 50px rgba(130,170,115,.025)!important}\n.windowBar{background:# archive...\u003c/span>\u003c/div>\n\u003cscript id=\"baltazar-dark-digital-layer\">\n(function(){\n  \"use strict\";\n  var clock=document.getElementById(\"bd-clock\");\n  var status=document.getElementById(\"bd-status\");\n  var terminal=document.getElementById(\"bd-terminal\");\n  var terminalText=document.getElementById(\"bd-terminal-text\");\n  function pad(n){return String(n).padStart(2,\"0\")}\n  function tick(){\n    var d=new Date();\n    if(clock) clock.textContent=pad(d.getHours())+\":\"+pad(d.getMinutes())+\":\"+pad(d.getSeconds());\n  }\n  tick();setInterval(tick,1000);\n  var messages=[\"field archive loaded\",\"source index verified\",\"image journal online\",\n    \"genetic continuity linked\",\"grower.ch references retained\",\"support channel ready\",\"archive node stable\"];\n  var msgIndex=0;\n  function pulseMessage(){\n    if(!terminalText)return;\n    terminalText.textContent=messages[msgIndex%messages.length];msgIndex++;\n    if(terminal){terminal.classList.add(\"visible\");setTimeout(function(){terminal.classList.remove(\"visible\")},1700)}\n  }\n  setTimeout(pulseMessage,900);setInterval(pulseMessage,9000);\n  document.addEventListener(\"click\",function(event){\n    var link=event.target.closest?event.target.closest(\"a\"):null;\n    if(!link)return;\n    var href=link.getAttribute(\"href\")||\"\";\n    if(href.charAt(0)===\"#\"){\n      if(status)status.textContent=\"NAV // \"+href.slice(1).toUpperCase();\n      setTimeout(function(){if(status)status.textContent=\"READY\"},1600);\n    }\n    if(/^https?:\\/\\//i.test(href)){\n      if(status)status.textContent=\"EXTERNAL // OPEN\";\n      setTimeout(function(){if(status)status.textContent=\"READY\"},1200);\n    }\n  },true);\n  document.addEventListener(\"mousemove\",function(event){\n    document.documentElement.style.setProperty(\"--bd-mx\",(event.clientX/Math.max(window.innerWidth,1)).toFixed(3));\n  },{passive:true});\n})();\n\u003c/script>\n\n\n\u003c!-- =========================================================\n     AGE GATE\n     ========================================================= -->\n\n\u003cdiv id=\"ageGate\" aria-modal=\"true\" role=\"dialog\" aria-labelledby=\"ageTitle\">\n  \u003cdiv class=\"ageWindow\">\n    \u003cdiv class=\"windowBar\">\n      \u003cdiv class=\"windowDots\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n      \u003cdiv class=\"windowCode\">FIELD ARCHIVE / ACCESS\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ageBody\">\n      \u003cdiv class=\"ageKicker\">Baltazar Seeds / documented archive\u003c/div>\n      \u003ch1 class=\"ageTitle\" id=\"ageTitle\">18+ \u003cspan>only.\u003c/span>\u003c/h1>\n      \u003cp class=\"ageText\">\n        This website contains cannabis related material and is intended for adults only.\n        Enter only if you are legally permitted to view this material in your location.\n      \u003c/p>\n      \u003cdiv class=\"ageActions\">\n        \u003cbutton class=\"ageButton\" id=\"ageYes\">Enter archive\u003c/button>\n        \u003cbutton class=\"ageButton secondary\" id=\"ageNo\">Leave\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- =========================================================\n     APP\n     ========================================================= -->\n\n\u003cdiv class=\"app\" id=\"top\">\n\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"#top\" aria-label=\"Baltazar Seeds home\">\n      \u003cdiv class=\"brandMark\">B\u003c/div>\n      \u003cdiv class=\"brandText\">\n        \u003cstrong>Baltazar Seeds\u003c/strong>\n        \u003csmall>Field Archive / Living Record\u003c/small>\n      \u003c/div>\n    \u003c/a>\n\n    \u003cnav class=\"topNav\" aria-label=\"Main navigation\">\n      \u003ca href=\"#archive\">Archive\u003c/a>\n      \u003ca href=\"#journal\">Journal\u003c/a>\n      \u003ca href=\"#continuity\">Continuity\u003c/a>\n      \u003ca href=\"#sources\">Sources\u003c/a>\n      \u003ca href=\"#world\">World\u003c/a>\n      \u003cbutton type=\"button\" id=\"supportTop\">Support\u003c/button>\n    \u003c/nav>\n\n    \u003cdiv class=\"topStatus\">\n      \u003ci class=\"statusDot\">\u003c/i>\n      \u003cspan>Archive online\u003c/span>\n    \u003c/div>\n\n    \u003cbutton class=\"mobileMenu\" id=\"mobileMenu\" aria-label=\"Open menu\" aria-expanded=\"false\">☰\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"workspace\">\n\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003cdiv class=\"sideLabel\">Navigate\u003c/div>\n\n      \u003cnav class=\"sideNav\">\n        \u003ca href=\"#top\">\u003cspan class=\"sideIcon\">01\u003c/span>Index\u003c/a>\n        \u003ca href=\"#timeline\">\u003cspan class=\"sideIcon\">02\u003c/span>Timeline\u003c/a>\n        \u003ca href=\"#archive\">\u003cspan class=\"sideIcon\">03\u003c/span>Reports\u003c/a>\n        \u003ca href=\"#journal\">\u003cspan class=\"sideIcon\">04\u003c/span>Journal\u003c/a>\n        \u003ca href=\"#continuity\">\u003cspan class=\"sideIcon\">05\u003c/span>Genetics\u003c/a>\n        \u003ca href=\"#sources\">\u003cspan class=\"sideIcon\">06\u003c/span>Grower.ch\u003c/a>\n        \u003ca href=\"#world\">\u003cspan class=\"sideIcon\">07\u003c/span>World\u003c/a>\n      \u003c/nav>\n\n      \u003cdiv class=\"sideBottom\">\n        \u003cp>\n          The archive connects the old reports with the new work.\n          Nothing here needs to pretend that the story started yesterday.\n        \u003c/p>\n        \u003ca href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Open Grower.ch ↗\u003c/a>\n      \u003c/div>\n    \u003c/aside>\n\n    \u003cmain class=\"content\">\n\n      \u003c!-- =====================================================\n           HERO\n           ===================================================== -->\n\n      \u003csection class=\"hero\">\n        \u003cdiv class=\"heroGrid\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Field archive / Baltazar Seeds\u003c/div>\n\n            \u003ch1>\n              Seeds are\u003cbr>\n              \u003cspan>a record.\u003c/span>\n            \u003c/h1>\n\n            \u003cp class=\"heroIntro\">\n              Baltazar Seeds is built around the documented path behind the seeds.\n              Old Grower.ch reports.\n              New experiments.\n              Different plants.\n              Different rooms.\n              Different years.\n              The archive keeps the connection visible instead of turning the history into a polished story that never happened.\n            \u003c/p>\n          \u003c/div>\n\n          \u003cdiv class=\"heroSide\">\n            \u003cstrong>2007 → 2026\u003c/strong>\n            \u003cp>\n              The first documented reports are from the late 2000s.\n              After a long pause the work returned in 2025.\n              The current archive continues through Strain Mix Part Three.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"metricRow\">\n          \u003cdiv class=\"metric\">\n            \u003cb>10+\u003c/b>\n            \u003cspan>Years away\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"metric\">\n            \u003cb>2007\u003c/b>\n            \u003cspan>Old report roots\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"metric\">\n            \u003cb>I → II → HK → III\u003c/b>\n            \u003cspan>Recent chapters\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"metric\">\n            \u003cb>OPEN\u003c/b>\n            \u003cspan>Archive status\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           TIMELINE\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"timeline\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Chronology\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The long \u003cspan>thread.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">old roots / new chapters / one archive\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"timeline\">\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2007\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>First Grow / Hindu Kush\u003c/h3>\n                \u003cp>\n                  The documented beginning.\n                  A first grow with Hindu Kush.\n                  400 W and coco.\n                  The report itself is part of the history now carried forward.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 01\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Mazar & Euforia\u003c/h3>\n                \u003cp>\n                  The second documented grow.\n                  Mazar and Euforia become part of the early record together with the first attempts to compare different genetics in one continuing archive.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 02\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Blueberry\u003c/h3>\n                \u003cp>\n                  The third grow.\n                  Blueberry takes its place in the sequence alongside Thai Haze Skunk and genetics carried forward from the previous run.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 03\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Jorge's Diamonds & Perplex\u003c/h3>\n                \u003cp>\n                  A later 2008 report with Jorge's Diamonds No1, Perplex and additional Afghan genetics.\n                  The archive gets broader while the documentation stays personal.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 04\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Blue Moonshine & Pure Afghan\u003c/h3>\n                \u003cp>\n                  Another step in the old sequence.\n                  Blue Moonshine enters the report together with Pure Afghan and genetics carried over from earlier work.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 05\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2009\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Chocolope / G13 Haze / Hawaiian Snow\u003c/h3>\n                \u003cp>\n                  The old archive continues into 2009.\n                  This report was approached as a grow protocol with the focus on the most important observations.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 06\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2025\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Strainmix Part One\u003c/h3>\n                \u003cp>\n                  After more than ten years away the work returns.\n                  The idea is deliberately open.\n                  A mixed seed experiment.\n                  Quality over quantity.\n                  Curiosity over a perfectly predictable result.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">NEW / I\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2025\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Strainmix Part Two\u003c/h3>\n                \u003cp>\n                  The experiment expands into a much larger documented run.\n                  More named genetics.\n                  More plants.\n                  More problems to solve.\n                  More information for the next chapter.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">NEW / II\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2026\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Baltazars Hell Kitchen\u003c/h3>\n                \u003cp>\n                  Three tents.\n                  A more structured environment.\n                  Automatic irrigation enters the picture and later needs to be adjusted when reality proves less tidy than the plan.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">HK / 01\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2026\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Strain Mix Part Three\u003c/h3>\n                \u003cp>\n                  Seeds from the previous run return.\n                  The focus moves even more toward following the genetics.\n                  Phenotype hunting becomes a real part of the process.\n                  The report is still open.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">NEW / III\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           REPORT ARCHIVE\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"archive\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Grow reports\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The \u003cspan>archive.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">direct links to the original reports\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"reportGrid\">\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">09.08.2007\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>First Grow / Hindu Kush\u003c/h3>\n              \u003cp>\n                The first documented grow in the old sequence.\n                Hindu Kush.\n                400 W.\n                Coco.\n                A report that now sits at the root of everything that followed.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">2007\u003c/span>\n                \u003cspan class=\"fact\">Hindu Kush\u003c/span>\n                \u003cspan class=\"fact\">400 W\u003c/span>\n                \u003cspan class=\"fact\">Coco\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/first-grow-hindu-kush-400w-coco-63-bt-beendet.33441/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">03.02.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Mazar & Euforia\u003c/h3>\n              \u003cp>\n                The second grow.\n                Mazar and Euforia are documented together with the early comparison between soil and coco.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Mazar\u003c/span>\n                \u003cspan class=\"fact\">Euforia\u003c/span>\n                \u003cspan class=\"fact\">2nd grow\u003c/span>\n                \u003cspan class=\"fact\">2008\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/mazar-euforia.30/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">30.03.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Blueberry\u003c/h3>\n              \u003cp>\n                The third grow.\n                Blueberry becomes the center of the report with Thai Haze Skunk and Mazar F2 also present in the record.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Blueberry\u003c/span>\n                \u003cspan class=\"fact\">Thai Haze Skunk\u003c/span>\n                \u003cspan class=\"fact\">Mazar F2\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/blueberry.408/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">09.07.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Jorge's Diamonds & Perplex\u003c/h3>\n              \u003cp>\n                A fourth grow with Jorge's Diamonds No1 and Perplex plus Afghan bonus genetics.\n                The archive continues to grow.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Jorge's Diamonds\u003c/span>\n                \u003cspan class=\"fact\">Perplex\u003c/span>\n                \u003cspan class=\"fact\">Afghan\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/jorges-diamonds-perplex.955/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">13.09.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Blue Moonshine & Pure Afghan\u003c/h3>\n              \u003cp>\n                Blue Moonshine enters the old Dutch Passion focused report together with Pure Afghan and additional genetics from the previous run.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Blue Moonshine\u003c/span>\n                \u003cspan class=\"fact\">Pure Afghan\u003c/span>\n                \u003cspan class=\"fact\">2008\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/blue-moonshine-pure-afghan.1497/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">07.03.2009\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Chocolope / G13 Haze / Hawaiian Snow\u003c/h3>\n              \u003cp>\n                The 2009 report focuses on the most important observations and treats the grow as a protocol rather than a polished presentation.\n rtBody\">\n              \u003ch3>Bio Erde Strainmix Part Two\u003c/h3>\n              \u003cp>\n                The next run expands the archive with a broad selection of named genetics and a larger documented environment.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Part Two\u003c/span>\n                \u003cspan class=\"fact\">2025\u003c/span>\n                \u003cspan class=\"fact\">21 strains\u003c/span>\n                \u003cspan class=\"fact\">Grow log\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/strainmix-part-2.179085/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">SYSTEM TEST\u003c/span>\n              \u003cspan class=\"reportYear\">03.01.2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Baltazars Hell Kitchen\u003c/h3>\n              \u003cp>\n                Three tents.\n                A more structured setup.\n                Automatic irrigation.\n                Then the practical problems begin and the report records the adjustment instead of hiding it.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Hell Kitchen\u003c/span>\n                \u003cspan class=\"fact\">2026\u003c/span>\n                \u003cspan class=\"fact\">3 tents\u003c/span>\n                \u003cspan class=\"fact\">Archive\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/baltazars-hell-kitchen.187410/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003 riginal two image record remains visible at the same time.\n                No automatic swap.\n                No disappearing second frame.\n                Both source files are part of the page.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>File A\u003c/span>\u003cb>STRAIN5.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>File B\u003c/span>\u003cb>STRAIN5A.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Display\u003c/span>\u003cb>Both visible\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>Record 06\u003c/b>\n              \u003cspan>Finish / original pair\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"dualCard\" style=\"border:0;border-radius:0;\">\n              \u003cdiv class=\"imageCell\">\n                \u003cimg src=\"STRAIN6.JPG\" alt=\"STRAIN6 original image\">\n              \u003c/div>\n              \u003cdiv class=\"imageCell\">\n                \u003cimg src=\"STRAIN6A.JPG\" alt=\"STRAIN6A original image\">\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>The second image stays part of the story.\u003c/h3>\n              \u003cp>\n                The original pair is preserved as a real diptych.\n                This is deliberately different from the previous crossfade approach.\n                Both photographs can be inspected immediately.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>File A\u003c/span>\u003cb>STRAIN6.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>File B\u003c/span>\u003cb>STRAIN6A.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Display\u003c/span>\u003cb>Both visible\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           CONTINUITY\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"continuity\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Continuity\u003c/div>\n            \u003ch2 class=\"sectionTitle\">From \u003cspan>memory\u003c/span> to archive.\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">the structure behind the project\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"lineage\">\n          \u003cdiv class=\"lineagePath\">\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>ROOT\u003c/small>\n              \u003cstrong>2007–09\u003c/strong>\n              \u003cp>Old Grower.ch reports and first documented work.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>RETURN\u003c/small>\n              \u003cstrong>Part One\u003c/strong>\n              \u003cp>2025 comeback through the mixed seed experiment.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>EXPANSION\u003c/small>\n              \u003cstrong>Part Two\u003c/strong>\n              \u003cp>More genetics and a larger documented run.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>SYSTEM\u003c/small>\n              \u003cstrong>Hell Kitchen\u003c/strong>\n              \u003cp>More structure and a more complex environment.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>CURRENT\u003c/small>\n              \u003cstrong>Part Three\u003c/strong>\n              \u003cp>Following the genetics and hunting phenotypes.\u003c/p>\n            \u003c/div>\n\n          \u003c/div>\n\n          \u003cp class=\"lineageNote\">\n            The point of the archive is not to invent a clean origin story.\n            The useful part is that the old reports exist.\n            The new reports exist.\n            The seeds sit between those two periods as a continuation of an interest that was already there long before the name Baltazar Seeds appeared on a page.\n          \u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           PART ONE NOTES\n           ===================================================== -->\n\n      \u003csection class=\"section\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Part One / 2025\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The comeback was \u003cspan>messy.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">the important part is that it happened\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"reportGrid\">\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">01\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Quality over quantity\u003c/h3>\n              \u003cp>\n                The return was not designed as a perfect production project.\n                The starting point was curiosity.\n                What happens when a mixed collection of seeds is allowed to show what is actually in it.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Experiment\u003c/span>\n                \u003cspan class=\"fact\">Mixed origins\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">02\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>It did not start smoothly\u003c/h3>\n              \u003cp>\n                The first attempt began with 23 seeds and only three early plants.\n                Dry winter air and heat became part of the real conditions.\n                More seeds were prepared and the experiment continued.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">23 first seeds\u003c/span>\n                \u003cspan class=\"fact\">3 early plants\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">03\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Selection became unavoidable\u003c/h3>\n              \u003cp>\n                As more plants appeared the differences became part of the record.\n                One unusual plant even became number 18 in the Zwergenbattle 2025.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Selection\u003c/span>\n                \u003cspan class=\"fact\">Zwergenbattle\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">04\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Every plant was different\u003c/h3>\n              \u003cp>\n                Possible identities were treated as possibilities rather than absolute labels.\n                Gelato.\n                Skunk.\n                Purple Tangie.\n                Cali Orange.\n                Variation remained the interesting part.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Variation\u003c/span>\n                \u003cspan class=\"fact\">Phenotypes\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           PART TWO / HELL KITCHEN / PART THREE\n           ===================================================== -->\n\n      \u003csection class=\"section\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Three recent chapters\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The project \u003cspan>keeps moving.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">I / II / HK / III\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"compare\">\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>II\u003c/b>\n              \u003cspan>2025\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>The mix gets serious.\u003c/h3>\n              \u003cp>\n                Part Two moves into a larger documented run.\n                The report records a broad mixture of named genetics and the practical problems that appeared along the way.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Space\u003c/span>\u003cb>120 × 120 × 200\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Lighting\u003c/span>\u003cb>250 / 400 / 600 W\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Documentation\u003c/span>\u003cb>Growth / problems / solutions\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>HK\u003c/b>\n              \u003cspan>2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>More structure.\u003c/h3>\n              \u003cp>\n                Hell Kitchen expands the environment again.\n                Three tents.\n                Larger containers.\n                Automatic watering.\n                Then the report records the reality when the automatic system needs adjustment.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Tents\u003c/span>\u003cb>3\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Containers\u003c/span>\u003cb>13 → 22 L\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Direction\u003c/span>\u003cb>Structured\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>III\u003c/b>\n              \u003cspan>2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>The story continues.\u003c/h3>\n              \u003cp>\n                Part Three returns to the core idea of following the genetics.\n                Seeds from the previous run return.\n                The report is now explicitly interested in development over time and real phenotype hunting.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Flowering\u003c/span>\u003cb>FD 32\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Veg\u003c/span>\u003cb>Approx 4–5 weeks\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Plants\u003c/span>\u003cb>9\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>∞\u003c/b>\n              \u003cspan>OPEN\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>Not a finished story.\u003c/h3>\n              \u003cp>\n                The archive is deliberately open.\n                There is no final chapter here because the reports themselves are the continuation.\n                The next entry belongs to the next run.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Status\u003c/span>\u003cb>Open\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Archive\u003c/span>\u003cb>Growing\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Direction\u003c/span>\u003cb>Continue\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           SOURCES\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"sources\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Primary source index\u003c/div>\n            \u003ch2 class=\"sectionTitle\">Grower.ch is part of the \u003cspan>archive.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">original forum records\u003c/div>\n        \u003c/div>\n\n        \u003cdi =\"true\">\n  \u003cdiv class=\"drawerPanel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"contactTitle\">\n    \u003cdiv class=\"drawerTop\">\n      \u003cstrong id=\"contactTitle\">Contact\u003c/strong>\n      \u003cbutton class=\"closeButton\" type=\"button\" id=\"contactClose\" aria-label=\"Close\">×\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"drawerBody\">\n      \u003ch3>Talk to\u003cbr>Baltazar.\u003c/h3>\n\n      \u003cp>\n        Use the contact route already connected to the project.\n        Replace the address below with the existing project email if your original page uses a different address.\n      \u003c/p>\n\n      \u003cdiv class=\"drawerRows\">\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Email\u003c/span>\n          \u003ca href=\"mailto:contact@baltazar-seeds.com\">Email ↗\u003c/a>\n        \u003c/div>\n\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Forum\u003c/span>\n          \u003ca href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Grower.ch ↗\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">Archive ready\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  /* =======================================================\n     AGE GATE\n     ======================================================= */\n\n  const ageGate = document.getElementById(\"ageGate\");\n  const ageYes = document.getElementById(\"ageYes\");\n  const ageNo = document.getElementById(\"ageNo\");\n  const AGE_KEY = \"baltazar_archive_age_18\";\n\n  function hideAge(){\n    try{\n      localStorage.setItem(AGE_KEY,\"true\");\n    }catch(error){}\n    ageGate.classList.add(\"hidden\");\n  }\n\n  ageYes.addEventListener(\"click\",hideAge);\n\n  ageNo.addEventListener(\"click\",function(){\n    ageNo.textContent = \"18+ required\";\n  });\n\n  try{\n    if(localStorage.getItem(AGE_KEY) === \"true\"){\n      ageGate.classList.add(\"hidden\");\n    }\n  }catch(error){}\n\n  /* =======================================================\n     MOBILE MENU\n     ======================================================= */\n\n  const mobileMenu = document.getElementById(\"mobileMenu\");\n  const sidebar = document.getElementById(\"sidebar\");\n\n  function closeMobileMenu(){\n    sidebar.classList.remove(\"mobileOpen\");\n    mobileMenu.setAttribute(\"aria-expanded\",\"false\");\n  }\n\n  mobileMenu.addEventListener(\"click\",function(){\n    const open = sidebar.classList.toggle(\"mobileOpen\");\n    mobileMenu.setAttribute(\"aria-expanded\",String(open));\n  });\n\n  sidebar.querySelectorAll(\"a\").forEach(function(link){\n    link.addEventListener(\"click\",closeMobileMenu);\n  });\n\n  document.addEventListener(\"click\",function(event){\n    if(window.innerWidth > 780) return;\n\n    if(\n      sidebar.classList.contains(\"mobileOpen\") &&\n      !sidebar.contains(event.target) &&\n      !mobileMenu.contains(event.target)\n    ){\n      closeMobileMenu();\n    }\n  });\n\n  /* =======================================================\n     DRAWERS\n     ======================================================= */\n\n  const supportDrawer = document.getElementById(\"supportDrawer\");\n  const contactDrawer = document.getElementById(\"contactDrawer\");\n\n  function openDrawer(drawer){\n    drawer.classList.add(\"open\");\n    drawer.setAttribute(\"aria-hidden\",\"false\");\n    document.body.style.overflow = \"hidden\";\n  }\n\n  function closeDrawer(drawer){\n    drawer.classList.remove(\"open\");\n    drawer.setAttribute(\"aria-hidden\",\"true\");\n\n    if(\n      !supportDrawer.classList.contains(\"open\") &&\n      !contactDrawer.classList.contains(\"open\")\n    ){\n      document.body.style.overflow = \"\";\n    }\n  }\n\n  document.getElementById(\"supportTop\").addEventListener(\"click\",function(){\n    openDrawer(supportDrawer);\n  });\n\n  document.getElementById(\"drawerClose\").addEventListener(\"click\",function(){\n    closeDrawer(supportDrawer);\n  });\n\n  document.getElementById(\"contactOpen\").addEventListener(\"click\",function(){\n    openDrawer(contactDrawer);\n  });\n\n  document.getElementById(\"contactClose\").addEventListener(\"click\",function(){\n    closeDrawer(contactDrawer);\n  });\n\n  [supportDrawer,contactDrawer].forEach(function(drawer){\n    drawer.addEventListener(\"click\",function(event){\n      if(event.target === drawer){\n        closeDrawer(drawer);\n      }\n    });\n  });\n\n  document.addEventListener(\"keydown\",function(event){\n    if(event.key === \"Escape\"){\n      closeDrawer(supportDrawer);\n      closeDrawer(contactDrawer);\n      closeMobileMenu();\n    }\n  });\n\n  /* =======================================================\n     ACTIVE SECTION\n     ======================================================= */\n\n  const sideLinks = Array.from(document.querySelectorAll(\".sideNav a\"));\n  const sections = sideLinks\n    .map(function(link){\n      const id = link.getAttribute(\"href\");\n      return id ? document.querySelector(id) : null;\n    })\n    .filter(Boolean);\n\n  const observer = new IntersectionObserver(function(entries){\n    entries.forEach(function(entry){\n      if(!entry.isIntersecting) return;\n\n      sideLinks.forEach(function(link){\n        link.classList.remove(\"active\");\n      });\n\n      const active = sideLinks.find(function(link){\n        return link.getAttribute(\"href\") === \"#\" + entry.target.id;\n      });\n\n      if(active) active.classList.add(\"active\");\n    });\n  },{\n    root:null,\n    rootMargin:\"-35% 0px -55% 0px\",\n    threshold:0\n  });\n\n  sections.forEach(function(section){\n    observer.observe(section);\n  });\n\n  /* =======================================================\n     SIMPLE IMAGE ERROR FALLBACK\n     ======================================================= */\n\n  document.querySelectorAll(\"img\").forEach(function(img){\n    img.addEventListener(\"error\",function(){\n      img.style.opacity = \".22\";\n      img.style.filter = \"grayscale(1)\";\n      img.alt = \"Image file not found: \" + img.getAttribute(\"src\");\n    });\n  });\n\n  /* =======================================================\n     TOAST\n     ======================================================= */\n\n  const toast = document.getElementById(\"toast\");\n  let toastTimer = null;\n\n  function showToast(message){\n    toast.textContent = message;\n    toast.classList.add(\"show\");\n\n    clearTimeout(toastTimer);\n\n    toastTimer = setTimeout(function(){\n      toast.classList.remove(\"show\");\n    },1800);\n  }\n\n  document.querySelectorAll('a[href^=\"#\"]').forEach(function(link){\n    link.addEventListener(\"click\",function(){\n      const target = document.querySelector(link.getAttribute(\"href\"));\n\n      if(target){\n        setTimeout(function(){\n          showToast(\"Archive location opened\");\n        },350);\n      }\n    });\n  });\n\n  /* =======================================================\n     YEAR / STATUS\n     ======================================================= */\n\n  const statusText = document.querySelector(\".topStatus span\");\n\n  if(statusText){\n    statusText.textContent = \"Archive online\";\n  }\n\n})();\n\u003c/script>\n\n\n\u003csection class=\"section\" id=\"preserved-links\">\n  \u003cdiv id=\"bd-preserved-links\">\n    \u003cdiv class=\"bd-link-grid\">\n      \u003ca href=\"https://www.grower.ch/forum/threads/strainmix-part-1.174488/\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan class=\"bd-link-no\">01\u003c/span>www.grower.ch/forum/threads/strainmix-part-1.174488/\u003c/a>\u003ca href=\"https://buy.stripe.com/dRm4gCdai9wn46Y7A5gw00J\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan class=\"bd-link-no\">02\u003c/span>buy.stripe.com/dRm4gCdai9wn46Y7A5gw00J\u003c/a>\u003ca href=\"https://buy.stripe.com/8x25kG9Y65g75b26w1gw00K\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan class=\"bd-link-no\">03\u003c/span>buy.stripe.com/8x25kG9Y65g75b26w1gw00K\u003c/a>\u003ca href=\"https://buy.stripe.com/14A8wSeem6kb46Yg6Bgw00L\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan class=\"bd-link-no\">04\u003c/span>buy.stripe.com/14A8wSeem6kb46Yg6Bgw00L\u003c/a>\u003ca href=\"https://buy.stripe.com/dRmdRc9Y6gYPbzq2fLgw00M\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan class=\"bd-link-no\">05\u003c/span>buy.stripe.com/dRmdRc9Y6gYPbzq2fLgw00M\u003c/a>\u003ca href=\"https://www.instagram.com/real_jack_james\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan class=\"bd-link-no\">06\u003c/span>www.instagram.com/real_jack_james\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c/body>\n\u003c/html>\n\u003c!-- PRESERVED_SECOND_FILE_URLS\nhttps://www.grower.ch/forum/threads/strainmix-part-1.174488/\nhttps://buy.stripe.com/dRm4gCdai9wn46Y7A5gw00J\nhttps://buy.stripe.com/8x25kG9Y65g75b26w1gw00K\nhttps://buy.stripe.com/14A8wSeem6kb46Yg6Bgw00L\nhttps://buy.stripe.com/dRmdRc9Y6gYPbzq2fLgw00M\nhttps://www.instagram.com/real_jack_james\nEND_PRESERVED_SECOND_FILE_URLS -->";

/* =========================================================
   DUAL ARCHIVE ENGINE
   ========================================================= */

(function(){

  const frameA = document.getElementById("frameA");
  const frameB = document.getElementById("frameB");
  const choiceA = document.getElementById("choiceA");
  const choiceB = document.getElementById("choiceB");
  const swapButton = document.getElementById("swapButton");
  const activeLabel = document.getElementById("activeLabel");
  const hud = document.getElementById("transitionHud");
  const hudTarget = document.getElementById("hudTarget");

  const frames = [frameA, frameB];
  const choices = [choiceA, choiceB];
  const documents = [ORIGINAL_ARCHIVE_A, ORIGINAL_ARCHIVE_B];

  let active = 0;
  let loaded = [false,false];
  let switching = false;

  function loadArchive(index){
    if(loaded[index]) return;
    frames[index].srcdoc = documents[index];
    loaded[index] = true;
  }

  function setPressed(index){
    choices.forEach((button,i)=>{
      const isActive = i === index;
      button.classList.toggle("active",isActive);
      button.setAttribute("aria-pressed",String(isActive));
    });

    activeLabel.textContent =
      index === 0 ? "01 / PRIMARY" : "02 / SECONDARY";
  }

  function switchArchive(next){
    next = Number(next);

    if(next !== 0 && next !== 1) return;
    if(next === active || switching) return;

    switching = true;
    loadArchive(next);

    hudTarget.textContent = next === 0 ? "01" : "02";
    hud.classList.add("show");

    window.setTimeout(()=>{
      frames[active].classList.remove("active");
      frames[next].classList.add("active");

      active = next;
      setPressed(active);

      try{
        localStorage.setItem(
          "baltazar-active-archive",
          String(active)
        );
      }catch(e){}

      window.setTimeout(()=>{
        hud.classList.remove("show");
        switching = false;
      },190);

    },150);
  }

  function toggleArchive(){
    switchArchive(active === 0 ? 1 : 0);
  }

  frameA.addEventListener("load",()=>{
    loaded[0] = true;
  });

  frameB.addEventListener("load",()=>{
    loaded[1] = true;
  });

  choiceA.addEventListener("click",()=>{
    switchArchive(0);
  });

  choiceB.addEventListener("click",()=>{
    switchArchive(1);
  });

  swapButton.addEventListener("click",toggleArchive);

  document.addEventListener("keydown",(event)=>{

    if(event.key === "1"){
      switchArchive(0);
    }

    else if(event.key === "2"){
      switchArchive(1);
    }

    else if(event.code === "Space"){

      const target = document.activeElement;

      const isTyping =
        target &&
        (
          target.tagName === "INPUT" ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable
        );

      if(!isTyping){
        event.preventDefault();
        toggleArchive();
      }
    }
  });

  /* Restore the last selected archive when possible. */

  try{

    const saved = Number(
      localStorage.getItem("baltazar-active-archive")
    );

    if(saved === 1){

      active = 1;

      frameA.classList.remove("active");
      frameB.classList.add("active");

      setPressed(1);
      loadArchive(1);

    }else{

      loadArchive(0);

    }

  }catch(e){

    loadArchive(0);

  }

})();
</script>
