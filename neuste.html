<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050708">
<meta name="description" content="Baltazar Seeds — dual archive interface. Original archive documents preserved and switchable.">
<title>BALTAZAR SEEDS — DUAL ARCHIVE</title>

<style>
/* =========================================================
   BALTAZAR SEEDS — DUAL ARCHIVE CONTROL SHELL
   The two original documents are preserved in full.
   This outer shell adds the archive switch without deleting
   or rewriting the original page code.
   ========================================================= */

:root{
  --bg:#050708;
  --panel:#0a0e10;
  --panel2:#0e1417;
  --line:#263237;
  --line2:#344249;
  --text:#e9f0ed;
  --muted:#75858b;
  --acid:#b8ff3d;
  --cyan:#67f4ff;
  --mono:"SFMono-Regular","Roboto Mono","DM Mono","IBM Plex Mono",Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*,
*::before,
*::after{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  background:var(--bg);
  overflow:hidden;
}

body{
  color:var(--text);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

/* DIGITAL GRID */

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:9990;
  pointer-events:none;
  opacity:.12;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:32px 32px;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:9991;
  pointer-events:none;
  opacity:.035;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.7) 0,
      rgba(255,255,255,.7) 1px,
      transparent 1px,
      transparent 4px
    );
  mix-blend-mode:screen;
}

/* FRAME STAGE */

#stage{
  position:fixed;
  inset:0;
  z-index:1;
  background:#050708;
}

.archive-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
  opacity:0;
  visibility:hidden;
  transform:scale(.995);
  transition:
    opacity .34s var(--ease),
    transform .5s var(--ease),
    visibility 0s linear .5s;
}

.archive-frame.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
  transition:
    opacity .34s var(--ease),
    transform .5s var(--ease),
    visibility 0s;
}

/* TOP-LEFT DIGITAL SWITCH */

#switcher{
  position:fixed;
  top:16px;
  left:16px;
  z-index:10000;
  width:236px;
  user-select:none;
}

#switcher::before{
  content:"";
  position:absolute;
  inset:-7px;
  border:1px solid rgba(184,255,61,.11);
  pointer-events:none;
}

.switch-shell{
  position:relative;
  border:1px solid #354249;
  background:
    linear-gradient(180deg,rgba(15,21,24,.97),rgba(5,8,9,.97));
  box-shadow:
    0 18px 55px rgba(0,0,0,.52),
    inset 0 1px 0 rgba(255,255,255,.05),
    0 0 0 1px rgba(0,0,0,.7);
  overflow:hidden;
}

.switch-top{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px;
  border-bottom:1px solid #222c31;
  color:#62737a;
  font-size:8px;
  letter-spacing:.15em;
  text-transform:uppercase;
  background:#080c0e;
}

.switch-lights{
  display:flex;
  gap:5px;
}

.switch-lights i{
  width:6px;
  height:6px;
  display:block;
  border:1px solid #4b565a;
  border-radius:50%;
}

.switch-lights i:first-child{
  background:#ff5f56;
  border-color:#ff5f56;
  box-shadow:0 0 7px rgba(255,95,86,.35);
}

.switch-lights i:nth-child(2){
  background:#ffbd2e;
  border-color:#ffbd2e;
}

.switch-lights i:nth-child(3){
  background:var(--acid);
  border-color:var(--acid);
  box-shadow:0 0 7px rgba(184,255,61,.35);
}

.switch-main{
  display:grid;
  grid-template-columns:1fr 42px 1fr;
  align-items:stretch;
  min-height:68px;
}

.archive-choice{
  position:relative;
  border:0;
  margin:0;
  padding:11px 9px;
  background:transparent;
  color:#68787e;
  cursor:pointer;
  text-align:left;
  font-family:var(--mono);
  transition:background .22s ease,color .22s ease;
}

.archive-choice:hover{
  background:rgba(184,255,61,.055);
  color:#cbd6d3;
}

.archive-choice.active{
  background:rgba(184,255,61,.09);
  color:var(--text);
}

.archive-choice.active::after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:2px;
  background:var(--acid);
  box-shadow:0 0 12px rgba(184,255,61,.55);
}

.archive-choice .choice-no{
  display:block;
  font-size:8px;
  line-height:1;
  color:var(--acid);
  letter-spacing:.14em;
  margin-bottom:7px;
}

.archive-choice .choice-name{
  display:block;
  font-size:10px;
  line-height:1.1;
  letter-spacing:.08em;
  text-transform:uppercase;
  white-space:nowrap;
}

.archive-choice .choice-sub{
  display:block;
  margin-top:5px;
  font-size:7px;
  line-height:1.2;
  letter-spacing:.08em;
  color:#536269;
  text-transform:uppercase;
}

.switch-center{
  display:grid;
  place-items:center;
  border-left:1px solid #222c31;
  border-right:1px solid #222c31;
  background:#070a0c;
}

#swapButton{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border:1px solid #3a484e;
  border-radius:2px;
  background:#0d1417;
  color:var(--acid);
  cursor:pointer;
  font:16px/1 var(--mono);
  transition:
    border-color .2s ease,
    background .2s ease,
    transform .3s var(--ease),
    box-shadow .2s ease;
}

#swapButton:hover{
  border-color:var(--acid);
  background:#111a1d;
  box-shadow:0 0 18px rgba(184,255,61,.13);
}

#swapButton:active{
  transform:scale(.9) rotate(180deg);
}

.switch-bottom{
  height:27px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px;
  border-top:1px solid #222c31;
  background:#070b0d;
  color:#526269;
  font-size:7px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.switch-live{
  display:flex;
  align-items:center;
  gap:5px;
}

.switch-live::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--acid);
  box-shadow:0 0 8px rgba(184,255,61,.7);
  animation:pulse 1.7s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:.45;transform:scale(.85)}
  50%{opacity:1;transform:scale(1)}
}

/* KEYBOARD HINT */

#keyHint{
  position:fixed;
  left:16px;
  bottom:14px;
  z-index:10000;
  padding:6px 8px;
  border:1px solid rgba(52,66,73,.65);
  background:rgba(5,8,9,.82);
  color:#5f7077;
  font:7px/1 var(--mono);
  letter-spacing:.09em;
  text-transform:uppercase;
  backdrop-filter:blur(10px);
  opacity:.72;
}

/* TRANSITION HUD */

#transitionHud{
  position:fixed;
  inset:0;
  z-index:9998;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
  background:rgba(3,5,6,0);
  transition:opacity .18s ease,background .18s ease;
}

#transitionHud.show{
  opacity:1;
  background:rgba(3,5,6,.24);
}

.hudBox{
  min-width:260px;
  padding:15px 17px;
  border:1px solid #344249;
  background:rgba(7,11,13,.95);
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  transform:translateY(7px);
  transition:transform .25s var(--ease);
}

#transitionHud.show .hudBox{
  transform:translateY(0);
}

.hudLine{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  font-size:8px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.hudLine strong{
  color:var(--acid);
  font-weight:500;
}

.hudProgress{
  position:relative;
  height:2px;
  margin-top:11px;
  background:#1c2529;
  overflow:hidden;
}

.hudProgress::after{
  content:"";
  position:absolute;
  inset:0;
  width:45%;
  background:var(--acid);
  box-shadow:0 0 12px rgba(184,255,61,.55);
  animation:scan 1s linear infinite;
}

@keyframes scan{
  from{transform:translateX(-120%)}
  to{transform:translateX(260%)}
}

/* ACCESSIBILITY / MOBILE */

button:focus-visible{
  outline:1px solid var(--acid);
  outline-offset:2px;
}

@media(max-width:720px){
  #switcher{
    top:9px;
    left:9px;
    width:210px;
  }

  .switch-main{
    min-height:61px;
    grid-template-columns:1fr 38px 1fr;
  }

  .archive-choice{
    padding:9px 7px;
  }

  .archive-choice .choice-name{
    font-size:9px;
  }

  .archive-choice .choice-sub{
    display:none;
  }

  #keyHint{
    display:none;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div id="stage" aria-label="Baltazar Seeds dual archive">
  <iframe id="frameA" class="archive-frame active" title="Baltazar Seeds Archive A"></iframe>
  <iframe id="frameB" class="archive-frame" title="Baltazar Seeds Archive B"></iframe>
</div>

<div id="switcher">
  <div class="switch-shell">
    <div class="switch-top">
      <span>ARCHIVE // LINK</span>
      <span class="switch-lights" aria-hidden="true">
        <i></i><i></i><i></i>
      </span>
    </div>

    <div class="switch-main">
      <button class="archive-choice active" id="choiceA" type="button" aria-label="Archive A öffnen" aria-pressed="true">
        <span class="choice-no">01</span>
        <span class="choice-name">FIELD ARCHIVE</span>
        <span class="choice-sub">PRIMARY DOCUMENT</span>
      </button>

      <div class="switch-center">
        <button id="swapButton" type="button" aria-label="Zwischen den beiden Archiven wechseln" title="Switch archive">↔</button>
      </div>

      <button class="archive-choice" id="choiceB" type="button" aria-label="Archive B öffnen" aria-pressed="false">
        <span class="choice-no">02</span>
        <span class="choice-name">FIELD ARCHIVE</span>
        <span class="choice-sub">SECOND DOCUMENT</span>
      </button>
    </div>

    <div class="switch-bottom">
      <span class="switch-live">LINK ACTIVE</span>
      <span id="activeLabel">01 / PRIMARY</span>
    </div>
  </div>
</div>

<div id="keyHint">[ 1 ] PRIMARY &nbsp;&nbsp; [ 2 ] SECONDARY &nbsp;&nbsp; [ SPACE ] SWITCH</div>

<div id="transitionHud" aria-hidden="true">
  <div class="hudBox">
    <div class="hudLine">
      <span>Switching archive</span>
      <strong id="hudTarget">02</strong>
    </div>
    <div class="hudProgress"></div>
  </div>
</div>

<script>

  overflow-x:hidden;\n}\n\nbody::before{\n  content:\"\";\n  position:fixed;\n  inset:0;\n  z-index:9999;\n  pointer-events:none;\n  opacity:.16;\n  background-image:\n    radial-gradient(rgba(0,0,0,.25) .55px,transparent .55px);\n  background-size:5px 5px;\n  mix-blend-mode:multiply;\n}\n\na{\n  color:inherit;\n  text-decoration:none;\n}\n\nbutton,\na{\n  -webkit-tap-highlight-color:transparent;\n}\n\nbutton{\n  font:inherit;\n}\n\n::selection{\n  background:var(--acid);\n  color:var(--ink);\n}\n\n:focus-visible{\n  outline:2px solid var(--green);\n  outline-offset:3px;\n}\n\n/* =========================================================\n   AGE GATE\n   ========================================================= */\n\n#ageGate{\n  position:fixed;\n  inset:0;\n  z-index:50000;\n  display:grid;\n  place-items:center;\n  padding:24px;\n  background:rgba(232,229,220,.97);\n  backdrop-filter:blur(18px);\n  transition:opacity .5s ease,visibility .5s ease;\n}\n\n#ageGate.hidden{\n  opacity:0;\n  visibility:hidden;\n  pointer-events:none;\n}\n\n.ageWindow{\n  width:min(560px,100%);\n  border:1px solid var(--ink);\n  border-radius:24px;\n  background:var(--paper2);\n  box-shadow:0 35px 100px rgba(0,0,0,.18);\n  overflow:hidden;\n}\n\n.windowBar{\n  height:46px;\n  padding:0 18px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  border-bottom:1px solid var(--line);\n  background:var(--paper3);\n}\n\n.windowDots{\n  display:flex;\n  gap:6px;\n}\n\n.windowDots i{\n  width:8px;\n  height:8px;\n  border:1px solid var(--ink);\n  border-radius:50%;\n  display:block;\n}\n\n.windowCode{\n  font:10px \"DM Mono\",monospace;\n  letter-spacing:.16em;\n  color:var(--muted);\n  text-transform:uppercase;\n}\n\n.ageBody{\n  padding:42px;\n}\n\n.ageKicker{\n  font:10px \"DM Mono\",monospace;\n  text-transform:uppercase;\n  letter-spacing:.16em;\n  color:var(--green);\n  margin-bottom:18px;\n}\n\n.ageTitle{\n  font:700 clamp(44px,8vw,78px)/.86 Syne,sans-serif;\n  lett =====================================================\n   DRAWER\n   ========================================================= */\n\n.drawer{\n  position:fixed;\n  inset:0;\n  z-index:15000;\n  display:grid;\n  justify-items:end;\n  background:rgba(23,25,21,.22);\n  backdrop-filter:blur(5px);\n  opacity:0;\n  visibility:hidden;\n  transition:.3s ease;\n}\n\n.drawer.open{\n  opacity:1;\n  visibility:visible;\n}\n\n.drawerPanel{\n  width:min(520px,100%);\n  height:100%;\n  background:var(--paper2);\n  border-left:1px solid var(--line2);\n  padding:20px;\n  transform:translateX(100%);\n  transition:.45s var(--ease);\n  overflow:auto;\n}\n\n.drawer.open .drawerPanel{\n  transform:translateX(0);\n}\n\n.drawerTop{\n  display:flex;\n  justify-content:space-between;\n  align-items:center;\n  padding-bottom:14px;\n  border-bottom:1px solid var(--line);\n}\n\n.drawerTop strong{\n  font:700 20px Syne,sans-serif;\n  letter-spacing:-.05em;\n}\n\n.closeButton{\n  width:34px;\n  height:34px;\n  border:1px solid var(--line2);\n  border-radius:10px;\n  background:transparent;\n  cursor:pointer;\n  font-size:18px;\n}\n\n.drawerBody{\n  padding-top:18px;\n}\n\n.drawerBody h3{\n  font:600 31px/.9 Syne,sans-serif;\n  letter-spacing:-.055em;\n}\n\n.drawerBody p{\n  margin-top:12px;\n  color:var(--muted);\n  font-size:11px;\n  line-height:1.75;\n}\n\n.drawerRows{\n  margin-top:20px;\n  border-top:1px solid var(--line);\n}\n\n.drawerRow{\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:14px;\n  padding:14px 0;\n  border-bottom:1px solid var(--line);\n}\n\n.drawerRow span{\n  color:var(--muted);\n  font:8px \"DM Mono\",monospace;\n  text-transform:uppercase;\n  letter-spacing:.08em;\n}\n\n.drawerRow a{\n  font:10px \"DM Mono\",monospace;\n  text-transform:uppercase;\n  letter-spacing:.06em;\n}\n\n.drawerRow a:hover{\n  color:var(--green);\n}\n\n/* =========================================================\n   TOAST\n   ========================================================= */\n\n.toast{\n  position:fixed;\n  left:50%;\n  bottom:24px;\n  transform:translate(-50%,20px);\n  z-index:25000;\n  padding:10px 14px;\n  border:1px solid var(--ink);\n  border-radius:10px;\n  background:var(--ink);\n  color:var(--white);\n  font:9px \"DM Mono\",monospace;\n  letter-spacing:.08em;\n  text-transform:uppercase;\n  opacity:0;\n  pointer-events:none;\n  transition:.3s var(--ease);\n}\n\n.toast.show{\n  opacity:1;\n  transform:translate(-50%,0);\n}\n\n/* =========================================================\n   MOBILE\n   ========================================================= */\n\n.mobileMenu{\n  display:none;\n}\n\n@media(max-width:1050px){\n  .workspace{\n    grid-template-columns:190px minmax(0,1fr);\n  }\n\n  .topStatus{\n    min-width:auto;\n  }\n\n  .brand{\n    min-width:auto;\n  }\n\n  .heroGrid{\n    grid-template-columns:1fr;\n  }\n\n  .heroSide{\n    border-left:0;\n    border-top:1px solid var(--line);\n    padding:16px 0 0;\n  }\n\n  .sourceGrid{\n    grid-template-columns:repeat(2,minmax(0,1fr));\n  }\n\n  .hubGrid{\n    grid-template-columns:1fr 1fr;\n  }\n}\n\n@media(max-width:780px){\n  body{\n    background:var(--paper2);\n  }\n\n  .app{\n    width:100%;\n    margin:0;\n    border-radius:0;\n    border-left:0;\n    border-right:0;\n  }\n\n  .topbar{\n    min-height:64px;\n    border-radius:0;\n    padding:9px 12px;\n  }\n\n  .brandText small{\n    display:none;\n  }\n\n  .topNav{\n    display:none;\n  }\n\n  .topStatus{\n    display:none;\n  }\n\n  .mobileMenu{\n    display:flex;\n    width:38px;\n    height:38px;\n    border:1px solid var(--line2);\n    border-radius:11px;\n    align-items:center;\n    justify-content:center;\n    cursor:pointer;\n    background:var(--paper);\n    font-size:16px;\n  }\n\n  .workspace{\n    display:block;\n  }\n\n  .sidebar{\n    position:fixed;\n    left:10px;\n    right:10px;\n    top:72px;\n    z-index:4000;\n    border:1px solid var(--line2);\n    border-radius:18px;\n    box-shadow:var(--shadow);\n    padding:10px;\n    transform:translateY(-12px);\n    opacity:0;\n    visibility:hidden;\n    transition:.25s var(--ease);\n  }\n\n  .sidebar.mobileOpen{\n    transform:translateY(0);\n    opacity:1;\n    visibility:visible;\n  }\n\n  .sideNav{\n    grid-template-columns:1fr 1fr;\n  }\n\n  .sideBottom{\n    display:none;\n  }\n\n  .content{\n    width:100%;\n  }\n\n  .hero{\n    padding:32px 18px 26px;\n  }\n\n  .hero h1{\n    font-size:clamp(53px,16vw,92px);\n  }\n\n  .heroIntro{\n    font-size:12px;\n  }\n\n  .metricRow{\n    grid-template-columns:1fr 1fr;\n  }\n\n  .metric:nth-child(2){\n    border-right:0;\n  }\n\n  .metric:nth-child(-n+2){\n    border-bottom:1px solid var(--line);\n  }\n\n  .section{\n    padding:28px 18px 32px;\n  }\n\n  .sectionHead{\n    display:block;\n  }\n\n  .sectionMeta{\n    margin-top:8px;\n  }\n\n  .timeline::before{\n    left:45px;\n  }\n\n  .timeItem{\n    grid-template-columns:35px 16px minmax(0,1fr);\n  }\n\n  .timeYear{\n    font-size:8px;\n  }\n\n  .timeCard{\n    grid-template-columns:1fr;\n  }\n\n  .timeCode{\n    text-align:left;\n  }\n\n  .reportGrid,\n  .compare,\n  .journalGrid,\n  .hubGrid{\n    grid-template-columns:1fr;\n  }\n\n  .journalCard{\n    min-height:330px;\n  }\n\n  .journalStack{\n    grid-template-rows:auto auto;\n  }\n\n  .dualCard{\n    grid-template-columns:1fr;\n  }\n\n  .dualCard .imageCell{\n    min-height:190px;\n  }\n\n  .dualCard img{\n    min-height:190px;\n  }\n\n  .dualInfo{\n    min-height:150px;\n    border-left:0;\n    border-top:1px solid var(--line);\n  }\n\n  .sourceGrid{\n    grid-template-columns:1fr;\n  }\n\n  .lineage{\n    overflow:auto;\n  }\n\n  .support{\n    padding:28px 18px;\n  }\n\n  .supportGrid{\n    grid-template-columns:1fr;\n  }\n\n  .supportButton{\n    justify-self:start;\n  }\n\n  .footer{\n    padding:20px 18px 25px;\n    grid-template-columns:1fr;\n  }\n\n  .footerNav{\n    justify-content:flex-start;\n  }\n\n  .ageBody{\n    padding:30px 24px;\n  }\n\n  .ageActions{\n    flex-direction:column;\n  }\n\n  .ageButton{\n    width:100%;\n  }\n}\n\n@media(prefers-reduced-motion:reduce){\n  *,\n  *::before,\n  *::after{\n    animation-duration:.001ms!important;\n    transition-duration:.001ms!important;\n    scroll-behavior:auto!important;\n  }\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n\u003c!-- =========================================================\n     AGE GATE\n     ========================================================= -->\n\n\u003cdiv id=\"ageGate\" aria-modal=\"true\" role=\"dialog\" aria-labelledby=\"ageTitle\">\n  \u003cdiv class=\"ageWindow\">\n    \u003cdiv class=\"windowBar\">\n      \u003cdiv class=\"windowDots\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n      \u003cdiv class=\"windowCode\">FIELD ARCHIVE / ACCESS\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ageBody\">\n      \u003cdiv class=\"ageKicker\">Baltazar Seeds / documented archive\u003c/div>\n      \u003ch1 class=\"ageTitle\" id=\"ageTitle\">18+ \u003cspan>only.\u003c/span>\u003c/h1>\n      \u003cp class=\"ageText\">\n        This website contains cannabis related material and is intended for adults only.\n        Enter only if you are legally permitted to view this material in your location.\n      \u003c/p>\n      \u003cdiv class=\"ageActions\">\n        \u003cbutton class=\"ageButton\" id=\"ageYes\">Enter archive\u003c/button>\n        \u003cbutton class=\"ageButton secondary\" id=\"ageNo\">Leave\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- =========================================================\n     APP\n     ========================================================= -->\n\n\u003cdiv class=\"app\" id=\"top\">\n\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"#top\" aria-label=\"Baltazar Seeds home\">\n      \u003cdiv class=\"brandMark\">B\u003c/div>\n      \u003cdiv class=\"brandText\">\n        \u003cstrong>Baltazar Seeds\u003c/strong>\n        \u003csmall>Field Archive / Living Record\u003c/small>\n      \u003c/div>\n    \u003c/a>\n\n    \u003cnav class=\"topNav\" aria-label=\"Main navigation\">\n      \u003ca href=\"#archive\">Archive\u003c/a>\n      \u003ca href=\"#journal\">Journal\u003c/a>\n      \u003ca href=\"#continuity\">Continuity\u003c/a>\n      \u003ca href=\"#sources\">Sources\u003c/a>\n      \u003ca href=\"#world\">World\u003c/a>\n      \u003cbutton type=\"button\" id=\"supportTop\">Support\u003c/button>\n    \u003c/nav>\n\n    \u003cdiv class=\"topStatus\">\n      \u003ci class=\"statusDot\">\u003c/i>\n      \u003cspan>Archive online\u003c/span>\n    \u003c/div>\n\n    \u003cbutton class=\"mobileMenu\" id=\"mobileMenu\" aria-label=\"Open menu\" aria-expanded=\"false\">☰\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"workspace\">\n\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003cdiv class=\"sideLabel\">Navigate\u003c/div>\n\n      \u003cnav class=\"sideNav\">\n        \u003ca href=\"#top\">\u003cspan class=\"sideIcon\">01\u003c/span>Index\u003c/a>\n        \u003ca href=\"#timeline\">\u003cspan class=\"sideIcon\">02\u003c/span>Timeline\u003c/a>\n        \u003ca href=\"#archive\">\u003cspan class=\"sideIcon\">03\u003c/span>Reports\u003c/a>\n        \u003ca href=\"#journal\">\u003cspan class=\"sideIcon\">04\u003c/span>Journal\u003c/a>\n        \u003ca href=\"#continuity\">\u003cspan class=\"sideIcon\">05\u003c/span>Genetics\u003c/a>\n        \u003ca href=\"#sources\">\u003cspan class=\"sideIcon\">06\u003c/span>Grower.ch\u003c/a>\n        \u003ca href=\"#world\">\u003cspan class=\"sideIcon\">07\u003c/span>World\u003c/a>\n      \u003c/nav>\n\n      \u003cdiv class=\"sideBottom\">\n        \u003cp>\n          The archive connects the old reports with the new work.\n          Nothing here needs to pretend that the story started yesterday.\n        \u003c/p>\n        \u003ca href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Open Grower.ch ↗\u003c/a>\n      \u003c/div>\n    \u003c/aside>\n\n    \u003cmain class=\"content\">\n\n      \u003c!-- =====================================================\n           HERO\n           ===================================================== -->\n\n      \u003csection class=\"hero\">\n        \u003cdiv class=\"heroGrid\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Field archive / Baltazar Seeds\u003c/div>\n\n            \u003ch1>\n              Seeds are\u003cbr>\n              \u003cspan>a record.\u003c/span>\n            \u003c/h1>\n\n            \u003cp class=\"heroIntro\">\n              Baltazar Seeds is built around the documented path behind the seeds.\n              Old Grower.ch reports.\n              New experiments.\n              Different plants.\n              Different rooms.\n              Different years.\n              The archive keeps the connection visible instead of turning the history into a polished story that never happened.\n            \u003c/p>\n          \u003c/div>\n\n          \u003cdiv class=\"heroSide\">\n            \u003cstrong>2007 → 2026\u003c/strong>\n            \u003cp>\n              The first documented reports are from the late 2000s.\n              After a long pause the work returned in 2025.\n              The current archive continues through Strain Mix Part Three.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"metricRow\">\n          \u003cdiv class=\"metric\">\n            \u003cb>10+\u003c/b>\n            \u003cspan>Years away\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"metric\">\n            \u003cb>2007\u003c/b>\n            \u003cspan>Old report roots\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"metric\">\n            \u003cb>I → II → HK → III\u003c/b>\n            \u003cspan>Recent chapters\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"metric\">\n            \u003cb>OPEN\u003c/b>\n            \u003cspan>Archive status\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           TIMELINE\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"timeline\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Chronology\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The long \u003cspan>thread.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">old roots / new chapters / one archive\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"timeline\">\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2007\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>First Grow / Hindu Kush\u003c/h3>\n                \u003cp>\n                  The documented beginning.\n                  A first grow with Hindu Kush.\n                  400 W and coco.\n                  The report itself is part of the history now carried forward.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 01\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Mazar & Euforia\u003c/h3>\n                \u003cp>\n                  The second documented grow.\n                  Mazar and Euforia become part of the early record together with the first attempts to compare different genetics in one continuing archive.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 02\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Blueberry\u003c/h3>\n                \u003cp>\n                  The third grow.\n                  Blueberry takes its place in the sequence alongside Thai Haze Skunk and genetics carried forward from the previous run.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 03\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Jorge's Diamonds & Perplex\u003c/h3>\n                \u003cp>\n                  A later 2008 report with Jorge's Diamonds No1, Perplex and additional Afghan genetics.\n                  The archive gets broader while the documentation stays personal.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 04\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2008\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Blue Moonshine & Pure Afghan\u003c/h3>\n                \u003cp>\n                  Another step in the old sequence.\n                  Blue Moonshine enters the report together with Pure Afghan and genetics carried over from earlier work.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 05\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2009\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Chocolope / G13 Haze / Hawaiian Snow\u003c/h3>\n                \u003cp>\n                  The old archive continues into 2009.\n                  This report was approached as a grow protocol with the focus on the most important observations.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">ROOT / 06\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2025\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Strainmix Part One\u003c/h3>\n                \u003cp>\n                  After more than ten years away the work returns.\n                  The idea is deliberately open.\n                  A mixed seed experiment.\n                  Quality over quantity.\n                  Curiosity over a perfectly predictable result.\n                \u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"timeCode\">NEW / I\u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"timeItem\">\n            \u003cdiv class=\"timeYear\">2025\u003c/div>\n            \u003cdiv class=\"timeDot\">\u003c/div>\n            \u003cdiv class=\"timeCard\">\n              \u003cdiv>\n                \u003ch3>Strainmix Part Two\u003c/h3>\n                \u003cp>\n                  The experiment expands into a much larger documented run.\n                  More named genetics.\n                  More plants.\n           \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Grow reports\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The \u003cspan>archive.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">direct links to the original reports\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"reportGrid\">\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">09.08.2007\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>First Grow / Hindu Kush\u003c/h3>\n              \u003cp>\n                The first documented grow in the old sequence.\n                Hindu Kush.\n                400 W.\n                Coco.\n                A report that now sits at the root of everything that followed.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">2007\u003c/span>\n                \u003cspan class=\"fact\">Hindu Kush\u003c/span>\n                \u003cspan class=\"fact\">400 W\u003c/span>\n                \u003cspan class=\"fact\">Coco\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/first-grow-hindu-kush-400w-coco-63-bt-beendet.33441/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">03.02.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Mazar & Euforia\u003c/h3>\n              \u003cp>\n                The second grow.\n                Mazar and Euforia are documented together with the early comparison between soil and coco.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Mazar\u003c/span>\n                \u003cspan class=\"fact\">Euforia\u003c/span>\n                \u003cspan class=\"fact\">2nd grow\u003c/span>\n                \u003cspan class=\"fact\">2008\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/mazar-euforia.30/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">30.03.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Blueberry\u003c/h3>\n              \u003cp>\n                The third grow.\n                Blueberry becomes the center of the report with Thai Haze Skunk and Mazar F2 also present in the record.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Blueberry\u003c/span>\n                \u003cspan class=\"fact\">Thai Haze Skunk\u003c/span>\n                \u003cspan class=\"fact\">Mazar F2\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/blueberry.408/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">09.07.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Jorge's Diamonds & Perplex\u003c/h3>\n              \u003cp>\n                A fourth grow with Jorge's Diamonds No1 and Perplex plus Afghan bonus genetics.\n                The archive continues to grow.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Jorge's Diamonds\u003c/span>\n                \u003cspan class=\"fact\">Perplex\u003c/span>\n                \u003cspan class=\"fact\">Afghan\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/jorges-diamonds-perplex.955/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">13.09.2008\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Blue Moonshine & Pure Afghan\u003c/h3>\n              \u003cp>\n                Blue Moonshine enters the old Dutch Passion focused report together with Pure Afghan and additional genetics from the previous run.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Blue Moonshine\u003c/span>\n                \u003cspan class=\"fact\">Pure Afghan\u003c/span>\n                \u003cspan class=\"fact\">2008\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/blue-moonshine-pure-afghan.1497/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">ROOT REPORT\u003c/span>\n              \u003cspan class=\"reportYear\">07.03.2009\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Chocolope / G13 Haze / Hawaiian Snow\u003c/h3>\n              \u003cp>\n                The 2009 report focuses on the most important observations and treats the grow as a protocol rather than a polished presentation.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Chocolope\u003c/span>\n                \u003cspan class=\"fact\">G13 Haze\u003c/span>\n                \u003cspan class=\"fact\">Hawaiian Snow\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/chocolope-g13-haze-hawaiian-snow.40558/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">RETURN\u003c/span>\n              \u003cspan class=\"reportYear\">10.01.2025\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Bio Erde Strainmix Part One\u003c/h3>\n              \u003cp>\n                After more than ten years away the return starts as an experiment with mixed seed origins.\n                Quality over quantity.\n                The uncertainty is part of the point.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Part One\u003c/span>\n                \u003cspan class=\"fact\">2025\u003c/span>\n                \u003cspan class=\"fact\">Seed mix\u003c/span>\n                \u003cspan class=\"fact\">Return\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/strainmix-part-1.174488/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">EXPANSION\u003c/span>\n              \u003cspan class=\"reportYear\">01.05.2025\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Bio Erde Strainmix Part Two\u003c/h3>\n              \u003cp>\n                The next run expands the archive with a broad selection of named genetics and a larger documented environment.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Part Two\u003c/span>\n                \u003cspan class=\"fact\">2025\u003c/span>\n                \u003cspan class=\"fact\">21 strains\u003c/span>\n                \u003cspan class=\"fact\">Grow log\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/strainmix-part-2.179085/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">SYSTEM TEST\u003c/span>\n              \u003cspan class=\"reportYear\">03.01.2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Baltazars Hell Kitchen\u003c/h3>\n              \u003cp>\n                Three tents.\n                A more structured setup.\n                Automatic irrigation.\n                Then the practical problems begin and the report records the adjustment instead of hiding it.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Hell Kitchen\u003c/span>\n                \u003cspan class=\"fact\">2026\u003c/span>\n                \u003cspan class=\"fact\">3 tents\u003c/span>\n                \u003cspan class=\"fact\">Archive\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/baltazars-hell-kitchen.187410/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">CURRENT\u003c/span>\n              \u003cspan class=\"reportYear\">02.09.2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Bio Erde Strain Mix Part Three\u003c/h3>\n              \u003cp>\n                The current chapter.\n                Seeds from the previous run return.\n                The archive follows the genetics over time and phenotype hunting becomes a central part of the record.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Part Three\u003c/span>\n                \u003cspan class=\"fact\">FD 32\u003c/span>\n                \u003cspan class=\"fact\">2026\u003c/span>\n                \u003cspan class=\"fact\">Current\u003c/span>\n              \u003c/div>\n              \u003ca class=\"reportLink\" href=\"https://www.grower.ch/forum/threads/strain-mix-part-3.193044/\" target=\"_blank\" rel=\"noopener noreferrer\">Open report ↗\u003c/a>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           JOURNAL\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"journal\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Image journal\u003c/div>\n            \ RAIN5 original image\">\n              \u003c/div>\n              \u003cdiv class=\"imageCell\">\n                \u003cimg src=\"STRAIN5A.JPG\" alt=\"STRAIN5A original image\">\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>Nothing is hidden behind a crossfade.\u003c/h3>\n              \u003cp>\n                The original two image record remains visible at the same time.\n                No automatic swap.\n                No disappearing second frame.\n                Both source files are part of the page.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>File A\u003c/span>\u003cb>STRAIN5.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>File B\u003c/span>\u003cb>STRAIN5A.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Display\u003c/span>\u003cb>Both visible\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>Record 06\u003c/b>\n              \u003cspan>Finish / original pair\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"dualCard\" style=\"border:0;border-radius:0;\">\n              \u003cdiv class=\"imageCell\">\n                \u003cimg src=\"STRAIN6.JPG\" alt=\"STRAIN6 original image\">\n              \u003c/div>\n              \u003cdiv class=\"imageCell\">\n                \u003cimg src=\"STRAIN6A.JPG\" alt=\"STRAIN6A original image\">\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>The second image stays part of the story.\u003c/h3>\n              \u003cp>\n                The original pair is preserved as a real diptych.\n                This is deliberately different from the previous crossfade approach.\n                Both photographs can be inspected immediately.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>File A\u003c/span>\u003cb>STRAIN6.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>File B\u003c/span>\u003cb>STRAIN6A.JPG\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Display\u003c/span>\u003cb>Both visible\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           CONTINUITY\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"continuity\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Continuity\u003c/div>\n            \u003ch2 class=\"sectionTitle\">From \u003cspan>memory\u003c/span> to archive.\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">the structure behind the project\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"lineage\">\n          \u003cdiv class=\"lineagePath\">\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>ROOT\u003c/small>\n              \u003cstrong>2007–09\u003c/strong>\n              \u003cp>Old Grower.ch reports and first documented work.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>RETURN\u003c/small>\n              \u003cstrong>Part One\u003c/strong>\n              \u003cp>2025 comeback through the mixed seed experiment.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>EXPANSION\u003c/small>\n              \u003cstrong>Part Two\u003c/strong>\n              \u003cp>More genetics and a larger documented run.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>SYSTEM\u003c/small>\n              \u003cstrong>Hell Kitchen\u003c/strong>\n              \u003cp>More structure and a more complex environment.\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"lineNode\">\n              \u003csmall>CURRENT\u003c/small>\n              \u003cstrong>Part Three\u003c/strong>\n              \u003cp>Following the genetics and hunting phenotypes.\u003c/p>\n            \u003c/div>\n\n          \u003c/div>\n\n          \u003cp class=\"lineageNote\">\n            The point of the archive is not to invent a clean origin story.\n            The useful part is that the old reports exist.\n            The new reports exist.\n            The seeds sit between those two periods as a continuation of an interest that was already there long before the name Baltazar Seeds appeared on a page.\n          \u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           PART ONE NOTES\n           ===================================================== -->\n\n      \u003csection class=\"section\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Part One / 2025\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The comeback was \u003cspan>messy.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">the important part is that it happened\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"reportGrid\">\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">01\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Quality over quantity\u003c/h3>\n              \u003cp>\n                The return was not designed as a perfect production project.\n                The starting point was curiosity.\n                What happens when a mixed collection of seeds is allowed to show what is actually in it.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Experiment\u003c/span>\n                \u003cspan class=\"fact\">Mixed origins\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">02\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>It did not start smoothly\u003c/h3>\n              \u003cp>\n                The first attempt began with 23 seeds and only three early plants.\n                Dry winter air and heat became part of the real conditions.\n                More seeds were prepared and the experiment continued.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">23 first seeds\u003c/span>\n                \u003cspan class=\"fact\">3 early plants\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">03\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Selection became unavoidable\u003c/h3>\n              \u003cp>\n                As more plants appeared the differences became part of the record.\n                One unusual plant even became number 18 in the Zwergenbattle 2025.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Selection\u003c/span>\n                \u003cspan class=\"fact\">Zwergenbattle\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"report\">\n            \u003cdiv class=\"reportTop\">\n              \u003cspan class=\"reportType\">Observation\u003c/span>\n              \u003cspan class=\"reportYear\">04\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"reportBody\">\n              \u003ch3>Every plant was different\u003c/h3>\n              \u003cp>\n                Possible identities were treated as possibilities rather than absolute labels.\n                Gelato.\n                Skunk.\n                Purple Tangie.\n                Cali Orange.\n                Variation remained the interesting part.\n              \u003c/p>\n              \u003cdiv class=\"reportFacts\">\n                \u003cspan class=\"fact\">Variation\u003c/span>\n                \u003cspan class=\"fact\">Phenotypes\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           PART TWO / HELL KITCHEN / PART THREE\n           ===================================================== -->\n\n      \u003csection class=\"section\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Three recent chapters\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The project \u003cspan>keeps moving.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">I / II / HK / III\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"compare\">\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>II\u003c/b>\n              \u003cspan>2025\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>The mix gets serious.\u003c/h3>\n              \u003cp>\n                Part Two moves into a larger documented run.\n                The report records a broad mixture of named genetics and the practical problems that appeared along the way.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Space\u003c/span>\u003cb>120 × 120 × 200\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Lighting\u003c/span>\u003cb>250 / 400 / 600 W\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Documentation\u003c/span>\u003cb>Growth / problems / solutions\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>HK\u003c/b>\n              \u003cspan>2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>More structure.\u003c/h3>\n              \u003cp>\n                Hell Kitchen expands the environment again.\n                Three tents.\n                Larger containers.\n                Automatic watering.\n                Then the report records the reality when the automatic system needs adjustment.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Tents\u003c/span>\u003cb>3\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Containers\u003c/span>\u003cb>13 → 22 L\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Direction\u003c/span>\u003cb>Structured\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>III\u003c/b>\n              \u003cspan>2026\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>The story continues.\u003c/h3>\n              \u003cp>\n                Part Three returns to the core idea of following the genetics.\n                Seeds from the previous run return.\n                The report is now explicitly interested in development over time and real phenotype hunting.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Flowering\u003c/span>\u003cb>FD 32\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Veg\u003c/span>\u003cb>Approx 4–5 weeks\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Plants\u003c/span>\u003cb>9\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n          \u003carticle class=\"compareCard\">\n            \u003cdiv class=\"compareHead\">\n              \u003cb>∞\u003c/b>\n              \u003cspan>OPEN\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"compareContent\">\n              \u003ch3>Not a finished story.\u003c/h3>\n              \u003cp>\n                The archive is deliberately open.\n                There is no final chapter here because the reports themselves are the continuation.\n                The next entry belongs to the next run.\n              \u003c/p>\n              \u003cdiv class=\"compareList\">\n                \u003cdiv>\u003cspan>Status\u003c/span>\u003cb>Open\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Archive\u003c/span>\u003cb>Growing\u003c/b>\u003c/div>\n                \u003cdiv>\u003cspan>Direction\u003c/span>\u003cb>Continue\u003c/b>\u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/article>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           SOURCES\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"sou 003ca href=\"https://www.grower.ch/forum/threads/baltazars-hell-kitchen.187410/\" target=\"_blank\" rel=\"noopener noreferrer\">Open source ↗\u003c/a>\n          \u003c/div>\n\n          \u003cdiv class=\"sourceCard\">\n            \u003csmall>2026 / III\u003c/small>\n            \u003cstrong>Strain Mix Part Three\u003c/strong>\n            \u003cspan>Current archive / FD 32\u003c/span>\n            \u003ca href=\"https://www.grower.ch/forum/threads/strain-mix-part-3.193044/\" target=\"_blank\" rel=\"noopener noreferrer\">Open source ↗\u003c/a>\n          \u003c/div>\n\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- =====================================================\n           WORLD HUB\n           ===================================================== -->\n\n      \u003csection class=\"section\" id=\"world\">\n        \u003cdiv class=\"sectionHead\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">Outside the archive\u003c/div>\n            \u003ch2 class=\"sectionTitle\">The rest of the \u003cspan>world.\u003c/span>\u003c/h2>\n          \u003c/div>\n          \u003cdiv class=\"sectionMeta\">grower / games / merch / contact\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"hubGrid\">\n\n          \u003carticle class=\"hubCard\">\n            \u003cdiv>\n              \u003cdiv class=\"hubIcon\">G\u003c/div>\n              \u003ch3>Grower.ch\u003c/h3>\n              \u003cp>\n                The original forum environment behind the documented reports.\n                The archive links back to the actual threads instead of replacing them.\n              \u003c/p>\n            \u003c/div>\n            \u003ca class=\"hubLink\" href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Visit Grower.ch ↗\u003c/a>\n          \u003c/article>\n\n          \u003carticle class=\"hubCard\">\n            \u003cdiv>\n              \u003cdiv class=\"hubIcon\">▶\u003c/div>\n              \u003ch3>Games\u003c/h3>\n          \u003ca href=\"#top\">Top\u003c/a>\n          \u003ca href=\"#archive\">Archive\u003c/a>\n          \u003ca href=\"#sources\">Sources\u003c/a>\n          \u003ca href=\"#world\">World\u003c/a>\n          \u003ca href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Grower.ch ↗\u003c/a>\n        \u003c/nav>\n      \u003c/footer>\n\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- =========================================================\n     SUPPORT DRAWER\n     ========================================================= -->\n\n\u003cdiv class=\"drawer\" id=\"supportDrawer\" aria-hidden=\"true\">\n  \u003cdiv class=\"drawerPanel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawerTitle\">\n    \u003cdiv class=\"drawerTop\">\n      \u003cstrong id=\"drawerTitle\">Support\u003c/strong>\n      \u003cbutton class=\"closeButton\" type=\"button\" id=\"drawerClose\" aria-label=\"Close\">×\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"drawerBody\">\n      \u003ch3>Support the\u003cbr>continuation.\u003c/h3>\n\n      \u003cp>\n        The archive is built around the reports and the work behind them.\n        If you want to support the project you can use the Stripe link below.\n      \u003c/p>\n\n      \u003cdiv class=\"drawerRows\">\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Support\u003c/span>\n          \u003ca href=\"https://buy.stripe.com/dRmaF04DMdMD6f61bHgw00I\" target=\"_blank\" rel=\"noopener noreferrer\">Stripe ↗\u003c/a>\n        \u003c/div>\n\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Source archive\u003c/span>\n          \u003ca href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Grower.ch ↗\u003c/a>\n        \u003c/div>\n\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Merch\u003c/span>\n          \u003ca href=\"seite3.html\">Open ↗\u003c/a>\n        \u003c/div>\n\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Games\u003c/span>\n          \u003ca href=\"baltazarsrun.html\">Baltazar's Run ↗\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- =========================================================\n     CONTACT DRAWER\n     ========================================================= -->\n\n\u003cdiv class=\"drawer\" id=\"contactDrawer\" aria-hidden=\"true\">\n  \u003cdiv class=\"drawerPanel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"contactTitle\">\n    \u003cdiv class=\"drawerTop\">\n      \u003cstrong id=\"contactTitle\">Contact\u003c/strong>\n      \u003cbutton class=\"closeButton\" type=\"button\" id=\"contactClose\" aria-label=\"Close\">×\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"drawerBody\">\n      \u003ch3>Talk to\u003cbr>Baltazar.\u003c/h3>\n\n      \u003cp>\n        Use the contact route already connected to the project.\n        Replace the address below with the existing project email if your original page uses a different address.\n      \u003c/p>\n\n      \u003cdiv class=\"drawerRows\">\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Email\u003c/span>\n          \u003ca href=\"mailto:contact@baltazar-seeds.com\">Email ↗\u003c/a>\n        \u003c/div>\n\n        \u003cdiv class=\"drawerRow\">\n          \u003cspan>Forum\u003c/span>\n          \u003ca href=\"https://www.grower.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">Grower.ch ↗\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">Archive ready\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  /* =======================================================\n     AGE GATE\n     ======================================================= */\n\n  const ageGate = document.getElementById(\"ageGate\");\n  const ageYes = document.getElementById(\"ageYes\");\n  const ageNo = document.getElementById(\"ageNo\");\n  const AGE_KEY = \"baltazar_archive_age_18\";\n\n  function hideAge(){\n    try{\n      localStorage.setItem(AGE_KEY,\"true\");\n    }catch(error){}\n    ageGate.classList.add(\"hidden\");\n  }\n\n  ageYes.addEventListener(\"click\",hideAge);\n\n  ageNo.addEventListener(\"click\",function(){\n    ageNo.textContent = \"18+ required\";\n  });\n\n  try{\n    if(localStorage.getItem(AGE_KEY) === \"true\"){\n      ageGate.classList.add(\"hidden\");\n    }\n  }catch(error){}\n\n  /* =======================================================\n     MOBILE MENU\n     ======================================================= */\n\n  const mobileMenu = document.getElementById(\"mobileMenu\");\n  const sidebar = document.getElementById(\"sidebar\");\n\n  function closeMobileMenu(){\n    sidebar.classList.remove(\"mobileOpen\");\n    mobileMenu.setAttribute(\"aria-expanded\",\"false\");\n  }\n\n  mobileMenu.addEventListener(\"click\",function(){\n    const open = sidebar.classList.toggle(\"mobileOpen\");\n    mobileMenu.setAttribute(\"aria-expanded\",String(open));\n  });\n\n  sidebar.querySelectorAll(\"a\").forEach(function(link){\n    link.addEventListener(\"click\",closeMobileMenu);\n  });\n\n  document.addEventListener(\"click\",function(event){\n    if(window.innerWidth > 780) return;\n\n    if(\n      sidebar.classList.contains(\"mobileOpen\") &&\n      !sidebar.contains(event.target) &&\n      !mobileMenu.contains(event.target)\n    ){\n      closeMobileMenu();\n    }\n  });\n\n  /* =======================================================\n     DRAWERS\n     ======================================================= */\n\n  const supportDrawer = document.getElementById(\"supportDrawer\");\n  const contactDrawer = document.getElementById(\"contactDrawer\");\n\n  function openDrawer(drawer){\n    drawer.classList.add(\"open\");\n    drawer.setAttribute(\"aria-hidden\",\"false\");\n    document.body.style.overflow = \"hidden\";\n  }\n\n  function closeDrawer(drawer){\n    drawer.classList.remove(\"open\");\n    drawer.setAttribute(\"aria-hidden\",\"true\");\n\n    if(\n      !supportDrawer.classList.contains(\"open\") &&\n      !contactDrawer.classList.contains(\"open\")\n    ){\n      document.body.style.overflow = \"\";\n    }\n  }\n\n  document.getElementById(\"supportTop\").addEventListener(\"click\",function(){\n    openDrawer(supportDrawer);\n  });\n\n  document.getElementById(\"drawerClose\").addEventListener(\"click\",function(){\n    closeDrawer(supportDrawer);\n  });\n\n  document.getElementById(\"contactOpen\").addEventListener(\"click\",function(){\n    openDrawer(contactDrawer);\n  });\n\n  document.getElementById(\"contactClose\").addEventListener(\"click\",function(){\n    closeDrawer(contactDrawer);\n  });\n\n  [supportDrawer,contactDrawer].forEach(function(drawer){\n    drawer.addEventListener(\"click\",function(event){\n      if(event.target === drawer){\n        closeDrawer(drawer);\n      }\n    });\n  });\n\n  document.addEventListener(\"keydown\",function(event){\n    if(event.key === \"Escape\"){\n      closeDrawer(supportDrawer);\n      closeDrawer(contactDrawer);\n      closeMobileMenu();\n    }\n  });\n\n  /* =======================================================\n     ACTIVE SECTION\n     ======================================================= */\n\n  const sideLinks = Array.from(document.querySelectorAll(\".sideNav a\"));\n  const sections = sideLinks\n    .map(function(link){\n      const id = link.getAttribute(\"href\");\n      return id ? document.querySelector(id) : null;\n    })\n    .filter(Boolean);\n\n  const observer = new IntersectionObserver(function(entries){\n    entries.forEach(function(entry){\n      if(!entry.isIntersecting) return;\n\n      sideLinks.forEach(function(link){\n        link.classList.remove(\"active\");\n      });\n\n      const active = sideLinks.find(function(link){\n        return link.getAttribute(\"href\") === \"#\" + entry.target.id;\n      });\n\n      if(active) active.classList.add(\"active\");\n    });\n  },{\n    root:null,\n    rootMargin:\"-35% 0px -55% 0px\",\n    threshold:0\n  });\n\n  sections.forEach(function(section){\n    observer.observe(section);\n  });\n\n  /* =======================================================\n     SIMPLE IMAGE ERROR FALLBACK\n     ======================================================= */\n\n  document.querySelectorAll(\"img\").forEach(function(img){\n    img.addEventListener(\"error\",function(){\n      img.style.opacity = \".22\";\n      img.style.filter = \"grayscale(1)\";\n      img.alt = \"Image file not found: \" + img.getAttribute(\"src\");\n    });\n  });\n\n  /* =======================================================\n     TOAST\n     ======================================================= */\n\n  const toast = document.getElementById(\"toast\");\n  let toastTimer = null;\n\n  function showToast(message){\n    toast.textContent = message;\n    toast.classList.add(\"show\");\n\n    clearTimeout(toastTimer);\n\n    toastTimer = setTimeout(function(){\n      toast.classList.remove(\"show\");\n    },1800);\n  }\n\n  document.querySelectorAll('a[href^=\"#\"]').forEach(function(link){\n    link.addEventListener(\"click\",function(){\n      const target = document.querySelector(link.getAttribute(\"href\"));\n\n      if(target){\n        setTimeout(function(){\n          showToast(\"Archive location opened\");\n        },350);\n      }\n    });\n  });\n\n  /* =======================================================\n     YEAR / STATUS\n     ======================================================= */\n\n  const statusText = document.querySelector(\".topStatus span\");\n\n  if(statusText){\n    statusText.textContent = \"Archive online\";\n  }\n\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>";
const ORIGINAL_ARCHIVE_B = "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#e8e5dc\">\n\u003cmeta name=\"description\" content=\"Baltazar Seeds. A living archive of documented grow reports, old genetics, new experiments, games, merch and the road between them.\">\n\u003ctitle>BALTAZAR SEEDS — FIELD ARCHIVE\u003c/title>\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\n\u003cstyle>\n/* =========================================================\n   BALTAZAR SEEDS — FIELD ARCHIVE\n   One file\n   No frameworks\n   No external JavaScript\n   Images remain local\n   ========================================================= */\n\n*,\n*::before,\n*::after{\n  box-sizing:border-box;\n  margin:0;\n  padding:0;\n}\n\n:root{\n  --paper:#e8e5dc;\n  --paper2:#f2efe7;\n  --paper3:#d9d5ca;\n  --ink:#171915;\n  --ink2:#30332d;\n  --muted:#686b63;\n  --line:#c8c5bb;\n  --line2:#b7b4aa;\n  --green:#31563c;\n  --green2:#4d7354;\n  --acid:#b4d43f;\n  --warm:#a26c38;\n  --red:#9d4d43;\n  --white:#faf9f5;\n  --shadow:0 18px 50px rgba(20,22,18,.10);\n  --shadow2:0 5px 18px rgba(20,22,18,.08);\n  --radius:22px;\n  --radius2:14px;\n  --ease:cubic-bezier(.2,.8,.2,1);\n}\n\nhtml{\n  scroll-behavior:smooth;\n  background:var(--paper);\n}\n\nbody{\n  min-height:100vh;\n  background:\n    radial-gradient(circle at 20% 0%,rgba(255,255,255,.65),transparent 34rem),\n    linear-gradient(180deg,var(--paper2),var(--paper));\n  color:var(--ink);\n  font-family:Manrope,Arial,sans-serif;\n  font-weight:400;\n  -webkit-font-smoothing:antialiased;\n  overflow-x:hidden;\n}\n\nbody::before{\n  content:\"\";\n  position:fixed;\n  inset:0;\n  z-index:9999;\n  pointer-events:none;\n  opacity:.16;\n  background-image:\n    radial-gradient(rgba(0,0,0,.25) .55px,transparent .55px);\n  background-size:5px 5px;\n  mix-blend-mode:multiply;\n}\n\na{\n  color:inherit;\n  text-decoration:none;\n}\n\nbutton,\na{\n  -webkit-tap-highlight-color:transparent;\n}\n\nbutton{\n  font:inherit;\n}\n\n::selection{\n  background:var(--acid);\n  color:var(--ink);\n}\n\n:focus-visible{\n  outline:2px solid var(--green);\n  outline-offset:3px;\n}\n\n/* =========================================================\n   AGE GATE\n   ========================================================= */\n\n#ageGate{\n  position:fixed;\n  inset:0;\n  z-index:50000;\n  display:grid;\n  place-items:center;\n  padding:24px;\n  background:rgba(232,229,220,.97);\n  backdrop-filter:blur(18px);\n  transition:opacity .5s ease,visibility .5s ease;\n}\n\n#ageGate.hidden{\n  opacity:0;\n  visibility:hidden;\n  pointer-events:none;\n}\n\n.ageWindow{\n  width:min(560px,100%);\n  border:1px solid var(--ink);\n  border-radius:24px;\n  background:var(--paper2);\n  box-shadow:0 35px 100px rgba(0,0,0,.18);\n  overflow:hidden;\n}\n\n.windowBar{\n  height:46px;\n  padding:0 18px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  border-bottom:1px solid var(--line);\n  background:var(--paper3);\n}\n\n.windowDots{\n  display:flex;\n  gap:6px;\n}\n\n.windowDots i{\n  width:8px;\n  height:8px;\n  border:1px solid var(--ink);\n  border-radius:50%;\n  display:block;\n}\n\n.windowCode{\n  font:10px \"DM Mono\",monospace;\n  letter-spacing:.16em;\n  color:var(--muted);\n  text-transform:uppercase;\n}\n\n.ageBody{\n  padding:42px;\n}\n\n.ageKicker{\n  font:10px \"DM Mono\",monospace;\n  text-transform:uppercase;\n  letter-spacing:.16em;\n  color:var(--green);\n  margin-bottom:18px;\n}\n\n.ageTitle{\n  font:700 clamp(44px,8vw,78px)/.86 Syne,sans-serif;\n  letter-spacing:-.055em;\n  margin-bottom:22px;\n}\n\n.ageTitle span{\n  color:var(--green);\n}\n\n.ageText{\n  max-width:420px;\n  color:var(--muted);\n  font-size:13px;\n  line-height:1.75;\n  margin-bottom:30px;\n}\n\n.ageActions{\n  display:flex;\n  gap:10px;\n}\n\n.ageButton{\n  border:1px solid var(--ink);\n  background:var(--ink);\n  color:var(--white);\n  border-radius:12px;\n  padding:13px 20px;\n  cursor:pointer;\n  font:10px \"DM Mono\",monospace;\n  letter-spacing:.12em;\n  text-transform:uppercase;\n  transition:.25s var(--ease);\n}\n\n.ageButton:hover{\n  transform:translateY(-2px);\n  background:var(--green);\n}\n\n.ageButton.secondary{\n  background:transparent;\n  color:var(--ink);\n}\n\n.ageButton.secondary:hover{\n  background:var(--paper3);\n}\n\n/* =========================================================\n   APP SHELL\n   ========================================================= */\n\n.app{\n  width:min(1480px,calc(100% - 28px));\n  margin:14px auto 0;\n  border:1px solid var(--line2);\n  border-radius:28px;\n  overflow:hidden;\n  background:rgba(242,239,231,.88);\n  box-shadow:var(--shadow);\n}\n\n.topbar{\n  min-height:76px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:18px;\n  padding:12px 18px;\n  border-bottom:1px solid var(--line);\n  background:rgba(242,239,231,.94);\n  position:sticky;\n  top:0;\n  z-index:3000;\n  backdrop-filter:blur(16px);\n}\n\n.brand{\n  display:flex;\n  align-items:center;\n  gap:12px;\n  min-width:230px;\n}\n\n.brandMark{\n  width:42px;\n  height:42px;\n  border:1px solid var(--ink);\n  border-radius:13px;\n  display:grid;\n  place-items:center;\n  background:var(--ink);\n  color:var(--acid);\n  font:700 15px Syne,sans-serif;\n  letter-spacing:-.08em;\n}\n\n.brandText strong{\n  display:block;\n  font:700 15px Syne,sans-serif;\n  letter-spacing:-.035em;\n}\n\n.brandText small{\n  display:block;\n  margin-top:2px;\n  font:9px \"DM Mono\",monospace;\n  color:var(--muted);\n  text-transform:uppercase;\n  letter-spacing:.08em;\n}\n\n.topNav{\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  gap:5px;\n  flex-wrap:wrap;\n}\n\n.topNav a,\n.topNav button{\n  border:1px solid transparent;\n  border-radius:10px;\n  padding:9px 10px;\n  color:var(--muted);\n  background:transparent;\n  cursor:pointer;\n  font:9px \"DM Mono\",monospace;\n  text-transform:uppercase;\n  letter-spacing:.10em;\n  transition:.22s ease;\n}\n\n.topNav a:hover,\n.topNav button:hover{\n  color:var(--ink);\n  border-color:var(--line);\n  background:var(--paper);\n}\n\n.topStatus{\n  display:flex;\n  align-items:center;\n  gap:8px;\n  min-width:230px;\n  justify-content:flex-end;\n  font:9px \"DM Mono\",monospace;\n  color:var(--muted);\n  text-transform:uppercase;\n  letter-spacing:.08em;\n}\n\n.statusDot{\n  width:7px;\n  height:7px;\n  border-radius:50%;\n  background:var(--green2);\n  box-shadow:0 0 0 4px rgba(77,115,84,.12);\n}\n\n/* =========================================================\n   MAIN LAYOUT\n   ========================================================= */\n\n.workspace{\n  display:grid;\n  grid-template-columns:230px minmax(0,1fr);\n  min-height:900px;\n}\n\n.sidebar{\n  border-right:1px solid var(--line);\n  padding:20px 14px;\n  background:rgba(217,213,202,.34);\n}\n\n.sideLabel{\n  padding:7px 10px 10px;\n  font:9px \"DM Mono\",monospace;\n  color:var(--muted);\n  text-transform:uppercase;\n  letter-spacing:.13em;\n}\n\n.sideNav{\n  display:grid;\n  gap:4px;\n}\n\n.sideNav button,\n.sideNav a{\n  width:100%;\n  border:1px solid transparent;\n  border-radius:12px;\n  background:transparent;\n  padding:11px 11px;\n  display:flex;\n  align-items:center;\n  gap:10px;\n  color:var(--muted);\n  text-align:left;\n  cursor:pointer;\n  font:10px \"DM Mono\",monospace;\n  text-transform:uppercase;\n  letter-spacing:.06em;\n  transition:.2s ease;\n}\n\n.sideNav button:hover,\n.sideNav a:hover,\n.sideNav .active{\n  color:var(--ink);\n  border-color:va
