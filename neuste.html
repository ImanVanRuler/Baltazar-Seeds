<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050708">
<title>BALTAZAR SEEDS — DUAL FIELD ARCHIVE</title>
<style>
:root{
  --bg:#030506;
  --panel:#080c0e;
  --panel2:#0c1214;
  --line:#263238;
  --line2:#34444b;
  --text:#edf5f1;
  --muted:#7c898d;
  --green:#b7ff3d;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--bg);overflow:hidden}
body{
  font-family:"SFMono-Regular","Cascadia Code","Roboto Mono",ui-monospace,monospace;
  color:var(--text);
}
#archiveStage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#030506;
}
.archiveFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:scale(.995);
  transition:
    opacity .28s ease,
    transform .28s ease,
    visibility 0s linear .28s;
  background:#050708;
}
.archiveFrame.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:scale(1);
  transition:
    opacity .28s ease,
    transform .28s ease,
    visibility 0s linear 0s;
}
#archiveSwitcher{
  position:fixed;
  top:16px;
  left:16px;
  z-index:2147483647;
  display:flex;
  align-items:stretch;
  gap:0;
  padding:4px;
  border:1px solid rgba(183,255,61,.28);
  background:rgba(3,5,6,.9);
  box-shadow:
    0 14px 45px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.025) inset,
    0 0 34px rgba(183,255,61,.045);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-radius:5px;
  user-select:none;
}
.archiveSwitchButton{
  appearance:none;
  border:1px solid transparent;
  background:transparent;
  color:#68767b;
  min-width:166px;
  min-height:42px;
  padding:0 14px;
  cursor:pointer;
  border-radius:3px;
  font:
    11px/1.05 "SFMono-Regular","Cascadia Code","Roboto Mono",
    ui-monospace,monospace;
  letter-spacing:.075em;
  text-transform:uppercase;
  text-align:left;
  position:relative;
  overflow:hidden;
  transition:
    color .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    transform .18s ease;
}
.archiveSwitchButton::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:2px;
  background:transparent;
  box-shadow:none;
}
.archiveSwitchButton:hover{
  color:#dbe7e2;
  background:rgba(255,255,255,.035);
}
.archiveSwitchButton.active{
  color:var(--green);
  border-color:rgba(183,255,61,.25);
  background:
    linear-gradient(90deg,rgba(183,255,61,.11),rgba(183,255,61,.025));
  box-shadow:
    inset 0 0 20px rgba(183,255,61,.025),
    0 0 18px rgba(183,255,61,.055);
}
.archiveSwitchButton.active::before{
  background:var(--green);
  box-shadow:0 0 13px rgba(183,255,61,.85);
}
.archiveSwitchButton:active{transform:translateY(1px)}
.archiveSwitchButton:focus-visible{
  outline:1px solid var(--green);
  outline-offset:2px;
}
.switchIndex{
  display:inline-block;
  opacity:.45;
  margin-right:8px;
}
.switchName{
  display:block;
  margin-top:4px;
  color:inherit;
}
#archiveSwitcherMeta{
  position:absolute;
  left:4px;
  top:calc(100% + 5px);
  white-space:nowrap;
  padding:5px 7px;
  border-left:2px solid rgba(183,255,61,.45);
  background:rgba(3,5,6,.86);
  color:#617075;
  font:9px/1.2 "SFMono-Regular","Cascadia Code",monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
  pointer-events:none;
}
#archiveSwitcherMeta b{
  color:#9eadab;
  font-weight:500;
}
#archiveBoot{
  position:fixed;
  inset:0;
  z-index:2147483646;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#030506;
  color:#91a19d;
  font:11px/1.6 "SFMono-Regular","Cascadia Code","Roboto Mono",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
  transition:opacity .3s ease;
}
#archiveBoot.hide{opacity:0}
.bootInner{
  width:min(520px,calc(100vw - 42px));
}
.bootLine{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid #1b2529;
  padding:8px 0;
}
.bootLine span:last-child{color:var(--green)}
.bootBar{
  margin-top:14px;
  height:2px;
  background:#182125;
  overflow:hidden;
}
.bootBar i{
  display:block;
  height:100%;
  width:0;
  background:var(--green);
  box-shadow:0 0 14px rgba(183,255,61,.75);
  transition:width .45s ease;
}
#archiveNoScript{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050708;
  color:#b7ff3d;
  font:13px monospace;
}
@media(max-width:760px){
  #archiveSwitcher{
    left:9px;
    right:9px;
    top:9px;
  }
  .archiveSwitchButton{
    min-width:0;
    flex:1;
    padding:0 9px;
  }
  .switchIndex{display:none}
  #archiveSwitcherMeta{display:none}
}
@media(prefers-reduced-motion:reduce){
  .archiveFrame{transition:none}
  #archiveBoot{transition:none}
}
</style>
</head>
<body>
<noscript>
  <div id="archiveNoScript">JAVASCRIPT REQUIRED FOR ARCHIVE SWITCHING</div>
</noscript>

<div id="archiveStage">
  <iframe
    id="archive01"
    class="archiveFrame active"
    title="Baltazar Seeds Field Archive 01"
    src="BALTAZAR_FIELD_ARCHIVE_01.html"
    loading="eager"
    allow="fullscreen"
  ></iframe>

  <iframe
    id="archive02"
    class="archiveFrame"
    title="Baltazar Seeds Field Archive 02"
    src="BALTAZAR_FIELD_ARCHIVE_02.html"
    loading="eager"
    allow="fullscreen"
  ></iframe>
</div>

<div id="archiveSwitcher" role="navigation" aria-label="Baltazar Seeds archive switcher">
  <button
    type="button"
    class="archiveSwitchButton active"
    data-target="1"
    aria-selected="true"
    aria-controls="archive01"
  >
    <span class="switchIndex">01</span>
    <span class="switchName">FIELD ARCHIVE I</span>
  </button>

  <button
    type="button"
    class="archiveSwitchButton"
    data-target="2"
    aria-selected="false"
    aria-controls="archive02"
  >
    <span class="switchIndex">02</span>
    <span class="switchName">FIELD ARCHIVE II</span>
  </button>

  <div id="archiveSwitcherMeta">
    <b>BTZ</b> // DUAL ARCHIVE // <span id="archiveMetaState">01 ACTIVE</span>
  </div>
</div>

<div id="archiveBoot" aria-hidden="true">
  <div class="bootInner">
    <div class="bootLine"><span>BTZ ARCHIVE SYSTEM</span><span>ONLINE</span></div>
    <div class="bootLine"><span>FIELD ARCHIVE I</span><span>LOADED</span></div>
    <div class="bootLine"><span>FIELD ARCHIVE II</span><span>READY</span></div>
    <div class="bootBar"><i id="bootProgress"></i></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var buttons = Array.prototype.slice.call(
    document.querySelectorAll(".archiveSwitchButton")
  );
  var frames = {
    "1": document.getElementById("archive01"),
    "2": document.getElementById("archive02")
  };
  var metaState = document.getElementById("archiveMetaState");
  var boot = document.getElementById("archiveBoot");
  var bootProgress = document.getElementById("bootProgress");

  function switchArchive(target, pushHistory){
    target = String(target);
    if(!frames[target]) return;

    Object.keys(frames).forEach(function(key){
      frames[key].classList.toggle("active",key === target);
      frames[key].setAttribute("aria-hidden",key === target ? "false" : "true");
    });

    buttons.forEach(function(btn){
      var active = btn.dataset.target === target;
      btn.classList.toggle("active",active);
      btn.setAttribute("aria-selected",active ? "true" : "false");
    });

    metaState.textContent = target + " ACTIVE";

    if(pushHistory){
      try{
        history.replaceState(
          {archive:target},
          "",
          "#archive-" + target
        );
      }catch(e){}
    }
  }

  buttons.forEach(function(btn){
    btn.addEventListener("click",function(){
      switchArchive(btn.dataset.target,true);
    });
  });

  window.addEventListener("keydown",function(event){
    if(event.key === "1"){
      switchArchive("1",true);
    }else if(event.key === "2"){
      switchArchive("2",true);
    }else if(event.key === "ArrowLeft" || event.key === "ArrowRight"){
      var current = document.querySelector(".archiveSwitchButton.active");
      var target = current && current.dataset.target === "1" ? "2" : "1";
      switchArchive(target,true);
    }
  });

  window.addEventListener("hashchange",function(){
    var match = location.hash.match(/archive-(1|2)/);
    if(match) switchArchive(match[1],false);
  });

  var initial = (location.hash.match(/archive-(1|2)/) || [,"1"])[1];
  switchArchive(initial,false);

  /* Soft boot sequence. It never blocks the page after loading. */
  var progress = 0;
  var timer = setInterval(function(){
    progress += Math.floor(Math.random()*18) + 10;
    if(progress >= 100){
      progress = 100;
      clearInterval(timer);
      setTimeout(function(){
        boot.classList.add("hide");
        setTimeout(function(){
          boot.style.display = "none";
        },320);
      },120);
    }
    bootProgress.style.width = progress + "%";
  },75);

  /* Keyboard / assistive hint */
  buttons.forEach(function(btn){
    btn.title = "Switch to " + btn.textContent.replace(/\s+/g," ").trim();
  });
})();
</script>
</body>
</html>
